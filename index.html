/* ============================================================
   BANK STATEMENT IMPORT — parsers (CSV / TSV / TXT, Excel .xlsx, bank "xls" that is really HTML/text,
   pasted text, PDF text, PDF/photo OCR). All parsing is local in the browser.
   PDF and OCR load pdf.js / Tesseract.js from a CDN only when such a file is chosen (needs internet);
   every other route works fully offline.
   ============================================================ */
const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function isoDate(y,m,d){
  if(y<100) y += y>=70 ? 1900 : 2000;
  if(m<1||m>12||d<1||d>31) return null;
  const dt = new Date(Date.UTC(y,m-1,d)); if(dt.getUTCMonth()!==m-1) return null;
  return dt.toISOString().slice(0,10);
}
function parseDateStr(s){
  if(s===null||s===undefined) return null;
  if(typeof s==='number'){ if(s>20000 && s<80000) return new Date(Math.round((s-25569)*86400000)).toISOString().slice(0,10); return null; }
  s = String(s).trim(); if(!s) return null;

function parseCSV(text){

  let best=',', bestScore=-1;
  [',','\t',';','|'].forEach(d=>{
    const counts = lines.map(l=>l.split(d).length-1).filter(c=>c>0);
    if(!counts.length) return;
    const mode = counts.sort((a,b)=>a-b)[Math.floor(counts.length/2)];
    const score = counts.filter(c=>c===mode).length * (mode>1?1:0.3) * (d==='\t'?1.3:1);
    if(score>bestScore){ bestScore=score; best=d; }

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"' && cur==='') q=true;
    else if(ch===best){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch==='\r'){ /* skip */ }

  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }

}

  if(textLen<20) return {rows:[], warns:[], scanned:true, doc};
  let res = pdfLinesToRows(pages);
  if(res.rows.length<2){
    const lines = pages.flat().map(l=>l.items.map(i=>i.s).join(' '));
    res = parseTextLines(lines);
  }
  return Object.assign(res,{scanned:false});
}
async function ocrCanvasesOrImage(sources, onProgress){
  await loadScriptOnce(TESS_URL);
  const worker = await window.Tesseract.createWorker('eng', 1, {logger:m=>{ if(onProgress && m.status==='recognizing text') onProgress(m.progress); }});
  let text='';
  for(const s of sources){ const r = await worker.recognize(s); text += r.data.text+'\n'; }
  await worker.terminate();
  return text;
}
async function pdfToCanvases(doc){
  const out=[];
  for(let pn=1; pn<=doc.numPages; pn++){
    const page=await doc.getPage(pn); const vp=page.getViewport({scale:2.2});
    const cv=document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise; out.push(cv);
  }
  return out;
}

/* ---------- One entry point: file -> {rows, warns, notes[]} ---------- */
async function readStatementFile(file, setStatus){
  const name = (file.name||'').toLowerCase(); const notes=[];
  const buf = await file.arrayBuffer(); const u8 = new Uint8Array(buf.slice(0,8));
  const isZip = u8[0]===0x50 && u8[1]===0x4B, isOle = u8[0]===0xD0 && u8[1]===0xCF, isPdf = u8[0]===0x25 && u8[1]===0x50;
  const isImg = /\.(png|jpe?g|webp|bmp|tiff?)$/.test(name) || /^image\//.test(file.type);
  if(isPdf || name.endsWith('.pdf')){
    setStatus && setStatus(bt('Reading PDF…','पीडीएफ पढ़ा जा रहा है…'));
    const r = await parsePdfFile(buf);
    if(r.scanned){
      setStatus && setStatus(bt('Scanned PDF — running OCR (first run downloads the OCR engine; may take a minute)…','स्कैन की हुई पीडीएफ — ओसीआर चल रहा है (पहली बार ओसीआर इंजन डाउनलोड होगा; एक मिनट लग सकता है)…'));
      const cvs = await pdfToCanvases(r.doc);
      const text = await ocrCanvasesOrImage(cvs, p=>setStatus&&setStatus(bt('OCR… ','ओसीआर… ')+Math.round(p*100)+'%'));
      const o = parseTextLines(text.split(/\n/)); o.notes=['ocr']; return o;
    }
    return r;
  }
  if(isImg){
    setStatus && setStatus(bt('Photo — running OCR (first run downloads the OCR engine)…','फोटो — ओसीआर चल रहा है (पहली बार ओसीआर इंजन डाउनलोड होगा)…'));
    const text = await ocrCanvasesOrImage([file], p=>setStatus&&setStatus(bt('OCR… ','ओसीआर… ')+Math.round(p*100)+'%'));
    const o = parseTextLines(text.split(/\n/)); o.notes=['ocr']; return o;
  }
  let grid=null;
  if(isZip){ grid = await parseXlsx(buf); }
  else if(isOle){ throw new Error('OLD_XLS'); }
  else {
    const text = new TextDecoder('utf-8').decode(buf);
    if(/^\s*<(!doctype|html|table|\?xml)/i.test(text) || /<table/i.test(text.slice(0,4000))) grid = parseHtmlTable(text);
    else grid = parseCSV(text);
  }
  return {grid};
}
/* From a grid, pick a mapping and build rows (or return the grid for manual mapping) */
function rowsFromGrid(grid, forcedMap){
  const det = forcedMap || detectMap(grid);
  if(!det) return {rows:[], warns:[], det:null};
  const r = gridToRows(grid, det); r.det = det; return r;
}

/* ---------- Auto-classification (rule = specific keyword; guess = low confidence, must be reviewed) ---------- */
function autoHead(r, ctx){
  const n = String(r.narr||'').toUpperCase(); const T = re => re.test(n);
  if(r.cr>0){
    if(T(/CASH\s*DEP|\bCDM\b|BY CASH|CASH-DEP|CSH DEP/)) return ['R_SALES','rule'];
    if(T(/SUBSIDY|REFUND|REVERSAL|CASHBACK|CHARGEBACK|REVERSE|INT(EREST)?\.? ?(CR|CREDIT|PD|PAID)|\bSB INT|FD INT|INT\.PD/)) return ['R_INC','rule'];
    if(T(/LOAN.*(DISB|CREDIT)|DISBURS|TERM LOAN|TL DISB|MUDRA|PMEGP|CGTMSE/)) return ['R_TL','rule'];
    if(T(/CAPITAL|OWN FUND|PROMOTER|PROPRIETOR|INTRODUC/)) return ['R_CAP','rule'];
    if(T(/SALE OF (ASSET|VEHICLE|MACHIN)/)) return ['R_FAS','rule'];
    if(T(/\bSELF\b|OWN A\/C|OWN ACC|TRANSFER FROM (SB|SAVINGS)/)) return ['R_INTER','guess'];
    if(T(/UPI|NEFT|RTGS|IMPS|CHQ|CHEQUE|\bCLG\b|\bPOS\b|ECOM|MMT|PAYTM|PHONEPE|GPAY|BHARATPE|RAZORPAY|SETTLEMENT|\bQR\b/)) return ['R_SALES','guess'];
    return ['',''];
  }
  if(T(/SALARY|SALARIES|WAGES|PAYROLL|STAFF|LABOUR|LABOR/)) return ['P_SAL','rule'];
  if(T(/\bRENT\b|\bLEASE\b/)) return ['P_RENT','rule'];
  if(T(/ELECTRIC|BESCOM|MSEDCL|TNEB|\bBSES\b|DISCOM|POWER BILL|UPPCL|DHBVN|UHBVN|TORRENT POWER|KSEB|\bCESC\b/)) return ['P_ELEC','rule'];
  if(T(/\bGST\b|CBIC|CGST|SGST|IGST|GSTN/) && !T(/CHARGES|CHGS/)) return ['P_GST','rule'];
  if(T(/INCOME TAX|ADVANCE TAX|\bITD\b|CBDT|TAX PAYMENT/)) return ['P_TAX','rule'];
  if(T(/\bEMI\b|LOAN REPAY|INSTAL|LOAN A\/C|\bTL A\/C|NACH.*LOAN|ACH D.*LOAN|\bLN\b.*REPAY/)) return ['P_EMI','rule'];
  if(T(/INT(EREST)?\.? ?(DEBIT|CHG|CHARG|COLL|ON CC|ON OD)|CC INT|OD INT|\bINT\b DEBIT|INTEREST/)) return ['P_INT','rule'];
  if(T(/CHARGES|\bCHGS\b|SMS CHG|MIN BAL|PROCESSING FEE|BANK CHARGE|ANNUAL FEE|DEBIT CARD|FOLIO/)) return ['P_BANKCH','rule'];
  if(T(/\bATM\b|CASH WDL|CASH WITHDRAW|\bNFS\b|CHQ SELF|\bSELF\b/)) return ['P_CASHB','guess'];
  if(T(/INSURANCE|\bLIC\b|PREMIUM|LOMBARD|ERGO/)) return ['P_INS','guess'];
  if(T(/FREIGHT|TRANSPORT|LOGISTIC|CARTAGE|TRUCK|COURIER|DTDC|DELHIVERY|BLUE ?DART|PORTER|CARRIER/)) return ['P_TRANS','rule'];
  if(T(/REPAIR|MAINTENANCE|SERVICING|\bAMC\b/)) return ['P_REPAIR','rule'];
  if(T(/TELEPHONE|MOBILE|RECHARGE|AIRTEL|\bJIO\b|VODAFONE|\bBSNL\b|BROADBAND|INTERNET|STATIONER|PRINTING|OFFICE|PROFESSIONAL|AUDIT FEE|\bCA FEE|LEGAL|REGISTRATION|LICEN[CS]E/)) return ['P_ADMIN','guess'];
  if(T(/ADVERT|MARKETING|PROMOTION|COMMISSION|BROKERAGE/)) return ['P_SELL','guess'];
  if(T(/MACHINERY|EQUIPMENT|FURNITURE|VEHICLE|COMPUTER|LAPTOP|\bMOTOR\b|\bPLANT\b|TRACTOR|GENERATOR|INVERTER/)) return ['P_FA','guess'];
  if(T(/DRAWING|PERSONAL|FAMILY|HOUSEHOLD|SCHOOL|TUITION|MEDICAL|HOSPITAL|HOME EXP/)) return ['P_DRAW','guess'];
  if(ctx && ctx.purRe && ctx.purRe.test(n)) return ['P_PUR','guess'];
  if(T(/PURCHASE|SUPPLIER|MATERIAL|RAW MATERIAL/)) return ['P_PUR','guess'];
  return ['',''];
}
const NOISE = /^(UPI|NEFT|RTGS|IMPS|ACH|NACH|POS|ECOM|MMT|CHQ|CHEQUE|CLG|BY|TO|TRF|TRANSFER|CR|DR|P2A|P2M|P2P|PAYMENT|FROM|PAID|PHONE|VIA|REF|NO|INB|MOB|BANK|LTD|A\/C|AC|DEBIT|CREDIT|DEP|WDL|CASH|TXN|IFT)$/;

  let s = String(narr||'').toUpperCase().replace(/[0-9]{3,}/g,' ').replace(/[^A-Z& ]/g,' ');

function fyEndOf(iso){ const y=+iso.slice(0,4), m=+iso.slice(5,7); return m>=4 ? y+1 : y; }
function bankOpenAuto(b){
  const r = b.rows.find(x=>x.bal!==null && x.bal!==undefined);
  if(!r) return null;
  /* first row with a balance; add back the net effect of every row up to and including it */
  let v = r.bal; for(const x of b.rows){ v = v - (x.cr||0) + (x.dr||0); if(x===r) break; }
  return Math.round(v*100)/100;
}
const Q = x => Math.round((+x||0)*100);
const rup = x => x/100;
function money(n){
  n = Math.round(n*100)/100; if(Number.isInteger(n)) return inr(n);
  const neg = n<0, a = Math.abs(n), w = Math.floor(a+1e-9); const frac = (Math.round((a-w)*100)).toString().padStart(2,'0');
  return (neg?'-':'') + inr(w) + '.' + frac;
}

  const b = getBank(p), out = { enabled:true, source:'bank', years:[], errors:[], warns:[], ok:false, h:getHistory(p) };
  const err = (en,hi,fix)=>out.errors.push({en,hi,fix});
  const rows = b.rows.filter(r=>r.date);
  if(!rows.length){ err('No bank entries yet — upload a statement, paste entries or add them by hand in the Bank-Statement workspace.','अभी कोई बैंक प्रविष्टि नहीं — बैंक-स्टेटमेंट कार्यक्षेत्र में स्टेटमेंट अपलोड करें, प्रविष्टियाँ पेस्ट करें या हाथ से जोड़ें।'); return out; }
  const bad = rows.filter(r=>(r.dr>0&&r.cr>0)||(!r.dr&&!r.cr));
  if(bad.length) err(`${bad.length} entr${bad.length>1?'ies have':'y has'} no amount or both debit and credit (first: ${fmtD(bad[0].date)} ${bad[0].narr.slice(0,40)}).`,`${bad.length} प्रविष्टि(यों) में राशि नहीं है या नामे व जमा दोनों हैं (पहली: ${fmtD(bad[0].date)} ${bad[0].narr.slice(0,40)})।`);
  const unc = rows.filter(r=>!r.head).length;
  if(unc) err(`${unc} bank entr${unc>1?'ies are':'y is'} not classified yet.`,`${unc} बैंक प्रविष्टि(याँ) अभी वर्गीकृत नहीं हैं।`);
  const wrong = rows.filter(r=>r.head && BH[r.head] && ((BH[r.head].s==='R')!==(r.cr>0)));
  if(wrong.length) err(`${wrong.length} entr${wrong.length>1?'ies have':'y has'} a head that does not match whether it is a receipt or a payment.`,`${wrong.length} प्रविष्टि(यों) का शीर्ष प्राप्ति/भुगतान से मेल नहीं खाता।`);
  if(!b.reviewed) err('Confirm that you have reviewed the classification (tick the box in the workspace).','पुष्टि करें कि आपने वर्गीकरण की समीक्षा कर ली है (कार्यक्षेत्र में बॉक्स चुनें)।');
  if(!b.decl.openingConfirmed) err('Confirm the opening balances in the workspace (Declarations → Opening position).','कार्यक्षेत्र में प्रारंभिक शेष की पुष्टि करें (घोषणाएँ → प्रारंभिक स्थिति)।');
  const fys = Array.from(new Set(rows.map(r=>fyEndOf(r.date)))).sort((a,b2)=>a-b2);
  fys.forEach(fy=>{ if(!yearDecl(b,fy).confirmed) err(`Confirm the declarations for FY ${fyLabel(fy)} in the workspace.`,`कार्यक्षेत्र में वित्त वर्ष ${fyLabel(fy)} की घोषणाओं की पुष्टि करें।`); });
  if(fys.length>3) err('More than 3 financial years of entries — please keep the last 1 to 3 years.','3 से अधिक वित्त वर्षों की प्रविष्टियाँ — कृपया अंतिम 1 से 3 वर्ष रखें।');

  /* opening bank balance and statement continuity */
  let openBank = (b.openBank!==null && b.openBank!==undefined && b.openBank!=='') ? Q(b.openBank) : null;
  const auto = bankOpenAuto(b); if(openBank===null && auto!==null) openBank = Q(auto);
  if(openBank===null) err('Enter the opening bank balance (the statement has no balance column).','प्रारंभिक बैंक शेष दर्ज करें (स्टेटमेंट में शेष कॉलम नहीं है)।');
  if(out.errors.length) return out;
  if(!b.ignoreBalCheck){
    let run = openBank, breaks=[];
    rows.forEach(r=>{ run += Q(r.cr) - Q(r.dr); if(r.bal!==null && r.bal!==undefined){ if(Math.abs(run - Q(r.bal))>1){ breaks.push({r, exp:run, got:Q(r.bal)}); run = Q(r.bal); } } });
    if(breaks.length){
      const f=breaks[0]; err(`Bank balance does not reconcile at ${breaks.length} point(s); first on ${fmtD(f.r.date)} (“${f.r.narr.slice(0,30)}”): entries give ${money(rup(f.exp))} but the statement shows ${money(rup(f.got))}. Entries may be missing, duplicated or have a wrong Dr/Cr. Fix them, or tick “Ignore balance check” in the workspace.`,
        `बैंक शेष ${breaks.length} स्थान पर मेल नहीं खाता; पहला ${fmtD(f.r.date)} (“${f.r.narr.slice(0,30)}”): प्रविष्टियों से ${money(rup(f.exp))} बनता है पर स्टेटमेंट में ${money(rup(f.got))} है। प्रविष्टियाँ छूटी, दोहराई या नामे/जमा गलत हो सकती हैं। ठीक करें या कार्यक्षेत्र में “शेष जाँच अनदेखी करें” चुनें।`);
      return out;
    }
  }
  const info = bankConstitutionInfo(p), ind = bankIndustryInfo(p);
  let prev = null, bankRun = openBank;
  for(const fy of fys){
    const yrows = rows.filter(r=>fyEndOf(r.date)===fy), D = yearDecl(b,fy), od = b.decl.opening;
    let ob;
    if(!prev){
      ob = { FA:Q(od.netFixedAssets), STK:Q(od.inventory), DR:Q(od.receivables), OCA:Q(od.otherCurrentAssets), CASHH:Q(od.cashInHand), BANK:openBank, INTER:0,
             CR:-Q(od.tradeCreditors), OCL:-Q(od.otherCurrentLiab), TL:-Q(od.termLoanOS), UNSEC:-Q(od.unsecuredLoans), GST:-Q(od.gstBalance) };
    } else {
      ob = prev.closeSigned;
      const first = yrows[0];
      if(first && first.bal!==null && first.bal!==undefined){
        const impl = Q(first.bal) - Q(first.cr) + Q(first.dr);
        if(Math.abs(impl - ob.BANK)>1 && !b.ignoreBalCheck){ err(`Gap between years: FY ${fyLabel(fy-1)} closes at ${money(rup(ob.BANK))} but the first entry of FY ${fyLabel(fy)} implies an opening of ${money(rup(impl))}. Some entries in between are missing.`,`वर्षों के बीच अंतर: वित्त वर्ष ${fyLabel(fy-1)} ${money(rup(ob.BANK))} पर बंद होता है पर वित्त वर्ष ${fyLabel(fy)} की पहली प्रविष्टि ${money(rup(impl))} का प्रारंभिक शेष दर्शाती है। बीच की कुछ प्रविष्टियाँ छूटी हैं।`); return out; }
      }
    }
    const res = buildBankYear(fy, yrows, ob, D, b, p, info, ind);
    res.errors.forEach(e=>out.errors.push(e)); res.warns.forEach(w=>out.warns.push(w));
    out.years.push(res);
    if(!res.ok) return out;
    prev = res;
  }
  out.ok = out.errors.length===0;
  return out;
}

function buildBankYear(fy, yrows, ob, D, b, p, info, ind){
  const res = { year:{ key:'bank'+fy, label:fyLabel(fy), start:`01-04-${fy-1}`, end:`31-03-${fy}`, openDate:`31-03-${fy-1}`, closeDate:`31-03-${fy}`, fy }, errors:[], warns:[], ok:false, bank:true, accOrder:BK_ORDER };
  const err = (en,hi)=>res.errors.push({en,hi}); const warn = (en,hi)=>res.warns.push({en,hi});
  const g1 = Math.max(0,(+b.gstSalesPct||0))/100, g2 = Math.max(0,(+b.gstPurchPct||0))/100;
  const startISO=`${fy-1}-04-01`, endISO=`${fy}-03-31`;
  const J=[]; const add=(when,date,narr,lines,txt)=>{ lines=lines.filter(l=>l[1]||l[2]); if(lines.length) J.push({no:J.length+1,when,date,narr,txt,lines}); };
  const two=(narr,dr,cr,amt)=>{ if(amt>0) add('adj',endISO,narr,[[dr,amt,0],[cr,0,amt]]); };

  /* opening entry — capital is the balancing figure of the opening position */
  let sum=0; const oLines=[];
  Object.keys(ob).forEach(a=>{ const v=ob[a]; sum+=v; if(v>0) oLines.push([a,v,0]); else if(v<0) oLines.push([a,0,-v]); });
  if(sum>0) oLines.push(['CAP',0,sum]); else if(sum<0) oLines.push(['CAP',-sum,0]);
  add('open',startISO,['Opening balances brought forward','प्रारंभिक शेष आगे लाए गए'],oLines);

  /* bank entries, one journal line each */
  const tot={}, cnt={}; let sumDrBank=0, sumCrBank=0;
  yrows.forEach(r=>{
    const h = BH[r.head]; let acc = h.acc; if(acc==='TAXX') acc = info.taxExp ? 'TAX' : 'DRW';
    const cr=Q(r.cr), dr=Q(r.dr);
    if(cr>0){ add('txn',r.date,null,[['BANK',cr,0],[acc,0,cr]],r.narr); tot[r.head]=(tot[r.head]||0)+cr; sumCrBank+=cr; }
    else { add('txn',r.date,null,[[acc,dr,0],['BANK',0,dr]],r.narr); tot[r.head]=(tot[r.head]||0)+dr; sumDrBank+=dr; }
    cnt[r.head]=(cnt[r.head]||0)+1;
  });
  const T = k => tot[k]||0;

  /* declared / derived figures */
  const Orec=ob.DR, OC=-ob.CR, Ocl=-ob.OCL, Otl=-ob.TL, Ounsec=-ob.UNSEC;
  const Crec=Q(D.receivables), Ccred=Q(D.tradeCreditors), Cinv=Q(D.inventory), Ccash=Q(D.cashInHand), Cocl=Q(D.otherCurrentLiab), Ctl=Q(D.termLoanOS);
  const Sc=Q(D.cashSalesNotDeposited), CP=Q(D.cashPurchases), CD=Q(D.cashDrawings);
  const grossSales = T('R_SALES') + Sc + Crec - Orec;
  const netSales = Math.round(grossSales/(1+g1)), gstOut = grossSales - netSales;
  const grossPurch = T('P_PUR') + CP + Ccred - OC;
  const netPurch = Math.round(grossPurch/(1+g2)), gstIn = grossPurch - netPurch;
  const cashSpend = ob.CASHH + T('P_CASHB') + Sc - Ccash;
  const cashOpex = cashSpend - CP - CD;
  const principal = Otl + T('R_TL') - Ctl, interestEmi = T('P_EMI') - principal;
  const dOCL = Cocl - Ocl;
  const depBase = ob.FA + T('P_FA') - T('R_FAS');
  const rate = (b.deprRate!==null && b.deprRate!==undefined && b.deprRate!=='') ? +b.deprRate : ((typeof getAssumptions==='function' && getAssumptions(p) && getAssumptions(p).deprRate) || 10);
  const depAuto = Math.max(0, Math.round(depBase*rate/100));
  const dep = (D.depreciation!==null && D.depreciation!==undefined && D.depreciation!=='') ? Q(D.depreciation) : depAuto;
  const FY = bt(`FY ${fyLabel(fy)}`,`वित्त वर्ष ${fyLabel(fy)}`);

  if(grossSales<0) err(`${FY}: Sales work out negative (${money(rup(grossSales))}) — closing debtors are far below opening debtors plus receipts. Re-check the debtors you declared.`,`${FY}: बिक्री ऋणात्मक (${money(rup(grossSales))}) — अंतिम देनदार, प्रारंभिक देनदार व प्राप्तियों से बहुत कम हैं। घोषित देनदार जाँचें।`);
  if(grossPurch<0) err(`${FY}: Purchases work out negative (${money(rup(grossPurch))}) — closing creditors are far below opening creditors plus payments. Re-check the creditors you declared.`,`${FY}: क्रय ऋणात्मक (${money(rup(grossPurch))}) — अंतिम लेनदार बहुत कम हैं। घोषित लेनदार जाँचें।`);
  if(cashOpex<0) err(`${FY}: Cash in hand does not reconcile — cash available (opening ${money(rup(ob.CASHH))} + withdrawn ${money(rup(T('P_CASHB')))} + undeposited sales ${money(rup(Sc))} − closing ${money(rup(Ccash))}) is ${money(rup(cashSpend))}, less than the cash purchases and cash drawings you declared. Adjust cash in hand, undeposited cash sales, cash purchases or cash drawings.`,`${FY}: हाथ की नकदी मेल नहीं खाती — उपलब्ध नकद (प्रारंभिक ${money(rup(ob.CASHH))} + निकासी ${money(rup(T('P_CASHB')))} + अजमा बिक्री ${money(rup(Sc))} − अंतिम ${money(rup(Ccash))}) ${money(rup(cashSpend))} है, जो घोषित नकद क्रय व नकद आहरण से कम है।`);
  if(principal<0) err(`${FY}: Closing term loan (${money(rup(Ctl))}) is higher than opening ${money(rup(Otl))} plus disbursements ${money(rup(T('R_TL')))}. Classify the disbursement entry or correct the closing term loan.`,`${FY}: अंतिम मीयादी ऋण (${money(rup(Ctl))}), प्रारंभिक ${money(rup(Otl))} + वितरण ${money(rup(T('R_TL')))} से अधिक है। वितरण प्रविष्टि वर्गीकृत करें या अंतिम ऋण सुधारें।`);
  else if(interestEmi<0) err(`${FY}: Instalments paid (${money(rup(T('P_EMI')))}) are less than the principal reduction implied by the closing term loan (${money(rup(principal))}). Check the closing term loan or the instalment entries.`,`${FY}: चुकाई किस्तें (${money(rup(T('P_EMI')))}) अंतिम मीयादी ऋण से निकले मूलधन कटौती (${money(rup(principal))}) से कम हैं। अंतिम ऋण या किस्त प्रविष्टियाँ जाँचें।`);
  if(depBase>=0 && dep>depBase) err(`${FY}: Depreciation (${money(rup(dep))}) exceeds the fixed assets available (${money(rup(depBase))}).`,`${FY}: मूल्यह्रास (${money(rup(dep))}) उपलब्ध स्थिर संपत्ति (${money(rup(depBase))}) से अधिक है।`);
  if(depBase<0) err(`${FY}: Fixed assets sold exceed opening assets plus purchases.`,`${FY}: बेची गई स्थिर संपत्ति, प्रारंभिक संपत्ति + खरीद से अधिक है।`);
  if(res.errors.length) return res;

  /* year-end adjustments (derived from declared items) */
  const A=(narr,lines)=>add('adj',endISO,narr,lines);
  if(Sc>0) A(['Cash collected from customers but not deposited in bank (declared)','ग्राहकों से प्राप्त पर बैंक में जमा न की गई नकदी (घोषित)'],[['CASHH',Sc,0],['DR',0,Sc]]);
  A(['Sales for the year = receipts + closing debtors − opening debtors','वर्ष की बिक्री = प्राप्तियाँ + अंतिम देनदार − प्रारंभिक देनदार'],[['DR',grossSales,0],['SAL',0,netSales],['GST',0,gstOut]]);
  A(['Purchases for the year = payments + closing creditors − opening creditors','वर्ष का क्रय = भुगतान + अंतिम लेनदार − प्रारंभिक लेनदार'],[['PUR',netPurch,0],['GST',gstIn,0],['CR',0,grossPurch]]);
  if(CP>0) A(['Purchases paid in cash from till (declared)','गल्ले से नकद चुकाया गया क्रय (घोषित)'],[['CR',CP,0],['CASHH',0,CP]]);
  if(cashOpex>0) A(['Operating expenses paid in cash from till (balancing figure of cash in hand)','गल्ले से नकद चुकाए परिचालन व्यय (नकदी का शेष आंकड़ा)'],[['OP_CASH',cashOpex,0],['CASHH',0,cashOpex]]);
  if(CD>0) A(['Drawings taken in cash from till (declared)','गल्ले से नकद आहरण (घोषित)'],[['DRW',CD,0],['CASHH',0,CD]]);
  if(T('P_EMI')>0 || principal!==0) A(['Term loan instalments split into principal and interest (principal = opening + disbursed − closing)','मीयादी ऋण किस्तें मूलधन व ब्याज में विभाजित (मूलधन = प्रारंभिक + वितरित − अंतिम)'],[['TL',principal,0],['INT',interestEmi,0],['EMI',0,T('P_EMI')]]);
  if(dOCL>0) A(['Expenses outstanding at year end — increase in accrued dues (declared)','वर्षांत पर बकाया व्यय — देय में वृद्धि (घोषित)'],[['OP_OTH',dOCL,0],['OCL',0,dOCL]]);
  else if(dOCL<0) A(['Old accrued dues settled during the year (declared closing accruals lower)','पुराने प्रोद्भवन का वर्ष में निपटान (घोषित अंतिम प्रोद्भवन कम)'],[['OCL',-dOCL,0],['OP_OTH',0,-dOCL]]);
  if(dep>0) A(['Depreciation for the year','वर्ष हेतु मूल्यह्रास'],[['DEP',dep,0],['FA',0,dep]]);

  /* provisional balances to build closing entries */
  const acc0={}; BK_ORDER.forEach(a=>acc0[a]=0); J.forEach(j=>j.lines.forEach(l=>{ acc0[l[0]]+=l[1]-l[2]; }));
  const K=(narr,dr,cr,amt)=>{ if(amt>0) add('close',endISO,narr,[[dr,amt,0],[cr,0,amt]]); };
  K(['Opening stock transferred to Trading A/c','प्रारंभिक स्टॉक व्यापार खाते में अंतरित'],'TRD','STK',ob.STK);
  K(['Purchases transferred to Trading A/c','क्रय व्यापार खाते में अंतरित'],'TRD','PUR',acc0.PUR);
  K(['Sales transferred to Trading A/c','बिक्री व्यापार खाते में अंतरित'],'SAL','TRD',-acc0.SAL);
  K(['Closing stock (declared) brought into books','अंतिम स्टॉक (घोषित) बही में लिया गया'],'STK','TRD',Cinv);
  const GP = (-acc0.SAL) + Cinv - ob.STK - acc0.PUR;
  if(GP>=0) K(['Gross profit transferred to Profit & Loss A/c','सकल लाभ लाभ-हानि खाते में अंतरित'],'TRD','PL',GP); else K(['Gross loss transferred to Profit & Loss A/c','सकल हानि लाभ-हानि खाते में अंतरित'],'PL','TRD',-GP);
  OPEX_ACCS.concat(['DEP','INT','TAX']).forEach(a=>{ const v=acc0[a]; if(v>0) K([`${ACC[a][0]} transferred to Profit & Loss A/c`,`${ACC[a][1]} लाभ-हानि खाते में अंतरित`],'PL',a,v); else if(v<0) K([`${ACC[a][0]} transferred to Profit & Loss A/c`,`${ACC[a][1]} लाभ-हानि खाते में अंतरित`],a,'PL',-v); });
  if(acc0.INC<0) K(['Other income transferred to Profit & Loss A/c','अन्य आय लाभ-हानि खाते में अंतरित'],'INC','PL',-acc0.INC);
  /* net profit = credit balance of P&L after the transfers above */
  let plNet = 0; J.filter(j=>j.when==='close').forEach(j=>j.lines.forEach(l=>{ if(l[0]==='PL') plNet += l[2]-l[1]; }));
  if(plNet>=0) K(['Net profit transferred to Capital Account','शुद्ध लाभ पूंजी खाते में अंतरित'],'PL','CAP',plNet); else K(['Net loss transferred to Capital Account','शुद्ध हानि पूंजी खाते में अंतरित'],'CAP','PL',-plNet);
  if(acc0.DRW>0) K(['Drawings transferred to Capital Account','आहरण पूंजी खाते में अंतरित'],'CAP','DRW',acc0.DRW); else if(acc0.DRW<0) K(['Drawings transferred to Capital Account','आहरण पूंजी खाते में अंतरित'],'DRW','CAP',-acc0.DRW);

  J.forEach(j=>{ const d=j.lines.reduce((s,l)=>s+l[1],0), c=j.lines.reduce((s,l)=>s+l[2],0); if(d!==c) err(`Internal error: journal entry ${j.no} does not balance.`,`आंतरिक त्रुटि: जर्नल प्रविष्टि ${j.no} संतुलित नहीं।`); });

  /* ledgers */
  const raw={}; BK_ORDER.forEach(a=>raw[a]=[]);
  J.forEach(j=>j.lines.forEach(l=>{ const opp = j.lines.length===2 ? j.lines.find(x=>x!==l)[0] : null; raw[l[0]].push({jn:j.no,when:j.when,dr:rup(l[1]),cr:rup(l[2]),pdr:l[1],pcr:l[2],opp,date:j.date,txt:j.txt||null}); }));
  const ledgers={};
  BK_ORDER.forEach(a=>{
    const left=[],right=[]; let d=0,c=0,pd=0,pc=0;
    raw[a].forEach(x=>{ if(x.pdr){ left.push({kind:'line',x,amt:x.dr}); pd+=x.pdr; } if(x.pcr){ right.push({kind:'line',x,amt:x.cr}); pc+=x.pcr; } });
    const pb=pd-pc;
    if(pb>0){ right.push({kind:'bal',amt:rup(pb)}); pc+=pb; } else if(pb<0){ left.push({kind:'bal',amt:rup(-pb)}); pd+=-pb; }
    ledgers[a]={left,right,totalDr:rup(pd),totalCr:rup(pc),bal:rup(pb),pbal:pb,used:raw[a].length>0};
  });
  /* trial balance (after adjustments, before closing entries) */
  const tb=[]; BK_ORDER.forEach(a=>{ let d=0,c=0; raw[a].forEach(x=>{ if(x.when!=='close'){ d+=x.pdr; c+=x.pcr; } }); const v=d-c; if(v) tb.push({acc:a,dr:v>0?rup(v):0,cr:v<0?rup(-v):0,pv:v}); });
  const tbDr=tb.reduce((s,r)=>s+r.pv*(r.pv>0?1:0),0), tbCr=tb.reduce((s,r)=>s-r.pv*(r.pv<0?1:0),0);

  const pb = a => ledgers[a].pbal;
  const nominalClosed = ['SAL','INC','PUR','DEP','INT','TAX','TRD','PL','DRW'].concat(OPEX_ACCS).every(a=>pb(a)===0);
  const closeSigned = { FA:pb('FA'), STK:pb('STK'), DR:pb('DR'), OCA:pb('OCA'), CASHH:pb('CASHH'), BANK:pb('BANK'), INTER:pb('INTER'), CR:pb('CR'), OCL:pb('OCL'), TL:pb('TL'), UNSEC:pb('UNSEC'), GST:pb('GST') };
  const capClose = -pb('CAP');
  const assets = pb('FA')+pb('STK')+pb('DR')+pb('CASHH')+pb('OCA') + Math.max(pb('BANK'),0) + Math.max(pb('GST'),0) + Math.max(pb('INTER'),0);
  const liabs  = capClose - pb('TL') - pb('UNSEC') - pb('CR') - pb('OCL') + Math.max(-pb('BANK'),0) + Math.max(-pb('GST'),0) + Math.max(-pb('INTER'),0);
  /* statement figures, read back from ledgers */
  const sumDrN = (a,f)=>raw[a].filter(f).reduce((s,x)=>s+x.pdr,0), sumCrN=(a,f)=>raw[a].filter(f).reduce((s,x)=>s+x.pcr,0);
  const nc = x=>x.when!=='close';
  const st = { sales:sumCrN('SAL',nc), openStock:sumDrN('STK',x=>x.when==='open'), purchases:sumDrN('PUR',nc), closeStock:sumDrN('STK',x=>x.when==='close'),

  st.cos=st.openStock+st.purchases-st.closeStock; st.gp=st.sales-st.cos; st.opexTotal=st.opex.reduce((s,x)=>s+x.v,0);
  st.ebitda=st.gp+st.otherIncome-st.opexTotal; st.pbt=st.ebitda-st.dep-st.int; st.np=st.pbt-st.tax;
  const capIntro = sumCrN('CAP',x=>x.when==='txn'), drawingsT = sumDrN('DRW',nc)-sumCrN('DRW',nc);
  const capOpening = (()=>{ let s=0; Object.keys(ob).forEach(a=>s+=ob[a]); return s; })();
  const closeBankStmt = (()=>{ const last=[...yrows].reverse().find(r=>r.bal!==null && r.bal!==undefined); return last? Q(last.bal):null; })();

  const tally=[];
  const TL_=(key,en,hi,bookP,declP,declLabelEn,declLabelHi)=>tally.push({key,en,hi,book:rup(bookP),decl:declP===null?null:rup(declP),ok: declP===null ? true : Math.abs(bookP-declP)<=0});
  TL_('bank','Bank book closing balance vs statement closing balance','बैंक बही का अंतिम शेष बनाम स्टेटमेंट का अंतिम शेष',pb('BANK'),closeBankStmt);
  TL_('rcpt','Total receipts in Bank Book vs total credits in statement','बैंक बही की कुल प्राप्तियाँ बनाम स्टेटमेंट की कुल जमा',sumDrN('BANK',x=>x.when==='txn'),sumCrBank);
  TL_('pay','Total payments in Bank Book vs total debits in statement','बैंक बही के कुल भुगतान बनाम स्टेटमेंट की कुल नामे',sumCrN('BANK',x=>x.when==='txn'),sumDrBank);
  TL_('stock','Closing stock — books vs declared','अंतिम स्टॉक — बहीखाते बनाम घोषित',pb('STK'),Cinv);
  TL_('debtors','Closing debtors — books vs declared','अंतिम देनदार — बहीखाते बनाम घोषित',pb('DR'),Crec);
  TL_('creditors','Closing creditors — books vs declared','अंतिम लेनदार — बहीखाते बनाम घोषित',-pb('CR'),Ccred);
  TL_('cash','Cash in hand — books vs declared','हाथ में नकद — बहीखाते बनाम घोषित',pb('CASHH'),Ccash);
  TL_('accr','Accrued / other dues — books vs declared','प्रोद्भवन / अन्य देय — बहीखाते बनाम घोषित',-pb('OCL'),Cocl);
  TL_('tl','Closing term loan — books vs declared','अंतिम मीयादी ऋण — बहीखाते बनाम घोषित',-pb('TL'),Ctl);
  TL_('capital','Capital: opening + profit + introduced − drawings = closing','पूंजी: प्रारंभिक + लाभ + निवेश − आहरण = अंतिम',capClose,capOpening+st.np+capIntro-drawingsT);
  TL_('tb','Trial balance: total Debits = total Credits','तलपट: कुल नामे = कुल जमा',tbDr,tbCr);
  TL_('bs','Balance sheet: total Assets = Liabilities + Capital','तुलन पत्र: कुल संपत्ति = देनदारियाँ + पूंजी',assets,liabs);
  const tallyOk = tally.every(t=>t.ok) && nominalClosed;
  if(!tallyOk) err('Internal error: the books do not tally.','आंतरिक त्रुटि: बहीखाते मेल नहीं खाते।');

  /* balance sheet groups + 10-field summary (for “Use as Last Year's Actuals”) */
  const bs = { netFixedAssets:pb('FA'), inventory:pb('STK'), receivables:pb('DR'), cashHand:pb('CASHH'), bankPos:Math.max(pb('BANK'),0), oca:pb('OCA'), gstRec:Math.max(pb('GST'),0), interDr:Math.max(pb('INTER'),0),
    capital:capClose, tl:-pb('TL'), unsec:-pb('UNSEC'), cred:-pb('CR'), ocl:-pb('OCL'), gstPay:Math.max(-pb('GST'),0), od:Math.max(-pb('BANK'),0), interCr:Math.max(-pb('INTER'),0), assets, liabs };
  const r0 = x=>Math.round(rup(x));
  const summary10 = { sales:r0(st.sales), costOfSales:r0(st.cos), operatingExpenses:r0(st.opexTotal-st.otherIncome), depreciation:r0(st.dep), interestPaid:r0(st.int), netProfit:r0(st.np),
    netFixedAssets:r0(bs.netFixedAssets), inventory:r0(bs.inventory), receivables:r0(bs.receivables), cashBank:r0(bs.cashHand+bs.bankPos), otherCurrentAssets:r0(bs.oca+bs.gstRec+bs.interDr),
    netWorth:r0(bs.capital), termLoanOS:r0(bs.tl), wcBorrowingOS:r0(bs.od), tradeCreditors:r0(bs.cred), otherCurrentLiab:r0(bs.ocl+bs.unsec+bs.gstPay+bs.interCr) };

  /* warnings to review */
  const guessRows = yrows.filter(r=>r.conf==='guess').length;
  if(guessRows) warn(`${FY}: ${guessRows} entr${guessRows>1?'ies were':'y was'} classified by a low-confidence guess — please make sure each is right.`,`${FY}: ${guessRows} प्रविष्टि(याँ) कम भरोसे के अनुमान से वर्गीकृत हुईं — कृपया हर एक जाँच लें।`);
  if(netSales>0 && cashOpex>0.25*netSales) warn(`${FY}: cash-paid expenses (${money(rup(cashOpex))}) are over 25% of sales — confirm the cash in hand and undeposited-sales figures.`,`${FY}: नकद चुकाए व्यय (${money(rup(cashOpex))}) बिक्री के 25% से अधिक हैं — नकदी व अजमा बिक्री के आंकड़े जाँचें।`);
  if(st.pbt>0 && st.tax>0.4*st.pbt) warn(`${FY}: income tax is ${Math.round(st.tax/st.pbt*100)}% of profit before tax — check the tax entries.`,`${FY}: आयकर कर-पूर्व लाभ का ${Math.round(st.tax/st.pbt*100)}% है — कर प्रविष्टियाँ जाँचें।`);
  if(!info.taxExp && T('P_TAX')>0) warn(`${FY}: income tax paid from the business account (${money(rup(T('P_TAX')))}) is treated as the owner's drawings because a ${info.name.toLowerCase()} is not taxed separately.`,`${FY}: व्यवसाय खाते से चुकाया आयकर (${money(rup(T('P_TAX')))}) स्वामी का आहरण माना गया है क्योंकि ${info.name} पर अलग से कर नहीं लगता।`);
  const negOpex = st.opex.filter(x=>x.v<0); if(negOpex.length) warn(`${FY}: an expense head is negative because declared accruals fell — confirm the opening and closing accrued dues.`,`${FY}: घोषित प्रोद्भवन घटने से एक व्यय शीर्ष ऋणात्मक है — प्रारंभिक व अंतिम प्रोद्भवन जाँचें।`);
  if(bs.od>0) warn(`${FY}: the bank account is overdrawn at year end (${money(rup(bs.od))}); it is shown as working-capital borrowing.`,`${FY}: वर्षांत पर बैंक खाता ओवरड्रॉन है (${money(rup(bs.od))}); इसे कार्यशील पूंजी उधार दर्शाया गया है।`);

  const heads = Object.keys(tot).map(h=>({head:h,total:rup(tot[h]),count:cnt[h]}));
  res.journal=J; res.ledgers=ledgers; res.tb=tb; res.tbDr=rup(tbDr); res.tbCr=rup(tbCr);
  res.stmt={ sales:rup(st.sales), openStock:rup(st.openStock), purchases:rup(st.purchases), closeStock:rup(st.closeStock), cos:rup(st.cos), gp:rup(st.gp),
    otherIncome:rup(st.otherIncome), opex:st.opex.map(x=>({acc:x.acc,v:rup(x.v)})), opexTotal:rup(st.opexTotal), ebitda:rup(st.ebitda), dep:rup(st.dep), int:rup(st.int), pbt:rup(st.pbt), tax:rup(st.tax), np:rup(st.np) };
  res.bsB = Object.fromEntries(Object.entries(bs).map(([k,v])=>[k,rup(v)]));
  res.summary10 = summary10; res.tally=tally; res.tallyOk=tallyOk; res.heads=heads; res.closeSigned=closeSigned;
  res.capital = { open:rup(capOpening), np:rup(st.np), intro:rup(capIntro), draw:rup(drawingsT), close:rup(capClose) };
  res.derived = { grossSales:rup(grossSales), netSales:rup(netSales), gstOut:rup(gstOut), grossPurch:rup(grossPurch), netPurch:rup(netPurch), gstIn:rup(gstIn), cashSales:rup(Sc), cashPurch:rup(CP), cashOpex:rup(cashOpex), cashDraw:rup(CD),
    principal:rup(principal), interestEmi:rup(interestEmi), dep:rup(dep), depAuto:rup(depAuto), depRate:rate, dOCL:rup(dOCL), bankIn:rup(sumCrBank), bankOut:rup(sumDrBank) };
  res.openingAssumed=false; res.ok = res.errors.length===0;
  return res;
}

function bkSay(kind,msg){ bkMsg=msg; bkMsgKind=kind; const el=document.getElementById('bkStatus'); if(el) el.innerHTML = msg ? `<div class="${kind==='bad'?'mismatch-box':'note-box'}">${msg}</div>` : ''; }

/* ----- import ----- */
function bankImportRows(rows, opts){
  const b = getBank(current), ctx = bankIndustryInfo(current);
  opts = opts||{};
  if(rows.length>1 && rows[0].date > rows[rows.length-1].date) rows = rows.slice().reverse();   /* newest-first statements */
  const replaceAll = opts.mode==='replace';
  if(replaceAll){ b.rows=[]; }
  if(opts.replaceSrc){ b.rows = b.rows.filter(r=>r.src!==opts.replaceSrc); }
  let added=0, dup=0;
  const have = new Set(b.rows.filter(r=>r.bal!==null&&r.bal!==undefined).map(r=>[r.date,r.dr,r.cr,r.bal].join('|')));
  const fresh=[];
  rows.forEach(r=>{
    const key=[r.date,r.dr,r.cr,r.bal].join('|');
    if(r.bal!==null && r.bal!==undefined && have.has(key)){ dup++; return; }
    const [head,conf] = autoHead(r, ctx);
    fresh.push({id:b.nextId++, date:r.date, narr:r.narr||'', dr:Math.round((r.dr||0)*100)/100, cr:Math.round((r.cr||0)*100)/100, bal:(r.bal===null||r.bal===undefined)?null:Math.round(r.bal*100)/100, head, conf, manual:false, grp:grpKey(r.narr), src:opts.src||'', flag:r.flag||''});
    added++;
  });
  /* stable merge-sort by date, keeping import order inside a day */
  const merged = b.rows.concat(fresh).map((r,i)=>({r,i})).sort((x,y)=>x.r.date<y.r.date?-1:x.r.date>y.r.date?1:x.i-y.i).map(x=>x.r);
  b.rows = merged; b.reviewed=false;
  if(opts.open!==undefined && opts.open!==null && (b.openBank===null||b.openBank===undefined||b.openBank==='') && !bankOpenAuto(b)) b.openBank = Math.round(opts.open*100)/100;
  const h=getHistory(current); h.enabled=true; h.source='bank';
  quietSave();
  return {added, dup};
}

  const d=rows.map(r=>r.date).sort(); const dr=rows.reduce((s,r)=>s+r.dr,0), cr=rows.reduce((s,r)=>s+r.cr,0);

}

function bkSecDecl(){

  <p class="muted small">${bt('Opening capital is the balancing figure of this position. Opening bank balance is taken from the statement.','प्रारंभिक पूंजी इस स्थिति का शेष आंकड़ा है। प्रारंभिक बैंक शेष स्टेटमेंट से लिया जाता है।')}</p>
  <label class="chk"><input type="checkbox" ${b.decl.openingConfirmed?'checked':''} onchange="bankDeclOpenConfirm(this.checked)"> ${bt('Opening position confirmed','प्रारंभिक स्थिति की पुष्टि')}</label>`;
  fys.forEach((fy,i)=>{ const D=yearDecl(b,fy);
    html+=`<h4>FY ${fyLabel(fy)} — ${bt('as at','दिनांक')} 31-03-${fy}</h4><div class="grid fill-zone">${fld(DECL_CLOSE,D,k=>`bankDeclYear(${fy},'${k}',this.value)`)}${fld(DECL_FLOW,D,k=>`bankDeclYear(${fy},'${k}',this.value)`)}</div>
    <label class="chk"><input type="checkbox" ${D.confirmed?'checked':''} onchange="bankDeclYearConfirm(${fy},this.checked)"> ${bt('Declarations for this year confirmed','इस वर्ष की घोषणाओं की पुष्टि')}</label>`; });

}

/* ---------- extraction of (label, amounts) lines from a grid or PDF/OCR cells ---------- */
function fsCellsToLines(cells){
  /* cells: array of strings left→right. Returns [{label, vals:[...]}] — handles label|cur|prev and side-by-side layouts */
  const out=[]; let cur=null;
  const isText = c => /[A-Za-zऀ-ॿ]{3,}/.test(String(c));
  for(const raw of cells){
    const c = (raw===null||raw===undefined) ? '' : (typeof raw==='number'? raw : String(raw).trim());
    if(c==='') continue;
    const pa = (typeof c==='number') ? {v:c,tag:''} : parseAmt(c);
    if(pa && !(typeof c==='string' && isText(c))){ if(!cur) continue; cur.vals.push(pa.v); }
    else if(typeof c==='string' && isText(c)){ if(cur && !cur.vals.length && cur.label.length<120) cur.label+=' '+c.replace(/\s+/g,' '); else { cur={label:c.replace(/\s+/g,' '),vals:[]}; out.push(cur); } }
  }
  return out.filter(l=>l.vals.length).map(l=>{
    let v=l.vals.slice();
    if(v.length>=3 && Number.isInteger(v[0]) && Math.abs(v[0])<=60 && Math.abs(v[1])>60) v=v.slice(1);       /* note-number column */
    if(v.length===1 && false) v=v;
    return {label:l.label, a:v[0], b:v.length>1?v[1]:null};
  }).filter(l=>!(Number.isInteger(l.a) && l.a>=1990 && l.a<=2100 && /year|march|particulars|^fy|^as at/i.test(l.label)));
}

function fsLinesFromText(lines){
  const out=[];
  lines.forEach(line=>{
    line=String(line).replace(/\s+$/,''); if(!line.trim()) return;
    const parts = line.split(/\t|\s{3,}/).map(x=>x.trim()).filter(Boolean);
    let cells = parts;
    if(parts.length<2){ const m=line.match(/^(.*?[A-Za-zऀ-ॿ][^\d(-]*?)\s+((?:\(?-?[\d,]+(?:\.\d+)?\)?\s*){1,3})$/); if(m){ cells=[m[1].trim()].concat(m[2].trim().split(/\s+/)); } }
    fsCellsToLines(cells).forEach(l=>out.push(l));

  return out;
}

function fsTotals(f,col){

/* A balance sheet that shows only "Total current assets / liabilities": the part that is not stock / debtors / cash etc. is split using

function fsGroupSplit(f){

function fsParseParties(text){
  const out=[]; String(text||'').split(/\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const m=line.match(/^(.*?)[\s,;\t:|-]+\(?(-?[\d,]+(?:\.\d+)?)\)?\s*$/); if(!m) { out.push({name:line,amt:NaN}); return; }

let fsMsg='', fsMsgKind='note', fsTab='file';
function fsSay(kind,msg){ fsMsg=msg; fsMsgKind=kind; const el=document.getElementById('fsStatus'); if(el) el.innerHTML = msg ? `<div class="${kind==='bad'?'mismatch-box':'note-box'}">${msg}</div>` : ''; }
function fsAutoAll(f){ f.lines.forEach(l=>{ if(!l.manual) l.item=fsAutoItem(l.label); }); }
function fsAddLines(lines, replace){
  const f=getFs(current); if(replace){ f.lines=[]; f.nextId=1; }
  lines.forEach(l=>{ f.lines.push({id:f.nextId++, label:String(l.label).slice(0,90), a:l.a, b:(l.b===undefined?null:l.b), item:(l.item||fsAutoItem(l.label)), manual:!!l.item}); });
  f.reviewed=false; const h=getHistory(current); h.enabled=true; h.source='fs'; quietSave();
}
function fsSectionFilter(items,txtOf){
  /* an appraisal report holds the actual year and also projections, assessment and household pages - keep only the "Last Year (Actual)" statements */
  const START=/last\s*year\s*\(actual\)/i, STOP=/projected|working capital assessment|3-year|proposed loan|household|recommend|officer|tandon|turnover method|\byear\s*[23]\b/i;
  if(!items.some(x=>START.test(txtOf(x)))) return items;
  let on=false; return items.filter(x=>{ const t=txtOf(x); if(STOP.test(t)){ on=false; return false; } if(START.test(t)) on=true; return on; });
}
async function fsReadFile(file,setStatus){
  const name=(file.name||'').toLowerCase(); const buf=await file.arrayBuffer(); const u8=new Uint8Array(buf.slice(0,8));
  const isZip=u8[0]===0x50&&u8[1]===0x4B, isOle=u8[0]===0xD0&&u8[1]===0xCF, isPdf=u8[0]===0x25&&u8[1]===0x50;
  const isImg=/\.(png|jpe?g|webp|bmp|tiff?)$/.test(name)||/^image\//.test(file.type);
  if(isPdf||name.endsWith('.pdf')){
    setStatus&&setStatus(bt('Reading PDF…','पीडीएफ पढ़ा जा रहा है…'));
    const doc=await openPdf(buf); const pages=await pdfPageLines(doc); const n=pages.flat().reduce((s,l)=>s+l.items.length,0);
    if(n>=20){ const out=[]; fsSectionFilter(pages.flat(),l=>l.items.map(i=>i.s).join(' ')).forEach(l=>fsCellsToLines(l.items.map(i=>i.s)).forEach(x=>out.push(x))); return {lines:out}; }
    setStatus&&setStatus(bt('Scanned PDF — running OCR (first run downloads the OCR engine)…','स्कैन की हुई पीडीएफ — ओसीआर चल रहा है (पहली बार ओसीआर इंजन डाउनलोड होगा)…'));
    const text=await ocrCanvasesOrImage(await pdfToCanvases(doc),p=>setStatus&&setStatus(bt('OCR… ','ओसीआर… ')+Math.round(p*100)+'%'));
    return {lines:fsLinesFromText(fsSectionFilter(text.split(/\n/),x=>x)), ocr:true};
  }
  if(isImg){ setStatus&&setStatus(bt('Photo — running OCR…','फोटो — ओसीआर चल रहा है…')); const text=await ocrCanvasesOrImage([file],p=>setStatus&&setStatus(bt('OCR… ','ओसीआर… ')+Math.round(p*100)+'%')); return {lines:fsLinesFromText(text.split(/\n/)), ocr:true}; }
  let grid;
  if(isZip){ const gl=await parseXlsx(buf,'list'); for(const g of gl){ const t=fsTemplateParse(g); if(t){ const mp=gl.map(fsMonthsParse).find(Boolean); if(mp) t.meta.months=mp; return {lines:t.lines,meta:t.meta,template:true}; } } grid=[]; gl.forEach(g=>g.forEach(r=>grid.push(r))); } else if(isOle) throw new Error('OLD_XLS');
  else { const text=new TextDecoder('utf-8').decode(buf); if(/^\s*<(!doctype|html|table|\?xml)/i.test(text)||/<table/i.test(text.slice(0,4000))) grid=parseHtmlTable(text); else grid=parseCSV(text); }
  { const t=fsTemplateParse(grid); if(t) return {lines:t.lines,meta:t.meta,template:true}; }
  return {lines:fsLinesFromGrid(fsSectionFilter(grid,r=>r.join(' ')))};
}
function fsErrMsg(e){
  const m=String(e&&e.message||e);
  return m==='OLD_XLS'?bt('This is an old binary .xls file. Save it as .xlsx or .csv and upload again.','यह पुरानी .xls फ़ाइल है। इसे .xlsx या .csv में सहेजकर फिर अपलोड करें।')
   :m==='NO_DECOMPRESS'?bt('This browser cannot open .xlsx directly. Save as .csv and upload that.','यह ब्राउज़र .xlsx सीधे नहीं खोल सकता। .csv में सहेजकर अपलोड करें।')
   :m==='LOAD_FAIL'?bt('PDF / photo reading needs internet the first time. You are offline — upload CSV/Excel, paste or type instead.','पीडीएफ / फोटो पढ़ने के लिए पहली बार इंटरनेट चाहिए। आप ऑफ़लाइन हैं — CSV/Excel अपलोड करें, पेस्ट करें या टाइप करें।')
   :m==='PDF_CANCELLED'?bt('PDF password not entered.','पीडीएफ पासवर्ड नहीं दिया गया।'):m==='PDF_PASSWORD'?bt('Wrong PDF password.','पीडीएफ पासवर्ड गलत है।')
   :bt('Could not read this file: ','यह फ़ाइल पढ़ी नहीं जा सकी: ')+escapeHtml(m);
}

  ${row(bt('Paid to creditors (opening + credit purchases − closing)','लेनदारों को भुगतान (प्रारंभिक + उधार क्रय − अंतिम)'),r.derived.payments)}${row(bt('Fixed assets added (negative = disposed)','स्थिर संपत्ति जोड़ी (ऋणात्मक = निपटान)'),r.derived.addFA)}
  ${row(bt('Term loan: net disbursed / (repaid)','मीयादी ऋण: शुद्ध वितरण / (चुकौती)'),r.derived.dTL)}${row(bt('Cash credit / OD: net drawn / (repaid)','नकद ऋण / ओडी: शुद्ध आहरण / (चुकौती)'),r.derived.dWC)}${row(bt('Drawings','आहरण'),r.derived.drawings)}${row(bt('Capital introduced','पूंजी निवेश'),r.derived.intro)}</table>
  ${r.warns.map(w=>`<div class="note-box">⚠ ${bt(w.en,w.hi)}</div>`).join('')}`;

function rHistFsFs(B){
  let html=`<h3>${bt('Past Financial Statements (from borrower’s statements)','पिछले वर्ष के वित्तीय विवरण (उधारकर्ता के विवरणों से)')}</h3>${fsBanner(B.years[0])}`;
  B.years.forEach(r=>{ html+=fsStmtHtml(r); });
  return html;
}
function fsJournalHtml(r){
  let rows='';
  r.journal.forEach(j=>{
    const dt=j.date?fmtD(j.date):(j.when==='open'?r.year.start:(j.when==='close'?r.year.end:bt('During year','वर्ष में'))); let first=true;
    j.lines.filter(l=>l[1]).forEach(l=>{ rows+=`<tr><td>${first?j.no:''}</td><td style="white-space:nowrap;">${first?dt:''}</td><td>${an(l[0])} A/c ... Dr</td><td>${money(l[1])}</td><td></td></tr>`; first=false; });
    j.lines.filter(l=>l[2]).forEach(l=>{ rows+=`<tr><td></td><td></td><td style="padding-left:28px;">${bt('To','को')} ${an(l[0])} A/c</td><td></td><td>${money(l[2])}</td></tr>`; });
    rows+=`<tr><td></td><td></td><td colspan="3" class="muted small" style="text-align:left;"><i>(${bt('Being','अर्थात्')} ${bt(j.narr[0],j.narr[1])})</i></td></tr>`;
  });
  const td=r.journal.reduce((s,j)=>s+j.lines.reduce((a,l)=>a+l[1],0),0);
  return `<details><summary><b>${bt('Journal','जर्नल')}</b> (${r.journal.length} ${bt('entries — expand to view / print','प्रविष्टियाँ — देखने / प्रिंट हेतु खोलें')})</summary><table class="tbook"><tr><th>JV</th><th>${bt('Date','दिनांक')}</th><th>${bt('Particulars','विवरण')}</th><th>${bt('Dr ₹','नामे ₹')}</th><th>${bt('Cr ₹','जमा ₹')}</th></tr>${rows}<tr class="total"><td></td><td></td><td>${bt('Total','योग')}</td><td>${money(td)}</td><td>${money(td)}</td></tr></table></details>`;
}

function fsMonthlyHtml(r){
  if(!r.monthly) return '';
  const T=(k)=>r.monthly.reduce((a,m)=>a+m[k],0);
  const sch=(k,title)=>r.schedules&&r.schedules[k]?`<h4>${title}</h4><table class="tbook"><tr><th>${bt('Party','पार्टी')}</th><th>${bt('Balance at year end ₹','वर्षांत शेष ₹')}</th></tr>${r.schedules[k].map(x=>`<tr><td style="text-align:left;">${escapeHtml(x.name)}</td><td>${money(x.amt)}</td></tr>`).join('')}<tr class="total"><td>${bt('Total — agrees with ledger balance','योग — खाताबही शेष से मेल')}</td><td>${money(r.schedules[k].reduce((a,x)=>a+x.amt,0))}</td></tr></table>`:'';
  return `<details open><summary><b>${bt('Month-wise register — sales, purchases, collections, payments, expenses (allocated)','माहवार रजिस्टर — बिक्री, क्रय, वसूली, भुगतान, व्यय (आवंटित)')}</b></summary>
  <p class="muted small">${bt('Annual statement figures apportioned by month (see the note under the statements). Each line feeds the ledgers and the trial balance below.','वार्षिक विवरण के आंकड़े माह अनुसार आवंटित (विवरण के नीचे टिप्पणी देखें)। हर पंक्ति नीचे की खाताबही व तलपट में जाती है।')}</p>
  <div style="overflow-x:auto;"><table class="tbook"><tr><th>${bt('Month','माह')}</th><th>${bt('Sales','बिक्री')}</th><th>${bt('Purchases','क्रय')}</th><th>${bt('Collected from debtors','देनदारों से वसूली')}</th><th>${bt('Paid to creditors','लेनदारों को भुगतान')}</th><th>${bt('Expenses & interest','व्यय व ब्याज')}</th></tr>
  ${r.monthly.map(m=>`<tr><td style="text-align:left;">${m.lab}</td><td>${money(m.sales)}</td><td>${money(m.purchases)}</td><td>${money(m.collections)}</td><td>${money(m.payments)}</td><td>${money(m.expenses)}</td></tr>`).join('')}
  <tr class="total"><td>${bt('Total','योग')}</td><td>${money(T('sales'))}</td><td>${money(T('purchases'))}</td><td>${money(T('collections'))}</td><td>${money(T('payments'))}</td><td>${money(T('expenses'))}</td></tr></table></div></details>${sch('debtors',bt('Schedule of Sundry Debtors (party-wise, as given by the borrower)','विविध देनदारों की अनुसूची (पार्टी-वार, उधारकर्ता द्वारा दी गई)'))}${sch('creditors',bt('Schedule of Sundry Creditors (party-wise, as given by the borrower)','विविध लेनदारों की अनुसूची (पार्टी-वार, उधारकर्ता द्वारा दी गई)'))}`;
}
function fsLedgersHtml(r){
  const P=r.partyAcc||{debtors:[],creditors:[]}, ids=r.accOrder.filter(a=>a!=='CASH'&&r.ledgers[a].used);
  const grp=a=>(P.debtors.includes(a)||a==='DR')?'d':(P.creditors.includes(a)||a==='CR')?'c':/^SL\d/.test(a)?'s':/^PU\d/.test(a)?'p':/^XL\d/.test(a)?'x':/^ST\d/.test(a)?'k':['TRD','PL'].includes(a)?'t':['INC','DEP','INT','TAX'].includes(a)?'e':'b';
  const G=[['d',bt('Debtors — party accounts (one account if no party list was given)','देनदार — पार्टी खाते (सूची न देने पर एक खाता)')],['c',bt('Creditors — party accounts (one account if no party list was given)','लेनदार — पार्टी खाते (सूची न देने पर एक खाता)')],['s',bt('Sales accounts (by product / service group)','बिक्री खाते (उत्पाद / सेवा समूह अनुसार)')],['p',bt('Purchase accounts (by group)','क्रय खाते (समूह अनुसार)')],['k',bt('Stock accounts (opening and closing)','स्टॉक खाते (प्रारंभिक व अंतिम)')],['x',bt('Expense accounts — one for every expense line of the statements','व्यय खाते — विवरण की हर व्यय पंक्ति का अलग खाता')],['e',bt('Other income, depreciation, interest, tax','अन्य आय, मूल्यह्रास, ब्याज, कर')],['b',bt('Capital, loans, fixed assets and other balance-sheet accounts','पूंजी, ऋण, स्थिर संपत्ति व अन्य तुलन-पत्र खाते')],['t',bt('Trading and Profit & Loss accounts','व्यापार व लाभ-हानि खाते')]];
  return `<h4>${bt('Ledger Accounts','खाताबही')} — ${ids.length+1} ${bt('accounts (Cash & Bank Book above)','खाते (रोकड़ व बैंक बही ऊपर)')}</h4>`+
    G.map(([k,title])=>{ const l=ids.filter(a=>grp(a)===k); if(!l.length) return ''; return `<details><summary><b>${title}</b> — ${l.length} ${bt('ledgers','खाते')}</summary>${l.map(a=>ledgerHtml(a,r)).join('')}</details>`; }).join('');
}
function rBooksFs(B){
  let html=`<h3>${bt('Books of Accounts (from borrower’s statements)','बहीखाते (उधारकर्ता के विवरणों से)')}</h3>${fsBanner(B.years[0])}
  <div class="btnrow no-print" style="margin-top:0;"><button class="btn gold" onclick="window.print()">${bt('Print Books of Accounts','बहीखाते प्रिंट करें')}</button></div>`;
  B.years.forEach(r=>{
    html+=`<div class="section-anchor">${fyHead(r)}
    <details open><summary><b>${bt('Cash & Bank Book','रोकड़ व बैंक बही')}</b></summary>${ledgerHtml('CASH',r,bt('Cash & Bank Book','रोकड़ व बैंक बही'))}</details>
    ${fsMonthlyHtml(r)}
    ${fsJournalHtml(r)}
    ${fsLedgersHtml(r)}
    ${tbHtml(r)}</div>`;
  });
  return html;
}

function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function downloadFsTemplate(){
  const bin=atob(FS_TEMPLATE_B64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  downloadBlob(new Blob([u8],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'MSME_Financial_Statements_Template.xlsx');
}
function fsTemplateParse(grid){

    else if(/^financial year ending/i.test(lab)){ const y=parseInt(String(r[1]).replace(/\D/g,'').slice(-4)); if(y>=1990&&y<=2100) meta.fy=y; }
    if(code && FS_ITEM[code] && code!=='IGNORE'){
      const a=pa(r[1]), b=pa(r[2]);
      if((a!==null&&a!==0)||(b!==null&&b!==0)) lines.push({label:lab, a:(a===null?0:a), b:b, item:code});
    }
  });
  return {lines, meta};
}
function fsMonthsParse(grid){
  let marker=false; grid.forEach(r=>r.forEach(c=>{ if(typeof c==='string' && c.indexOf('MSME-BOOKS-MONTHS')===0) marker=true; })); if(!marker) return null;
  const pa=x=>{ const p=parseAmt(x); return p?p.v:0; }, MON=['apr','may','jun','jul','aug','sep','oct','nov','dec','jan','feb','mar'];
  const S=Array(12).fill(0), P=Array(12).fill(0); let any=false; const deb=[], cre=[];
  grid.forEach(r=>{ const k=MON.indexOf(String(r[0]||'').trim().toLowerCase().slice(0,3)); if(k>=0&&String(r[0]).trim().length<=3){ S[k]=pa(r[1]); P[k]=pa(r[2]); if(S[k]||P[k]) any=true; }
    const dn=String(r[4]||'').trim(), da=pa(r[5]); if(dn&&da&&!/^(debtor|total|balance)/i.test(dn)) deb.push(dn+', '+da);
    const cn=String(r[7]||'').trim(), ca=pa(r[8]); if(cn&&ca&&!/^(creditor|total|balance)/i.test(cn)) cre.push(cn+', '+ca); });
  return {monthSales:any&&S.some(x=>x>0)?S:null, monthPurch:any&&P.some(x=>x>0)?P:null, debtors:deb.join('\n'), creditors:cre.join('\n')};
}
function fsMatchActivity(name){
  const n=String(name||'').trim().toLowerCase(); if(!n) return null;
  return ACTIVITIES.find(a=>a[1].toLowerCase()===n) || ACTIVITIES.find(a=>a[1].toLowerCase().includes(n)||n.includes(a[1].toLowerCase())) || null;
}
const CONSTITUTIONS=["Proprietorship","Partnership","SHG/JLG","Private Limited","LLP","Other"];
function fsApplyMeta(meta){
  const notes=[], b=current.borrower, h=getHistory(current), f=getFs(current);
  if(meta.name){ if(!b.business){ b.business=meta.name; b.name=b.name||meta.name; } else if(b.business!==meta.name) notes.push(bt(`The sheet names the unit “${meta.name}”; this project is “${b.business}” (kept).`,`शीट में इकाई का नाम “${meta.name}” है; यह परियोजना “${b.business}” है (वही रखा)।`)); }
  const cm=CONSTITUTIONS.find(c=>c.toLowerCase()===String(meta.constitution||'').toLowerCase()); if(cm) b.constitution=cm;
  if(meta.activity){ const a=fsMatchActivity(meta.activity); if(a){ current.activityCategory=a[0]; current.activityName=a[1]; current.activityModel=a[2]; f.tpl=null; f.mix=null; } else notes.push(bt(`Activity “${meta.activity}” is not in the list — the generic groups are used; pick the nearest activity in Step 2 or choose the groups in section 2.`,`गतिविधि “${meta.activity}” सूची में नहीं है — सामान्य समूह प्रयोग हुए; चरण 2 में निकटतम गतिविधि चुनें या खंड 2 में समूह चुनें।`)); }
  if(meta.fy){ f.fyEnd=meta.fy; h.fyEnd=meta.fy; }
  if(meta.months){ const m=meta.months; if(m.monthSales) f.monthSales=m.monthSales; if(m.monthPurch) f.monthPurch=m.monthPurch; if(m.debtors) f.partyText.debtors=m.debtors; if(m.creditors) f.partyText.creditors=m.creditors; notes.push(bt('Month-wise figures / party lists read from the sheet.','माहवार आंकड़े / पार्टी सूची शीट से पढ़ी गईं।')); }
  return notes;
}

async function booksNewFromFile(fileList){

    const p=createBooksProject(name, meta.constitution||document.getElementById('bn_cons').value, meta.activity||document.getElementById('bn_act').value);
    fsAddLines(r.lines,true); const notes=fsApplyMeta(meta); quietSave();
    fsMsg='✓ '+escapeHtml(file.name)+': '+r.lines.length+' '+bt('lines read','पंक्तियाँ पढ़ी गईं')+(r.template?' ('+bt('Excel template — rows mapped exactly','एक्सेल प्रारूप — पंक्तियाँ सटीक जुड़ीं')+')':'')+'. '+notes.join(' ')+' '+bt('Check the mapping, set the mix and confirm.','मैपिंग जाँचें, मिश्रण भरें व पुष्टि करें।'); fsMsgKind='note';

  finally{ booksNewBusy=false; }

/* ---------------- Share (Web Share API with file/text/download fallback) ---------------- */
async function shareBlob(blob, filename, title, text){
  try{
    const file = new File([blob], filename, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title, text, files:[file]});
      return true;
    }
  }catch(e){ if(e && e.name==='AbortError') return true; }
  try{
    if(navigator.share){ await navigator.share({title, text}); return true; }
  }catch(e){ if(e && e.name==='AbortError') return true; }
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  return false;
}

  const styleEl = document.querySelector('style');

}

function benchmarkAnalysis(c){
  const hi = LANG==='hi';
  const rows = []; const flags = [];
  Object.keys(RATIO_NORMS).forEach(key=>{
    const norm = RATIO_NORMS[key];
    const series = [0,1,2].map(i=>c.ratios[i][key]);
    const valid = series.filter(v=>v!==null);
    if(!valid.length) return;
    const latest = valid[valid.length-1];
    const breach = norm.dir==='higher' ? latest < norm.threshold : latest > norm.threshold;
    const first = series[0], last = series[2];
    const deteriorating = (!breach && first!==null && last!==null) ? (norm.dir==='higher' ? last < first : last > first) : false;
    const status = breach ? 'bad' : (deteriorating ? 'warn' : 'good');
    if(status!=='good') flags.push(key);
    rows.push({ key, label:norm.label[hi?1:0], latest, dir:norm.dir, threshold:norm.threshold, status });
  });
  let dscrStatus = null;
  if(c.avgDscr!==null){
    const breach = c.avgDscr<1.5 || (c.minDscr!==null && c.minDscr<1.2);
    const withVal = c.dscrYearly.filter(d=>d.dscr!==null);
    const deteriorating = !breach && withVal.length>1 && withVal[withVal.length-1].dscr < withVal[0].dscr;
    dscrStatus = breach ? 'bad' : (deteriorating ? 'warn' : 'good');
    if(dscrStatus!=='good') flags.push('dscr');
  }
  ['gpMargin','ebitdaMargin','npMargin'].forEach(key=>{
    const first=c.ratios[0][key], last=c.ratios[2][key];
    if(first!==null && last!==null && last < first-0.5 && !flags.includes('margin')) flags.push('margin');
  });
  return { rows, dscrStatus, flags };
}

  { kw:["month wise","monthly","party wise","party-wise","debtors list","creditors list","individual sales","individual purchase","trial balance from","माहवार","पार्टी"],
    en:"A financial statement has only annual totals, so the app cannot know individual invoices. Instead the books post sales (by group), purchases, collections, payments and every expense month by month, so each ledger and the trial balance can be traced to monthly postings. Enter actual monthly sales / purchases (GST returns, sales register) in section 4b or the 'Monthly & Parties' sheet of the Excel format and the annual figure is split in that proportion; if empty, equal months are used. A party-wise debtors / creditors list (name, amount) must agree with the balance sheet and then gives every party its own ledger account; each expense line of the statements also has its own ledger. Party opening balances are not in the statements, so they are taken in proportion to year-end balances, and credit sales / purchases are shared in the same proportion — an allocation, stated in the books. Month-wise postings are an allocation, not actual dated invoices — the books say so. Only the bank-statement route uses real dated entries.",
    hi:"वित्तीय विवरण में केवल वार्षिक योग होते हैं, इसलिए ऐप अलग-अलग बिल नहीं जान सकता। इसके बजाय बहीखाते बिक्री (समूह-वार), क्रय, वसूली, भुगतान व हर व्यय माह-दर-माह दर्शाते हैं, ताकि हर खाताबही व तलपट माहवार प्रविष्टियों तक खोजा जा सके। वास्तविक माहवार बिक्री / क्रय (जीएसटी रिटर्न, बिक्री रजिस्टर) खंड 4b या एक्सेल प्रारूप की 'Monthly & Parties' शीट में भरें तो वार्षिक आंकड़ा उसी अनुपात में बँटता है; खाली हो तो समान माह। पार्टी-वार देनदार / लेनदार सूची (नाम, राशि) अनुसूची बनती है जो तुलन पत्र से मिलनी चाहिए। माहवार प्रविष्टियाँ आवंटन हैं, वास्तविक दिनांकित बिल नहीं — बहीखाते यह लिखते हैं। केवल बैंक स्टेटमेंट मार्ग में असली दिनांकित प्रविष्टियाँ होती हैं।" },
  { kw:["demo books","demo data","sample books","restore demo","remove demo","डेमो बहीखाते","डेमो डेटा"],
    en:"Books menu → 'Demo data' has four ready-made sets (grocery shop, beauty parlour, engineering works with tax, engineering works from a bank statement) to cross-check the app. Use 'Load demo books' to add them, 'Remove demo books' to delete them, and 'Restore demo books' to bring back the original data even if you edited them. 'Download filled sample Excel' gives a filled sheet to test the upload. Demo books are labelled DEMO DATA.",
    hi:"बहीखाते मेनू → 'डेमो डेटा' में ऐप जाँचने हेतु चार तैयार सेट हैं (किराना दुकान, ब्यूटी पार्लर, कर सहित इंजीनियरिंग वर्क्स, बैंक स्टेटमेंट से इंजीनियरिंग वर्क्स)। जोड़ने हेतु 'डेमो बहीखाते लोड करें', हटाने हेतु 'डेमो बहीखाते हटाएँ', और संपादित होने पर भी मूल डेटा लौटाने हेतु 'पुनः स्थापित करें' दबाएँ। 'भरा नमूना एक्सेल डाउनलोड करें' अपलोड जाँचने हेतु भरी शीट देता है। डेमो बहीखाते DEMO DATA अंकित हैं।" },
  { kw:["books of accounts","books menu","बहीखाता","बहीखाते","ledger","journal","trial balance","cash book"],
    en:"The Books button (top bar) prepares books of accounts — Journal, Cash & Bank Book, Ledgers, Trial Balance, Trading & P&L and Balance Sheet — for an EXISTING unit, from (1) actual financial statements, (2) bank-statement entries or (3) declared annual figures. Each saved set can be viewed, printed, shared or edited. Everything is labelled reconstructed / unaudited.",
    hi:"ऊपर का बहीखाते बटन किसी चालू इकाई के बहीखाते — जर्नल, रोकड़ व बैंक बही, खाताबही, तलपट, व्यापार व लाभ-हानि खाता और तुलन पत्र — (1) वास्तविक वित्तीय विवरण, (2) बैंक स्टेटमेंट प्रविष्टियों या (3) घोषित वार्षिक आंकड़ों से बनाता है। हर सेट देख, प्रिंट, साझा या संपादित कर सकते हैं। सब पर पुनर्निर्मित / अलेखापरीक्षित अंकित रहता है।" },
  { kw:["excel format","excel template","blank excel","blank format","template","एक्सेल प्रारूप","खाली एक्सेल"],
    en:"Tap 'Download blank Excel format' (Books menu, Dashboard, Step 1 or the Financial-Statements workspace). Fill the yellow cells: unit name, constitution, nature of business, year, then P&L and Balance Sheet figures (previous-year balance sheet gives the opening position). Check that 'Difference' is 0. Upload it in Books → Prepare new books; unit details are read from the sheet. Don't add, delete or rename rows. The 'Example (grocery)' sheet is not read.",
    hi:"'खाली एक्सेल प्रारूप डाउनलोड करें' दबाएँ (बहीखाते मेनू, डैशबोर्ड, चरण 1 या वित्तीय-विवरण कार्यक्षेत्र)। पीले खाने भरें: इकाई का नाम, गठन, व्यवसाय की प्रकृति, वर्ष, फिर लाभ-हानि व तुलन पत्र (पिछले वर्ष का तुलन पत्र प्रारंभिक स्थिति देता है)। देखें कि 'अंतर' 0 है। बहीखाते → नए बहीखाते तैयार करें में अपलोड करें; इकाई का विवरण शीट से पढ़ा जाता है। पंक्तियाँ जोड़ें/हटाएँ/नाम न बदलें। 'Example (grocery)' शीट पढ़ी नहीं जाती।" },
  { kw:["financial statement","actual statement","upload statement","p&l and balance sheet","balance sheet upload","वित्तीय विवरण अपलोड"],
    en:"Upload the borrower's actual P&L and Balance Sheet as the Excel format, CSV, Excel, PDF (password-protected too), photo/scan, or paste/type the lines. Each line is matched to an account head by its wording — review it, set the estimated item/service mix, confirm the opening position if no previous-year column exists, and tick the review box. The books are written to match the statements to the paisa.",
    hi:"उधारकर्ता का वास्तविक लाभ-हानि व तुलन पत्र एक्सेल प्रारूप, CSV, एक्सेल, पीडीएफ (पासवर्ड वाली भी), फोटो/स्कैन के रूप में अपलोड करें, या पंक्तियाँ पेस्ट/टाइप करें। हर पंक्ति शब्दों से खाता शीर्ष से जुड़ती है — जाँचें, अनुमानित मद/सेवा मिश्रण भरें, पिछले वर्ष का स्तंभ न हो तो प्रारंभिक स्थिति की पुष्टि करें और समीक्षा बॉक्स चुनें। बहीखाते विवरण से पाई-पाई मिलते हैं।" },
  { kw:["nature of business","grocery","as per business","item wise","item-wise","mix","estimated mix","est.","मिश्रण","मदवार"],
    en:"The books use groups typical of the business: a grocery/kirana shop gets staples, pulses & spices, edible oil & dairy, packaged food, beverages, personal & home care and others; a service unit gets its own service-income heads (e.g. main service charges, other services, product sales) and consumables. A statement has only totals, so the split uses YOUR estimated mix % (editable, must total 100%). It adds up exactly to the statement but is marked 'est.' — it is not an item-wise record.",
    hi:"बहीखाते व्यवसाय के अनुरूप समूह प्रयोग करते हैं: किराना दुकान को अनाज, दालें व मसाले, खाद्य तेल व डेयरी, पैकेज्ड खाद्य, पेय, व्यक्तिगत व गृह देखभाल व अन्य; सेवा इकाई को अपने सेवा-आय शीर्ष (मुख्य सेवा शुल्क, अन्य सेवाएँ, उत्पाद बिक्री) व उपभोग्य। विवरण में केवल योग होते हैं, इसलिए विभाजन आपके अनुमानित मिश्रण % (संपादन योग्य, योग 100%) से होता है। यह विवरण से ठीक मिलता है पर 'अनु.' अंकित है — मदवार रिकॉर्ड नहीं।" },
  { kw:["bank statement","bank entries","passbook","पासबुक","बैंक स्टेटमेंट"],
    en:"Books can also be written from real dated bank entries: upload the bank statement (CSV, Excel, PDF, photo), paste or type entries. Entries are grouped by counterparty and classified into heads by the nature of the activity and constitution — you review them. Things a bank cannot show (stock, debtors, creditors, cash in hand, closing term loan) are declared by you and marked †.",
    hi:"बहीखाते असली दिनांकित बैंक प्रविष्टियों से भी बन सकते हैं: बैंक स्टेटमेंट (CSV, Excel, पीडीएफ, फोटो) अपलोड करें, या प्रविष्टियाँ पेस्ट/टाइप करें। प्रविष्टियाँ प्रतिपक्ष से समूहित होकर गतिविधि व संविधान के अनुसार शीर्षों में वर्गीकृत होती हैं — आप जाँचते हैं। जो बैंक नहीं दिखा सकता (स्टॉक, देनदार, लेनदार, हाथ में नकद, अंतिम मीयादी ऋण) उसे आप घोषित करते हैं व † अंकित रहता है।" },
  { kw:["print books","share books","view books","pdf of books","whatsapp","save as pdf","बहीखाते प्रिंट","साझा"],
    en:"In the Books menu, each saved set has View, Print, Share and Edit data. View has three tabs: Financial statements, Books of accounts and Full set. Print opens every section and prints the full set — choose 'Save as PDF' to get a PDF. Share sends one self-contained web page: on a phone it opens the share sheet (WhatsApp, email); otherwise it downloads the file to attach. Download file always saves it.",
    hi:"बहीखाते मेनू में हर सहेजे सेट के लिए देखें, प्रिंट, साझा करें व डेटा संपादित करें बटन हैं। देखें में तीन टैब हैं: वित्तीय विवरण, बहीखाते व पूरा सेट। प्रिंट हर खंड खोलकर पूरा सेट छापता है — पीडीएफ हेतु 'Save as PDF' चुनें। साझा करने पर एक स्वतंत्र वेब पेज जाता है: फ़ोन पर शेयर शीट (व्हाट्सऐप, ईमेल) खुलती है, अन्यथा फ़ाइल डाउनलोड होती है। 'फ़ाइल डाउनलोड' सदैव सहेजता है।" },
  { kw:["does not balance","not balance","books cannot be prepared","tally","mismatch","net profit differs","मेल नहीं","संतुलित"],
    en:"Books are generated only when they tally with your statements. Common fixes: (1) 'balance sheet does not balance' — a line is missing or mapped to the wrong head (e.g. a total line not set to 'ignore'); (2) 'net profit differs' — a P&L line is missing or mapped wrongly, or (for proprietorships) a tax line should be mapped; (3) 'collections/payments negative' — raise the cash-sales / cash-purchase share or check debtors/creditors; (4) opening position missing — fill the previous-year column or use 'Assume opening = closing'.",
    hi:"बहीखाते तभी बनते हैं जब वे आपके विवरण से मिलें। सामान्य सुधार: (1) 'तुलन पत्र संतुलित नहीं' — कोई पंक्ति छूटी या गलत शीर्ष से जुड़ी है (जैसे योग पंक्ति 'छोड़ें' पर न हो); (2) 'शुद्ध लाभ भिन्न' — लाभ-हानि की कोई पंक्ति छूटी/गलत जुड़ी है, या (एकल स्वामित्व में) कर की पंक्ति जोड़ें; (3) 'वसूली/भुगतान ऋणात्मक' — नकद बिक्री/क्रय का हिस्सा बढ़ाएँ या देनदार/लेनदार जाँचें; (4) प्रारंभिक स्थिति नहीं — पिछले वर्ष का स्तंभ भरें या 'प्रारंभिक = अंतिम मानें' दबाएँ।" },
  { kw:["unaudited","reconstructed","not real books","are these actual books","अलेखापरीक्षित","पुनर्निर्मित"],
    en:"These books are RECONSTRUCTED from the borrower's financial statements, bank entries or declared figures — they are not the borrower's contemporaneous day-to-day books and not audited accounts. Figures flagged † are declared by the borrower; group splits flagged 'est.' are estimates; derived flows (collections, payments, loan movements) are arithmetic. Always say so when presenting them to a bank.",
    hi:"ये बहीखाते उधारकर्ता के वित्तीय विवरण, बैंक प्रविष्टियों या घोषित आंकड़ों से पुनर्निर्मित हैं — उधारकर्ता के दैनिक वास्तविक बहीखाते या लेखापरीक्षित लेखे नहीं। † वाले आंकड़े उधारकर्ता द्वारा घोषित हैं; 'अनु.' वाले समूह-विभाजन अनुमान हैं; निकाले गए प्रवाह (वसूली, भुगतान, ऋण परिवर्तन) गणितीय हैं। बैंक को देते समय यह अवश्य बताएँ।" },
  { kw:["dscr","debt service coverage"],
    en:"DSCR (Debt Service Coverage Ratio) = (Profit After Tax + Depreciation + Interest on Term Loan) ÷ (Term Loan Interest + Principal Repayment) for that year. It shows how comfortably projected cash accrual covers the annual loan instalment. A commonly used indicative norm is Average DSCR ≥ 1.5 and no single year below 1.2. See the Financial Ratios tab for your project's actual DSCR, year by year, and for suggestions if it's flagged.",
    hi:"डीएससीआर (ऋण चुकौती क्षमता अनुपात) = (कर पश्चात लाभ + मूल्यह्रास + मीयादी ऋण ब्याज) ÷ (उस वर्ष का ब्याज + मूलधन चुकौती)। यह दर्शाता है कि अनुमानित नकदी संचयन वार्षिक किस्त को कितनी सहजता से पूरा करता है। सामान्यतः प्रयुक्त संकेतक: औसत डीएससीआर ≥ 1.5 तथा कोई भी वर्ष 1.2 से कम न हो। अपनी परियोजना का वास्तविक डीएससीआर व सुझाव हेतु 'वित्तीय अनुपात' खंड देखें।" },
  { kw:["current ratio"],
    en:"Current Ratio = Current Assets ÷ Current Liabilities. It shows short-term solvency. A commonly used indicative norm is ≥ 1.33. If yours is flagged low, the Financial Ratios tab suggests increasing the promoter's margin money in working capital or tightening stock/receivable days.",
    hi:"धारा अनुपात = चालू संपत्ति ÷ चालू देनदारियाँ। यह अल्पकालिक शोधन क्षमता दर्शाता है। सामान्य संकेतक: ≥ 1.33। यदि कम है, तो 'वित्तीय अनुपात' खंड कार्यशील पूंजी में प्रवर्तक मार्जिन बढ़ाने अथवा स्टॉक/प्राप्य अवधि घटाने का सुझाव देता है।" },
  { kw:["debt equity","debt-equity","d/e ratio"],
    en:"Debt-Equity Ratio = Total Debt ÷ Net Worth (Tangible Net Worth). It shows how leveraged the business is relative to the promoter's own stake. A commonly used indicative norm is ≤ 3:1. Increasing the promoter's own contribution, or reducing the Term Loan requested, directly improves it.",
    hi:"ऋण इक्विटी अनुपात = कुल ऋण ÷ निवल मूल्य (टीएनडब्ल्यू)। यह दर्शाता है कि प्रवर्तक के स्वयं के हिस्से की तुलना में व्यवसाय कितना उधार-आधारित है। सामान्य संकेतक: ≤ 3:1। प्रवर्तक का स्वयं का अंशदान बढ़ाना, अथवा मीयादी ऋण घटाना, इसे सीधे बेहतर करता है।" },
  { kw:["tol/tnw","tol tnw","total outside liabilities"],
    en:"TOL/TNW = Total Outside Liabilities ÷ Tangible Net Worth. It's a broader leverage check than Debt-Equity, including trade creditors and other current liabilities. A commonly used indicative norm is ≤ 4:1. Raising net worth or trimming total borrowings/creditor dependence improves it.",
    hi:"टीओएल/टीएनडब्ल्यू = कुल बाह्य देनदारियाँ ÷ मूर्त निवल मूल्य। यह ऋण-इक्विटी से व्यापक उत्तोलन जाँच है, जिसमें व्यापारिक लेनदार व अन्य चालू देनदारियाँ भी शामिल हैं। सामान्य संकेतक: ≤ 4:1। निवल मूल्य बढ़ाना अथवा कुल उधार/लेनदार निर्भरता घटाना इसे बेहतर करता है।" },
  { kw:["interest coverage","icr"],
    en:"Interest Coverage Ratio = EBITDA ÷ Interest. It shows how many times over the business's operating profit covers its interest bill. A commonly used indicative norm is ≥ 1.5. A lower loan quantum, longer tenure/moratorium, or more realistic (higher) EBITDA assumptions all improve it.",
    hi:"ब्याज कवरेज अनुपात = ईबीआईटीडीए ÷ ब्याज। यह दर्शाता है कि परिचालन लाभ ब्याज भार को कितने गुना कवर करता है। सामान्य संकेतक: ≥ 1.5। कम ऋण राशि, लंबी अवधि/स्थगन, अथवा अधिक यथार्थवादी (उच्च) ईबीआईटीडीए मान्यताएँ — सभी इसे बेहतर करती हैं।" },
  { kw:["mpbf","turnover method","nayak"],
    en:"The Turnover Method (Nayak Committee, used for MSME working capital up to the RBI-specified limit) sets indicative Working Capital Requirement as a % of projected annual turnover, split between the borrower's own margin and bank finance. See 'Working Capital – Turnover Method' in the report; the % figures are editable in Settings.",
    hi:"टर्नओवर पद्धति (नायक समिति, आरबीआई-निर्धारित सीमा तक एमएसएमई कार्यशील पूंजी हेतु प्रयुक्त) अनुमानित वार्षिक टर्नओवर के % के रूप में सांकेतिक कार्यशील पूंजी आवश्यकता निर्धारित करती है, जो उधारकर्ता के स्वयं के मार्जिन व बैंक वित्त में विभाजित होती है। रिपोर्ट में 'कार्यशील पूंजी – टर्नओवर पद्धति' देखें; % आंकड़े सेटिंग्स में बदले जा सकते हैं।" },
  { kw:["operating cycle"],

function aiMatchOffline(query){
  const q = (query||'').toLowerCase();
  let best=null, bestScore=0;
  AI_KB.forEach(entry=>{
    let score=0;
    entry.kw.forEach(k=>{ if(q.includes(k)) score += k.length; });
    if(score>bestScore){ bestScore=score; best=entry; }
  });
  if(!best) return null;
  return LANG==='hi' ? best.hi : best.en;
}
