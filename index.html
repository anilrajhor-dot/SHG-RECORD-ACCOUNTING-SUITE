<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSME Project Report Generator</title>
<style>
:root{
  --navy:#173a5e;
  --navy-dark:#0f2740;
  --gold:#c9922e;
  --gold-dark:#a5751d;
  --cream:#f6f4ef;
  --paper:#ffffff;
  --ink:#1c2530;
  --ink-soft:#5b6572;
  --line:#dcd6c9;
  --green:#2f7a4f;
  --red:#b3402f;
  --amber:#b3841f;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
}
.app{max-width:960px;margin:0 auto;padding:0 0 60px;}
header.topbar{
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);
  color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
header.topbar .brand{display:flex;flex-direction:column;}
header.topbar .brand b{font-size:16px;letter-spacing:.2px;}
header.topbar .brand span{font-size:11px;color:#cfd9e6;}
header.topbar button.nav-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:7px 12px;border-radius:var(--radius);font-size:13px;cursor:pointer;
}
header.topbar button.nav-btn:active{background:rgba(255,255,255,.2);}
header.topbar button.lang-btn{background:var(--gold);border:none;color:#fff;font-weight:700;}
main{padding:16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 4px;font-size:18px;color:var(--navy);}
.card h3{margin:18px 0 8px;font-size:15px;color:var(--navy-dark);border-bottom:1px solid var(--line);padding-bottom:6px;}
.muted{color:var(--ink-soft);font-size:13px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:4px;margin-top:10px;font-weight:600;}
input[type=text],input[type=number],input[type=tel],select,textarea{
  width:100%;padding:9px 10px;border:1px solid #c7c0ac;border-radius:var(--radius);font-size:15px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
button.btn{
  background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius);
  font-size:14.5px;cursor:pointer;font-weight:600;
}
button.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
button.btn.gold{background:var(--gold);color:#fff;}
button.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red);}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
button.btn:active{transform:translateY(1px);}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.pill{padding:7px 13px;border-radius:20px;border:1px solid #c7c0ac;background:#fff;cursor:pointer;font-size:13.5px;}
.pill.active{background:var(--navy);color:#fff;border-color:var(--navy);}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0;}
table th,table td{border:1px solid var(--line);padding:7px 8px;text-align:right;}
table th:first-child,table td:first-child{text-align:left;}
table th{background:#eee8d8;color:var(--navy-dark);font-weight:700;}
table tr.total td{font-weight:700;background:#f3efe2;}
.progressbar{display:flex;gap:4px;margin-bottom:16px;}
.progressbar div{flex:1;height:6px;border-radius:3px;background:#e3dcc9;}
.progressbar div.done{background:var(--gold);}
.progressbar div.current{background:var(--navy);}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.badge.default{background:#e4eee7;color:var(--green);}
.badge.modified{background:#fbe9d8;color:var(--gold-dark);}
.badge.bad{background:#fdeceb;color:var(--red);}
.check-list{list-style:none;padding:0;margin:8px 0;}
.check-list li{padding:5px 0;font-size:14px;display:flex;gap:8px;align-items:flex-start;}
.check-list li.pass:before{content:"✓";color:var(--green);font-weight:900;}
.check-list li.fail:before{content:"✗";color:var(--red);font-weight:900;}
.check-list li.warn:before{content:"!";color:var(--amber);font-weight:900;}
.proj-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;}
.proj-item .meta b{display:block;}
.proj-item .meta span{font-size:12px;color:var(--ink-soft);}
.proj-actions{display:flex;gap:6px;flex-wrap:wrap;}
.proj-actions button{padding:6px 9px;font-size:12px;}
.demo-tag{background:var(--red);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-left:6px;}
.assump-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding:7px 0;font-size:14px;}
.assump-row .val{display:flex;align-items:center;gap:8px;}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.tabs button{white-space:nowrap;padding:8px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;}
.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.report-page{background:#fff;}
.report-cover{text-align:center;padding:50px 10px;border:2px solid var(--navy);border-radius:8px;}
.report-cover h1{color:var(--navy);font-size:22px;margin-bottom:4px;}
.report-cover .sub{color:var(--ink-soft);margin-bottom:30px;}
.footer-byline{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:30px;padding-top:14px;border-top:1px solid var(--line);}
.note-box{background:#fdf6e8;border-left:4px solid var(--gold);padding:10px 12px;font-size:13px;margin:10px 0;border-radius:0 4px 4px 0;}
.warn-box{background:#fdeceb;border-left:4px solid var(--red);padding:10px 12px;font-size:13px;margin:10px 0;border-radius:0 4px 4px 0;}
.emi-box{background:#eef4ee;border-left:4px solid var(--green);padding:10px 12px;font-size:14px;margin:10px 0;border-radius:0 4px 4px 0;font-weight:700;color:var(--navy-dark);}
.mismatch{color:var(--red);font-weight:800;}
tr.mismatch-row td{background:#fdeceb;}
.mismatch-box{background:#fdeceb;border-left:4px solid var(--red);padding:10px 12px;font-size:13px;margin:10px 0;border-radius:0 4px 4px 0;color:#7a2418;}
.dev-credit{background:var(--navy);color:#fff;padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:600;margin-bottom:14px;text-align:center;}
.dev-credit.cover{background:none;color:var(--navy);border:1px solid var(--gold);margin:16px auto 0;max-width:90%;}
.letter-block{border:1px solid var(--line);padding:20px;border-radius:4px;background:#fff;font-size:14.5px;}
.letter-block p{margin:10px 0;}
.section-anchor{scroll-margin-top:70px;}
.hidden{display:none !important;}
.small{font-size:12px;}
.searchbox{position:relative;}
.activity-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius);}
.activity-list .act-item{padding:8px 10px;border-bottom:1px solid #efece0;cursor:pointer;font-size:14px;}
.activity-list .act-item:hover, .activity-list .act-item.sel{background:#f3efe2;}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-top:8px;}
.fill-zone input[type=text],.fill-zone input[type=number],.fill-zone input[type=tel],.fill-zone textarea,.fill-zone select{
  background:#fff8e0;border:1.5px solid var(--gold);
}
.default-zone input[type=text],.default-zone input[type=number],input.default-input{
  background:#eaf2fb;border:1.5px solid #4a7fb5;
}
.color-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-soft);margin:4px 0 14px;padding:8px 10px;background:#faf8f2;border:1px solid var(--line);border-radius:4px;}
.color-legend span{display:flex;align-items:center;gap:6px;}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15);}
.swatch.fill{background:#fff8e0;border-color:var(--gold);}
.swatch.default{background:#eaf2fb;border-color:#4a7fb5;}
.swatch.auto{background:#eef4ee;border-color:var(--green);}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}
.help-toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px;}
.help-toc a{font-size:12px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--navy);text-decoration:none;}
.staff-box{background:#eef4ee;border-left:4px solid var(--green);padding:9px 12px;font-size:13px;margin:8px 0;border-radius:0 4px 4px 0;}
h4{margin:16px 0 6px;font-size:14px;color:var(--navy-dark);}
table.tbook td,table.tbook th{font-size:12px;padding:5px 6px;}
table.tbook td:nth-child(3),table.tbook th:nth-child(3){text-align:left;}
@media print{ table.tbook{page-break-inside:avoid;} }
@media print{
  header.topbar,.no-print{display:none !important;}
  body{background:#fff;font-size:12px;}
  .app{max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;page-break-inside:avoid;}
  .report-page{padding:0;}
  table{font-size:11px;}
}
.ai-fab{position:fixed;bottom:20px;right:20px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:#fff;border:none;
  font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.28);cursor:pointer;z-index:300;line-height:1;}
.ai-fab:active{transform:translateY(1px);}
.ai-panel{position:fixed;bottom:84px;right:16px;left:16px;max-width:380px;margin-left:auto;
  max-height:72vh;background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);z-index:300;display:flex;flex-direction:column;overflow:hidden;}
.ai-panel-header{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);color:#fff;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ai-panel-header b{font-size:14px;}
.ai-panel-header button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:6px;font-size:12px;padding:4px 8px;cursor:pointer;}
.ai-tabs{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
.ai-tabs button{flex:1;background:#f3efe2;border:none;padding:8px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);}
.ai-tabs button.active{background:#fff;color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold);}
.ai-panel-body{padding:10px 12px;overflow-y:auto;flex:1;font-size:13px;}
.ai-quicklist{list-style:none;padding:0;margin:0;}
.ai-quicklist li{padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--navy);}
.ai-quicklist li:hover{background:#f6f4ef;}
.ai-context-tip{background:#eef4ee;border-left:4px solid var(--green);padding:8px 10px;
  font-size:12.5px;border-radius:0 4px 4px 0;margin-bottom:10px;}
.ai-msg{padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.45;white-space:pre-wrap;}
.ai-msg.user{background:#eaf2fb;color:var(--ink);margin-left:20px;}
.ai-msg.bot{background:#f3efe2;color:var(--ink);margin-right:8px;}
.ai-msg.bot .ai-src{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
.ai-ask-row{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-shrink:0;}
.ai-ask-row input{flex:1;padding:8px;border:1px solid #c7c0ac;border-radius:6px;font-size:13px;}
.ai-ask-row button{padding:8px 12px;border-radius:6px;border:none;background:var(--navy);color:#fff;font-size:13px;cursor:pointer;}
@media print{ .ai-fab,.ai-panel{display:none !important;} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <b id="topbarTitle">MSME Project Report Generator</b>
      <span id="topbarSub">Offline • v2.1</span>
    </div>
    <div class="no-print" style="display:flex;gap:8px;">
      <button class="nav-btn lang-btn" id="langBtn" onclick="toggleLang()">हिंदी</button>
      <button class="nav-btn" id="booksBtn" onclick="renderBooksMenu()">Books</button>
      <button class="nav-btn" id="helpBtn" onclick="openHelpScreen()">Help</button>
      <button class="nav-btn" onclick="goDashboard()">Dashboard</button>
      <button class="nav-btn" id="saveTopBtn" onclick="saveCurrentProject()" style="display:none;">Save</button>
    </div>
  </header>
  <main id="mainArea"></main>
</div>

<button id="aiFab" class="ai-fab no-print" onclick="toggleAiPanel()" title="AI Assistant">✦</button>
<div id="aiPanel" class="ai-panel no-print hidden">
  <div class="ai-panel-header"><b id="aiPanelTitle">AI Assistant</b><button onclick="toggleAiPanel()">✕</button></div>
  <div class="ai-tabs">
    <button id="aiTabHelpBtn" onclick="aiSwitchTab('help')">Quick Help</button>
    <button id="aiTabAskBtn" onclick="aiSwitchTab('ask')">Ask</button>
  </div>
  <div id="aiPanelBody" class="ai-panel-body"></div>
  <div id="aiAskRow" class="ai-ask-row hidden">
    <input type="text" id="aiAskInput" placeholder="Type a question…" onkeydown="if(event.key==='Enter')aiAsk();">
    <button onclick="aiAsk()">➤</button>
  </div>
</div>

<script>
/* ============================================================
   MSME OFFLINE PROJECT REPORT GENERATOR
   Developed by Anil Sharma, Former General Manager, Central Bank of India,
   and National Resource Person, NIRD&PR.
   100% offline. No server, login or external API calls.
   ============================================================ */
const APP_VERSION = "2.1";
const STORAGE_KEY = "msme_prg_projects_v1";
const SETTINGS_KEY = "msme_prg_settings_v1";
const AI_SETTINGS_KEY = "msme_prg_ai_settings_v1";
let LANG = 'en';
let currentScreenRenderer = null;
const BYLINE = {
  en:"Developed by Anil Sharma, Former General Manager, Central Bank of India, and National Resource Person, NIRD&PR.",
  hi:"विकासकर्ता: अनिल शर्मा, पूर्व महाप्रबंधक, सेंट्रल बैंक ऑफ इंडिया एवं नेशनल रिसोर्स पर्सन, NIRD&PR."
};
function byline(){ return BYLINE[LANG]; }
function toggleLang(){
  LANG = LANG==='en' ? 'hi' : 'en';
  document.getElementById('langBtn').textContent = LANG==='en' ? 'हिंदी' : 'English';
  document.getElementById('topbarTitle').textContent = tt('appTitle');
  document.getElementById('helpBtn').textContent = tt('helpBtn');
  document.getElementById('booksBtn').textContent = bt('Books','बहीखाते');
  if(currentScreenRenderer) currentScreenRenderer();
  if(typeof aiSwitchTab==='function'){
    const fab = document.getElementById('aiFab');
    if(fab) fab.title = LANG==='hi' ? 'एआई सहायक' : 'AI Assistant';
    const panel = document.getElementById('aiPanel');
    if(panel && !panel.classList.contains('hidden')){
      document.getElementById('aiPanelTitle').textContent = LANG==='hi'?'एआई सहायक':'AI Assistant';
      aiSwitchTab(aiActiveTab);
    }
  }
}
/* ---------------- i18n dictionary: key -> [en, hi] ---------------- */
const I18N = {
  appTitle:["MSME Project Report Generator","एमएसएमई परियोजना रिपोर्ट जनरेटर"],
  newProject:["+ New Project","+ नई परियोजना"],
  loadSamples:["Load Sample Projects","नमूना परियोजनाएँ लोड करें"],
  removeSamples:["Remove Demo Projects","नमूना परियोजनाएँ हटाएँ"],
  importProject:["Import Project","परियोजना आयात करें"],
  settingsBtn:["Settings / Default Assumptions","सेटिंग्स / डिफ़ॉल्ट मान्यताएँ"],
  savedProjects:["Saved Projects","सहेजी गई परियोजनाएँ"],
  noProjects:["No saved projects yet. Start a new project or load sample projects to explore the app.","अभी तक कोई सहेजी गई परियोजना नहीं है। नई परियोजना शुरू करें या नमूना परियोजनाएँ लोड करें।"],
  open:["Open","खोलें"], duplicate:["Duplicate","डुप्लिकेट करें"], exportBtn:["Export","निर्यात करें"], deleteBtn:["Delete","हटाएँ"],
  offlineNote:["100% offline. Data stays only on this device (browser storage).","100% ऑफलाइन। डेटा केवल इसी डिवाइस पर सुरक्षित रहता है।"],
  save:["Save","सहेजें"],
  tagline:["Ask less. Calculate more. Show assumptions. Explain clearly.","कम पूछें। अधिक गणना करें। मान्यताएँ दिखाएँ। स्पष्ट रूप से समझाएँ।"],
  taglineSub:["Enter Borrower Details, Activity, Loan Requirement and Sales Projection — the rest is calculated automatically using transparent, editable assumptions.","उधारकर्ता विवरण, गतिविधि, ऋण आवश्यकता और बिक्री अनुमान दर्ज करें — शेष सभी गणना पारदर्शी, संपादन-योग्य मान्यताओं का उपयोग करके स्वतः हो जाएगी।"],
  stepBorrower:["Borrower Details","उधारकर्ता विवरण"],
  stepActivity:["Business Activity","व्यवसाय गतिविधि"],
  stepLoan:["Loan Requirement","ऋण आवश्यकता"],
  stepSales:["Sales Projection","बिक्री अनुमान"],
  stepLoanTerms:["Loan Terms","ऋण शर्तें"],
  borrowerName:["Borrower Name *","उधारकर्ता का नाम *"],
  businessName:["Business Name *","व्यवसाय का नाम *"],
  constitution:["Constitution","गठन प्रकार"],
  mobile:["Mobile","मोबाइल"],
  address:["Address","पता"],
  businessStatus:["Business Status","व्यवसाय स्थिति"],
  businessExperience:["Business Experience","व्यावसायिक अनुभव"],
  udyam:["Udyam Registration (if available)","उद्यम पंजीकरण (यदि उपलब्ध हो)"],
  gstin:["GSTIN (if applicable)","जीएसटीएन (यदि लागू हो)"],
  bankBranch:["Bank / Branch (if required)","बैंक / शाखा (यदि आवश्यक हो)"],
  next:["Next","आगे"], back:["Back","पीछे"], cancel:["Cancel","रद्द करें"],
  reviewAssumptions:["Review Assumptions","मान्यताएँ देखें"],
  cat_Trading:["Trading","व्यापार"], cat_Manufacturing:["Manufacturing","विनिर्माण"], cat_Services:["Services","सेवाएँ"],
  searchActivity:["Search activity...","गतिविधि खोजें..."],
  notListed:["My activity is not listed — enter manually and pick the nearest financial model","मेरी गतिविधि सूची में नहीं है — मैन्युअल रूप से दर्ज करें और निकटतम वित्तीय मॉडल चुनें"],
  activityNameLabel:["Activity Name","गतिविधि का नाम"],
  nearestModel:["Nearest Financial Model","निकटतम वित्तीय मॉडल"],
  selectedLabel:["Selected:","चयनित:"], none:["None","कोई नहीं"], modelWord:["financial model:","वित्तीय मॉडल:"],
  totalLoanRequired:["Total Loan Required (₹) *","कुल आवश्यक ऋण (₹) *"],
  purposeOfLoan:["Purpose of Loan","ऋण का उद्देश्य"],
  termLoanAmount:["Term Loan Amount (₹, if known)","मीयादी ऋण राशि (₹, यदि ज्ञात हो)"],
  wcAmount:["Working Capital Amount (₹, if known)","कार्यशील पूंजी राशि (₹, यदि ज्ञात हो)"],

/* ---------------- Formatting ---------------- */
function inr(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  n = Math.round(n);
  const neg = n<0; n = Math.abs(n);
  let s = n.toString();
  let last3 = s.substring(s.length-3);
  let other = s.substring(0,s.length-3);
  if(other!=='') last3 = ','+last3;
  let formatted = other.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + last3;
  return (neg?'-':'') + '₹' + formatted;
}
function pct(n,dp){ if(n===null||n===undefined||isNaN(n)) return "—"; return (Math.round(n*Math.pow(10,dp||1))/Math.pow(10,dp||1))+"%"; }
function num(n){ return (n===null||n===undefined||isNaN(n))?0:n; }

/* ============================================================
   CALCULATION ENGINE
   ============================================================ */
function getAssumptions(p){
  const base = MODELS[p.activityModel] || MODELS.fastMovingRetail;
  const a = Object.assign({}, base);
  if(p.assumptions){ Object.assign(a, p.assumptions); }
  return a;
}
function isModified(p, key){
  const base = MODELS[p.activityModel] || MODELS.fastMovingRetail;
  if(!p.assumptions || p.assumptions[key]===undefined) return false;
  return Number(p.assumptions[key]) !== Number(base[key]);
}
function getSalesSeries(p){
  if(p.sales.mode==='growth'){
    /* Year 1 = Current Sales exactly, as entered — growth is applied only from Year 2 onward. */
    const y1 = num(p.sales.currentSales), g = num(p.sales.growthPct)/100;
    const y2 = y1*(1+g), y3 = y2*(1+g);
    return [y1,y2,y3];
  }
  return [num(p.sales.y1), num(p.sales.y2), num(p.sales.y3)];
}
function computeEMI(principal, annualRatePct, months){
  if(principal<=0 || months<=0) return 0;
  const r = annualRatePct/100/12;
  if(r===0) return principal/months;
  const f = Math.pow(1+r, months);
  return principal*r*f/(f-1);
}

function calculate(p){
  const a = getAssumptions(p);
  const s = p.settings;
  const sales = getSalesSeries(p);

  const pnl = [0,1,2].map(i=>{
    const S = sales[i];
    const cos = S*a.costOfSales/100;
    const gp = S-cos;
    const employee = S*a.employee/100, rent=S*a.rent/100, elec=S*a.electricity/100,
      transport=S*a.transport/100, admin=S*a.admin/100, selling=S*a.selling/100,
      repairs=S*a.repairs/100, other=S*a.otherOpex/100;
    const totalOpex = employee+rent+elec+transport+admin+selling+repairs+other;
    const ebitda = gp-totalOpex;
    return {sales:S,cos,gp,employee,rent,elec,transport,admin,selling,repairs,other,totalOpex,ebitda};
  });

  /* Working Capital (Turnover Method) is computed from sales alone, independent of the loan
     split entered — needed below to work out an Indicative Term Loan whenever the applicant
     has not explicitly split their Total Loan Requested. */
  const y1Sales = sales[0];
  const wcReq = y1Sales*s.wcTurnoverPct/100;
  const wcNwc = y1Sales*s.wcNwcPct/100;
  const wcBank = y1Sales*s.wcBankPct/100;

  /* Loan structure: Total Loan Requested = Term Loan + Working Capital Finance.
     - If the applicant gives Term Loan (with or without WC), that figure is preserved as-is.
     - If only WC Finance is given, the Indicative Term Loan is the remainder of the Total.
     - If neither is given, the Indicative Term Loan is the Total minus the Indicative Working
       Capital Finance (Turnover Method) — the entire requested amount is never silently
       treated as Term Loan. The applicant's original Total Loan Requested is never altered. */
  const appliedTotal = num(p.loan.total);
  const appliedTermLoan = num(p.loan.termLoan);
  const appliedWc = num(p.loan.wcLoan);
  let termLoan;
  if(appliedTermLoan>0){
    termLoan = appliedTermLoan;
  } else if(appliedWc>0){
    termLoan = Math.max(appliedTotal-appliedWc, 0);
  } else {
    termLoan = Math.max(appliedTotal-wcBank, 0);
  }
  /* If the applicant explicitly entered Working Capital Finance, that figure — not the
     generic Turnover Method estimate — is what drives the projected Balance Sheet, interest
     calculation and financing logic below. The Turnover Method assessment (wcBank) remains
     separately available throughout the report purely as an indicative reference. */
  const wcFinance = appliedWc>0 ? appliedWc : wcBank;

  const fixedAssetReq = s.promoterMarginFixedPct<100 ? termLoan/(1-s.promoterMarginFixedPct/100) : termLoan;
  const promoterMarginFixed = fixedAssetReq - termLoan;
  const split = s.fixedAssetSplit;
  const fa = {
    land: fixedAssetReq*split.land/100, building: fixedAssetReq*split.building/100,
    machinery: fixedAssetReq*split.machinery/100, furniture: fixedAssetReq*split.furniture/100,
    vehicle: fixedAssetReq*split.vehicle/100, preliminary: fixedAssetReq*split.preliminary/100,
    other: fixedAssetReq*split.other/100
  };
  /* Land and Preliminary Expenses are both non-depreciable — excluded from the depreciable
     block (grossBlock). Land is never written off; Preliminary Expenses are shown separately
     in Project Cost and are never silently folded into Building/Machinery/Other Fixed Assets
     or depreciated alongside them (see Methodology section for disclosure). */
  const grossBlock = fixedAssetReq - fa.land - fa.preliminary;

  /* Project Cost takes only the Margin Money for Working Capital (the borrower's own
     contribution, wcNwc) — not the full Working Capital Requirement (wcReq). The bank's
     working capital limit (wcBank) is a separate revolving fund-based facility sanctioned
     against stock/receivables under the Turnover Method (see Working Capital Assessment /
     MPBF sections) and does not form part of the project financing table below. */
  const totalProjectCost = fixedAssetReq + wcNwc;
  const promoterContributionTotal = promoterMarginFixed + wcNwc;
  const meansOfFinance = {
    promoterContribution: promoterContributionTotal, termLoan: termLoan,
    otherSources:0, subsidy:0,
    total: promoterContributionTotal+termLoan,
    wcFinanceMemo: wcFinance
  };

  /* Loan Reconciliation — two genuinely different concepts, kept separate and never
     conflated as a "mismatch":
       (a) Structure check: if the applicant entered Total, Term AND WC Finance, do their
           own three numbers add up (Term + WC = Total)? This is a genuine, informational
           warning about the applicant's own entered data — never auto-corrected.
       (b) Indicative comparison: the Turnover Method's independently-calculated WC estimate,
           shown purely as a reference figure alongside whatever WC Finance was requested —
           the two are different concepts by design and a difference between them is not an
           error of any kind. */
  const tolerancePct = (s.loanMismatchTolerancePct===undefined?5:s.loanMismatchTolerancePct);
  const structureTolerance = Math.max(appliedTotal*tolerancePct/100, 1);
  const loanCheck = {
    appliedTotal, appliedTermLoan, appliedWc,
    termLoanUsed: termLoan, wcFinanceUsed: wcFinance,
    indicativeWc: wcBank,
    indicativeDifference: appliedTotal - (termLoan + wcFinance),
    structureMismatch: (appliedTermLoan>0 && appliedWc>0) && Math.abs((appliedTermLoan+appliedWc)-appliedTotal) > structureTolerance,
    tolerancePct
  };
  loanCheck.anyMismatch = loanCheck.structureMismatch;

  /* Last Year's Actuals (existing units only) — a full actual P&L and Balance Sheet, used to
     (a) compare against this year's Year-1 projection and flag an unusually large sales jump,
     and (b) derive real historical percentages/days so assumptions can be calibrated to actual
     performance instead of the generic model defaults (see applyActualsToAssumptions()). */
  const defAc = {sales:0,costOfSales:0,operatingExpenses:0,depreciation:0,interestPaid:0,netProfit:0,
    netFixedAssets:0,inventory:0,receivables:0,cashBank:0,otherCurrentAssets:0,
    netWorth:0,termLoanOS:0,wcBorrowingOS:0,tradeCreditors:0,otherCurrentLiab:0};
  const ac = Object.assign({}, defAc, p.actuals||{});
  const hasActuals = p.borrower.existing==='Existing' && num(ac.sales)>0;

  const acCA = num(ac.inventory)+num(ac.receivables)+num(ac.cashBank)+num(ac.otherCurrentAssets);
  const acCL = num(ac.wcBorrowingOS)+num(ac.tradeCreditors)+num(ac.otherCurrentLiab);
  const acTOL = num(ac.termLoanOS)+num(ac.wcBorrowingOS)+num(ac.tradeCreditors)+num(ac.otherCurrentLiab);
  const acTotalAssets = num(ac.netFixedAssets)+acCA;
  const acTotalLiabEquity = num(ac.netWorth)+acTOL;
  const acGrossProfit = num(ac.sales)-num(ac.costOfSales);
  const acEbitda = acGrossProfit-num(ac.operatingExpenses);
  const acPBT = acEbitda-num(ac.depreciation)-num(ac.interestPaid);

  const modelOpexPct = a.employee+a.rent+a.electricity+a.transport+a.admin+a.selling+a.repairs+a.otherOpex;
  const actualCostOfSalesPct = num(ac.sales)>0 ? (num(ac.costOfSales)/num(ac.sales))*100 : null;
  const actualOpexPct = num(ac.sales)>0 ? (num(ac.operatingExpenses)/num(ac.sales))*100 : null;
  const actualDeprRatePct = num(ac.netFixedAssets)>0 ? (num(ac.depreciation)/num(ac.netFixedAssets))*100 : null;
  const actualStockDays = num(ac.costOfSales)>0 ? (num(ac.inventory)/num(ac.costOfSales))*365 : null;
  const actualDebtorDays = num(ac.sales)>0 ? (num(ac.receivables)/num(ac.sales))*365 : null;
  const actualCreditorDays = num(ac.costOfSales)>0 ? (num(ac.tradeCreditors)/num(ac.costOfSales))*365 : null;

  function devFlag(model, actual){ return (actual!==null && model>0) ? Math.abs(actual-model)/model>0.25 : false; }
  const assumptionComparisons = [
    {key:'costOfSales', labelEn:'Cost of Sales', labelHi:'बिक्री लागत', model:a.costOfSales, actual:actualCostOfSalesPct, unit:'%', flag:devFlag(a.costOfSales,actualCostOfSalesPct)},
    {key:'opexAggregate', labelEn:'Total Operating Expenses', labelHi:'कुल परिचालन व्यय', model:modelOpexPct, actual:actualOpexPct, unit:'%', flag:devFlag(modelOpexPct,actualOpexPct)},
    {key:'deprRate', labelEn:'Depreciation Rate', labelHi:'मूल्यह्रास दर', model:a.deprRate, actual:actualDeprRatePct, unit:'%', flag:devFlag(a.deprRate,actualDeprRatePct)},
    {key:'stockDays', labelEn:'Stock Holding', labelHi:'स्टॉक अवधि', model:a.stockDays, actual:actualStockDays, unit:'days', flag:devFlag(a.stockDays,actualStockDays)},
    {key:'debtorDays', labelEn:'Debtor Days', labelHi:'देनदार अवधि', model:a.debtorDays, actual:actualDebtorDays, unit:'days', flag:devFlag(a.debtorDays,actualDebtorDays)},
    {key:'creditorDays', labelEn:'Creditor Days', labelHi:'लेनदार अवधि', model:a.creditorDays, actual:actualCreditorDays, unit:'days', flag:devFlag(a.creditorDays,actualCreditorDays)}
  ];

  const actualsCheck = { hasActuals, actuals: ac,
    currentAssets: acCA, currentLiabilities: acCL, totalOutsideLiab: acTOL,
    totalAssets: acTotalAssets, totalLiabEquity: acTotalLiabEquity,
    balanceGapPct: acTotalAssets>0 ? (Math.abs(acTotalAssets-acTotalLiabEquity)/acTotalAssets)*100 : null,
    grossProfit: acGrossProfit, ebitda: acEbitda, pbt: acPBT,
    currentRatio: acCL>0 ? acCA/acCL : null,
    tolTnw: num(ac.netWorth)>0 ? acTOL/num(ac.netWorth) : null,
    salesGrowthPct: hasActuals ? ((sales[0]-num(ac.sales))/num(ac.sales))*100 : null,
    highGrowthFlag: false,
    assumptionComparisons, modelOpexPct,
    actualCostOfSalesPct, actualOpexPct, actualDeprRatePct, actualStockDays, actualDebtorDays, actualCreditorDays
  };
  if(hasActuals && actualsCheck.salesGrowthPct!==null){
    actualsCheck.highGrowthFlag = actualsCheck.salesGrowthPct > (s.maxSalesGrowthPct===undefined?50:s.maxSalesGrowthPct);
  }

  const opCycle = pnl.map((row,i)=>{
    const S = sales[i];
    const inventory = row.cos*a.stockDays/365;
    const receivables = S*a.debtorDays/365;
    const otherCA = S*s.otherCurrentAssetsPct/100;
    const creditors = row.cos*a.creditorDays/365;
    const otherCL = S*s.otherCurrentLiabPct/100;
    const gap = (inventory+receivables+otherCA) - (creditors+otherCL);
    const borrowerContribution = gap*(s.wcNwcPct/s.wcTurnoverPct);
    const bankFinance = gap - borrowerContribution;
    return {inventory,receivables,otherCA,creditors,otherCL,gap,borrowerContribution,bankFinance};
  });

  const tenureMonths = p.loanTerms.tenureYears*12;
  const moraMonths = num(p.loanTerms.moratoriumMonths);
  const rate = num(p.loanTerms.interestRatePct)/100/12;
  const repayMonths = Math.max(tenureMonths - moraMonths,1);
  /* Genuinely implement the selected instalment frequency: interest still accrues monthly on
     the reducing balance, but principal is repaid only at each period boundary (every month
     for Monthly, every 3rd month for Quarterly) — not silently treated as monthly regardless
     of what was selected. */
  const freq = (p.loanTerms.instalmentFreq==='Quarterly') ? 'Quarterly' : 'Monthly';
  const periodMonths = freq==='Quarterly' ? 3 : 1;
  const numInstalments = Math.max(Math.floor(repayMonths/periodMonths),1);
  const principalPerInstalment = termLoan>0 ? termLoan/numInstalments : 0;
  let schedule = [];
  let bal = termLoan;
  let monthsSinceMora = 0;
  for(let m=1;m<=tenureMonths;m++){
    const openBal = bal;
    const interest = openBal*rate;
    let principal = 0;
    if(m>moraMonths){
      monthsSinceMora++;
      if(monthsSinceMora % periodMonths === 0 || m===tenureMonths){
        principal = Math.min(principalPerInstalment, bal);
      }
    }
    bal = bal - principal;
    schedule.push({month:m, open:openBal, interest, principal, close:bal, inMoratorium: m<=moraMonths});
  }
  function yearBucket(yr){
    const from=(yr-1)*12+1, to=yr*12;
    const rows = schedule.filter(r=>r.month>=from && r.month<=to);
    const openBal = rows.length? rows[0].open : (yr===1?termLoan:0);
    const closeBal = rows.length? rows[rows.length-1].close : 0;
    const interest = rows.reduce((t,r)=>t+r.interest,0);
    const principal = rows.reduce((t,r)=>t+r.principal,0);
    return {openBal,closeBal,interest,principal};
  }
  const tlYearly = [1,2,3].map(yearBucket);
  const emi = computeEMI(termLoan, p.loanTerms.interestRatePct, repayMonths);

  /* Working Capital borrowing modeled in the Balance Sheet/Cash Flow/interest calculation is
     anchored to wcFinance (the applicant's entered WC Finance if given, else the Turnover
     Method estimate for Year 1) and scaled in later years in proportion to projected sales
     growth — never silently replaced by the generic turnover-method figure when the
     applicant has stated their own. */
  const wcYearly = sales.map(S=> wcFinance*(S/y1Sales));
  const wcInterestYearly = wcYearly.map(w=> w*num(p.loanTerms.interestRatePct)/100);

  let wdv = grossBlock;
  const deprYearly = [];
  for(let i=0;i<3;i++){ const d = wdv*a.deprRate/100; deprYearly.push(d); wdv = wdv-d; }

  const pnlFull = pnl.map((row,i)=>{
    const depr = deprYearly[i];
    const interest = tlYearly[i].interest + wcInterestYearly[i];
    const pbt = row.ebitda - depr - interest;
    const tax = pbt>0 ? pbt*s.taxRatePct/100 : 0;
    const pat = pbt-tax;
    return Object.assign({}, row, {depr, interest, pbt, tax, pat, termInterest:tlYearly[i].interest, wcInterest:wcInterestYearly[i]});
  });

  let cumRE = 0;
  const drawingsYearly = pnlFull.map(r=> Math.max(r.pat,0)*s.ownerDrawingsPct/100);
  const reYearly = pnlFull.map((r,i)=>{ cumRE += (r.pat - drawingsYearly[i]); return cumRE; });

  const nfaYearly = [];
  for(let i=0;i<3;i++){
    const close = (i===0?grossBlock:nfaYearly[i-1].close) - deprYearly[i];
    nfaYearly.push({open:(i===0?grossBlock:nfaYearly[i-1].close), close});
  }

  let cash = num(p.openingCash);
  const cashFlow = [];
  let cumulativeFunding = 0;
  for(let i=0;i<3;i++){
    const opChgInv = i===0 ? opCycle[0].inventory : (opCycle[i].inventory-opCycle[i-1].inventory);
    const opChgRec = i===0 ? opCycle[0].receivables : (opCycle[i].receivables-opCycle[i-1].receivables);
    const opChgOCA = i===0 ? opCycle[0].otherCA : (opCycle[i].otherCA-opCycle[i-1].otherCA);
    const opChgCred = i===0 ? opCycle[0].creditors : (opCycle[i].creditors-opCycle[i-1].creditors);
    const opChgOCL = i===0 ? opCycle[0].otherCL : (opCycle[i].otherCL-opCycle[i-1].otherCL);
    const operating = pnlFull[i].pat + deprYearly[i] - (opChgInv+opChgRec+opChgOCA) + (opChgCred+opChgOCL);
    const investing = i===0 ? -(fixedAssetReq) : 0;
    const termLoanDisb = i===0 ? termLoan : 0;
    const termPrincipalRepaid = -tlYearly[i].principal;
    const promoterInfusion = i===0 ? promoterContributionTotal : 0;
    const wcChg = i===0 ? wcYearly[0] : (wcYearly[i]-wcYearly[i-1]);
    const drawings = -drawingsYearly[i];
    const financingBeforeFunding = termLoanDisb+termPrincipalRepaid+promoterInfusion+wcChg+drawings;
    const netBeforeFunding = operating+investing+financingBeforeFunding;
    const closingBeforeFunding = cash+netBeforeFunding;
    /* If projected cash generation is insufficient and closing cash would be negative, that
       shortfall is shown as an indicative Additional Short-Term Funding Requirement — added
       here as a financing inflow so Cash/Bank never goes negative, and carried forward as a
       cumulative liability on the Balance Sheet (see chkCashDeficit / rBS / rCF). Only the new
       shortfall arising in a given year is counted, avoiding double-counting across years. */
    const fundingRequired = Math.max(-closingBeforeFunding, 0);
    const financing = financingBeforeFunding + fundingRequired;
    const net = operating+investing+financing;
    const closing = cash+net;
    cumulativeFunding += fundingRequired;
    cashFlow.push({operating,investing,financing,net,opening:cash,closing,
      termLoanDisb,termPrincipalRepaid,promoterInfusion,wcChg,drawings,fundingRequired,cumulativeFunding});
    cash = closing;
  }

  const balanceSheet = [0,1,2].map(i=>{
    /* Net Fixed Assets = Land + Preliminary Expenses (both carried at cost, never depreciated)
       + the depreciable block net of accumulated depreciation. */
    const assets = { nfa: nfaYearly[i].close + fa.land + fa.preliminary, inventory: opCycle[i].inventory, receivables: opCycle[i].receivables,
      cash: Math.max(cashFlow[i].closing,0), otherCA: opCycle[i].otherCA };
    assets.total = assets.nfa+assets.inventory+assets.receivables+assets.cash+assets.otherCA;
    const promoterCapital = promoterContributionTotal;
    const additionalFunding = cashFlow[i].cumulativeFunding;
    const liabilities = { promoterCapital, retainedEarnings: reYearly[i], termLoan: tlYearly[i].closeBal,
      wcBorrowing: wcYearly[i], creditors: opCycle[i].creditors, otherCL: opCycle[i].otherCL, additionalFunding };
    liabilities.total = promoterCapital+reYearly[i]+tlYearly[i].closeBal+wcYearly[i]+opCycle[i].creditors+opCycle[i].otherCL+additionalFunding;
    return {assets, liabilities, diff: assets.total-liabilities.total};
  });

  const dscrYearly = pnlFull.map((r,i)=>{
    const cashAccrual = r.pat + r.depr;
    const debtService = r.termInterest + tlYearly[i].principal;
    const dscr = debtService>0 ? (cashAccrual+r.termInterest)/(debtService) : null;
    return {cashAccrual, interest:r.termInterest, principal:tlYearly[i].principal, debtService, dscr};
  });
  const validDscr = dscrYearly.filter(d=>d.dscr!==null).map(d=>d.dscr);
  const avgDscr = validDscr.length? validDscr.reduce((a,b)=>a+b,0)/validDscr.length : null;
  const minDscr = validDscr.length? Math.min(...validDscr) : null;

  const ratios = [0,1,2].map(i=>{
    const bs = balanceSheet[i], r = pnlFull[i];
    const ca = bs.assets.inventory+bs.assets.receivables+bs.assets.cash+bs.assets.otherCA;
    const cl = bs.liabilities.wcBorrowing+bs.liabilities.creditors+bs.liabilities.otherCL+bs.liabilities.additionalFunding;
    const currentRatio = cl>0? ca/cl : null;
    const tnw = bs.liabilities.promoterCapital+bs.liabilities.retainedEarnings;
    const totalDebt = bs.liabilities.termLoan+bs.liabilities.wcBorrowing+bs.liabilities.additionalFunding;
    const tol = totalDebt+bs.liabilities.creditors+bs.liabilities.otherCL;
    const debtEquity = tnw>0? totalDebt/tnw : null;
    const tolTnw = tnw>0? tol/tnw : null;
    const gpMargin = r.sales>0? (r.gp/r.sales)*100 : null;
    const ebitdaMargin = r.sales>0? (r.ebitda/r.sales)*100 : null;
    const npMargin = r.sales>0? (r.pat/r.sales)*100 : null;
    const interestCoverage = r.interest>0? r.ebitda/r.interest : null;
    return {currentRatio,debtEquity,tolTnw,gpMargin,ebitdaMargin,npMargin,interestCoverage,
      stockDays:a.stockDays, debtorDays:a.debtorDays, creditorDays:a.creditorDays, wcCycle:a.stockDays+a.debtorDays-a.creditorDays};
  });

  const breakeven = pnlFull.map((r,i)=>{
    const S = sales[i];
    const variable = r.cos + r.transport + r.selling;
    const fixed = r.employee+r.rent+r.elec+r.admin+r.repairs+r.other+r.depr+r.interest;
    const contribution = S-variable;
    const pvRatio = S>0? contribution/S : 0;
    const beSales = pvRatio>0 ? fixed/pvRatio : null;
    const bePct = (beSales!==null && S>0) ? (beSales/S)*100 : null;
    return {fixed,variable,contribution,pvRatio:pvRatio*100,beSales,bePct};
  });

  /* Working Capital: Turnover Method vs Operating Cycle Method — shown side by side, neither
     is auto-selected. If they diverge materially, this is surfaced as a note for the
     applicant/bank to review the assumptions, not a sanction decision. */
  const wcDivPct = wcReq>0 ? Math.abs(wcReq-opCycle[0].gap)/wcReq*100 : null;
  const wcMethodsDiverge = wcDivPct!==null && wcDivPct > (s.wcMethodDivergencePct===undefined?25:s.wcMethodDivergencePct);

  /* Internal Report Calculation Check — pure arithmetic/consistency checks (P&L, Balance
     Sheet, Cash Flow, Project Cost = Means of Finance, working capital, repayment schedule,
     ratios computed). This gates whether the final report can be generated; it is not a
     credit, eligibility or sanction judgment — those remain with the lending bank. */
  /* Internal Report Calculation Check — pure arithmetic/data-integrity checks (P&L, Balance
     Sheet, Cash Flow, Project Cost = Means of Finance, loan structure, Land/Preliminary
     treatment, working capital, repayment schedule, ratios computed). This gates whether the
     final report can be generated; it is not a credit, eligibility or sanction judgment —
     those remain with the lending bank. */
  function validNum(v){ return v===null || (typeof v==='number' && isFinite(v)); }
  const RATIO_KEYS = ['currentRatio','debtEquity','tolTnw','gpMargin','ebitdaMargin','npMargin','interestCoverage','stockDays','debtorDays','creditorDays','wcCycle'];
  const ratiosValid = ratios.every(r => RATIO_KEYS.every(k=>validNum(r[k])));
  const noNaNAcrossReport =
    pnlFull.every(r=>Object.values(r).every(v=>typeof v!=='number'||isFinite(v))) &&
    balanceSheet.every(b=>isFinite(b.assets.total) && isFinite(b.liabilities.total) && b.assets.cash>=0 && isFinite(b.liabilities.additionalFunding) && b.liabilities.additionalFunding>=0) &&
    cashFlow.every(c=>isFinite(c.closing) && isFinite(c.fundingRequired) && c.fundingRequired>=0) &&
    schedule.every(r=>isFinite(r.close)&&isFinite(r.interest)) &&
    dscrYearly.every(d=>d.dscr===null||isFinite(d.dscr)) &&
    isFinite(emi);

  const checklist = [];
  checklist.push({key:"chkBorrower", pass: !!(p.borrower.name && p.activityModel)});
  checklist.push({key:"chkSales", pass: sales.every(v=>v>0)});
  checklist.push({key:"chkAssump", pass:true});
  checklist.push({key:"chkCost", pass: Math.abs(totalProjectCost-meansOfFinance.total)<1});
  checklist.push({key:"chkLoanStructure", pass:
    isFinite(appliedTotal) && appliedTotal>=0 &&
    isFinite(appliedTermLoan) && appliedTermLoan>=0 &&
    isFinite(appliedWc) && appliedWc>=0 &&
    isFinite(termLoan) && termLoan>=0 &&
    isFinite(wcFinance) && wcFinance>=0 &&
    isFinite(wcBank) && wcBank>=0
  });
  checklist.push({key:"chkLoanReconcile", pass: !loanCheck.structureMismatch, info:true});
  checklist.push({key:"chkLandPrelim", pass: fa.land>=0 && fa.preliminary>=0 && grossBlock>=0 && deprYearly.every(d=>isFinite(d)&&d>=0)});
  checklist.push({key:"chkWC", pass: wcReq>0});
  checklist.push({key:"chkPnl", pass: pnlFull.every(r=>!isNaN(r.pat))});
  checklist.push({key:"chkBS", pass: balanceSheet.every(b=>Math.abs(b.diff)<2)});
  checklist.push({key:"chkCF", pass: cashFlow.every(c=>!isNaN(c.closing))});
  checklist.push({key:"chkRepay", pass: termLoan>=0 && schedule.every(r=>!isNaN(r.close)) && Math.abs(schedule[schedule.length-1].close)<1});
  checklist.push({key:"chkRatios", pass: ratiosValid});
  checklist.push({key:"chkNoNaN", pass: noNaNAcrossReport});
  const allPass = checklist.filter(c=>!c.info).every(c=>c.pass);
  checklist.push({key:"chkReady", pass: allPass});

  return {
    a, sales, pnl:pnlFull, fixedAssetReq, promoterMarginFixed, fa, grossBlock,
    wcReq, wcNwc, wcBank, totalProjectCost, meansOfFinance, opCycle,
    schedule, tlYearly, wcYearly, wcInterestYearly, deprYearly, nfaYearly,
    drawingsYearly, reYearly, cashFlow, balanceSheet, dscrYearly, avgDscr, minDscr,
    ratios, breakeven, checklist, termLoan, tenureMonths, moraMonths, emi, repayMonths,
    freq, periodMonths, wcDivPct, wcMethodsDiverge, wcFinance, loanCheck, actualsCheck
  };
}

function goDashboard(){
  wizardStep=1; current=null;
  document.getElementById('saveTopBtn').style.display='none';
  renderDashboard();
}
function renderDashboard(){
  currentScreenRenderer = renderDashboard;
  document.getElementById('topbarSub').textContent = tt('dashTitleSub')+" • v"+APP_VERSION;
  document.getElementById('topbarTitle').textContent = tt('appTitle');
  const projects = loadAllProjects();
  let html = `<div class="dev-credit">${byline()}</div>
  <div class="card">
    <h2>${tt('appTitle')}</h2>
    <p class="muted">${tt('tagline')}<br>${tt('taglineSub')}</p>
    <div class="btnrow">
      <button class="btn gold" onclick="startNewProject()">${tt('newProject')}</button>
      <button class="btn gold" onclick="renderBooksMenu()">${bt('Books of Accounts','बहीखाते')}</button>
      <button class="btn secondary" onclick="downloadFsTemplate()">⬇ ${bt('Blank Excel format','खाली एक्सेल प्रारूप')}</button>
      <button class="btn secondary" onclick="loadSampleProjects()">${tt('loadSamples')}</button>
      ${projects.some(p=>p.isDemo) ? `<button class="btn secondary" onclick="removeDemoProjects()">${tt('removeSamples')}</button>` : ''}
      <button class="btn secondary" onclick="document.getElementById('importFile').click()">${tt('importProject')}</button>
      <button class="btn secondary" onclick="openSettingsScreen()">${tt('settingsBtn')}</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImportFile(event)">
    </div>
  </div>`;

  html += `<div class="card"><h3>${tt('savedProjects')} (${projects.length})</h3>`;
  if(projects.length===0){
    html += `<p class="muted">${tt('noProjects')}</p>`;
  } else {
    projects.slice().reverse().forEach(pr=>{
      html += `<div class="proj-item">
        <div class="meta">
          <b>${escapeHtml(pr.borrower.business||pr.borrower.name||"Untitled Project")} ${pr.isDemo?'<span class="demo-tag">DEMO DATA</span>':''}</b>
          <span>${escapeHtml(pr.activityName||'')} • ${inr(pr.loan.total)} • ${new Date(pr.createdAt).toLocaleDateString('en-IN')}</span>
        </div>
        <div class="proj-actions">
          <button class="btn secondary" onclick="openProject('${pr.id}')">${tt('open')}</button>
          <button class="btn secondary" onclick="duplicateProject('${pr.id}')">${tt('duplicate')}</button>
          <button class="btn secondary" onclick="exportProject('${pr.id}')">${tt('exportBtn')}</button>
          <button class="btn secondary" onclick="shareProject('${pr.id}')">${tt('shareBtn')}</button>
          <button class="btn danger" onclick="deleteProjectConfirm('${pr.id}')">${tt('deleteBtn')}</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  html += `<div class="card small muted">${tt('version')} ${APP_VERSION} — ${tt('offlineNote')}<br>${byline()}</div>`;
  document.getElementById('mainArea').innerHTML = html;
}
function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function startNewProject(){ current = blankProject(); wizardStep=1; renderWizard(); }
function openProject(id){
  const pr = loadAllProjects().find(x=>x.id===id);
  if(!pr) return;
  if(!pr.application) pr.application = { bankName:"", place:"", date:new Date().toISOString().slice(0,10) };
  if(!pr.actuals) pr.actuals = { sales:0, costOfSales:0, operatingExpenses:0, depreciation:0, interestPaid:0, netProfit:0,
    netFixedAssets:0, inventory:0, receivables:0, cashBank:0, otherCurrentAssets:0,
    netWorth:0, termLoanOS:0, wcBorrowingOS:0, tradeCreditors:0, otherCurrentLiab:0 };

function duplicateProject(id){
  const list = loadAllProjects();
  const pr = list.find(x=>x.id===id);
  if(!pr) return;
  const copy = JSON.parse(JSON.stringify(pr));
  copy.id = uid(); copy.createdAt = new Date().toISOString();
  copy.borrower.business = (copy.borrower.business||"Project")+" (Copy)";
  list.push(copy); persistAllProjects(list); renderDashboard();
}
function deleteProjectConfirm(id){
  if(!confirm("Delete this project permanently from this device? / इस परियोजना को स्थायी रूप से हटाएँ?")) return;
  let list = loadAllProjects().filter(x=>x.id!==id);
  persistAllProjects(list); renderDashboard();
}
function exportProject(id){
  const pr = loadAllProjects().find(x=>x.id===id);
  if(!pr) return;
  const blob = new Blob([JSON.stringify(pr,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = (pr.borrower.business||"msme-project").replace(/\s+/g,'_')+".json";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}
function shareProject(id){
  const pr = loadAllProjects().find(x=>x.id===id);
  if(!pr) return;
  const blob = new Blob([JSON.stringify(pr,null,2)], {type:"application/json"});
  const filename = (pr.borrower.business||"msme-project").replace(/\s+/g,'_')+".json";
  const title = (LANG==='hi'?'एमएसएमई परियोजना डेटा: ':'MSME Project Data: ')+(pr.borrower.business||'');
  const text = LANG==='hi'?'यह परियोजना फ़ाइल एमएसएमई परियोजना रिपोर्ट जनरेटर में आयात की जा सकती है।':'This project file can be imported back into the MSME Project Report Generator.';
  shareBlob(blob, filename, title, text).then(shared=>{
    if(!shared){ alert(LANG==='hi' ? "इस ब्राउज़र में सीधा साझा समर्थित नहीं है — फ़ाइल डाउनलोड कर दी गई है।" : "Direct sharing isn't supported on this browser — the file has been downloaded."); }
  });
}
function handleImportFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const pr = JSON.parse(e.target.result);
      pr.id = uid(); pr.createdAt = new Date().toISOString();
      if(!pr.application) pr.application = { bankName:"", place:"", date:new Date().toISOString().slice(0,10) };
  if(!pr.actuals) pr.actuals = { sales:0, costOfSales:0, operatingExpenses:0, depreciation:0, interestPaid:0, netProfit:0,
    netFixedAssets:0, inventory:0, receivables:0, cashBank:0, otherCurrentAssets:0,
    netWorth:0, termLoanOS:0, wcBorrowingOS:0, tradeCreditors:0, otherCurrentLiab:0 };
  else { const d = {sales:0,costOfSales:0,operatingExpenses:0,depreciation:0,interestPaid:0,netProfit:0,netFixedAssets:0,inventory:0,receivables:0,cashBank:0,otherCurrentAssets:0,netWorth:0,termLoanOS:0,wcBorrowingOS:0,tradeCreditors:0,otherCurrentLiab:0}; pr.actuals = Object.assign({}, d, pr.actuals); }
      getHistory(pr);
      const list = loadAllProjects(); list.push(pr); persistAllProjects(list);
      renderDashboard();
    }catch(err){ alert("Could not read this file. Please select a valid exported project JSON file."); }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

    ["h_books", hi?"बहीखाते (Books of Accounts) मेनू":"Books of Accounts menu",
      hi?`<p>ऊपर <b>बहीखाते</b> बटन से किसी <b>चालू इकाई</b> के बहीखाते व वित्तीय विवरण तैयार, देखे, प्रिंट व साझा किए जा सकते हैं। तीन आधार हैं: (1) <b>वास्तविक वित्तीय विवरण</b> (लाभ-हानि + तुलन पत्र) — एक्सेल प्रारूप, CSV, एक्सेल, पीडीएफ, फोटो, पेस्ट या टाइप; (2) <b>बैंक स्टेटमेंट</b> की असली प्रविष्टियाँ; (3) <b>घोषित वार्षिक आंकड़े</b> (चरण 1 में)।</p>

       <p><b>माहवार विवरण:</b> बिक्री (समूह-वार), क्रय, वसूली, भुगतान व हर व्यय माह-दर-माह दर्शाए जाते हैं, ताकि हर खाताबही व तलपट माहवार प्रविष्टियों तक खोजा जा सके। अधिक यथार्थता हेतु वास्तविक माहवार बिक्री / क्रय व पार्टी-वार देनदार / लेनदार (खंड 4b या एक्सेल प्रारूप की “Monthly &amp; Parties” शीट) भरें; अन्यथा समान माह। ये आवंटन हैं, वास्तविक बिल नहीं — बहीखाते यह लिखते हैं। केवल बैंक स्टेटमेंट मार्ग में असली दिनांकित प्रविष्टियाँ होती हैं।</p>
       <p><b>देखें / प्रिंट / साझा:</b> सहेजे बहीखातों की सूची में <b>देखें</b>, <b>प्रिंट</b> (पीडीएफ हेतु “Save as PDF”), <b>साझा करें</b> (फ़ोन पर व्हाट्सऐप/ईमेल; अन्यथा फ़ाइल डाउनलोड) व <b>डेटा संपादित करें</b> बटन हैं।</p>
       <p><b>डेमो डेटा:</b> बहीखाते मेनू → “डेमो डेटा” से ऐप जाँचने हेतु चार नमूना सेट लोड होते हैं; कभी भी हटाएँ और एक टैप में मूल पुनः पाएँ।</p>
       <div class="staff-box"><b>ध्यान दें:</b> सभी आउटपुट पर “पुनर्निर्मित / अलेखापरीक्षित” अंकित रहता है। यदि तुलन पत्र संतुलित न हो या गणना किया लाभ विवरण के लाभ से न मिले, तो बहीखाते नहीं बनते — अधूरी/गलत जुड़ी पंक्ति ठीक करें। पीडीएफ/फोटो पहली बार इंटरनेट से रीडर लोड करते हैं; एक्सेल/CSV/पेस्ट ऑफलाइन चलते हैं।</div>`
       :`<p>The <b>Books</b> button at the top prepares, views, prints and shares the books of accounts and financial statements of an <b>existing unit</b>. Three sources: (1) <b>actual financial statements</b> (P&amp;L + Balance Sheet) — Excel format, CSV, Excel, PDF, photo, paste or typing; (2) real <b>bank-statement</b> entries; (3) <b>declared annual figures</b> (Step 1).</p>
       <p><b>Excel format:</b> tap “Download blank Excel format” (Books menu, Dashboard, Step 1 or the Financial-Statements workspace). Fill the yellow cells — unit name, constitution, nature of business, year, P&amp;L and Balance Sheet (the previous-year balance sheet gives the opening position). Then upload it in the Books menu. Do not add, delete or rename rows — a hidden column holds codes.</p>
       <p><b>As per nature of business:</b> a grocery shop gets grocery groups (staples, pulses &amp; spices, oils, packaged food…); a service unit gets its own service-income heads. Statements give only totals, so the group split is your <b>estimated mix %</b> — marked “est.” in the books, not an item-wise record. Totals match the statements exactly.</p>
       <p><b>Month-wise detail:</b> sales (by group), purchases, collections, payments and each expense are posted month by month, so every ledger and the trial balance traces to monthly entries. Every expense line of your statements gets its own ledger account, and every debtor / creditor you list gets an individual account (opening balance and each month's credit sales / collections or purchases / payments) — without a party list, debtors and creditors stay as one account each. Enter actual monthly sales / purchases and party-wise debtors / creditors (section 4b, or the “Monthly &amp; Parties” sheet of the Excel format) for more realism; otherwise equal months are used. These are allocations, not actual invoices — the books say so. Only the bank-statement route uses real dated entries.</p>
       <p><b>View / Print / Share:</b> the saved-books list has <b>View</b>, <b>Print</b> (choose “Save as PDF” for a PDF), <b>Share</b> (WhatsApp/email on a phone; otherwise the file downloads) and <b>Edit data</b>.</p>
       <p><b>Demo data:</b> Books menu → “Demo data” loads four sample sets to cross-check the app; remove them any time and restore the originals with one tap.</p>
       <div class="staff-box"><b>Note:</b> every output is labelled “reconstructed / unaudited”. If the balance sheet does not balance, or the computed profit differs from the statement's profit, the books are not generated — fix the missing or wrongly mapped line. PDF/photo reading loads a reader from the internet the first time; Excel/CSV/paste work offline.</div>`],
    ["h_data", hi?"डेटा व ऑफलाइन":"Data & Offline Use",
      hi?`<p>यह ऐप 100% ऑफलाइन कार्य करता है — कोई इंटरनेट, लॉगिन या सर्वर आवश्यक नहीं। सभी परियोजनाएँ इसी डिवाइस/ब्राउज़र में सुरक्षित रहती हैं। किसी परियोजना का बैकअप लेने या दूसरे डिवाइस पर ले जाने हेतु "निर्यात करें" का उपयोग करें, और "परियोजना आयात करें" से वापस लोड करें।</p>`

  const body = sections.map(s=>`<div id="${s[0]}" class="section-anchor"><h3>${s[1]}</h3>${s[2]}</div>`).join('');
  const html = `<div class="card">
    <h2>${tt('helpTitle')}</h2>
    <p class="muted">${hi?"यह मार्गदर्शिका उधारकर्ता और उनकी सहायता करने वाले बैंक/क्षेत्रीय कर्मचारी दोनों के लिए है।":"This guide is written for both the borrower and the bank/field staff assisting them."}</p>
    <div class="help-toc">${toc}</div>
    ${body}
    <div class="btnrow"><button class="btn secondary" onclick="goDashboard()">${hi?'डैशबोर्ड':'Dashboard'}</button></div>
  </div>`;
  document.getElementById('mainArea').innerHTML = html;
}

function renderWizard(){
  currentScreenRenderer = renderWizard;
  document.getElementById('saveTopBtn').style.display='inline-block';
  document.getElementById('topbarTitle').textContent = tt('appTitle');
  document.getElementById('topbarSub').textContent = (current.borrower.business||"New Project")+" • "+wizardStep+"/5";
  let bars = "";
  for(let i=1;i<=5;i++){ bars += `<div class="${i<wizardStep?'done':(i===wizardStep?'current':'')}"></div>`; }
  const titles = [tt('stepBorrower'),tt('stepActivity'),tt('stepLoan'),tt('stepSales'),tt('stepLoanTerms')];
  let body = "";
  if(wizardStep===1) body = stepBorrower();
  else if(wizardStep===2) body = stepActivity();
  else if(wizardStep===3) body = stepLoan();
  else if(wizardStep===4) body = stepSales();
  else if(wizardStep===5) body = stepLoanTerms();

  } else if(wizardStep===3){
    /* Preserve exactly what the applicant entered. Term Loan and WC Finance are left at 0
       when not entered — the calculation engine derives an Indicative Term Loan and
       Indicative Working Capital Finance from these; the Total Loan Requested itself is
       never silently converted into a Term Loan. Amounts are clamped to non-negative since
       a negative loan or sales figure is never valid and would silently corrupt every
       downstream calculation. */
    current.loan = { total:Math.max(0,+val('w_loanTotal')||0), purpose:val('w_purpose'), termLoan:Math.max(0,+val('w_termLoan')||0), wcLoan:Math.max(0,+val('w_wcLoan')||0) };

];
function afLabel(row){ return LANG==='hi' ? row[2] : row[1]; }
function renderAssumptions(){
  currentScreenRenderer = renderAssumptions;
  const a = getAssumptions(current);
  const hi = LANG==='hi';
  let rows = ASSUMPTION_FIELDS.map(row=>{
    const k = row[0]; const mod = isModified(current,k);
    return `<div class="assump-row">
      <span>${afLabel(row)} ${mod?'<span class="badge modified">'+tt('modifiedTag')+'</span>':'<span class="badge default">'+tt('defaultTag')+'</span>'}</span>
      <span class="val"><input type="number" style="width:90px" class="default-input" id="asf_${k}" value="${a[k]}" onchange="assumptionChanged('${k}')"></span>
    </div>`;
  }).join('');
  let actualsBlock = '';
  if(current.borrower.existing==='Existing'){
    const c = calculate(current);
    const ck = c.actualsCheck;
    if(ck.hasActuals){
      const cmpRows = ck.assumptionComparisons.map(cmp=>{
        const label = hi?cmp.labelHi:cmp.labelEn;
        const unit = cmp.unit==='%' ? '%' : (hi?' दिन':' days');
        const actualTxt = cmp.actual!==null ? cmp.actual.toFixed(1)+unit : (hi?'लागू नहीं':'Not Applicable');
        return `<tr class="${cmp.flag?'mismatch-row':''}"><td>${label}</td><td>${cmp.model.toFixed(1)}${unit}</td><td><span class="${cmp.flag?'mismatch':''}">${actualTxt}</span></td></tr>`;
      }).join('');
      actualsBlock = `<h3>${hi?'पिछले वर्ष के वास्तविक बनाम मॉडल मान्यताएँ':'Last Year\'s Actual vs Model Assumptions'}</h3>
      <table><tr><th>${hi?'मापदंड':'Parameter'}</th><th>${hi?'मॉडल':'Model'}</th><th>${hi?'वास्तविक (पिछला वर्ष)':'Actual (Last Year)'}</th></tr>
      ${cmpRows}</table>
      <div class="btnrow"><button class="btn secondary" onclick="applyActualsToAssumptions()">${hi?'वास्तविक अनुपात मान्यताओं में लागू करें':'Use Actual Ratios as Assumptions'}</button></div>
      <p class="muted small">${hi?'इससे मॉडल की डिफ़ॉल्ट मान्यताएँ, पिछले वर्ष के वास्तविक प्रदर्शन के अनुरूप बदल जाएँगी — अनुमान वास्तविकता पर आधारित बनेंगे।':'This replaces the model\'s default assumptions with figures calibrated to last year\'s actual performance — grounding the projection in real numbers.'}</p>`;
    }
  }
  const html = `<div class="card">
    <h2>${tt('assumptionsUsed')}</h2>

}
function applyActualsToAssumptions(){
  const c = calculate(current);
  const ck = c.actualsCheck;
  if(!ck.hasActuals) return;
  if(!current.assumptions) current.assumptions = {};
  if(ck.actualCostOfSalesPct!==null) current.assumptions.costOfSales = Math.round(ck.actualCostOfSalesPct*10)/10;
  if(ck.actualDeprRatePct!==null) current.assumptions.deprRate = Math.round(ck.actualDeprRatePct*10)/10;
  if(ck.actualStockDays!==null) current.assumptions.stockDays = Math.round(ck.actualStockDays);
  if(ck.actualDebtorDays!==null) current.assumptions.debtorDays = Math.round(ck.actualDebtorDays);
  if(ck.actualCreditorDays!==null) current.assumptions.creditorDays = Math.round(ck.actualCreditorDays);
  if(ck.actualOpexPct!==null && ck.modelOpexPct>0){
    const scale = ck.actualOpexPct/ck.modelOpexPct;
    const a = getAssumptions(current);
    ["employee","rent","electricity","transport","admin","selling","repairs","otherOpex"].forEach(k=>{
      current.assumptions[k] = Math.round(a[k]*scale*10)/10;
    });
  }
  renderAssumptions();
}
function assumptionChanged(k){
  if(!current.assumptions) current.assumptions={};
  current.assumptions[k] = +document.getElementById('asf_'+k).value;

}

/* ============================================================
   PAST FINANCIALS & BOOKS OF ACCOUNTS (existing units only)
   Reconstructed, summary-level double-entry books built ONLY from figures the borrower
   declares (last year's actuals, optionally the year before, plus an opening balance sheet).
   Every ledger line is derived arithmetically from those declared totals — nothing is
   invented — and the result is proved against the declared statements (see "tally" rows).
   Always labelled "reconstructed / unaudited"; not contemporaneous books.
   ============================================================ */
const H_PNL = ['sales','costOfSales','operatingExpenses','depreciation','interestPaid','netProfit'];
const H_BS  = ['netFixedAssets','inventory','receivables','cashBank','otherCurrentAssets','netWorth','termLoanOS','wcBorrowingOS','tradeCreditors','otherCurrentLiab'];
const H_IDS = {sales:'sales',costOfSales:'cos',operatingExpenses:'opex',depreciation:'depr',interestPaid:'interest',netProfit:'np',
  netFixedAssets:'nfa',inventory:'inv',receivables:'rec',cashBank:'cash',otherCurrentAssets:'oca',netWorth:'nw',
  termLoanOS:'tlos',wcBorrowingOS:'wcos',tradeCreditors:'cred',otherCurrentLiab:'ocl'};
const H_LABEL = {sales:'actualSales',costOfSales:'actualCOS',operatingExpenses:'actualOpex',depreciation:'actualDepr',interestPaid:'actualInterest',netProfit:'actualNetProfit',
  netFixedAssets:'actualNFA',inventory:'actualInventory',receivables:'actualReceivables',cashBank:'actualCashBank',otherCurrentAssets:'actualOtherCA',
  netWorth:'actualNetWorth',termLoanOS:'actualTermLoanOS',wcBorrowingOS:'actualWcOS',tradeCreditors:'actualCreditors',otherCurrentLiab:'actualOtherCL'};
const ACC = {
  FA:['Fixed Assets (Net Block)','स्थिर संपत्ति (शुद्ध)'], STK:['Stock-in-Trade','स्टॉक'], DR:['Sundry Debtors','विविध देनदार'],
  OCA:['Other Current Assets','अन्य चालू संपत्तियाँ'], CASH:['Cash & Bank','नकद व बैंक'],
  CAP:['Capital Account (incl. reserves)','पूंजी खाता (संचित निधि सहित)'], TL:['Term Loan','मीयादी ऋण'],
  WC:['Working Capital Borrowing (CC/OD)','कार्यशील पूंजी उधार (सीसी/ओडी)'], CR:['Sundry Creditors','विविध लेनदार'],
  OCL:['Other Current Liabilities','अन्य चालू देनदारियाँ'], SAL:['Sales','बिक्री'], PUR:['Purchases','क्रय'],
  OPX:['Operating Expenses','परिचालन व्यय'], DEP:['Depreciation','मूल्यह्रास'], INT:['Interest on Loans','ऋणों पर ब्याज'],
  TAX:['Income Tax','आयकर'], TRD:['Trading Account','व्यापार खाता'], PL:['Profit & Loss Account','लाभ-हानि खाता']
};
const ACC_ORDER = ['CASH','DR','STK','OCA','FA','CAP','TL','WC','CR','OCL','SAL','PUR','OPX','DEP','INT','TAX','TRD','PL'];
function an(id){
  if((id==='CAP'||id==='DRW') && typeof current!=='undefined' && current && current.borrower){ const ci=bankConstitutionInfo(current); return (id==='CAP'?ci.cap:ci.drw)[LANG==='hi'?1:0]; }
  return ACC[id][LANG==='hi'?1:0];
}
function bt(en,hi){ return LANG==='hi' ? hi : en; }
const R = x => Math.round(+x||0);

function defaultFyEnd(){ const d=new Date(); return d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1; }
function fyLabel(endYear){ return (endYear-1)+'-'+String(endYear).slice(2); }
function blankHistory(){
  const z = keys => { const r={}; keys.forEach(k=>r[k]=0); return r; };
  return { enabled:false, fyEnd:defaultFyEnd(), usePrior:false, prior:z(H_PNL.concat(H_BS)), opening:z(H_BS),
           openingAssumed:false, cashSalesPct:0, cashPurchasePct:0, source:'declared' };
}
function getHistory(p){
  const b = blankHistory(), h = Object.assign({}, b, p.history||{});
  h.prior = Object.assign({}, b.prior, (p.history&&p.history.prior)||{});
  h.opening = Object.assign({}, b.opening, (p.history&&p.history.opening)||{});
  p.history = h; return h;
}

/* ---------- Year definitions: [year before last (optional)], last year ---------- */
function histYearsOf(p){
  const h = getHistory(p), ac = p.actuals||{}, end = h.fyEnd;
  const pnl = o => { const r={}; H_PNL.forEach(k=>r[k]=R(o[k])); return r; };
  const bs  = o => { const r={}; H_BS.forEach(k=>r[k]=R(o[k])); return r; };
  const ys = [];
  if(h.usePrior) ys.push({ key:'prior', label:fyLabel(end-1), start:`01-04-${end-2}`, end:`31-03-${end-1}`,
    openDate:`31-03-${end-2}`, closeDate:`31-03-${end-1}`, open:bs(h.opening), openSet:'opening', pnl:pnl(h.prior), close:bs(h.prior), closeSet:'prior', openLinked:false });
  ys.push({ key:'last', label:fyLabel(end), start:`01-04-${end-1}`, end:`31-03-${end}`,
    openDate:`31-03-${end-1}`, closeDate:`31-03-${end}`,
    open: h.usePrior ? bs(h.prior) : bs(h.opening), openSet: h.usePrior?'prior':'opening',
    pnl:pnl(ac), close:bs(ac), closeSet:'actuals', openLinked: h.usePrior });
  return ys;
}
const sumAssets = b => b.netFixedAssets+b.inventory+b.receivables+b.cashBank+b.otherCurrentAssets;
const sumLiab   = b => b.netWorth+b.termLoanOS+b.wcBorrowingOS+b.tradeCreditors+b.otherCurrentLiab;

/* ---------- The engine: one year -> journal, ledgers, cash book, trial balance, statements ---------- */
function buildYearBooks(y, h){
  const O=y.open, C=y.close, P=y.pnl;
  const res = { year:y, errors:[], warns:[], ok:false };
  const err = (en,hi,fix) => res.errors.push({en,hi,fix});
  const warn = (en,hi) => res.warns.push({en,hi});

  const gapO = sumAssets(O)-sumLiab(O), gapC = sumAssets(C)-sumLiab(C);
  if(!y.openLinked && gapO!==0) err(
    `Balance sheet as at ${y.openDate} (opening) does not balance: Assets ${inr(sumAssets(O))} vs Liabilities + Net Worth ${inr(sumLiab(O))} (difference ${inr(gapO)}).`,
    `${y.openDate} का (प्रारंभिक) तुलन पत्र संतुलित नहीं है: संपत्ति ${inr(sumAssets(O))} बनाम देनदारियाँ + निवल मूल्य ${inr(sumLiab(O))} (अंतर ${inr(gapO)})।`,
    {set:y.openSet, gap:gapO});
  if(gapC!==0) err(
    `Balance sheet as at ${y.closeDate} does not balance: Assets ${inr(sumAssets(C))} vs Liabilities + Net Worth ${inr(sumLiab(C))} (difference ${inr(gapC)}).`,
    `${y.closeDate} का तुलन पत्र संतुलित नहीं है: संपत्ति ${inr(sumAssets(C))} बनाम देनदारियाँ + निवल मूल्य ${inr(sumLiab(C))} (अंतर ${inr(gapC)})।`,
    {set:y.closeSet, gap:gapC});

  const S=P.sales, COS=P.costOfSales, OPEX=P.operatingExpenses, DEP=P.depreciation, INT=P.interestPaid, NP=P.netProfit;
  const GP=S-COS, PBT=GP-OPEX-DEP-INT, TAX=PBT-NP;
  const purchases = COS + C.inventory - O.inventory;
  const cs = Math.min(100,Math.max(0,+h.cashSalesPct||0)), cp = Math.min(100,Math.max(0,+h.cashPurchasePct||0));
  const cashSales = R(S*cs/100), creditSales = S-cashSales;
  const cashPurch = R(Math.max(0,purchases)*cp/100), creditPurch = purchases-cashPurch;
  const collections = O.receivables + creditSales - C.receivables;
  const payments = O.tradeCreditors + creditPurch - C.tradeCreditors;
  const dOCL = C.otherCurrentLiab - O.otherCurrentLiab;
  const opexCash = OPEX - dOCL;
  const addFA = C.netFixedAssets - O.netFixedAssets + DEP;
  const dTL = C.termLoanOS - O.termLoanOS, dWC = C.wcBorrowingOS - O.wcBorrowingOS, dOCA = C.otherCurrentAssets - O.otherCurrentAssets;
  const E = C.netWorth - O.netWorth - NP;           // + capital introduced / - drawings

  if(TAX<0) err(`${y.label}: Net Profit (${inr(NP)}) is higher than Profit Before Tax (${inr(PBT)}) computed from Sales, Cost of Sales, Expenses, Depreciation and Interest. Please re-check these figures.`,
                `${y.label}: शुद्ध लाभ (${inr(NP)}) बिक्री, लागत, व्यय, मूल्यह्रास व ब्याज से निकले कर-पूर्व लाभ (${inr(PBT)}) से अधिक है। कृपया आंकड़े जाँचें।`);
  if(purchases<0) err(`${y.label}: Purchases work out negative (${inr(purchases)}) — closing stock is too high compared to opening stock + cost of sales.`,
                      `${y.label}: क्रय ऋणात्मक (${inr(purchases)}) आ रहा है — अंतिम स्टॉक, प्रारंभिक स्टॉक + बिक्री लागत से बहुत अधिक है।`);
  if(collections<0) err(`${y.label}: Collections from debtors work out negative (${inr(collections)}) — closing debtors are higher than opening debtors + credit sales. Increase the cash-sales share or re-check debtors/sales.`,
                        `${y.label}: देनदारों से वसूली ऋणात्मक (${inr(collections)}) — अंतिम देनदार, प्रारंभिक देनदार + उधार बिक्री से अधिक हैं। नकद बिक्री का अनुपात बढ़ाएँ या आंकड़े जाँचें।`);
  if(payments<0) err(`${y.label}: Payments to creditors work out negative (${inr(payments)}) — closing creditors are higher than opening creditors + credit purchases. Increase the cash-purchase share or re-check creditors/purchases.`,
                     `${y.label}: लेनदारों को भुगतान ऋणात्मक (${inr(payments)}) — अंतिम लेनदार, प्रारंभिक लेनदार + उधार क्रय से अधिक हैं। नकद क्रय का अनुपात बढ़ाएँ या आंकड़े जाँचें।`);
  if(opexCash<0) err(`${y.label}: Cash paid for expenses works out negative (${inr(opexCash)}) — Other Current Liabilities rose by more than the operating expenses for the year.`,
                     `${y.label}: व्यय पर नकद भुगतान ऋणात्मक (${inr(opexCash)}) — अन्य चालू देनदारियाँ वर्ष के परिचालन व्यय से अधिक बढ़ी हैं।`);
  if(addFA<0) warn(`${y.label}: Net fixed assets fell by more than depreciation, so the books show a fixed-asset disposal at book value of ${inr(-addFA)}.`,
                   `${y.label}: शुद्ध स्थिर संपत्ति मूल्यह्रास से अधिक घटी है, अतः बहीखाते में ${inr(-addFA)} की संपत्ति बिक्री (बही मूल्य पर) दर्शाई गई है।`);
  if(PBT>0 && TAX>0.35*PBT) warn(`${y.label}: implied income tax (${inr(TAX)}) is ${Math.round(TAX/PBT*100)}% of Profit Before Tax — please confirm Net Profit.`,
                                 `${y.label}: निहित आयकर (${inr(TAX)}) कर-पूर्व लाभ का ${Math.round(TAX/PBT*100)}% है — कृपया शुद्ध लाभ की पुष्टि करें।`);
  if(res.errors.length) return res;

  /* ---- Journal ---- */
  const J = [];
  const add = (when, narr, lines) => { lines = lines.filter(l=>l[1]||l[2]); if(lines.length) J.push({no:J.length+1, when, narr, lines}); };
  const two = (when, narr, drAcc, crAcc, amt) => { if(amt>0) add(when, narr, [[drAcc,amt,0],[crAcc,0,amt]]); };

  add('open', ['Opening balances brought forward','प्रारंभिक शेष आगे लाए गए'], [
    ['FA',O.netFixedAssets,0],['STK',O.inventory,0],['DR',O.receivables,0],['OCA',O.otherCurrentAssets,0],['CASH',O.cashBank,0],
    ['CAP',0,O.netWorth],['TL',0,O.termLoanOS],['WC',0,O.wcBorrowingOS],['CR',0,O.tradeCreditors],['OCL',0,O.otherCurrentLiab]]);

  const D='during';
  two(D,['Sales made on credit during the year (annual summary)','वर्ष में उधार बिक्री (वार्षिक सारांश)'],'DR','SAL',creditSales);
  two(D,['Cash sales during the year (annual summary)','वर्ष में नकद बिक्री (वार्षिक सारांश)'],'CASH','SAL',cashSales);
  two(D,['Amount collected from debtors during the year','वर्ष में देनदारों से वसूली'],'CASH','DR',collections);
  two(D,['Purchases on credit during the year (annual summary)','वर्ष में उधार क्रय (वार्षिक सारांश)'],'PUR','CR',creditPurch);
  two(D,['Cash purchases during the year (annual summary)','वर्ष में नकद क्रय (वार्षिक सारांश)'],'PUR','CASH',cashPurch);
  two(D,['Amount paid to creditors during the year','वर्ष में लेनदारों को भुगतान'],'CR','CASH',payments);
  if(dOCL>=0){
    two(D,['Operating expenses paid in cash','परिचालन व्यय का नकद भुगतान'],'OPX','CASH',opexCash);
    two(D,['Operating expenses outstanding at year end (net increase in dues)','वर्ष के अंत में बकाया परिचालन व्यय (देय में शुद्ध वृद्धि)'],'OPX','OCL',dOCL);
  } else {
    two(D,['Operating expenses paid in cash','परिचालन व्यय का नकद भुगतान'],'OPX','CASH',OPEX);
    two(D,['Old outstanding dues settled in cash (net decrease in dues)','पुराने बकाया देयों का नकद निपटान (देय में शुद्ध कमी)'],'OCL','CASH',-dOCL);
  }
  two(D,['Depreciation provided for the year','वर्ष हेतु मूल्यह्रास'],'DEP','FA',DEP);
  if(addFA>0) two(D,['Fixed assets purchased / added during the year','वर्ष में खरीदी/जोड़ी गई स्थिर संपत्ति'],'FA','CASH',addFA);
  else two(D,['Fixed assets disposed of at book value','स्थिर संपत्ति का बही मूल्य पर निपटान'],'CASH','FA',-addFA);
  two(D,['Interest paid on loans during the year','वर्ष में ऋणों पर ब्याज भुगतान'],'INT','CASH',INT);
  two(D,['Income tax for the year (paid)','वर्ष का आयकर (भुगतान)'],'TAX','CASH',TAX);
  if(dTL>0) two(D,['Term loan disbursed during the year','वर्ष में मीयादी ऋण का वितरण'],'CASH','TL',dTL);
  else two(D,['Term loan principal repaid during the year','वर्ष में मीयादी ऋण मूलधन की चुकौती'],'TL','CASH',-dTL);
  if(dWC>0) two(D,['Net drawings in cash credit / overdraft','नकद ऋण/ओवरड्राफ्ट में शुद्ध आहरण'],'CASH','WC',dWC);
  else two(D,['Net repayment in cash credit / overdraft','नकद ऋण/ओवरड्राफ्ट में शुद्ध चुकौती'],'WC','CASH',-dWC);
  if(dOCA>0) two(D,['Increase in other current assets (advances, deposits etc.)','अन्य चालू संपत्तियों (अग्रिम, जमा आदि) में वृद्धि'],'OCA','CASH',dOCA);
  else two(D,['Decrease in other current assets recovered','अन्य चालू संपत्तियों में कमी की वसूली'],'CASH','OCA',-dOCA);
  if(E<0) two(D,['Drawings / withdrawals by owner(s) during the year','वर्ष में स्वामी/भागीदारों द्वारा आहरण'],'CAP','CASH',-E);
  else two(D,['Capital introduced by owner(s) during the year','वर्ष में स्वामी/भागीदारों द्वारा पूंजी निवेश'],'CASH','CAP',E);

  /* ---- Closing entries (Trading A/c, Profit & Loss A/c) ---- */
  const K='close';
  two(K,['Opening stock transferred to Trading A/c','प्रारंभिक स्टॉक व्यापार खाते में अंतरित'],'TRD','STK',O.inventory);
  two(K,['Purchases transferred to Trading A/c','क्रय व्यापार खाते में अंतरित'],'TRD','PUR',purchases);
  two(K,['Sales transferred to Trading A/c','बिक्री व्यापार खाते में अंतरित'],'SAL','TRD',S);
  two(K,['Closing stock brought into books (Trading A/c)','अंतिम स्टॉक बही में लिया गया (व्यापार खाता)'],'STK','TRD',C.inventory);
  if(GP>=0) two(K,['Gross profit transferred to Profit & Loss A/c','सकल लाभ लाभ-हानि खाते में अंतरित'],'TRD','PL',GP);
  else two(K,['Gross loss transferred to Profit & Loss A/c','सकल हानि लाभ-हानि खाते में अंतरित'],'PL','TRD',-GP);
  two(K,['Operating expenses transferred to Profit & Loss A/c','परिचालन व्यय लाभ-हानि खाते में अंतरित'],'PL','OPX',OPEX);
  two(K,['Depreciation transferred to Profit & Loss A/c','मूल्यह्रास लाभ-हानि खाते में अंतरित'],'PL','DEP',DEP);
  two(K,['Interest transferred to Profit & Loss A/c','ब्याज लाभ-हानि खाते में अंतरित'],'PL','INT',INT);
  two(K,['Income tax transferred to Profit & Loss A/c','आयकर लाभ-हानि खाते में अंतरित'],'PL','TAX',TAX);
  if(NP>=0) two(K,['Net profit transferred to Capital Account','शुद्ध लाभ पूंजी खाते में अंतरित'],'PL','CAP',NP);
  else two(K,['Net loss transferred to Capital Account','शुद्ध हानि पूंजी खाते में अंतरित'],'CAP','PL',-NP);

  /* every journal entry must balance */
  J.forEach(j=>{ const d=j.lines.reduce((s,l)=>s+l[1],0), c=j.lines.reduce((s,l)=>s+l[2],0); if(d!==c) err(`Internal error: journal entry ${j.no} does not balance.`,`आंतरिक त्रुटि: जर्नल प्रविष्टि ${j.no} संतुलित नहीं है।`); });

  /* ---- Ledgers ---- */
  const raw = {}; ACC_ORDER.forEach(a=>raw[a]=[]);
  J.forEach(j=>j.lines.forEach(l=>{
    const opp = j.lines.length===2 ? j.lines.find(x=>x!==l)[0] : null;
    raw[l[0]].push({jn:j.no, when:j.when, dr:l[1], cr:l[2], opp});
  }));
  const ledgers = {};
  ACC_ORDER.forEach(a=>{
    const left=[], right=[]; let d=0, c=0;
    raw[a].forEach(x=>{ if(x.dr){ left.push({kind:'line',x,amt:x.dr}); d+=x.dr; } if(x.cr){ right.push({kind:'line',x,amt:x.cr}); c+=x.cr; } });
    const bal = d-c;
    if(bal>0){ right.push({kind:'bal',amt:bal}); c+=bal; } else if(bal<0){ left.push({kind:'bal',amt:-bal}); d+=-bal; }
    ledgers[a] = { left, right, totalDr:d, totalCr:c, bal, used: raw[a].length>0 };
  });

  /* ---- Trial balance: after all year's transactions, before closing entries ---- */
  const tb = [];
  ACC_ORDER.forEach(a=>{
    let d=0,c=0; raw[a].forEach(x=>{ if(x.when!==K){ d+=x.dr; c+=x.cr; } });
    const b=d-c; if(b) tb.push({acc:a, dr:b>0?b:0, cr:b<0?-b:0});
  });
  const tbDr = tb.reduce((s,r)=>s+r.dr,0), tbCr = tb.reduce((s,r)=>s+r.cr,0);

  /* ---- Statements, read back from the ledgers (not from the inputs) ---- */
  const sd = (a,f) => raw[a].filter(f).reduce((s,x)=>s+x.dr,0);
  const sc = (a,f) => raw[a].filter(f).reduce((s,x)=>s+x.cr,0);
  const notK = x=>x.when!==K, isK = x=>x.when===K, isO = x=>x.when==='open';
  const st = { sales:sc('SAL',notK), openStock:sd('STK',isO), purchases:sd('PUR',notK), closeStock:sd('STK',isK),
               opex:sd('OPX',notK), dep:sd('DEP',notK), int:sd('INT',notK), tax:sd('TAX',notK) };
  st.cos = st.openStock + st.purchases - st.closeStock;
  st.gp = st.sales - st.cos; st.ebitda = st.gp - st.opex; st.pbt = st.ebitda - st.dep - st.int; st.np = st.pbt - st.tax;
  const bal = a => ledgers[a].bal;
  const bsBook = { netFixedAssets:bal('FA'), inventory:bal('STK'), receivables:bal('DR'), cashBank:bal('CASH'), otherCurrentAssets:bal('OCA'),
                   netWorth:-bal('CAP'), termLoanOS:-bal('TL'), wcBorrowingOS:-bal('WC'), tradeCreditors:-bal('CR'), otherCurrentLiab:-bal('OCL') };
  const nominalClosed = ['SAL','PUR','OPX','DEP','INT','TAX','TRD','PL'].every(a=>bal(a)===0);

  const tally = [];
  const T = (key, book, decl) => tally.push({key, book, decl, ok: book===decl});
  T('sales',st.sales,P.sales); T('costOfSales',st.cos,P.costOfSales); T('operatingExpenses',st.opex,P.operatingExpenses);
  T('depreciation',st.dep,P.depreciation); T('interestPaid',st.int,P.interestPaid); T('netProfit',st.np,P.netProfit);
  H_BS.forEach(k=>T(k,bsBook[k],C[k]));
  const tallyOk = tally.every(t=>t.ok) && tbDr===tbCr && nominalClosed;
  if(!tallyOk) err('Internal error: the books do not tally with the declared statements.','आंतरिक त्रुटि: बहीखाते घोषित विवरणों से मेल नहीं खा रहे।');

  res.journal=J; res.ledgers=ledgers; res.tb=tb; res.tbDr=tbDr; res.tbCr=tbCr; res.stmt=st; res.bsBook=bsBook; res.tally=tally; res.tallyOk=tallyOk;
  res.derived = { purchases, cashSales, creditSales, collections, creditPurch, cashPurch, payments, opexCash, addFA, dTL, dWC, dOCA, dOCL, tax:TAX, equityMove:E, cs, cp };
  res.openingAssumed = !y.openLinked && h.openingAssumed;
  res.ok = res.errors.length===0;
  return res;
}

function buildBooks(p){
  const h = getHistory(p);
  const out = { enabled: !!(h.enabled && p.borrower && p.borrower.existing==='Existing'), years:[], errors:[], ok:false, h };
  if(!out.enabled) return out;
  if(h.source==='bank') return buildBankBooks(p);
  if(h.source==='fs') return buildFsBooks(p);
  if(!(R((p.actuals||{}).sales)>0)){
    out.errors.push({en:"Enter last year's actual figures (Sales etc.) above first — the books are built from them.", hi:'पहले ऊपर पिछले वर्ष के वास्तविक आंकड़े (बिक्री आदि) दर्ज करें — बहीखाते उन्हीं से बनते हैं।'});
    return out;
  }
  out.years = histYearsOf(p).map(y=>buildYearBooks(y,h));
  out.years.forEach(r=>r.errors.forEach(e=>out.errors.push(e)));
  out.ok = out.errors.length===0;
  return out;
}

/* ---------- One-click fix: set Net Worth = Assets - outside liabilities for a given statement ---------- */
function fixBalanceSheet(set){
  if(currentScreenRenderer===renderWizard) persistWizardStep();
  const h = getHistory(current);
  const o = set==='actuals' ? current.actuals : h[set];
  o.netWorth = R(o.netFixedAssets)+R(o.inventory)+R(o.receivables)+R(o.cashBank)+R(o.otherCurrentAssets)
             - R(o.termLoanOS)-R(o.wcBorrowingOS)-R(o.tradeCreditors)-R(o.otherCurrentLiab);
  if(set==='opening') h.openingAssumed = false;
  if(currentScreenRenderer===drawReport) window._reportCalc = calculate(current);
  if(currentScreenRenderer) currentScreenRenderer();
}
