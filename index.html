<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SHG Records & Accounting Suite</title>
<style>
:root{
  --navy:#12283F;
  --navy-2:#1B3A5C;
  --navy-3:#234A73;
  --bg:#EEF2F6;
  --card:#FFFFFF;
  --border:#D9E1E8;
  --text:#1B2733;
  --muted:#5B6B7A;
  --green:#1B7A4C;
  --green-bg:#E5F4EC;
  --amber:#A6650C;
  --amber-bg:#FBF0DD;
  --red:#B23A3A;
  --red-bg:#FBE9E9;
  --accent:#2E6F9E;
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;}
h1,h2,h3,h4{margin:0 0 8px 0;font-weight:600;letter-spacing:-0.01em;}
a{color:var(--accent);}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:#F5F8FA;font-weight:600;color:var(--navy-2);position:sticky;top:0;}
tbody tr:hover{background:#F7FAFC;}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);}
.right{text-align:right;}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);}

/* ---- App shell ---- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:240px;flex-shrink:0;background:var(--navy);color:#DCE6EF;
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:40;
  transform:translateX(0);transition:transform .2s ease;
}
#sidebar .brand{padding:18px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1);}
#sidebar .brand b{color:#fff;font-size:16px;display:block;}
#sidebar .brand span{font-size:11.5px;color:#9FB4C8;}
#navlist{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;}
#navlist li{margin:1px 0;}
#navlist a{
  display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:6px;color:#C9D9E6;
  text-decoration:none;font-size:13.6px;cursor:pointer;
}
#navlist a:hover{background:rgba(255,255,255,.07);}
#navlist a.active{background:var(--navy-3);color:#fff;font-weight:600;}
#navlist .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#7C93A8;margin:12px 10px 4px;}
#sidebar .foot{padding:10px 14px;font-size:10.5px;color:#7C93A8;border-top:1px solid rgba(255,255,255,.1);}
#main{margin-left:240px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;
}
#topbar .shgname{font-weight:700;color:var(--navy);font-size:15px;}
#topbar .quickstats{display:flex;gap:16px;margin-left:auto;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
#topbar .quickstats b{color:var(--text);font-family:var(--mono);}
#hamburger{display:none;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;cursor:pointer;}
#content{padding:18px 20px 60px;max-width:1180px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h3{color:var(--navy-2);font-size:14.5px;margin-bottom:10px;}
.grid{display:grid;gap:12px;}
.grid.cols4{grid-template-columns:repeat(4,1fr);}
.grid.cols3{grid-template-columns:repeat(3,1fr);}
.grid.cols2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols4{grid-template-columns:repeat(2,1fr);}.grid.cols3{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.stat .val{font-size:19px;font-weight:700;color:var(--navy);font-family:var(--mono);}
.stat .val.neg{color:var(--red);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.grey{background:#EEF1F4;color:var(--muted);}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--navy-3);
  background:var(--navy-2);color:#fff;cursor:pointer;font-weight:600;font-size:13.5px;
}
.btn:hover{background:var(--navy-3);}
.btn.secondary{background:#fff;color:var(--navy-2);border-color:var(--border);}
.btn.secondary:hover{background:#F5F8FA;}
.btn.danger{background:var(--red);border-color:var(--red);}
.btn.small{padding:4px 9px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.field{margin-bottom:11px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:150px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--navy-2);border-bottom-color:var(--navy-2);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.msg{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;}
.msg.err{background:var(--red-bg);color:var(--red);}
.msg.ok{background:var(--green-bg);color:var(--green);}
.msg.info{background:#E7F0F8;color:var(--navy-3);}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;}
.qcard{border:1px solid var(--border);border-radius:8px;padding:11px 13px;background:#fff;}
.qcard .status{font-size:12px;font-weight:700;}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:20px;}
.modal .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.dot.green{background:var(--green);}.dot.amber{background:var(--amber);}.dot.red{background:var(--red);}
.helpbox{background:#F5F8FA;border:1px dashed var(--border);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:12px;}
footer.byline{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 6px;}
#sidebarScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebarScrim.show{display:block;}
  #main{margin-left:0;}
  #hamburger{display:block;}
  .grid.cols4,.grid.cols3,.grid.cols2{grid-template-columns:1fr 1fr;}
  #content{padding:14px 12px 60px;}
}
::-webkit-scrollbar{height:9px;width:9px;}
::-webkit-scrollbar-thumb{background:#c5d0da;border-radius:5px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebarScrim" onclick="closeSidebar()"></div>
  <nav id="sidebar">
    <div class="brand"><b>SHG Suite</b><span>Records · Accounting · Grading</span></div>
    <ul id="navlist"></ul>
    <div class="foot">Offline-first. Data stored on this device only.</div>
  </nav>
  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="shgname" id="topShgName">SHG</div>
      <div class="quickstats" id="topStats"></div>
      <div id="langToggle" style="margin-left:10px;flex-shrink:0"></div>
    </div>
    <div id="content"></div>
    <footer class="byline">Developed by Anil Sharma, Former General Manager, Central Bank of India.</footer>
  </div>
</div>
<div id="modalRoot"></div>

/* ---------------- Utilities ---------------- */
function rupee(n){
  n = Math.round((n||0)*100)/100;
  const neg = n<0; n=Math.abs(n);
  let parts = n.toFixed(2).split('.');
  let intPart = parts[0];
  let last3 = intPart.slice(-3);
  let rest = intPart.slice(0,-3);
  if(rest!=='') rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
  return (neg?'-':'') + '₹' + rest + last3 + '.' + parts[1];
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return String(dt.getDate()).padStart(2,'0')+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+dt.getFullYear();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthKey(d){ return (d||todayStr()).slice(0,7); }

/* ---------------- Transaction Engine (double entry) ---------------- */
function postTxn(t){
  // t: {date, type, debit, credit, amount, memberId, loanId, narration, meetingId, category}
  if(!t.date) throw new Error('Date is required.');
  if(isPeriodClosed(t.date)) throw new Error('Period '+monthKey(t.date)+' is closed. Reopen it in Settings to post here.');
  if(!ACCOUNTS[t.debit] && !t.debit.startsWith('EXP_')) throw new Error('Unknown debit account: '+t.debit);
  if(!ACCOUNTS[t.credit] && !t.credit.startsWith('EXP_')) throw new Error('Unknown credit account: '+t.credit);
  if(t.debit===t.credit) throw new Error('Debit and credit accounts must be different — "'+accountLabel(t.debit)+'" was selected on both sides.');
  const amt = Math.round((parseFloat(t.amount)||0)*100)/100;
  if(amt<=0) throw new Error('Amount must be greater than zero.');
  const txn = {
    id: nextId('TXN'),
    date: t.date,
    voucherNo: t.voucherNo || nextId('V'),
    type: t.type||'Journal',
    debit: t.debit, credit: t.credit, amount: amt,
    memberId: t.memberId||'', loanId: t.loanId||'', bankLoanId: t.bankLoanId||'', meetingId: t.meetingId||'',
    narration: t.narration||'',
    createdBy: DB.settings.currentUserName, createdAt: nowStamp(),
    modifiedBy:'', modifiedAt:'',
    reversed:false, reversalOf: t.reversalOf||'',
    demo: !!DEMO_MODE
  };
  DB.transactions.push(txn);
  logAudit('POST_TXN', txn.voucherNo+' Dr '+txn.debit+' / Cr '+txn.credit+' '+rupee(amt));
  return txn;
}
function reverseTxn(id, reason){
  const orig = DB.transactions.find(x=>x.id===id);
  if(!orig) throw new Error('Transaction not found.');
  if(orig.reversed) throw new Error('Already reversed.');
  const rev = postTxn({date: todayStr(), type:'Reversal', debit:orig.credit, credit:orig.debit,
    amount:orig.amount, memberId:orig.memberId, loanId:orig.loanId, bankLoanId:orig.bankLoanId, meetingId:orig.meetingId,
    narration:'Reversal of '+orig.voucherNo+(reason?(' — '+reason):''), reversalOf:orig.id});
  orig.reversed = true;
  orig.modifiedBy = DB.settings.currentUserName; orig.modifiedAt = nowStamp();
  logAudit('REVERSE_TXN', 'Reversed '+orig.voucherNo+' via '+rev.voucherNo+(reason?(' — '+reason):''));
  saveDB();
  return rev;
}
function accountType(code){
  if(code.startsWith('EXP_')) return 'expense';
  return ACCOUNTS[code] ? ACCOUNTS[code].type : 'asset';
}
function accountLabel(code){
  if(code.startsWith('EXP_')) return 'Expense: '+code.slice(4);
  return ACCOUNTS[code] ? ACCOUNTS[code].label : code;
}
// Ledger balance for an account, optionally filtered by memberId/loanId/date range
function ledgerMovement(code, opts){
  opts = opts||{};
  let dr=0, cr=0;
  for(const t of DB.transactions){
    if(opts.upToDate && t.date > opts.upToDate) continue;
    if(opts.fromDate && t.date < opts.fromDate) continue;
    if(opts.memberId && t.memberId!==opts.memberId) continue;
    if(opts.loanId && t.loanId!==opts.loanId) continue;
    if(opts.bankLoanId && t.bankLoanId!==opts.bankLoanId) continue;
    if(t.debit===code) dr += t.amount;
    if(t.credit===code) cr += t.amount;
  }
  return {dr,cr};
}
function accountBalance(code, opts){
  const {dr,cr} = ledgerMovement(code,opts);
  const type = accountType(code);
  const normalDebit = (type==='asset'||type==='expense');
  // Opening cash/bank balances are posted as real double-entry vouchers (see postOpeningBalances),
  // Debit Cash/Bank, Credit SHG Fund — so no separate adjustment is needed here. This keeps the
  // Trial Balance and Balance Sheet correct by construction rather than by a hidden add-on.
  return normalDebit ? (dr-cr) : (cr-dr);
}
// Posts (or re-posts) the SHG's opening cash/bank balances as a proper journal entry:
// Debit Cash/Bank, Credit SHG Fund/Capital — dated as given. Any previous opening-balance
// entries are reversed first (never deleted) so the audit trail stays intact.
function postOpeningBalances(cashAmt, bankAmt, date){
  date = date || todayStr();
  DB.transactions.filter(t=>t.type==='Opening Balance' && !t.reversed).forEach(t=>{
    try{ reverseTxn(t.id, 'Superseded by revised opening balance'); }catch(e){}
  });
  cashAmt = parseFloat(cashAmt)||0; bankAmt = parseFloat(bankAmt)||0;
  if(cashAmt>0) postTxn({date, type:'Opening Balance', debit:'CASH', credit:'SHG_FUND', amount:cashAmt, narration:'Opening cash balance'});
  if(bankAmt>0) postTxn({date, type:'Opening Balance', debit:'BANK', credit:'SHG_FUND', amount:bankAmt, narration:'Opening bank balance'});
  DB.settings.openingCash = cashAmt; DB.settings.openingBank = bankAmt; DB.settings.openingDate = date;
}
function allLedgerCodes(){
  const codes = Object.keys(ACCOUNTS).slice();
  const exp = new Set();
  DB.transactions.forEach(t=>{ if(t.debit.startsWith('EXP_')) exp.add(t.debit); if(t.credit.startsWith('EXP_')) exp.add(t.credit); });
  DB.expenseCategories.forEach(c=>exp.add('EXP_'+c));
  return codes.concat(Array.from(exp).sort());
}

/* ---------------- Member helpers ---------------- */
function memberSavingsBalance(id){ return accountBalance('MEMBER_SAVINGS',{memberId:id}); }
function memberLoanOutstanding(id){
  let total=0;
  DB.loans.filter(l=>l.memberId===id && l.status!=='Closed').forEach(l=>{ total += loanOutstanding(l.id).principal; });
  return total;
}
// Loan sub-ledger: principal outstanding is derived from the same double-entry ledger used
// everywhere else (Debit Member Loans on disbursement, Credit on repayment), filtered to this
// loan's transactions — so a reversed repayment nets out correctly instead of being summed
// ad hoc. This is the one place loan principal is calculated; every screen reads from here.
function loanOutstanding(loanId){
  const loan = DB.loans.find(l=>l.id===loanId);
  if(!loan) return {principal:0, interestPaid:0};
  const principal = Math.max(0, accountBalance('MEMBER_LOANS',{loanId}));
  const interestPaid = Math.max(0, accountBalance('INTEREST_INCOME',{loanId}));
  return {principal, interestPaid};
}
// Builds a transparent, instalment-wise repayment schedule for one loan: due dates, principal
// and interest due per instalment, and how much of each has actually been paid — so "loan
// outstanding" is never just a running sum, it is reconciled against a real schedule.
function generateLoanSchedule(loanId, asOfDate){
  asOfDate = asOfDate || todayStr();
  const loan = DB.loans.find(l=>l.id===loanId);
  // Defensive: a loan record missing its own required terms (principal, disbursement date)
  // cannot have a schedule computed — return empty rather than crash, and let Data Quality
  // flag the missing fields so they get corrected at the source.
  if(!loan || !loan.principal || !loan.disbursementDate || isNaN(new Date(loan.disbursementDate+'T00:00:00').getTime())) return [];
  const n = Math.max(1, loan.instalments||1);
  const method = loan.interestMethod || 'flat';
  const principalPerInst = Math.round((loan.principal/n)*100)/100;
  const totalFlatInterest = Math.round(loan.principal*(loan.interestRate||0)/100 * (n/12)*100)/100;
  // Actual repayments against this loan, oldest first, split into principal and interest legs.
  const repayTx = DB.transactions.filter(t=>t.loanId===loanId && !t.reversed && t.credit==='MEMBER_LOANS').sort((a,b)=>a.date<b.date?-1:1);
  const interestTx = DB.transactions.filter(t=>t.loanId===loanId && !t.reversed && t.credit==='INTEREST_INCOME').sort((a,b)=>a.date<b.date?-1:1);
  let principalPool = repayTx.reduce((s,t)=>s+t.amount,0);
  let interestPool = interestTx.reduce((s,t)=>s+t.amount,0);
  let runningOutstanding = loan.principal;
  const schedule = [];
  const freq = loan.frequency || 'Monthly';
  const periodsPerYear = freq==='Weekly' ? 52 : (freq==='Fortnightly' ? 26 : 12);
  for(let i=1;i<=n;i++){
    const dueDate = addPeriod(loan.disbursementDate, i, freq);
    const principalDue = (i===n) ? Math.round((loan.principal - principalPerInst*(n-1))*100)/100 : principalPerInst;
    const interestDue = method==='reducing'
      ? Math.round(runningOutstanding*(loan.interestRate||0)/100/periodsPerYear*100)/100
      : Math.round((totalFlatInterest/n)*100)/100;
    const principalPaid = Math.min(principalDue, Math.max(0,principalPool));
    const interestPaid = Math.min(interestDue, Math.max(0,interestPool));
    principalPool -= principalPaid; interestPool -= interestPaid;
    runningOutstanding = Math.max(0, runningOutstanding - principalDue);
    let status;
    const fullyPaid = principalPaid>=principalDue-0.5 && interestPaid>=interestDue-0.5;
    const partiallyPaid = (principalPaid>0 || interestPaid>0) && !fullyPaid;
    if(fullyPaid) status='Paid';
    else if(partiallyPaid) status = (dueDate<asOfDate ? 'Partially Paid (Overdue)' : 'Partially Paid');
    else status = (dueDate<asOfDate ? 'Overdue' : 'Due');
    schedule.push({inst:i, dueDate, principalDue, interestDue, totalDue:Math.round((principalDue+interestDue)*100)/100,
      principalPaid, interestPaid, balance: Math.round(((principalDue-principalPaid)+(interestDue-interestPaid))*100)/100, status});
  }
  return schedule;
}
// Everything the Meeting module needs to know about ALL of one member's active loans, as on
// a given date (defaults to today) rather than always "as of now" — so a meeting dated
// earlier than today shows the position that actually applied on that date. A member can hold
// several independent loans at once; this returns one entry per loan, never a merged figure.
// "Due now" is the oldest unpaid/overdue instalment on that loan; "arrears" is anything
// overdue on that loan before that.
function memberDueInfos(memberId, asOfDate){
  asOfDate = asOfDate || todayStr();
  return DB.loans.filter(l=>l.memberId===memberId && l.status!=='Closed').map(loan=>{
    const schedule = generateLoanSchedule(loan.id, asOfDate);
    const dueRows = schedule.filter(s=>s.status!=='Paid' && s.dueDate<=asOfDate);
    // "Current instalment" = the most recent instalment that has fallen due; every earlier
    // unpaid instalment is arrears. Principal and interest are kept separate all the way
    // through so "Total Principal Due" and "Total Interest Due" never get blended into one
    // opaque figure — Total Amount Due is always exactly their sum, never a separate estimate.
    const current = dueRows.length ? dueRows[dueRows.length-1] : null;
    const arrearsRows = dueRows.length>1 ? dueRows.slice(0,-1) : [];
    const arrearsPrincipal = Math.round(arrearsRows.reduce((s,r)=>s+Math.max(0,r.principalDue-r.principalPaid),0)*100)/100;
    const arrearsInterest = Math.round(arrearsRows.reduce((s,r)=>s+Math.max(0,r.interestDue-r.interestPaid),0)*100)/100;
    const arrears = Math.round((arrearsPrincipal+arrearsInterest)*100)/100;
    const principalDue = current ? Math.max(0, Math.round((current.principalDue-current.principalPaid)*100)/100) : 0;
    const interestDue = current ? Math.max(0, Math.round((current.interestDue-current.interestPaid)*100)/100) : 0;
    const totalPrincipalDue = Math.round((principalDue+arrearsPrincipal)*100)/100;
    const totalInterestDue = Math.round((interestDue+arrearsInterest)*100)/100;
    const fullySettled = schedule.every(s=>s.status==='Paid');
    return { loan, outstanding: loanOutstanding(loan.id).principal,
      principalDue, interestDue, arrears, arrearsPrincipal, arrearsInterest,
      totalPrincipalDue, totalInterestDue, fullySettled,
      totalDue: Math.round((totalPrincipalDue+totalInterestDue)*100)/100 };
  });
}
// Single-loan convenience wrapper, used only where a member is already known to have at most
// one loan in context (e.g. a report cell). The Meeting module always uses memberDueInfos().
function memberDueInfo(memberId, asOfDate){ return memberDueInfos(memberId, asOfDate)[0] || null; }

/* ---------------- Central engine aliases ----------------
   Thin named wrappers only — each calls the one real implementation above, so there is
   never a second, independently-maintained copy of any calculation. */
function calculateLoanOutstanding(loanId){ return loanOutstanding(loanId); }
function calculateInterest(loanId){ return generateLoanSchedule(loanId); }
function calculateSavings(memberId){ return memberSavingsBalance(memberId); }
function calculateCIFOutstanding(){ return cifOutstanding(); }
function calculateCashBalance(){ return accountBalance('CASH'); }
// Central corpus calculation — the SHG's own internal fund base (member savings, accumulated
// surplus/Capital Fund, and CIF), used both in the Balance Sheet's Notes to Accounts and in
// the Bank Loan Application generator's eligibility calculation, so the two always agree.
function calculateCorpus(){
  const savings = DB.members.reduce((s,m)=>s+memberSavingsBalance(m.id),0);
  const fund = accountBalance('SHG_FUND');
  const cumulativeSurplus = incomeExpenditure('1900-01-01', todayStr()).surplus;
  const capitalFund = Math.round((fund+cumulativeSurplus)*100)/100;
  const cif = accountBalance('CIF');
  const revolvingFund = accountBalance('REVOLVING_FUND');
  return { savings, capitalFund, cif, revolvingFund, total: Math.round((savings+capitalFund+cif+revolvingFund)*100)/100 };
}

function translateNode(root){
  if(!root || (DB.settings.language||'en')!=='hi') return;
  root.querySelectorAll('[placeholder]').forEach(el=>{
    const key = (el.getAttribute('placeholder')||'').trim();
    if(TRANSLATIONS[key]) el.setAttribute('placeholder', TRANSLATIONS[key]);
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while(n = walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    const trimmed = node.nodeValue.trim();
    if(!trimmed) return;
    if(TRANSLATIONS[trimmed]) node.nodeValue = node.nodeValue.replace(trimmed, TRANSLATIONS[trimmed]);
  });
}

function tbl(headers, rows){
  let h = `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{ h+= '<tr>' + r.map(c=>{
      if(typeof c==='string' && c.startsWith('§R§')) return `<td class="num">${c.slice(3)}</td>`;
      return `<td>${c}</td>`;
    }).join('') + '</tr>'; });
  h += '</tbody></table></div>';
  return h;
}

function saveMember(ev,id){
  ev.preventDefault(); const f=new FormData(ev.target);
  const data = Object.fromEntries(f.entries());
  if(id){
    Object.assign(DB.members.find(x=>x.id===id), data);
    logAudit('EDIT_MEMBER', id+' updated');
  } else {
    const dup = DB.members.some(x=>x.name.trim().toLowerCase()===data.name.trim().toLowerCase() && x.fatherHusband.trim().toLowerCase()===(data.fatherHusband||'').trim().toLowerCase());
    const newId = nextId('MEM');
    DB.members.push(Object.assign({id:newId}, data));
    logAudit('ADD_MEMBER', newId+' '+data.name+(dup?' (possible duplicate name)':''));
  }
  closeModal(); flash('ok','Member saved.'); render(); return false;
}

/* ============================================================ MEETINGS (guided workflow) */
function viewMeetings(){
  let html = `<div class="section-title"><h2>SHG Meetings</h2><div class="row"><button class="btn secondary" onclick="depositToBankForm()">Transfer Funds</button><button class="btn" onclick="go('meetingnew')">+ Conduct New Meeting</button></div></div>`;
  html += `<div class="card">`;
  html += DB.meetings.length ? tbl(['Date','Attendance','Savings','Principal','Interest','Fine','Total Collection','New Loans','Expenses','Deposit Made','Recon.','Status',''],
    DB.meetings.slice().reverse().map(mt=>{
      const pct = mt.totalMembers ? Math.round(mt.present/mt.totalMembers*100) : 0;
      // Older meetings (before principal/interest were split) only have a combined totals.repayment.
      const principal = mt.totals.principal!=null ? mt.totals.principal : (mt.totals.repayment||0);
      const interest = mt.totals.interest!=null ? mt.totals.interest : 0;
      const totalCollection = Math.round((mt.totals.savings+principal+interest+mt.totals.fines)*100)/100;
      let recon = '<span class="hint">—</span>';
      if(mt.actualReceived!=null){
        const diff = Math.round((mt.actualReceived-totalCollection)*100)/100;
        recon = diff===0 ? badge('Matched','green') : badge(rupee(Math.abs(diff))+(diff>0?' extra':' short'),'amber');
      }
      return [fmtDate(mt.date), mt.present+'/'+mt.totalMembers+' ('+pct+'%)',
      rightCell(rupee(mt.totals.savings)), rightCell(rupee(principal)), rightCell(rupee(interest)), rightCell(rupee(mt.totals.fines)),
      rightCell('<b>'+rupee(totalCollection)+'</b>'), rightCell(rupee(mt.totals.newLoans)),
      rightCell(rupee(mt.totals.expenses)), mt.bankDeposit&&mt.bankDeposit.amount?rightCell(rupee(mt.bankDeposit.amount)):'—',
      recon, badge('Posted','green'),
      `${mt.absentIds?`<button class="btn small secondary" onclick="viewAttendance('${mt.id}')">Attendance</button> `:''}<button class="btn small secondary" onclick="viewMeetingDetail('${mt.id}')">Details</button>`];
    })) :
    `<div class="empty">No meetings recorded yet.</div>`;
  html += `</div>`;
  if(ROUTE==='meetingnew') html += meetingWorkflow();
  return html;
}
function viewAttendance(meetingId){

// Reconstructs BOTH a member-wise and a loan-wise breakdown of one posted meeting straight
// from the transaction ledger (grouped by meetingId), never from a separately-stored summary
// — so it can never drift from the actual postings, and each loan's contribution stays visible
// even when a member repaid more than one loan in the same meeting.
function viewMeetingDetail(meetingId){
  const mt = DB.meetings.find(x=>x.id===meetingId); if(!mt) return;
  const txns = DB.transactions.filter(t=>t.meetingId===meetingId);
  const memberIds = Array.from(new Set(txns.map(t=>t.memberId).filter(Boolean)));
  const memberRows = memberIds.map(mid=>{
    const mine = txns.filter(t=>t.memberId===mid);
    const sav = mine.filter(t=>t.credit==='MEMBER_SAVINGS').reduce((s,t)=>s+t.amount,0);
    const prin = mine.filter(t=>t.credit==='MEMBER_LOANS').reduce((s,t)=>s+t.amount,0);
    const int_ = mine.filter(t=>t.credit==='INTEREST_INCOME').reduce((s,t)=>s+t.amount,0);
    const fine = mine.filter(t=>t.credit==='FINE_INCOME').reduce((s,t)=>s+t.amount,0);
    return [esc(memberName(mid)), rightCell(rupee(sav)), rightCell(rupee(prin+int_)), rightCell(rupee(fine)), rightCell('<b>'+rupee(sav+prin+int_+fine)+'</b>')];
  });
  const loanTx = txns.filter(t=>t.loanId && (t.credit==='MEMBER_LOANS'||t.credit==='INTEREST_INCOME'));
  const loanIds = Array.from(new Set(loanTx.map(t=>t.loanId)));
  const loanRows = loanIds.map(lid=>{
    const mine = loanTx.filter(t=>t.loanId===lid);
    const prin = mine.filter(t=>t.credit==='MEMBER_LOANS').reduce((s,t)=>s+t.amount,0);
    const int_ = mine.filter(t=>t.credit==='INTEREST_INCOME').reduce((s,t)=>s+t.amount,0);
    const memberId = mine[0].memberId;
    return [esc(memberName(memberId)), lid, rightCell(rupee(prin)), rightCell(rupee(int_)), rightCell('<b>'+rupee(prin+int_)+'</b>'), rightCell(rupee(loanOutstanding(lid).principal))];
  });
  const nonMember = txns.filter(t=>!t.memberId);
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Meeting Details — ${fmtDate(mt.date)}</h3>
    <p class="hint">Present: ${mt.present}/${mt.totalMembers}${mt.postedBy?(' · Posted by '+esc(mt.postedBy)+(mt.postedAt?(' on '+fmtDate(mt.postedAt.slice(0,10))):'')):''}</p>
    <h4>Member-wise</h4>${memberRows.length ? tbl(['Member','Savings','Loan Repayment','Fine','Total'], memberRows) : '<div class="empty">No member-wise transactions.</div>'}
    ${loanRows.length ? `<h4 style="margin-top:12px">Loan-wise</h4>${tbl(['Member','Loan ID','Principal','Interest','Total','Loan O/S Now'], loanRows)}` : ''}
    ${nonMember.length ? `<h4 style="margin-top:12px">Other Entries (New Loan / Expenses)</h4>${tbl(['Type','Debit','Credit','Amount','Narration'],
      nonMember.map(t=>[t.type, accountLabel(t.debit), accountLabel(t.credit), rightCell(rupee(t.amount)), esc(t.narration)]))}` : ''}
    ${mt.bankDeposit && mt.bankDeposit.amount ? `<div class="msg info" style="margin-top:10px">Cash of ${rupee(mt.bankDeposit.amount)} was deposited to bank as part of this meeting.</div>` : ''}`);
}
function meetingWorkflow(){

  const members = activeMembers();
  const today = todayStr();
  const dueList = [];
  members.forEach(m=> memberDueInfos(m.id, today).forEach(d=>{ if(d.totalDue>0.5) dueList.push({m,d}); }));

  let html = '';
  if(dueList.length){
    html += `<div class="card"><h3>Members with Repayment Due (${dueList.length} loan(s))</h3>
      ${tbl(['Member','Loan ID','Current Instalment (P+I)','Arrears (P+I)','Total Principal Due','Total Interest Due','Total Amount Due'],
        dueList.map(x=>[esc(x.m.name), x.d.loan.id,
          rightCell(rupee(x.d.principalDue)+' + '+rupee(x.d.interestDue)),
          rightCell(x.d.arrears>0?(rupee(x.d.arrearsPrincipal)+' + '+rupee(x.d.arrearsInterest)):'—'),
          rightCell(rupee(x.d.totalPrincipalDue)), rightCell(rupee(x.d.totalInterestDue)),
          rightCell('<b>'+rupee(x.d.totalDue)+'</b>')]))}
      <p class="hint" style="margin-top:6px">Total Principal Due + Total Interest Due always equals Total Amount Due. As on today — expand a member below and use "Fill Due Amounts" to apply these to the grid; changing the meeting date recalculates as on that date.</p>
    </div>`;
  }

  html += `<div class="card"><h3>Conduct Meeting</h3>
  <div class="helpbox">Enter savings, fines, and each loan's repayment directly here — this is the only place repayments need to be entered. A member with more than one loan repays each loan separately below; nothing needs to be entered twice.</div>
  <form onsubmit="return postMeeting(event)">
  <div class="row">

  html += `<div class="grid cols4" style="margin-top:10px">
    <div class="stat"><div class="lbl">Total Savings</div><div class="val" id="meetingTotSav">₹0.00</div></div>
    <div class="stat"><div class="lbl">Total Principal</div><div class="val" id="meetingTotPrin">₹0.00</div></div>
    <div class="stat"><div class="lbl">Total Interest</div><div class="val" id="meetingTotInt">₹0.00</div></div>
    <div class="stat"><div class="lbl">Total Fines</div><div class="val" id="meetingTotFine">₹0.00</div></div>
  </div>
  <div class="grid cols3" style="margin-top:10px">
    <div class="stat"><div class="lbl">Present / Saving / Repaying / Multi-Loan</div><div class="val" id="meetingCounts" style="font-size:13px">—</div></div>
    <div class="stat"><div class="lbl">Total Collection</div><div class="val" id="meetingGrandTotal">₹0.00</div></div>
    <div class="stat"><div class="lbl">Net Collection (after new loans &amp; expenses)</div><div class="val" id="meetingNetCollection">₹0.00</div></div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="field"><label>Actual Cash/Bank Counted Today ₹ (optional)</label><input type="number" min="0" step="0.01" name="actualReceived" id="actualReceived" oninput="meetingCalcGrandTotal()"></div>
  </div>
  <div class="hint" id="meetingReconDiff"></div>
  <div class="field" style="margin-top:10px"><label style="display:flex;align-items:center;gap:6px;font-weight:normal"><input type="checkbox" name="allowExcess" id="allowExcessChk" onchange="toggleAdjustmentReason()" style="width:auto"> Allow a loan's principal or interest payment to exceed the amount due (authorised adjustment)</label></div>
  <div class="field" id="adjustmentReasonField" style="display:none;margin-top:6px"><label>Reason for Authorised Adjustment *</label><input name="adjustmentReason" placeholder="e.g. advance interest paid by member, rounding settlement"></div>
  <h3 style="margin-top:16px">New Loan Disbursed at this Meeting (optional)</h3>
  <div class="row">

    </div>
    <div class="row">
      <div class="field"><label>Deposit / Reference No.</label><input name="depositRef"></div>
      <div class="field"><label>Remarks</label><input name="depositRemarks"></div>
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn" type="submit">Review &amp; Post Meeting</button>
    <button class="btn secondary" type="button" onclick="go('meetings')">Cancel</button>
  </div>
  </form></div>`;
  return html;
}
// One member's card: Present/Savings/Fine at member level, plus an expandable per-loan grid
// (native <details>, so no JS is needed to show/hide, and field values still submit when
// collapsed). This is what keeps a 2-loan member's repayment unambiguous — every rupee typed
// goes into a specific loan's own Principal/Interest field, never a shared member-level box.
function renderMemberMeetingCard(m, asOfDate){
  const dues = memberDueInfos(m.id, asOfDate);
  const totalOS = dues.reduce((s,d)=>s+d.outstanding,0);
  const totalDue = dues.reduce((s,d)=>s+d.totalDue,0);
  let html = `<div class="card" id="mcard_${m.id}" style="margin-top:10px;padding:12px 14px">
    <div class="row" style="align-items:center;justify-content:space-between;margin-bottom:6px">
      <label style="display:flex;align-items:center;gap:7px;font-weight:600;color:var(--text)"><input type="checkbox" name="present_${m.id}" checked style="width:auto"> ${esc(m.name)}</label>
      <span class="hint">${dues.length?('Loans: '+dues.length+' · O/S '+rupee(totalOS)+(totalDue>0.5?(' · Due '+rupee(totalDue)):'')):'No active loan'}</span>
    </div>
    <div class="row">
      <div class="field"><label>Savings ₹</label><input type="number" min="0" step="0.01" name="sav_${m.id}" oninput="meetingCalcMemberRow('${m.id}')"></div>
      <div class="field"><label>Fine ₹</label><input type="number" min="0" step="0.01" name="fine_${m.id}" oninput="meetingCalcMemberRow('${m.id}')"></div>
      <div class="field"><label>Member Total</label><div class="num" id="mtotal_${m.id}" style="padding-top:8px;font-weight:600">₹0.00</div></div>
    </div>`;
  if(dues.length){
    html += `<details ${totalDue>0.5?'open':''} style="margin-top:6px">
      <summary style="cursor:pointer;font-weight:600;color:var(--navy-2);font-size:13.5px">Loan-wise Repayment (${dues.length} loan${dues.length>1?'s':''})</summary>
      <div class="row" style="margin-top:8px"><button type="button" class="btn small secondary" onclick="meetingAllocateDue('${m.id}')">Fill Due Amounts</button></div>
      <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Loan ID</th><th>Purpose</th><th>Rate %</th><th>Loan O/S</th><th>Principal Due</th><th>Interest Due</th><th>Arrears (P/I)</th><th>Principal Paid ₹</th><th>Interest Paid ₹</th><th>Loan Total</th><th>Balance</th></tr></thead><tbody>`;
    dues.forEach(d=>{
      html += `<tr>
        <td>${d.loan.id}</td><td>${esc(d.loan.purpose||'—')}</td><td class="num">${d.loan.interestRate}%</td>
        <td class="num">${rupee(d.outstanding)}</td>
        <td class="num" id="pd_${d.loan.id}">${rupee(d.principalDue)}</td>
        <td class="num" id="id_${d.loan.id}">${rupee(d.interestDue)}</td>
        <td class="num" id="ar_${d.loan.id}">${d.arrears>0?(rupee(d.arrearsPrincipal)+' / '+rupee(d.arrearsInterest)):'—'}</td>
        <td><input type="number" min="0" step="0.01" name="rp_${d.loan.id}" style="width:80px" oninput="meetingCalcLoanRow('${d.loan.id}','${m.id}')"></td>
        <td><input type="number" min="0" step="0.01" name="ri_${d.loan.id}" style="width:80px" oninput="meetingCalcLoanRow('${d.loan.id}','${m.id}')"></td>
        <td class="num" id="loantotal_${d.loan.id}">₹0.00</td>
        <td class="num" id="loanbal_${d.loan.id}">${d.totalDue>0.5?rupee(d.totalDue):'—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div></details>`;
  }
  html += `</div>`;
  return html;
}
// Fills every one of this member's loan rows with that loan's own due principal/interest —
// this is the "Allocate Due Amounts" convenience. Nothing is posted here; the user can still
// edit any figure before Review & Post, and manual entry (leaving this unused) is always the
// default — no repayment is ever assumed or auto-posted against an unspecified loan.
function meetingAllocateDue(mid){
  memberDueInfos(mid, (document.getElementById('meetingDate')||{}).value || todayStr()).forEach(d=>{
    const rpEl = document.querySelector('[name="rp_'+d.loan.id+'"]');
    const riEl = document.querySelector('[name="ri_'+d.loan.id+'"]');
    if(rpEl) rpEl.value = d.principalDue.toFixed(2);
    if(riEl) riEl.value = d.interestDue.toFixed(2);
  });
  meetingCalcMemberRow(mid);
}
function toggleDepositSection(){
  const mode = (document.getElementById('meetingMode')||{}).value;
  const sec = document.getElementById('depositSection');
  if(sec) sec.style.display = mode==='CASH' ? '' : 'none';
}
function toggleAdjustmentReason(){
  const chk = document.getElementById('allowExcessChk');
  const field = document.getElementById('adjustmentReasonField');
  if(field) field.style.display = (chk && chk.checked) ? '' : 'none';
}
// Recomputes every loan's Due columns as on the newly-selected meeting date — without a full
// page re-render, so amounts already typed into the grid are preserved.
function reloadMeetingDueDate(newDate){
  activeMembers().forEach(m=>{
    memberDueInfos(m.id, newDate||todayStr()).forEach(d=>{
      const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
      set('pd_'+d.loan.id, rupee(d.principalDue));
      set('id_'+d.loan.id, rupee(d.interestDue));
      set('ar_'+d.loan.id, d.arrears>0?(rupee(d.arrearsPrincipal)+' / '+rupee(d.arrearsInterest)):'—');
      set('loanbal_'+d.loan.id, d.totalDue>0.5?rupee(d.totalDue):'—');
    });
  });
  meetingCalcGrandTotal();
}
function meetingCalcLoanRow(loanId, mid){
  const val = name => parseFloat((document.querySelector('[name="'+name+'_'+loanId+'"]')||{}).value)||0;
  const rp = val('rp'), ri = val('ri');
  const cell = document.getElementById('loantotal_'+loanId);
  if(cell) cell.textContent = rupee(rp+ri);
  const loan = DB.loans.find(l=>l.id===loanId);
  const due = loan ? memberDueInfos(loan.memberId, (document.getElementById('meetingDate')||{}).value || todayStr()).find(d=>d.loan.id===loanId) : null;
  const balCell = document.getElementById('loanbal_'+loanId);
  if(balCell && due){
    const bal = Math.round((due.totalDue - rp - ri)*100)/100;
    balCell.textContent = bal>0.005 ? rupee(bal) : (bal<-0.005 ? (rupee(Math.abs(bal))+' over') : 'Cleared');
  }
  meetingCalcMemberRow(mid);
}
function meetingCalcMemberRow(mid){
  const sav = parseFloat((document.querySelector('[name="sav_'+mid+'"]')||{}).value)||0;
  const fine = parseFloat((document.querySelector('[name="fine_'+mid+'"]')||{}).value)||0;
  let loanTotal = 0;
  memberDueInfos(mid).forEach(d=>{
    loanTotal += (parseFloat((document.querySelector('[name="rp_'+d.loan.id+'"]')||{}).value)||0);
    loanTotal += (parseFloat((document.querySelector('[name="ri_'+d.loan.id+'"]')||{}).value)||0);
  });
  const total = Math.round((sav+fine+loanTotal)*100)/100;
  const cell = document.getElementById('mtotal_'+mid);
  if(cell) cell.textContent = rupee(total);
  meetingCalcGrandTotal();
}
function meetingCalcGrandTotal(){
  const sum = prefix => { let s=0; document.querySelectorAll('input[name^="'+prefix+'_"]').forEach(el=>s+=parseFloat(el.value)||0); return s; };
  const totSav = sum('sav'), totFine = sum('fine');
  let totRp=0, totRi=0;
  DB.loans.forEach(l=>{ totRp += parseFloat((document.querySelector('[name="rp_'+l.id+'"]')||{}).value)||0; totRi += parseFloat((document.querySelector('[name="ri_'+l.id+'"]')||{}).value)||0; });
  const grand = Math.round((totSav+totRp+totRi+totFine)*100)/100;
  const newLoanAmt = parseFloat((document.querySelector('[name="newloan_amount"]')||{}).value)||0;
  const expAmt = parseFloat((document.querySelector('[name="exp_amount"]')||{}).value)||0;
  const depositAmt = parseFloat((document.querySelector('[name="depositAmount"]')||{}).value)||0;
  const netCollection = Math.round((grand - newLoanAmt - expAmt - depositAmt)*100)/100;
  const setText = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent = rupee(v); };
  setText('meetingTotSav', totSav); setText('meetingTotPrin', totRp); setText('meetingTotInt', totRi); setText('meetingTotFine', totFine);
  setText('meetingGrandTotal', grand); setText('meetingNetCollection', netCollection);
  let present=0, saving=0, repaying=0, multiLoan=0;
  activeMembers().forEach(m=>{
    if((document.querySelector('[name="present_'+m.id+'"]')||{}).checked) present++;
    if((parseFloat((document.querySelector('[name="sav_'+m.id+'"]')||{}).value)||0)>0) saving++;
    const loans = DB.loans.filter(l=>l.memberId===m.id && l.status!=='Closed');
    if(loans.length>1) multiLoan++;
    if(loans.some(l=>(parseFloat((document.querySelector('[name="rp_'+l.id+'"]')||{}).value)||0)>0 || (parseFloat((document.querySelector('[name="ri_'+l.id+'"]')||{}).value)||0)>0)) repaying++;
  });
  const countsEl = document.getElementById('meetingCounts');
  if(countsEl) countsEl.textContent = present+' / '+saving+' / '+repaying+' / '+multiLoan;
  const actualEl = document.getElementById('actualReceived');
  const diffEl = document.getElementById('meetingReconDiff');
  if(actualEl && diffEl){
    if(actualEl.value!==''){
      const actual = parseFloat(actualEl.value)||0;
      const diff = Math.round((actual-grand)*100)/100;
      diffEl.textContent = diff===0 ? 'Matches the amount entered above.' : ('Difference from entries: '+rupee(Math.abs(diff))+(diff>0?' more counted than entered':' less counted than entered'));
      diffEl.style.color = diff===0 ? 'var(--green)' : 'var(--red)';
    } else { diffEl.textContent=''; }
  }
  return grand;
}
// Meeting posting is a two-pass, all-or-nothing process:
// PASS 1 (here): read and validate every field — every loan gets its own explicit Principal
//   Paid/Interest Paid, so a repayment is never posted against an unspecified or guessed loan.
//   Nothing is posted yet, so a mistake found on loan 8 never leaves loans 1–7 already posted.
// PASS 2 (confirmPostMeeting, after the user reviews the summary): only then are transactions
//   actually created, in one go.
let PENDING_MEETING_PLAN = null;
function postMeeting(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const date = f.get('date');
  const mode = f.get('mode');
  const allowExcess = !!f.get('allowExcess');
  const adjustmentReason = (f.get('adjustmentReason')||'').trim();
  if(!date){ flash('error','Meeting date is required.'); render(); return false; }
  if(isPeriodClosed(date)){ flash('error','That period is closed. Reopen it in Settings first.'); render(); return false; }
  const members = activeMembers();
  try{
    const memberEntries = [];
    let present=0; const presentIds=[], absentIds=[];
    let dupWarnings = [];
    let anyOverrideUsed = false;
    members.forEach(m=>{
      const isPresent = !!f.get('present_'+m.id);
      if(isPresent){ present++; presentIds.push(m.id); } else { absentIds.push(m.id); }
      const sav = parseFloat(f.get('sav_'+m.id))||0;
      const fine = parseFloat(f.get('fine_'+m.id))||0;
      if(sav<0||fine<0) throw new Error('Negative amounts are not allowed ('+m.name+'). Enter zero or a positive amount.');
      const loans = DB.loans.filter(l=>l.memberId===m.id && l.status!=='Closed');
      const loanRows = [];
      loans.forEach(loan=>{
        const rp = parseFloat(f.get('rp_'+loan.id))||0;
        const ri = parseFloat(f.get('ri_'+loan.id))||0;
        if(rp<0||ri<0) throw new Error('Negative amounts are not allowed on loan '+loan.id+' ('+m.name+').');
        if(rp===0 && ri===0) return;
        const due = memberDueInfos(m.id, date).find(d=>d.loan.id===loan.id);
        const outstanding = loanOutstanding(loan.id).principal;
        let override = false;
        if(rp > outstanding+0.5){
          if(!allowExcess) throw new Error('Principal repayment for '+m.name+' on loan '+loan.id+' ('+rupee(rp)+') exceeds that loan\'s outstanding balance ('+rupee(outstanding)+'). Reduce the amount, or tick the authorised-adjustment checkbox.');
          override = true;
        }
        // Interest is checked against interest due only (current + interest arrears) —
        // never against the combined principal+interest arrears figure, so this threshold
        // can't be silently inflated by unrelated principal arrears.
        const interestCeiling = due ? (due.interestDue+due.arrearsInterest) : 0;
        if(due && ri > interestCeiling+0.5 && interestCeiling>0){
          if(!allowExcess) throw new Error('Interest payment for '+m.name+' on loan '+loan.id+' ('+rupee(ri)+') exceeds the interest currently due on that loan ('+rupee(interestCeiling)+'). Reduce the amount, or tick the authorised-adjustment checkbox.');
          override = true;
        }
        if(override) anyOverrideUsed = true;
        // Cross-meeting duplicate check: the same loan already has an identical, un-reversed
        // repayment posted on the same date — warn (shown in the review screen) rather than block.
        const dupe = DB.transactions.some(t=>!t.reversed && t.loanId===loan.id && t.date===date && t.credit==='MEMBER_LOANS' && t.amount===rp && rp>0);
        if(dupe) dupWarnings.push(m.name+' — loan '+loan.id+': a principal repayment of '+rupee(rp)+' on '+fmtDate(date)+' already exists.');
        loanRows.push({loan, rp, ri, override});
      });
      if(sav>0||fine>0||loanRows.length) memberEntries.push({m, sav, fine, loanRows});
    });
    if(anyOverrideUsed && !adjustmentReason){
      throw new Error('At least one loan exceeds the amount due and the authorised-adjustment box is ticked, but no reason was entered. A reason is required for every authorised adjustment so it stays traceable in the audit trail and reports.');
    }

    let newLoan = null;
    const nlMember = f.get('newloan_member');
    if(nlMember){
      const amt = parseFloat(f.get('newloan_amount'))||0;
      if(amt>0){
        if(amt<0) throw new Error('New loan amount cannot be negative.');
        newLoan = { memberId:nlMember, purpose:f.get('newloan_purpose')||'', amount:amt,
          rate: parseFloat(f.get('newloan_rate'))||0, inst: parseInt(f.get('newloan_inst'))||12 };
      }
    }
    let expense = null;
    const expAmt = parseFloat(f.get('exp_amount'))||0;
    if(expAmt>0){ if(expAmt<0) throw new Error('Expense amount cannot be negative.'); expense = { cat:f.get('exp_cat'), amount:expAmt, narration:f.get('exp_narration')||f.get('exp_cat') }; }

    const totals = {
      savings: Math.round(memberEntries.reduce((s,r)=>s+r.sav,0)*100)/100,
      principal: Math.round(memberEntries.reduce((s,r)=>s+r.loanRows.reduce((s2,lr)=>s2+lr.rp,0),0)*100)/100,
      interest: Math.round(memberEntries.reduce((s,r)=>s+r.loanRows.reduce((s2,lr)=>s2+lr.ri,0),0)*100)/100,
      fines: Math.round(memberEntries.reduce((s,r)=>s+r.fine,0)*100)/100,
      newLoans: newLoan ? newLoan.amount : 0,
      expenses: expense ? expense.amount : 0
    };
    const totalCollection = Math.round((totals.savings+totals.principal+totals.interest+totals.fines)*100)/100;
    const netCash = mode==='CASH' ? Math.round((totalCollection - totals.newLoans - totals.expenses)*100)/100 : 0;

    let deposit = null;
    const depositAmount = parseFloat(f.get('depositAmount'))||0;
    if(depositAmount>0){
      if(mode!=='CASH') throw new Error('A bank deposit only applies when this meeting\'s collection mode is Cash.');
      const availableCash = Math.round((accountBalance('CASH')+netCash)*100)/100;
      if(depositAmount > availableCash+0.5) throw new Error('Deposit amount ('+rupee(depositAmount)+') exceeds cash available after this meeting ('+rupee(availableCash)+').');
      deposit = { amount:depositAmount, date: f.get('depositDate')||date, bankAccount: f.get('depositBank')||'', ref: f.get('depositRef')||'', remarks: f.get('depositRemarks')||'' };
    }

    const actualRaw = f.get('actualReceived');
    const actualReceived = (actualRaw!=null && actualRaw!=='') ? parseFloat(actualRaw) : null;
    const reconDiff = actualReceived!=null ? Math.round((actualReceived-totalCollection)*100)/100 : null;

    const savingCount = memberEntries.filter(r=>r.sav>0).length;
    const repayingCount = memberEntries.filter(r=>r.loanRows.length>0).length;
    const multiLoanRepayCount = memberEntries.filter(r=>r.loanRows.length>1).length;

    PENDING_MEETING_PLAN = { date, mode, allowExcess, adjustmentReason, anyOverrideUsed, memberEntries, newLoan, expense, deposit, actualReceived, reconDiff, dupWarnings,
      totals, totalCollection, netCash, present, totalMembers:members.length, presentIds, absentIds,
      savingCount, repayingCount, multiLoanRepayCount,
      dueCount: (()=>{ let c=0; members.forEach(m=>memberDueInfos(m.id,date).forEach(d=>{ if(d.totalDue>0.5) c++; })); return c; })() };
    showMeetingConfirmation();
  }catch(e){
    flash('error', e.message);
    render();
  }
  return false;
}
function showMeetingConfirmation(){
  const p = PENDING_MEETING_PLAN; if(!p) return;
  const memberRows = p.memberEntries.map(r=>{
    const loanTotal = r.loanRows.reduce((s,lr)=>s+lr.rp+lr.ri,0);
    return [esc(r.m.name), rightCell(rupee(r.sav)), rightCell(rupee(loanTotal)), rightCell(rupee(r.fine)), rightCell('<b>'+rupee(r.sav+loanTotal+r.fine)+'</b>')];
  });
  const loanRows = [];
  p.memberEntries.forEach(r=> r.loanRows.forEach(lr=>{ if(lr.rp>0||lr.ri>0) loanRows.push([esc(r.m.name), lr.loan.id, rightCell(rupee(lr.rp)), rightCell(rupee(lr.ri)), rightCell('<b>'+rupee(lr.rp+lr.ri)+'</b>'), lr.override?badge('Adjustment','amber'):'']); }));
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Meeting Summary — ${fmtDate(p.date)}</h3>
    <div class="grid cols2">
      ${stat('Members Present', p.present+' / '+p.totalMembers)}
      ${stat('Saving / Repaying / Multi-Loan', p.savingCount+' / '+p.repayingCount+' / '+p.multiLoanRepayCount)}
      ${stat('Savings Collected', rupee(p.totals.savings))}
      ${stat('Principal Recovered', rupee(p.totals.principal))}
      ${stat('Interest Received', rupee(p.totals.interest))}
      ${stat('Fine Received', rupee(p.totals.fines))}
      ${stat('New Loans Disbursed', rupee(p.totals.newLoans))}
      ${stat('Meeting Expenses', rupee(p.totals.expenses))}
      ${stat(p.mode==='CASH'?'Cash Collection':'Bank Collection', rupee(p.totalCollection))}
      ${stat('Proposed Bank Deposit', p.deposit?rupee(p.deposit.amount):'—')}
      ${stat('Net Cash Remaining', p.mode==='CASH'?rupee(Math.round((p.netCash-(p.deposit?p.deposit.amount:0))*100)/100):'—')}
    </div>
    ${memberRows.length ? `<h4 style="margin-top:12px">Member-wise</h4>${tbl(['Member','Savings','Loan Repayment','Fine','Total'], memberRows)}` : ''}
    ${loanRows.length ? `<h4 style="margin-top:10px">Loan-wise</h4>${tbl(['Member','Loan ID','Principal','Interest','Total',''], loanRows)}` : ''}
    ${p.anyOverrideUsed ? `<div class="msg info" style="margin-top:10px"><b>Authorised Adjustment:</b> ${esc(p.adjustmentReason)}<br>Marked loans above exceed the amount normally due — this reason will be recorded in the audit trail and in that transaction's narration.</div>` : ''}
    ${p.dupWarnings && p.dupWarnings.length ? `<div class="msg err" style="margin-top:10px">Possible duplicate entr${p.dupWarnings.length>1?'ies':'y'}:<br>${p.dupWarnings.map(esc).join('<br>')}<br>You can still post if this is intentional (e.g. a genuine second payment).</div>` : ''}
    ${p.reconDiff!=null && p.reconDiff!==0 ? `<div class="msg err" style="margin-top:10px">Counted amount (${rupee(p.actualReceived)}) differs from entries by ${rupee(Math.abs(p.reconDiff))}. You can still post — the difference is saved with the meeting for follow-up.</div>` : ''}
    <p class="hint" style="margin-top:10px">Nothing has been posted yet. Review the figures, then confirm to create all accounting entries in one step.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="confirmPostMeeting()">Confirm &amp; Post Meeting</button>
      <button class="btn secondary" onclick="closeModal()">Back to Edit</button>
    </div>`);
}
// PASS 2: everything below was already validated in postMeeting(), so this loop posts the
// whole meeting — every loan repayment tagged with its own loanId — in one uninterrupted
// pass. The meeting record is only saved if every posting succeeds.
function confirmPostMeeting(){
  const p = PENDING_MEETING_PLAN; if(!p) return;
  const meetingId = nextId('MTG');
  try{
    p.memberEntries.forEach(r=>{
      if(r.sav>0) postTxn({date:p.date,type:'Savings',debit:p.mode,credit:'MEMBER_SAVINGS',amount:r.sav,memberId:r.m.id,meetingId,narration:'Meeting savings — '+r.m.name});
      r.loanRows.forEach(lr=>{
        const adjTag = lr.override ? ' [Authorised Adjustment: '+p.adjustmentReason+']' : '';
        if(lr.rp>0) postTxn({date:p.date,type:'Loan Repayment',debit:p.mode,credit:'MEMBER_LOANS',amount:lr.rp,memberId:r.m.id,loanId:lr.loan.id,meetingId,narration:'Principal repayment — '+r.m.name+' ('+lr.loan.id+')'+adjTag});
        if(lr.ri>0) postTxn({date:p.date,type:'Interest Received',debit:p.mode,credit:'INTEREST_INCOME',amount:lr.ri,memberId:r.m.id,loanId:lr.loan.id,meetingId,narration:'Interest received — '+r.m.name+' ('+lr.loan.id+')'+adjTag});
        if(lr.override) logAudit('AUTHORISED_ADJUSTMENT', 'Loan '+lr.loan.id+' ('+r.m.name+'): principal '+rupee(lr.rp)+' / interest '+rupee(lr.ri)+' exceeded amount due — reason: '+p.adjustmentReason);
      });
      if(r.fine>0) postTxn({date:p.date,type:'Fine',debit:p.mode,credit:'FINE_INCOME',amount:r.fine,memberId:r.m.id,meetingId,narration:'Fine/penalty — '+r.m.name});
    });
    if(p.newLoan){
      const loan = { id: nextId('LOAN'), memberId:p.newLoan.memberId, purpose:p.newLoan.purpose,
        sanctionDate:p.date, disbursementDate:p.date, principal:p.newLoan.amount, interestRate:p.newLoan.rate,
        instalments:p.newLoan.inst, frequency:'Monthly', interestMethod:'flat', status:'Active', nextDueDate: addPeriod(p.date,1,'Monthly') };
      DB.loans.push(loan);
      postTxn({date:p.date,type:'Disbursement',debit:'MEMBER_LOANS',credit:p.mode,amount:loan.principal,memberId:loan.memberId,loanId:loan.id,meetingId,narration:'Loan disbursed — '+memberName(loan.memberId)});
      logAudit('LOAN_SANCTION', loan.id+' sanctioned & disbursed for '+memberName(loan.memberId)+' — '+rupee(loan.principal)+' (via meeting)');
    }
    if(p.expense){
      postTxn({date:p.date,type:'Expense',debit:'EXP_'+p.expense.cat,credit:p.mode,amount:p.expense.amount,meetingId,narration:p.expense.narration});
    }
    if(p.deposit){
      let narration = 'Cash deposited to bank (meeting collection)';
      if(p.deposit.bankAccount) narration += ' — '+p.deposit.bankAccount;
      if(p.deposit.ref) narration += ' · Ref# '+p.deposit.ref;
      if(p.deposit.remarks) narration += ' · '+p.deposit.remarks;
      postTxn({date:p.deposit.date,type:'Bank Deposit',debit:'BANK',credit:'CASH',amount:p.deposit.amount,meetingId,narration});
    }
    const closingCash = accountBalance('CASH');
    DB.meetings.push({id:meetingId, date:p.date, totalMembers:p.totalMembers, present:p.present, presentIds:p.presentIds, absentIds:p.absentIds,
      totals:p.totals, actualReceived:p.actualReceived, mode:p.mode, closingCash,
      bankDeposit: p.deposit ? {amount:p.deposit.amount, bankAccount:p.deposit.bankAccount, ref:p.deposit.ref} : null,
      postedBy: DB.settings.currentUserName, postedAt: nowStamp()});
    logAudit('POST_MEETING', meetingId+' on '+p.date+' — '+p.present+'/'+p.totalMembers+' present, total collection '+rupee(p.totalCollection));
    let msg = 'Meeting posted. All registers, ledgers, loan positions and grading update automatically.';
    if(p.reconDiff!=null && p.reconDiff!==0) msg += ' Counted-vs-entries difference of '+rupee(Math.abs(p.reconDiff))+' was saved with the meeting.';
    if(p.mode==='CASH' && !p.deposit && p.totalCollection>0) msg += ' Remember to deposit cash collected when convenient (Transfer Funds).';
    PENDING_MEETING_PLAN = null;
    closeModal();
    flash('ok', msg);
    ROUTE='meetings'; render();
  }catch(e){
    flash('error', 'Posting failed: '+e.message+' — no part of this meeting was saved.');
    closeModal(); render();
  }
}
// Records the SHG physically moving cash into the bank — Debit Bank, Credit Cash — outside
// of a meeting (e.g. depositing cash collected on an earlier date). It is only a transfer,
// never income or expense, so it can never affect Trial Balance or Income & Expenditure.
// Generalised transfer between the SHG's own liquid funds — Cash, Bank, UPI — in any
// direction. This is never income or expense, only a movement between asset accounts, so it
// never touches Income & Expenditure or the Trial Balance's net position.
function depositToBankForm(){

  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Transfer Between Cash / Bank / UPI</h3>
  <p class="hint">Cash: <b>${rupee(balances.CASH)}</b> · Bank: <b>${rupee(balances.BANK)}</b> · UPI: <b>${rupee(balances.UPI)}</b></p>
  <form onsubmit="return postDepositToBank(event)">
    <div class="row">
      <div class="field"><label>From *</label><select name="fromAcct" id="transferFrom" onchange="guardTransferAccounts()" required><option value="CASH">Cash</option><option value="BANK">Bank</option><option value="UPI">UPI</option></select></div>
      <div class="field"><label>To *</label><select name="toAcct" id="transferTo" onchange="guardTransferAccounts()" required><option value="BANK">Bank</option><option value="CASH">Cash</option><option value="UPI">UPI</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Transfer Date</label><input type="date" name="date" value="${todayStr()}"></div>

    </div>

      <div class="field"><label>Reference No. (UTR / Deposit slip)</label><input name="ref"></div>
    </div>
    <div class="field"><label>Remarks</label><input name="remarks"></div>
    <button class="btn" type="submit">Post Transfer</button>
  </form>`);
}
function guardTransferAccounts(){
  const from = document.getElementById('transferFrom'), to = document.getElementById('transferTo');
  if(from && to && from.value===to.value){
    const opts = ['CASH','BANK','UPI'];
    to.value = opts.find(o=>o!==from.value);
  }
}
function postDepositToBank(ev){
  ev.preventDefault(); const f = new FormData(ev.target);
  try{
    const date = f.get('date'), amount = parseFloat(f.get('amount'))||0, fromAcct = f.get('fromAcct'), toAcct = f.get('toAcct'),
      bankAccount = f.get('bankAccount')||'', ref = f.get('ref')||'', remarks = f.get('remarks')||'';
    if(amount<=0) throw new Error('Enter a transfer amount greater than zero.');
    if(fromAcct===toAcct) throw new Error('"From" and "To" must be different accounts.');
    const fromBal = accountBalance(fromAcct);
    if(amount > fromBal+0.5) throw new Error('Transfer amount ('+rupee(amount)+') exceeds the balance in '+accountLabel(fromAcct)+' ('+rupee(fromBal)+'). Reduce the amount to match what is actually being moved.');
    let narration = accountLabel(fromAcct)+' transferred to '+accountLabel(toAcct);
    if(bankAccount) narration += ' — '+bankAccount;
    if(ref) narration += ' · Ref# '+ref;
    if(remarks) narration += ' · '+remarks;
    postTxn({date, type:'Fund Transfer', debit:toAcct, credit:fromAcct, amount, narration});
    closeModal(); flash('ok','Transfer posted — Cash Book, Bank Book and UPI Book now reconcile automatically.'); render();
  }catch(e){ flash('error', e.message); render(); }
  return false;
}
function addMonths(dateStr,n){
  const d = new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10);
}
// Advances a date by n instalment periods according to a loan's repayment frequency
// (Weekly/Fortnightly/Monthly). Used for both nextDueDate and the full repayment schedule.
function addPeriod(dateStr, n, frequency){
  if(frequency==='Weekly'){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+7*n); return d.toISOString().slice(0,10); }
  if(frequency==='Fortnightly'){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+14*n); return d.toISOString().slice(0,10); }
  return addMonths(dateStr, n);
}

/* ============================================================ LOANS */
function viewLoans(){
  let html = `<div class="section-title"><h2>Members Loan</h2><button class="btn" onclick="loanForm()">+ New Loan</button></div>`;
  if(!DB.loans.length){ html += `<div class="card"><div class="empty">No loans issued yet.</div></div>`; return html; }

  // --- Member Loan Summary: one member can hold several independent loans (item 15) ---
  const memberIds = Array.from(new Set(DB.loans.map(l=>l.memberId)));
  const summaryRows = memberIds.map(mid=>{
    const loans = DB.loans.filter(l=>l.memberId===mid && l.status!=='Closed');
    if(!loans.length) return null;
    const dues = memberDueInfos(mid, todayStr());
    const totalOS = loans.reduce((s,l)=>s+loanOutstanding(l.id).principal,0);
    const totalDue = dues.reduce((s,d)=>s+d.totalDue,0);
    const arrears = dues.reduce((s,d)=>s+d.arrears,0);
    return [esc(memberName(mid)), loans.length, rightCell(rupee(totalOS)), rightCell(totalDue>0.5?rupee(totalDue):'—'),
      rightCell(arrears>0.5?rupee(arrears):'—'), `<button class="btn small secondary" onclick="viewMemberLoans('${mid}')">View Loans</button>`];
  }).filter(Boolean);
  html += `<div class="card"><h3>Member Loan Summary</h3>${summaryRows.length ? tbl(['Member','Active Loans','Total Loan O/S','Total Due','Arrears',''], summaryRows) : `<div class="empty">No members with active loans.</div>`}</div>`;

  // --- Full Loan Register with filter ---
  const filter = window.__loansFilter || 'all';
  html += `<div class="card"><div class="section-title" style="margin-bottom:8px"><h3>Loan Register</h3>
    <select id="loansFilterSel" onchange="window.__loansFilter=this.value; render();" style="max-width:200px">
      <option value="all" ${filter==='all'?'selected':''}>All</option>
      <option value="active" ${filter==='active'?'selected':''}>Active</option>
      <option value="overdue" ${filter==='overdue'?'selected':''}>Overdue</option>
      <option value="closure" ${filter==='closure'?'selected':''}>Eligible for Closure</option>
      <option value="closed" ${filter==='closed'?'selected':''}>Closed</option>
    </select></div>`;
  let loans = DB.loans.slice().reverse();
  if(filter==='active') loans = loans.filter(l=>l.status!=='Closed');
  if(filter==='closed') loans = loans.filter(l=>l.status==='Closed');
  if(filter==='overdue') loans = loans.filter(l=>l.status!=='Closed' && l.nextDueDate && l.nextDueDate<todayStr());
  if(filter==='closure') loans = loans.filter(l=>loanEligibleForClosure(l));
  html += tbl(['Loan ID','Member','Purpose','Principal','Rate %','O/S Principal','Next Due','Status',''],
    loans.map(l=>{
      const os = loanOutstanding(l.id).principal;
      const overdue = l.status!=='Closed' && l.nextDueDate && l.nextDueDate<todayStr();
      const eligibleForClosure = loanEligibleForClosure(l);
      return [l.id, esc(memberName(l.memberId)), esc(l.purpose), rightCell(rupee(l.principal)), l.interestRate+'%',
        rightCell(rupee(os)), fmtDate(l.nextDueDate),

        `<button class="btn small secondary" onclick="viewLoanSchedule('${l.id}')">Schedule</button> `+
        (eligibleForClosure ? `<button class="btn small secondary" onclick="closeLoan('${l.id}')">Mark Closed</button>` : '')
      ];
    }));
  html += `</div>`;
  return html;
}

function saveLoan(ev){
  ev.preventDefault(); const f=new FormData(ev.target);
  try{

      sanctionDate:data.sanctionDate, disbursementDate:data.disbursementDate,
      principal: parseFloat(data.principal), interestRate: parseFloat(data.interestRate)||0,
      instalments: parseInt(data.instalments)||12, frequency: data.frequency||'Monthly', interestMethod: data.interestMethod||'flat',
      status:'Active', nextDueDate: addPeriod(data.disbursementDate,1,data.frequency||'Monthly') };
    DB.loans.push(loan);
    postTxn({date:data.disbursementDate,type:'Disbursement',debit:'MEMBER_LOANS',credit:data.mode,amount:loan.principal,memberId:loan.memberId,loanId:loan.id,narration:'Loan disbursed — '+memberName(loan.memberId)});
    logAudit('LOAN_SANCTION', loan.id+' sanctioned & disbursed for '+memberName(loan.memberId)+' — '+rupee(loan.principal));
    closeModal(); flash('ok','Loan disbursed.'); render();
  }catch(e){ flash('error',e.message); render(); }
  return false;
}
// A loan becomes eligible for closure only once BOTH principal and interest across its whole
// schedule are settled — never on principal alone, so an authorised interest balance can't be
// silently dropped by closing the loan.
function loanEligibleForClosure(loan){
  if(loan.status==='Closed') return false;
  return generateLoanSchedule(loan.id).every(s=>s.status==='Paid');
}
function closeLoan(id){
  const l = DB.loans.find(x=>x.id===id); if(!l) return;
  if(!loanEligibleForClosure(l)){ flash('error','This loan still has principal or interest outstanding and cannot be closed yet.'); render(); return; }
  l.status='Closed'; logAudit('CLOSE_LOAN', id+' marked closed'); flash('ok','Loan marked closed.'); render();
}

/* ============================================================ BANK LOAN TO SHG (TL / CC) */
// Tracks credit the SHG itself borrows FROM the bank — Term Loan (TL) and Cash Credit (CC) —
// separately from Member Loans (which the SHG lends TO its own members) and separately from
// the draft-letter Bank Loan Application. Sanction, drawal (utilisation) and repayment are
// each their own step, matching how a real TL/CC facility actually works: sanctioning a limit
// has no cash effect by itself; only an actual drawal or repayment moves money.
function bankLoanAcct(type){ return type==='CC' ? 'BANK_CC' : 'BANK_TL'; }
// "Utilised" = cumulative amount ever drawn against the sanctioned limit (a figure that only
// grows). "Outstanding Payable" (below) is the separate, currently-owed amount — drawals minus
// repayments — computed straight from the ledger, so the two can never silently drift apart.
function bankLoanUtilised(bankLoanId){
  return DB.transactions.filter(t=>!t.reversed && t.bankLoanId===bankLoanId && t.type==='Bank Loan Drawal').reduce((s,t)=>s+t.amount,0);
}
function bankLoanOutstanding(bankLoanId){
  const loan = DB.bankLoans.find(b=>b.id===bankLoanId); if(!loan) return 0;
  return Math.max(0, accountBalance(bankLoanAcct(loan.type), {bankLoanId}));
}
function viewBankLoanToSHG(){
  let html = `<div class="section-title"><h2>Bank Loan to SHG (TL / CC)</h2><button class="btn" onclick="bankLoanSanctionForm()">+ Record Sanction</button></div>`;
  html += `<div class="msg info">This records credit the bank extends TO the SHG (Term Loan or Cash Credit) — separate from Member Loans, which the SHG lends to its own members. Sanctioning a facility has no cash effect by itself; only an actual drawal or repayment posts to the ledger.</div>`;
  html += `<div class="grid cols3">
    ${stat('TL Outstanding', rupee(accountBalance('BANK_TL')))}
    ${stat('CC Outstanding', rupee(accountBalance('BANK_CC')))}
    ${stat('Total Bank Loan Outstanding', rupee(accountBalance('BANK_TL')+accountBalance('BANK_CC')))}
  </div>`;
  if(!DB.bankLoans.length){ html += `<div class="card"><div class="empty">No TL/CC facility recorded yet.</div></div>`; return html; }
  html += `<div class="card">${tbl(['Facility ID','Type','Sanction Date','Sanctioned Amount','Utilised','Not Utilised','Outstanding Payable','Rate %',''],
    DB.bankLoans.map(b=>{
      const utilised = bankLoanUtilised(b.id);
      const notUtilised = Math.max(0, Math.round((b.sanctionedAmount-utilised)*100)/100);
      return [b.id, b.type, fmtDate(b.sanctionDate), rightCell(rupee(b.sanctionedAmount)), rightCell(rupee(utilised)),
        rightCell(notUtilised>0?rupee(notUtilised):'—'), rightCell(rupee(bankLoanOutstanding(b.id))), b.rate+'%',
        `<button class="btn small secondary" onclick="bankLoanDrawalForm('${b.id}')">Drawal</button> <button class="btn small secondary" onclick="bankLoanRepaymentForm('${b.id}')">Repay</button>`];
    }))}</div>`;
  return html;
}

    postTxn({date:data.date, type:'Bank Loan Drawal', debit:data.mode, credit:bankLoanAcct(loan.type), amount, bankLoanId,
      narration:'Drawal against '+loan.id+' ('+loan.type+')'+(data.narration?(' — '+data.narration):'')});

    const loan = DB.bankLoans.find(b=>b.id===bankLoanId); if(!loan) throw new Error('Facility not found.');
    const data = Object.fromEntries(f.entries());
    const principal = parseFloat(data.principal)||0, interest = parseFloat(data.interest)||0;
    if(principal<0||interest<0) throw new Error('Negative amounts are not allowed.');
    if(principal===0 && interest===0) throw new Error('Enter a principal and/or interest amount.');
    const outstanding = bankLoanOutstanding(loan.id);
    if(principal > outstanding+0.5) throw new Error('Principal repayment ('+rupee(principal)+') exceeds the outstanding payable ('+rupee(outstanding)+').');
    if(principal>0) postTxn({date:data.date, type:'Bank Loan Repayment', debit:bankLoanAcct(loan.type), credit:data.mode, amount:principal, bankLoanId,
      narration:'Principal repaid — '+loan.id+' ('+loan.type+')'+(data.narration?(' — '+data.narration):'')});
    if(interest>0) postTxn({date:data.date, type:'Bank Loan Interest', debit:'INTEREST_EXPENSE', credit:data.mode, amount:interest, bankLoanId,
      narration:'Interest paid — '+loan.id+' ('+loan.type+')'+(data.narration?(' — '+data.narration):'')});
    if(bankLoanOutstanding(loan.id)<=0.5) loan.status='Closed';
    closeModal(); flash('ok','Repayment posted.'); render();
  }catch(e){ flash('error',e.message); render(); }
  return false;
}

function txnOptionsHTML(list, selectIdx){
  return list.map((o,i)=>`<option value="${o.value}" ${i===selectIdx?'selected':''}>${esc(o.label)}</option>`).join('');
}
function updateTxnNature(){
  const nature = (document.getElementById('txnNature')||{}).value;
  const debitSel = document.getElementById('txnDebit'), creditSel = document.getElementById('txnCredit');
  if(!debitSel||!creditSel) return;
  let debitOpts, creditOpts;
  if(nature==='expense'){
    debitOpts = DB.expenseCategories.map(c=>({value:'EXP_'+c,label:'Expense: '+c}))
      .concat([{value:'OTHER_ASSETS',label:accountLabel('OTHER_ASSETS')+' (Asset Purchase)'},{value:'__NEW__',label:'+ Add New Expense Head…'}]);
    creditOpts = FUND_ACCOUNTS.map(c=>({value:c,label:accountLabel(c)}));
  } else if(nature==='income'){
    debitOpts = FUND_ACCOUNTS.map(c=>({value:c,label:accountLabel(c)}));
    creditOpts = [{value:'FINE_INCOME',label:accountLabel('FINE_INCOME')},{value:'OTHER_INCOME',label:accountLabel('OTHER_INCOME')}];
  } else if(nature==='transfer'){
    debitOpts = FUND_ACCOUNTS.map(c=>({value:c,label:accountLabel(c)}));
    creditOpts = FUND_ACCOUNTS.map(c=>({value:c,label:accountLabel(c)}));
  } else {
    const codes = allLedgerCodes();
    debitOpts = codes.map(c=>({value:c,label:accountLabel(c)}));
    creditOpts = codes.map(c=>({value:c,label:accountLabel(c)}));
  }
  debitSel.innerHTML = txnOptionsHTML(debitOpts, 0);
  creditSel.innerHTML = txnOptionsHTML(creditOpts, creditOpts.length>1?1:0);
  toggleNewExpenseField();
  guardTxnAccounts('debit');
  guardTxnLoanField();
}
function toggleNewExpenseField(){
  const debitSel = document.getElementById('txnDebit');
  const field = document.getElementById('txnNewExpenseField');
  if(field) field.style.display = (debitSel && debitSel.value==='__NEW__') ? '' : 'none';
}
function guardTxnLoanField(){
  const credit = (document.getElementById('txnCredit')||{}).value;
  const memberId = (document.getElementById('txnMember')||{}).value;
  const field = document.getElementById('txnLoanField'), sel = document.getElementById('txnLoanId');
  const needsLoan = credit==='MEMBER_LOANS' || credit==='INTEREST_INCOME';
  if(field) field.style.display = needsLoan ? '' : 'none';
  if(sel && needsLoan){
    const loans = memberId ? DB.loans.filter(l=>l.memberId===memberId && l.status!=='Closed') : DB.loans.filter(l=>l.status!=='Closed');
    sel.innerHTML = loans.length ? loans.map(l=>`<option value="${l.id}">${l.id} — ${esc(memberName(l.memberId))} (${esc(l.purpose||'')})</option>`).join('') : `<option value="">— select a member with an active loan —</option>`;
  }
}
function guardTxnAccounts(changed){
  const d = document.getElementById('txnDebit'), c = document.getElementById('txnCredit');
  const warn = document.getElementById('txnAccountWarning'), btn = document.getElementById('txnSubmitBtn');
  if(!d || !c) return;
  if(d.value===c.value){
    // Nudge whichever field the user did NOT just change onto the next different option, so they never stay stuck on the same head.
    const codes = allLedgerCodes();
    const other = changed==='debit' ? c : d;
    const idx = codes.indexOf(other.value);
    other.value = codes[(idx+1)%codes.length];
  }
  const same = d.value===c.value;
  warn.style.display = same ? 'block' : 'none';
  if(btn) btn.disabled = same;
}
function saveManualTxn(ev){
  ev.preventDefault(); const f=new FormData(ev.target);
  try{
    const data = Object.fromEntries(f.entries());
    if(data.debit==='__NEW__'){
      const name = (data.newExpenseName||'').trim();
      if(!name) throw new Error('Enter a name for the new expense head.');
      if(!DB.expenseCategories.includes(name)) DB.expenseCategories.push(name);
      data.debit = 'EXP_'+name;
    }
    if(data.debit===data.credit) throw new Error('Debit and credit accounts must differ.');
    if((data.credit==='MEMBER_LOANS' || data.credit==='INTEREST_INCOME') && !data.loanId){
      throw new Error('A '+(data.credit==='MEMBER_LOANS'?'principal':'interest')+' repayment must be attributed to a specific Loan ID — select the member first, then the loan.');
    }
    const typeByNature = {expense:'Expense', income:'Other Income', transfer:'Fund Transfer', advanced:'Journal'};
    data.type = typeByNature[data.nature] || 'Journal';
    postTxn(data);
    closeModal(); flash('ok','Voucher posted.'); render();
  }catch(e){ flash('error',e.message); render(); }
  return false;
}
function doReverse(id){
  const reason = prompt('Reason for reversal (optional):','');
  try{ reverseTxn(id, reason||''); flash('ok','Transaction reversed.'); render(); }
  catch(e){ flash('error',e.message); render(); }
}

/* ============================================================ CASH / BANK BOOK */
function viewBook(code,title){
  let html = `<div class="section-title"><h2>${esc(title)}</h2><button class="btn secondary" onclick="depositToBankForm()">Transfer Funds</button></div>`;
  // Opening balance is posted as a real transaction (Debit Cash/Bank, Credit SHG Fund — see
  // postOpeningBalances), so it already appears in the transaction loop below. Starting the
  // running balance at DB.settings.openingCash/openingBank here would double-count it.
  let bal = 0;
  const rows = [];
  DB.transactions.filter(t=>t.debit===code||t.credit===code).sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{
    const isDr = t.debit===code;
    bal += isDr? t.amount : -t.amount;
    rows.push([fmtDate(t.date), t.voucherNo, esc(t.narration||t.type), isDr?rightCell(rupee(t.amount)):'', !isDr?rightCell(rupee(t.amount)):'', rightCell(rupee(bal))]);
  });
  html += `<div class="grid cols2">${stat('Closing Balance', rupee(bal))}${stat('Entries', rows.length)}</div>`;
  html += `<div class="card">${tbl(['Date','Voucher','Particulars','Receipts (Dr)','Payments (Cr)','Balance'], rows)}</div>`;
  return html;
}

  window.__ledgerSel = sel;

  // will appear naturally in the loop below — seeding bal from settings here would double-count it.
  let bal = 0;
  const type = accountType(sel);
  const normalDebit = (type==='asset'||type==='expense');
  const rows = [];

  });
