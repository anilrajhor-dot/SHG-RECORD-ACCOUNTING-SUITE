<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SHG Records & Accounting Suite</title>
<style>
:root{
  --navy:#12283F;
  --navy-2:#1B3A5C;
  --navy-3:#234A73;
  --bg:#EEF2F6;
  --card:#FFFFFF;
  --border:#D9E1E8;
  --text:#1B2733;
  --muted:#5B6B7A;
  --green:#1B7A4C;
  --green-bg:#E5F4EC;
  --amber:#A6650C;
  --amber-bg:#FBF0DD;
  --red:#B23A3A;
  --red-bg:#FBE9E9;
  --accent:#2E6F9E;
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:15px;}
h1,h2,h3,h4{margin:0 0 8px 0;font-weight:600;letter-spacing:-0.01em;}
a{color:var(--accent);}
table{border-collapse:collapse;width:100%;font-size:13.5px;}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
th{background:#F5F8FA;font-weight:600;color:var(--navy-2);position:sticky;top:0;}
tbody tr:hover{background:#F7FAFC;}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);}
.right{text-align:right;}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--mono);}

/* ---- App shell ---- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:240px;flex-shrink:0;background:var(--navy);color:#DCE6EF;
  display:flex;flex-direction:column;
  position:fixed;top:0;bottom:0;left:0;z-index:40;
  transform:translateX(0);transition:transform .2s ease;
}
#sidebar .brand{padding:18px 16px 10px;border-bottom:1px solid rgba(255,255,255,.1);}
#sidebar .brand b{color:#fff;font-size:16px;display:block;}
#sidebar .brand span{font-size:11.5px;color:#9FB4C8;}
#navlist{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;}
#navlist li{margin:1px 0;}
#navlist a{
  display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:6px;color:#C9D9E6;
  text-decoration:none;font-size:13.6px;cursor:pointer;
}
#navlist a:hover{background:rgba(255,255,255,.07);}
#navlist a.active{background:var(--navy-3);color:#fff;font-weight:600;}
#navlist .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#7C93A8;margin:12px 10px 4px;}
#sidebar .foot{padding:10px 14px;font-size:10.5px;color:#7C93A8;border-top:1px solid rgba(255,255,255,.1);}
#main{margin-left:240px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;
}
#topbar .shgname{font-weight:700;color:var(--navy);font-size:15px;}
#topbar .quickstats{display:flex;gap:16px;margin-left:auto;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
#topbar .quickstats b{color:var(--text);font-family:var(--mono);}
#hamburger{display:none;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;cursor:pointer;}
#content{padding:18px 20px 60px;max-width:1180px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.card h3{color:var(--navy-2);font-size:14.5px;margin-bottom:10px;}
.grid{display:grid;gap:12px;}
.grid.cols4{grid-template-columns:repeat(4,1fr);}
.grid.cols3{grid-template-columns:repeat(3,1fr);}
.grid.cols2{grid-template-columns:repeat(2,1fr);}
@media(max-width:900px){.grid.cols4{grid-template-columns:repeat(2,1fr);}.grid.cols3{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.stat .val{font-size:19px;font-weight:700;color:var(--navy);font-family:var(--mono);}
.stat .val.neg{color:var(--red);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.grey{background:#EEF1F4;color:var(--muted);}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--navy-3);
  background:var(--navy-2);color:#fff;cursor:pointer;font-weight:600;font-size:13.5px;
}
.btn:hover{background:var(--navy-3);}
.btn.secondary{background:#fff;color:var(--navy-2);border-color:var(--border);}
.btn.secondary:hover{background:#F5F8FA;}
.btn.danger{background:var(--red);border-color:var(--red);}
.btn.small{padding:4px 9px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.field{margin-bottom:11px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:150px;}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:9px 13px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;}
.tabs button.active{color:var(--navy-2);border-bottom-color:var(--navy-2);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.msg{padding:10px 12px;border-radius:6px;font-size:13px;margin-bottom:12px;}
.msg.err{background:var(--red-bg);color:var(--red);}
.msg.ok{background:var(--green-bg);color:var(--green);}
.msg.info{background:#E7F0F8;color:var(--navy-3);}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px;}
.qcard{border:1px solid var(--border);border-radius:8px;padding:11px 13px;background:#fff;}
.qcard .status{font-size:12px;font-weight:700;}
.overlay{position:fixed;inset:0;background:rgba(15,25,35,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:20px;}
.modal .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.dot.green{background:var(--green);}.dot.amber{background:var(--amber);}.dot.red{background:var(--red);}
.helpbox{background:#F5F8FA;border:1px dashed var(--border);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:12px;}
footer.byline{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 6px;}
#sidebarScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebarScrim.show{display:block;}
  #main{margin-left:0;}
  #hamburger{display:block;}
  .grid.cols4,.grid.cols3,.grid.cols2{grid-template-columns:1fr 1fr;}
  #content{padding:14px 12px 60px;}
}
::-webkit-scrollbar{height:9px;width:9px;}
::-webkit-scrollbar-thumb{background:#c5d0da;border-radius:5px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebarScrim" onclick="closeSidebar()"></div>
  <nav id="sidebar">
    <div class="brand"><b>SHG Suite</b><span>Records · Accounting · Grading</span></div>
    <ul id="navlist"></ul>
    <div class="foot">Offline-first. Data stored on this device only.</div>
  </nav>
  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="shgname" id="topShgName">SHG</div>
      <div class="quickstats" id="topStats"></div>
      <div id="langToggle" style="margin-left:10px;flex-shrink:0"></div>
    </div>
    <div id="content"></div>
    <footer class="byline">Developed by Anil Sharma, Former General Manager, Central Bank of India.</footer>
  </div>
</div>
<div id="modalRoot"></div>

/* ---------------- Utilities ---------------- */
function rupee(n){
  n = Math.round((n||0)*100)/100;
  const neg = n<0; n=Math.abs(n);
  let parts = n.toFixed(2).split('.');
  let intPart = parts[0];
  let last3 = intPart.slice(-3);
  let rest = intPart.slice(0,-3);
  if(rest!=='') rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',';
  return (neg?'-':'') + '₹' + rest + last3 + '.' + parts[1];
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return String(dt.getDate()).padStart(2,'0')+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+dt.getFullYear();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthKey(d){ return (d||todayStr()).slice(0,7); }
function isPeriodClosed(date){ return DB.closedPeriods.includes(monthKey(date)); }
function activeMembers(){ return DB.members.filter(m=>m.status==='Active'); }

function logAudit(action, details){

  if(DB.auditLog.length>3000) DB.auditLog.length=3000;

/* ---------------- Transaction Engine (double entry) ---------------- */
function postTxn(t){
  // t: {date, type, debit, credit, amount, memberId, loanId, narration, meetingId, category}
  if(!t.date) throw new Error('Date is required.');
  if(isPeriodClosed(t.date)) throw new Error('Period '+monthKey(t.date)+' is closed. Reopen it in Settings to post here.');
  if(!ACCOUNTS[t.debit] && !t.debit.startsWith('EXP_')) throw new Error('Unknown debit account: '+t.debit);
  if(!ACCOUNTS[t.credit] && !t.credit.startsWith('EXP_')) throw new Error('Unknown credit account: '+t.credit);
  if(t.debit===t.credit) throw new Error('Debit and credit accounts must be different — "'+accountLabel(t.debit)+'" was selected on both sides.');
  const amt = Math.round((parseFloat(t.amount)||0)*100)/100;
  if(amt<=0) throw new Error('Amount must be greater than zero.');
  const txn = {
    id: nextId('TXN'),
    date: t.date,
    voucherNo: t.voucherNo || nextId('V'),
    type: t.type||'Journal',
    debit: t.debit, credit: t.credit, amount: amt,
    memberId: t.memberId||'', loanId: t.loanId||'', meetingId: t.meetingId||'',
    narration: t.narration||'',
    createdBy: DB.settings.currentUserName, createdAt: nowStamp(),
    modifiedBy:'', modifiedAt:'',
    reversed:false, reversalOf: t.reversalOf||'',
    demo: !!DEMO_MODE
  };
  DB.transactions.push(txn);
  logAudit('POST_TXN', txn.voucherNo+' Dr '+txn.debit+' / Cr '+txn.credit+' '+rupee(amt));
  return txn;
}
function reverseTxn(id, reason){
  const orig = DB.transactions.find(x=>x.id===id);
  if(!orig) throw new Error('Transaction not found.');
  if(orig.reversed) throw new Error('Already reversed.');
  const rev = postTxn({date: todayStr(), type:'Reversal', debit:orig.credit, credit:orig.debit,
    amount:orig.amount, memberId:orig.memberId, loanId:orig.loanId, meetingId:orig.meetingId,
    narration:'Reversal of '+orig.voucherNo+(reason?(' — '+reason):''), reversalOf:orig.id});
  orig.reversed = true;
  orig.modifiedBy = DB.settings.currentUserName; orig.modifiedAt = nowStamp();
  logAudit('REVERSE_TXN', 'Reversed '+orig.voucherNo+' via '+rev.voucherNo+(reason?(' — '+reason):''));
  saveDB();
  return rev;
}
function accountType(code){
  if(code.startsWith('EXP_')) return 'expense';
  return ACCOUNTS[code] ? ACCOUNTS[code].type : 'asset';
}
function accountLabel(code){
  if(code.startsWith('EXP_')) return 'Expense: '+code.slice(4);
  return ACCOUNTS[code] ? ACCOUNTS[code].label : code;
}
// Ledger balance for an account, optionally filtered by memberId/loanId/date range
function ledgerMovement(code, opts){
  opts = opts||{};
  let dr=0, cr=0;
  for(const t of DB.transactions){
    if(opts.upToDate && t.date > opts.upToDate) continue;
    if(opts.fromDate && t.date < opts.fromDate) continue;
    if(opts.memberId && t.memberId!==opts.memberId) continue;
    if(opts.loanId && t.loanId!==opts.loanId) continue;
    if(t.debit===code) dr += t.amount;
    if(t.credit===code) cr += t.amount;
  }
  return {dr,cr};
}
function accountBalance(code, opts){
  const {dr,cr} = ledgerMovement(code,opts);
  const type = accountType(code);
  const normalDebit = (type==='asset'||type==='expense');
  // Opening cash/bank balances are posted as real double-entry vouchers (see postOpeningBalances),
  // Debit Cash/Bank, Credit SHG Fund — so no separate adjustment is needed here. This keeps the
  // Trial Balance and Balance Sheet correct by construction rather than by a hidden add-on.
  return normalDebit ? (dr-cr) : (cr-dr);
}
// Posts (or re-posts) the SHG's opening cash/bank balances as a proper journal entry:
// Debit Cash/Bank, Credit SHG Fund/Capital — dated as given. Any previous opening-balance
// entries are reversed first (never deleted) so the audit trail stays intact.
function postOpeningBalances(cashAmt, bankAmt, date){
  date = date || todayStr();
  DB.transactions.filter(t=>t.type==='Opening Balance' && !t.reversed).forEach(t=>{
    try{ reverseTxn(t.id, 'Superseded by revised opening balance'); }catch(e){}
  });
  cashAmt = parseFloat(cashAmt)||0; bankAmt = parseFloat(bankAmt)||0;
  if(cashAmt>0) postTxn({date, type:'Opening Balance', debit:'CASH', credit:'SHG_FUND', amount:cashAmt, narration:'Opening cash balance'});
  if(bankAmt>0) postTxn({date, type:'Opening Balance', debit:'BANK', credit:'SHG_FUND', amount:bankAmt, narration:'Opening bank balance'});
  DB.settings.openingCash = cashAmt; DB.settings.openingBank = bankAmt; DB.settings.openingDate = date;
}
function allLedgerCodes(){
  const codes = Object.keys(ACCOUNTS).slice();
  const exp = new Set();
  DB.transactions.forEach(t=>{ if(t.debit.startsWith('EXP_')) exp.add(t.debit); if(t.credit.startsWith('EXP_')) exp.add(t.credit); });
  DB.expenseCategories.forEach(c=>exp.add('EXP_'+c));
  return codes.concat(Array.from(exp).sort());
}

/* ---------------- Member helpers ---------------- */
function memberSavingsBalance(id){ return accountBalance('MEMBER_SAVINGS',{memberId:id}); }
function memberLoanOutstanding(id){
  let total=0;
  DB.loans.filter(l=>l.memberId===id && l.status!=='Closed').forEach(l=>{ total += loanOutstanding(l.id).principal; });
  return total;
}
// Loan sub-ledger: principal outstanding is derived from the same double-entry ledger used
// everywhere else (Debit Member Loans on disbursement, Credit on repayment), filtered to this
// loan's transactions — so a reversed repayment nets out correctly instead of being summed
// ad hoc. This is the one place loan principal is calculated; every screen reads from here.
function loanOutstanding(loanId){
  const loan = DB.loans.find(l=>l.id===loanId);
  if(!loan) return {principal:0, interestPaid:0};
  const principal = Math.max(0, accountBalance('MEMBER_LOANS',{loanId}));
  const interestPaid = Math.max(0, accountBalance('INTEREST_INCOME',{loanId}));
  return {principal, interestPaid};
}
// Builds a transparent, instalment-wise repayment schedule for one loan: due dates, principal
// and interest due per instalment, and how much of each has actually been paid — so "loan
// outstanding" is never just a running sum, it is reconciled against a real schedule.
function generateLoanSchedule(loanId, asOfDate){
  asOfDate = asOfDate || todayStr();
  const loan = DB.loans.find(l=>l.id===loanId);
  if(!loan) return [];
  const n = Math.max(1, loan.instalments||1);
  const method = loan.interestMethod || 'flat';
  const principalPerInst = Math.round((loan.principal/n)*100)/100;
  const totalFlatInterest = Math.round(loan.principal*(loan.interestRate||0)/100 * (n/12)*100)/100;
  // Actual repayments against this loan, oldest first, split into principal and interest legs.
  const repayTx = DB.transactions.filter(t=>t.loanId===loanId && !t.reversed && t.credit==='MEMBER_LOANS').sort((a,b)=>a.date<b.date?-1:1);
  const interestTx = DB.transactions.filter(t=>t.loanId===loanId && !t.reversed && t.credit==='INTEREST_INCOME').sort((a,b)=>a.date<b.date?-1:1);
  let principalPool = repayTx.reduce((s,t)=>s+t.amount,0);
  let interestPool = interestTx.reduce((s,t)=>s+t.amount,0);
  let runningOutstanding = loan.principal;
  const schedule = [];
  const freq = loan.frequency || 'Monthly';
  const periodsPerYear = freq==='Weekly' ? 52 : (freq==='Fortnightly' ? 26 : 12);
  for(let i=1;i<=n;i++){
    const dueDate = addPeriod(loan.disbursementDate, i, freq);
    const principalDue = (i===n) ? Math.round((loan.principal - principalPerInst*(n-1))*100)/100 : principalPerInst;
    const interestDue = method==='reducing'
      ? Math.round(runningOutstanding*(loan.interestRate||0)/100/periodsPerYear*100)/100
      : Math.round((totalFlatInterest/n)*100)/100;
    const principalPaid = Math.min(principalDue, Math.max(0,principalPool));
    const interestPaid = Math.min(interestDue, Math.max(0,interestPool));
    principalPool -= principalPaid; interestPool -= interestPaid;
    runningOutstanding = Math.max(0, runningOutstanding - principalDue);
    let status;
    const fullyPaid = principalPaid>=principalDue-0.5 && interestPaid>=interestDue-0.5;
    const partiallyPaid = (principalPaid>0 || interestPaid>0) && !fullyPaid;
    if(fullyPaid) status='Paid';
    else if(partiallyPaid) status = (dueDate<asOfDate ? 'Partially Paid (Overdue)' : 'Partially Paid');
    else status = (dueDate<asOfDate ? 'Overdue' : 'Due');
    schedule.push({inst:i, dueDate, principalDue, interestDue, totalDue:Math.round((principalDue+interestDue)*100)/100,
      principalPaid, interestPaid, balance: Math.round(((principalDue-principalPaid)+(interestDue-interestPaid))*100)/100, status});
  }
  return schedule;
}
// Everything the Meeting module needs to know about one member's repayment position, as on
// a given date (defaults to today) rather than always "as of now" — so a meeting dated
// earlier than today shows the position that actually applied on that date.
// "Due now" is the oldest unpaid/overdue instalment; "arrears" is anything overdue before that.
function memberDueInfo(memberId, asOfDate){
  asOfDate = asOfDate || todayStr();
  const loan = DB.loans.find(l=>l.memberId===memberId && l.status!=='Closed');
  if(!loan) return null;
  const schedule = generateLoanSchedule(loan.id, asOfDate);
  const dueRows = schedule.filter(s=>s.status!=='Paid' && s.dueDate<=asOfDate);
  const current = dueRows.length ? dueRows[dueRows.length-1] : null;
  const arrears = dueRows.length>1 ? Math.round(dueRows.slice(0,-1).reduce((s,r)=>s+r.balance,0)*100)/100 : 0;
  const principalDue = current ? Math.max(0, Math.round((current.principalDue-current.principalPaid)*100)/100) : 0;
  const interestDue = current ? Math.max(0, Math.round((current.interestDue-current.interestPaid)*100)/100) : 0;
  return { loan, outstanding: loanOutstanding(loan.id).principal, principalDue, interestDue, arrears,
    totalDue: Math.round((principalDue+interestDue+arrears)*100)/100 };
}

function translatePage(){
  if((DB.settings.language||'en')!=='hi') return;
  translateNode(document.getElementById('sidebar'));
  translateNode(document.getElementById('topbar'));
  translateNode(document.getElementById('content'));
}
function translateNode(root){
  if(!root || (DB.settings.language||'en')!=='hi') return;
  root.querySelectorAll('[placeholder]').forEach(el=>{
    const key = (el.getAttribute('placeholder')||'').trim();
    if(TRANSLATIONS[key]) el.setAttribute('placeholder', TRANSLATIONS[key]);
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while(n = walker.nextNode()) nodes.push(n);
  nodes.forEach(node=>{
    const trimmed = node.nodeValue.trim();
    if(!trimmed) return;
    if(TRANSLATIONS[trimmed]) node.nodeValue = node.nodeValue.replace(trimmed, TRANSLATIONS[trimmed]);
  });
}

function stat(label,val,warn){ return `<div class="stat"><div class="lbl">${esc(label)}</div><div class="val ${warn?'neg':''}">${val}</div></div>`; }
function rightCell(s){ return '§R§'+s; }
function tbl(headers, rows){
  let h = `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{ h+= '<tr>' + r.map(c=>{
      if(typeof c==='string' && c.startsWith('§R§')) return `<td class="num">${c.slice(3)}</td>`;
      return `<td>${c}</td>`;
    }).join('') + '</tr>'; });
  h += '</tbody></table></div>';
  return h;
}
function fyStart(){
  const d = new Date();
  const [mm,dd] = (DB.profile.financialYearStart||'04-01').split('-').map(Number);
  let y = d.getFullYear();
  const fyThis = new Date(y,mm-1,dd);
  if(d < fyThis) y -= 1;
  return `${y}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

function viewMeetings(){
  let html = `<div class="section-title"><h2>SHG Meetings</h2><div class="row"><button class="btn secondary" onclick="depositToBankForm()">Deposit to Bank</button><button class="btn" onclick="go('meetingnew')">+ Conduct New Meeting</button></div></div>`;
  html += `<div class="card">`;
  html += DB.meetings.length ? tbl(['Date','Attendance','Savings','Principal','Interest','Fine','Total Collection','New Loans','Expenses','Recon.','Status',''],
    DB.meetings.slice().reverse().map(mt=>{
      const pct = mt.totalMembers ? Math.round(mt.present/mt.totalMembers*100) : 0;
      // Older meetings (before principal/interest were split) only have a combined totals.repayment.
      const principal = mt.totals.principal!=null ? mt.totals.principal : (mt.totals.repayment||0);
      const interest = mt.totals.interest!=null ? mt.totals.interest : 0;
      const totalCollection = Math.round((mt.totals.savings+principal+interest+mt.totals.fines)*100)/100;
      let recon = '<span class="hint">—</span>';
      if(mt.actualReceived!=null){
        const diff = Math.round((mt.actualReceived-totalCollection)*100)/100;
        recon = diff===0 ? badge('Matched','green') : badge(rupee(Math.abs(diff))+(diff>0?' extra':' short'),'amber');
      }
      return [fmtDate(mt.date), mt.present+'/'+mt.totalMembers+' ('+pct+'%)',
      rightCell(rupee(mt.totals.savings)), rightCell(rupee(principal)), rightCell(rupee(interest)), rightCell(rupee(mt.totals.fines)),
      rightCell('<b>'+rupee(totalCollection)+'</b>'), rightCell(rupee(mt.totals.newLoans)),
      rightCell(rupee(mt.totals.expenses)), recon, badge('Posted','green'),
      `${mt.absentIds?`<button class="btn small secondary" onclick="viewAttendance('${mt.id}')">Attendance</button> `:''}<button class="btn small secondary" onclick="viewMeetingDetail('${mt.id}')">Details</button>`];
    })) :
    `<div class="empty">No meetings recorded yet.</div>`;
  html += `</div>`;
  if(ROUTE==='meetingnew') html += meetingWorkflow();
  return html;
}

// Reconstructs a member-wise breakdown of one posted meeting straight from the transaction
// ledger (grouped by meetingId) — never from a separately-stored summary — so it can never
// drift from the actual postings. Also shows each member's loan outstanding as it stands now.
function viewMeetingDetail(meetingId){
  const mt = DB.meetings.find(x=>x.id===meetingId); if(!mt) return;
  const txns = DB.transactions.filter(t=>t.meetingId===meetingId);
  const memberIds = Array.from(new Set(txns.map(t=>t.memberId).filter(Boolean)));
  const rows = memberIds.map(mid=>{
    const mine = txns.filter(t=>t.memberId===mid);
    const sav = mine.filter(t=>t.credit==='MEMBER_SAVINGS').reduce((s,t)=>s+t.amount,0);
    const prin = mine.filter(t=>t.credit==='MEMBER_LOANS').reduce((s,t)=>s+t.amount,0);
    const int_ = mine.filter(t=>t.credit==='INTEREST_INCOME').reduce((s,t)=>s+t.amount,0);
    const fine = mine.filter(t=>t.credit==='FINE_INCOME').reduce((s,t)=>s+t.amount,0);
    const loanId = mine.find(t=>t.loanId)?.loanId;
    const os = loanId ? loanOutstanding(loanId).principal : null;
    return [esc(memberName(mid)), rightCell(rupee(sav)), rightCell(rupee(prin)), rightCell(rupee(int_)), rightCell(rupee(fine)),
      rightCell('<b>'+rupee(sav+prin+int_+fine)+'</b>'), os!=null?rightCell(rupee(os)):'—'];
  });
  const nonMember = txns.filter(t=>!t.memberId);
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Meeting Details — ${fmtDate(mt.date)}</h3>
    <p class="hint">Present: ${mt.present}/${mt.totalMembers}${mt.postedBy?(' · Posted by '+esc(mt.postedBy)+(mt.postedAt?(' on '+fmtDate(mt.postedAt.slice(0,10))):'')):''}</p>
    ${rows.length ? tbl(['Member','Savings','Principal','Interest','Fine','Total Paid','Loan O/S Now'], rows) : '<div class="empty">No member-wise transactions.</div>'}
    ${nonMember.length ? `<h4 style="margin-top:12px">Other Entries (New Loan / Expenses)</h4>${tbl(['Type','Debit','Credit','Amount','Narration'],
      nonMember.map(t=>[t.type, accountLabel(t.debit), accountLabel(t.credit), rightCell(rupee(t.amount)), esc(t.narration)]))}` : ''}
    ${mt.bankDeposit && mt.bankDeposit.amount ? `<div class="msg info" style="margin-top:10px">Cash of ${rupee(mt.bankDeposit.amount)} was deposited to bank as part of this meeting.</div>` : ''}`);
}

// Live, client-side only — fills one member's Principal/Interest fields from the due-list
// "Use in Grid" button, then recalculates that row and the meeting totals.
function meetingFillDue(mid, principal, interest){
  const rpEl = document.querySelector('[name="rp_'+mid+'"]');
  const riEl = document.querySelector('[name="ri_'+mid+'"]');
  if(rpEl) rpEl.value = principal.toFixed(2);
  if(riEl) riEl.value = interest.toFixed(2);
  meetingCalcRow(mid);
}
function toggleDepositSection(){
  const mode = (document.getElementById('meetingMode')||{}).value;
  const sec = document.getElementById('depositSection');
  if(sec) sec.style.display = mode==='BANK' ? 'none' : '';
}
// Recomputes every member's Loan O/S / Due Now columns as on the newly-selected meeting date
// — without a full page re-render, so amounts already typed into the grid are preserved.
function reloadMeetingDueDate(newDate){
  activeMembers().forEach(m=>{
    const due = memberDueInfo(m.id, newDate||todayStr());
    const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
    set('os_'+m.id, due?rupee(due.outstanding):'—');
    set('pd_'+m.id, due?rupee(due.principalDue):'—');
    set('id_'+m.id, due?rupee(due.interestDue):'—');
    set('ar_'+m.id, due&&due.arrears>0?rupee(due.arrears):'—');
    set('rowbal_'+m.id, due&&due.totalDue>0.5?rupee(due.totalDue):'—');
  });
  meetingCalcGrandTotal();
}
function meetingCalcRow(mid){
  const val = name => parseFloat((document.querySelector('[name="'+name+'_'+mid+'"]')||{}).value)||0;
  const sav=val('sav'), rp=val('rp'), ri=val('ri'), fine=val('fine');
  const total = sav+rp+ri+fine;
  const cell = document.getElementById('rowtotal_'+mid);
  if(cell) cell.textContent = rupee(total);
  const due = memberDueInfo(mid, (document.getElementById('meetingDate')||{}).value || todayStr());
  const balCell = document.getElementById('rowbal_'+mid);
  if(balCell && due){
    const bal = Math.round((due.totalDue - rp - ri)*100)/100;
    balCell.textContent = bal>0.005 ? rupee(bal) : (bal<-0.005 ? (rupee(Math.abs(bal))+' over') : 'Cleared');
  }
  meetingCalcGrandTotal();
}
function meetingCalcGrandTotal(){
  const sum = prefix => { let s=0; document.querySelectorAll('input[name^="'+prefix+'_"]').forEach(el=>s+=parseFloat(el.value)||0); return s; };
  const totSav = sum('sav'), totRp = sum('rp'), totRi = sum('ri'), totFine = sum('fine');
  const grand = Math.round((totSav+totRp+totRi+totFine)*100)/100;
  const newLoanAmt = parseFloat((document.querySelector('[name="newloan_amount"]')||{}).value)||0;
  const expAmt = parseFloat((document.querySelector('[name="exp_amount"]')||{}).value)||0;
  const depositAmt = parseFloat((document.querySelector('[name="depositAmount"]')||{}).value)||0;
  const netCollection = Math.round((grand - newLoanAmt - expAmt - depositAmt)*100)/100;
  const setText = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent = rupee(v); };
  setText('meetingTotSav', totSav); setText('meetingTotPrin', totRp); setText('meetingTotInt', totRi); setText('meetingTotFine', totFine);
  setText('meetingGrandTotal', grand); setText('meetingNetCollection', netCollection);
  let present=0, saving=0, repaying=0;
  activeMembers().forEach(m=>{
    if((document.querySelector('[name="present_'+m.id+'"]')||{}).checked) present++;
    if((parseFloat((document.querySelector('[name="sav_'+m.id+'"]')||{}).value)||0)>0) saving++;
    if((parseFloat((document.querySelector('[name="rp_'+m.id+'"]')||{}).value)||0)>0) repaying++;
  });
  const countsEl = document.getElementById('meetingCounts');
  if(countsEl) countsEl.textContent = present+' / '+saving+' / '+repaying;
  const actualEl = document.getElementById('actualReceived');
  const diffEl = document.getElementById('meetingReconDiff');
  if(actualEl && diffEl){
    if(actualEl.value!==''){
      const actual = parseFloat(actualEl.value)||0;
      const diff = Math.round((actual-grand)*100)/100;
      diffEl.textContent = diff===0 ? 'Matches the amount entered above.' : ('Difference from entries: '+rupee(Math.abs(diff))+(diff>0?' more counted than entered':' less counted than entered'));
      diffEl.style.color = diff===0 ? 'var(--green)' : 'var(--red)';
    } else { diffEl.textContent=''; }
  }
  return grand;
}
// Meeting posting is a two-pass, all-or-nothing process:
// PASS 1 (here): read and validate every field. Nothing is posted yet, so a mistake found on
//   member 8 never leaves members 1–7 already posted — the classic half-posted-meeting problem.
// PASS 2 (confirmPostMeeting, after the user reviews the summary): only then are transactions
//   actually created, in one go.
let PENDING_MEETING_PLAN = null;
function postMeeting(ev){
  ev.preventDefault();
  const f = new FormData(ev.target);
  const date = f.get('date');
  const mode = f.get('mode');
  const allowExcess = !!f.get('allowExcess');
  if(!date){ flash('error','Meeting date is required.'); render(); return false; }
  if(isPeriodClosed(date)){ flash('error','That period is closed. Reopen it in Settings first.'); render(); return false; }
  const members = activeMembers();
  try{
    const rows = [];
    let present=0; const presentIds=[], absentIds=[];
    members.forEach(m=>{
      const isPresent = !!f.get('present_'+m.id);
      if(isPresent){ present++; presentIds.push(m.id); } else { absentIds.push(m.id); }
      const sav = parseFloat(f.get('sav_'+m.id))||0;
      const rp = parseFloat(f.get('rp_'+m.id))||0;
      const ri = parseFloat(f.get('ri_'+m.id))||0;
      const fine = parseFloat(f.get('fine_'+m.id))||0;
      if(sav<0||rp<0||ri<0||fine<0) throw new Error('Negative amounts are not allowed ('+m.name+'). Enter zero or a positive amount.');
      let loan = null;
      if(rp>0 || ri>0){
        loan = DB.loans.find(l=>l.memberId===m.id && l.status!=='Closed');
        if(!loan) throw new Error('No active loan found for '+m.name+' but a principal or interest amount was entered. Remove the amount, or check the member.');
        const due = memberDueInfo(m.id, date);
        const outstanding = loanOutstanding(loan.id).principal;
        if(rp > outstanding+0.5 && !allowExcess){
          throw new Error('Principal repayment for '+m.name+' ('+rupee(rp)+') exceeds the loan\'s outstanding balance ('+rupee(outstanding)+'). Reduce the amount, or tick the authorised-adjustment checkbox.');
        }
        if(due && ri > (due.interestDue+due.arrears)+0.5 && (due.interestDue+due.arrears)>0 && !allowExcess){
          throw new Error('Interest payment for '+m.name+' ('+rupee(ri)+') exceeds the interest currently due ('+rupee(due.interestDue+due.arrears)+'). Reduce the amount, or tick the authorised-adjustment checkbox.');
        }
      }
      if(sav>0||rp>0||ri>0||fine>0) rows.push({m, sav, rp, ri, fine, loan});
    });

    let newLoan = null;
    const nlMember = f.get('newloan_member');
    if(nlMember){
      const amt = parseFloat(f.get('newloan_amount'))||0;
      if(amt>0){
        if(amt<0) throw new Error('New loan amount cannot be negative.');
        if(DB.loans.some(l=>l.memberId===nlMember && l.status!=='Closed')) throw new Error(memberName(nlMember)+' already has an active loan — only one active loan per member is allowed.');
        newLoan = { memberId:nlMember, purpose:f.get('newloan_purpose')||'', amount:amt,
          rate: parseFloat(f.get('newloan_rate'))||0, inst: parseInt(f.get('newloan_inst'))||12 };
      }
    }
    let expense = null;
    const expAmt = parseFloat(f.get('exp_amount'))||0;
    if(expAmt>0){ if(expAmt<0) throw new Error('Expense amount cannot be negative.'); expense = { cat:f.get('exp_cat'), amount:expAmt, narration:f.get('exp_narration')||f.get('exp_cat') }; }

    const totals = {
      savings: Math.round(rows.reduce((s,r)=>s+r.sav,0)*100)/100,
      principal: Math.round(rows.reduce((s,r)=>s+r.rp,0)*100)/100,
      interest: Math.round(rows.reduce((s,r)=>s+r.ri,0)*100)/100,
      fines: Math.round(rows.reduce((s,r)=>s+r.fine,0)*100)/100,
      newLoans: newLoan ? newLoan.amount : 0,
      expenses: expense ? expense.amount : 0
    };
    const totalCollection = Math.round((totals.savings+totals.principal+totals.interest+totals.fines)*100)/100;
    const netCash = mode==='CASH' ? Math.round((totalCollection - totals.newLoans - totals.expenses)*100)/100 : 0;

    let deposit = null;
    const depositAmount = parseFloat(f.get('depositAmount'))||0;
    if(depositAmount>0){
      if(mode!=='CASH') throw new Error('A bank deposit only applies when this meeting\'s collection mode is Cash.');
      const availableCash = Math.round((accountBalance('CASH')+netCash)*100)/100;
      if(depositAmount > availableCash+0.5) throw new Error('Deposit amount ('+rupee(depositAmount)+') exceeds cash available after this meeting ('+rupee(availableCash)+').');
      deposit = { amount:depositAmount, date: f.get('depositDate')||date, bankAccount: f.get('depositBank')||'', ref: f.get('depositRef')||'', remarks: f.get('depositRemarks')||'' };
    }

    const actualRaw = f.get('actualReceived');
    const actualReceived = (actualRaw!=null && actualRaw!=='') ? parseFloat(actualRaw) : null;
    const reconDiff = actualReceived!=null ? Math.round((actualReceived-totalCollection)*100)/100 : null;

    PENDING_MEETING_PLAN = { date, mode, allowExcess, rows, newLoan, expense, deposit, actualReceived, reconDiff,
      totals, totalCollection, netCash, present, totalMembers:members.length, presentIds, absentIds,
      savingCount: rows.filter(r=>r.sav>0).length, repayingCount: rows.filter(r=>r.rp>0||r.ri>0).length,
      dueCount: members.filter(m=>{ const d=memberDueInfo(m.id,date); return d && d.totalDue>0.5; }).length };
    showMeetingConfirmation();
  }catch(e){
    flash('error', e.message);
    render();
  }
  return false;
}
function showMeetingConfirmation(){
  const p = PENDING_MEETING_PLAN; if(!p) return;
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Meeting Summary — ${fmtDate(p.date)}</h3>
    <div class="grid cols2">
      ${stat('Members Present', p.present+' / '+p.totalMembers)}
      ${stat('Making Savings / Repaying', p.savingCount+' / '+p.repayingCount)}
      ${stat('Savings Collected', rupee(p.totals.savings))}
      ${stat('Principal Recovered', rupee(p.totals.principal))}
      ${stat('Interest Received', rupee(p.totals.interest))}
      ${stat('Fine Received', rupee(p.totals.fines))}
      ${stat('New Loans Disbursed', rupee(p.totals.newLoans))}
      ${stat('Meeting Expenses', rupee(p.totals.expenses))}
      ${stat(p.mode==='CASH'?'Cash Collection':'Bank Collection', rupee(p.totalCollection))}
      ${stat('Proposed Bank Deposit', p.deposit?rupee(p.deposit.amount):'—')}
      ${stat('Net Cash Remaining', p.mode==='CASH'?rupee(Math.round((p.netCash-(p.deposit?p.deposit.amount:0))*100)/100):'—')}
    </div>
    ${p.reconDiff!=null && p.reconDiff!==0 ? `<div class="msg err" style="margin-top:10px">Counted amount (${rupee(p.actualReceived)}) differs from entries by ${rupee(Math.abs(p.reconDiff))}. You can still post — the difference is saved with the meeting for follow-up.</div>` : ''}
    <p class="hint" style="margin-top:10px">Nothing has been posted yet. Review the figures, then confirm to create all accounting entries in one step.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="confirmPostMeeting()">Confirm &amp; Post Meeting</button>
      <button class="btn secondary" onclick="closeModal()">Back to Edit</button>
    </div>`);
}
// PASS 2: everything below was already validated in postMeeting(), so this loop posts the
// whole meeting in one uninterrupted pass — the meeting is only saved if every entry succeeds.
function confirmPostMeeting(){
  const p = PENDING_MEETING_PLAN; if(!p) return;
  const meetingId = nextId('MTG');
  try{
    p.rows.forEach(r=>{
      if(r.sav>0) postTxn({date:p.date,type:'Savings',debit:p.mode,credit:'MEMBER_SAVINGS',amount:r.sav,memberId:r.m.id,meetingId,narration:'Meeting savings — '+r.m.name});
      if(r.rp>0) postTxn({date:p.date,type:'Loan Repayment',debit:p.mode,credit:'MEMBER_LOANS',amount:r.rp,memberId:r.m.id,loanId:r.loan.id,meetingId,narration:'Principal repayment — '+r.m.name});
      if(r.ri>0) postTxn({date:p.date,type:'Interest Received',debit:p.mode,credit:'INTEREST_INCOME',amount:r.ri,memberId:r.m.id,loanId:r.loan?r.loan.id:'',meetingId,narration:'Interest received — '+r.m.name});
      if(r.fine>0) postTxn({date:p.date,type:'Fine',debit:p.mode,credit:'FINE_INCOME',amount:r.fine,memberId:r.m.id,meetingId,narration:'Fine/penalty — '+r.m.name});
    });
    if(p.newLoan){
      const loan = { id: nextId('LOAN'), memberId:p.newLoan.memberId, purpose:p.newLoan.purpose,
        sanctionDate:p.date, disbursementDate:p.date, principal:p.newLoan.amount, interestRate:p.newLoan.rate,
        instalments:p.newLoan.inst, frequency:'Monthly', interestMethod:'flat', status:'Active', nextDueDate: addPeriod(p.date,1,'Monthly') };
      DB.loans.push(loan);
      postTxn({date:p.date,type:'Disbursement',debit:'MEMBER_LOANS',credit:p.mode,amount:loan.principal,memberId:loan.memberId,loanId:loan.id,meetingId,narration:'Loan disbursed — '+memberName(loan.memberId)});
      logAudit('LOAN_SANCTION', loan.id+' sanctioned & disbursed for '+memberName(loan.memberId)+' — '+rupee(loan.principal)+' (via meeting)');
    }
    if(p.expense){
      postTxn({date:p.date,type:'Expense',debit:'EXP_'+p.expense.cat,credit:p.mode,amount:p.expense.amount,meetingId,narration:p.expense.narration});
    }
    if(p.deposit){
      let narration = 'Cash deposited to bank (meeting collection)';
      if(p.deposit.bankAccount) narration += ' — '+p.deposit.bankAccount;
      if(p.deposit.ref) narration += ' · Ref# '+p.deposit.ref;
      if(p.deposit.remarks) narration += ' · '+p.deposit.remarks;
      postTxn({date:p.deposit.date,type:'Bank Deposit',debit:'BANK',credit:'CASH',amount:p.deposit.amount,meetingId,narration});
    }
    const closingCash = accountBalance('CASH');
    DB.meetings.push({id:meetingId, date:p.date, totalMembers:p.totalMembers, present:p.present, presentIds:p.presentIds, absentIds:p.absentIds,
      totals:p.totals, actualReceived:p.actualReceived, mode:p.mode, closingCash,
      bankDeposit: p.deposit ? {amount:p.deposit.amount, bankAccount:p.deposit.bankAccount, ref:p.deposit.ref} : null,
      postedBy: DB.settings.currentUserName, postedAt: nowStamp()});
    logAudit('POST_MEETING', meetingId+' on '+p.date+' — '+p.present+'/'+p.totalMembers+' present, total collection '+rupee(p.totalCollection));
    let msg = 'Meeting posted. All registers, ledgers, loan positions and grading update automatically.';
    if(p.reconDiff!=null && p.reconDiff!==0) msg += ' Counted-vs-entries difference of '+rupee(Math.abs(p.reconDiff))+' was saved with the meeting.';
    if(p.mode==='CASH' && !p.deposit && p.totalCollection>0) msg += ' Remember to deposit cash collected when convenient (Deposit to Bank).';
    PENDING_MEETING_PLAN = null;
    closeModal();
    flash('ok', msg);
    ROUTE='meetings'; render();
  }catch(e){
    flash('error', 'Posting failed: '+e.message+' — no part of this meeting was saved.');
    closeModal(); render();
  }
}
// Records the SHG physically moving cash into the bank — Debit Bank, Credit Cash — outside
// of a meeting (e.g. depositing cash collected on an earlier date). It is only a transfer,
// never income or expense, so it can never affect Trial Balance or Income & Expenditure.

    </div>
    <div class="row">
      <div class="field"><label>Bank Account</label><select name="bankAccount">${banks.length ? banks.map(b=>`<option value="${esc(b.bank+' - '+b.accno)}">${esc(b.bank)} — ${esc(b.accno)}</option>`).join('') : `<option value="">Not specified</option>`}</select></div>
      <div class="field"><label>Deposit / Reference No.</label><input name="ref"></div>

function postDepositToBank(ev){
  ev.preventDefault(); const f = new FormData(ev.target);
  try{
    const date = f.get('date'), amount = parseFloat(f.get('amount'))||0, bankAccount = f.get('bankAccount')||'', ref = f.get('ref')||'', remarks = f.get('remarks')||'';
    if(amount<=0) throw new Error('Enter a deposit amount greater than zero.');
    const cashBal = accountBalance('CASH');
    if(amount > cashBal+0.5) throw new Error('Deposit amount ('+rupee(amount)+') exceeds cash in hand ('+rupee(cashBal)+'). Reduce the amount to match what is actually being deposited.');
    let narration = 'Cash deposited to bank';
    if(bankAccount) narration += ' — '+bankAccount;
    if(ref) narration += ' · Ref# '+ref;
    if(remarks) narration += ' · '+remarks;
    postTxn({date, type:'Bank Deposit', debit:'BANK', credit:'CASH', amount, narration});
    closeModal(); flash('ok','Deposit posted — Cash Book and Bank Book now reconcile automatically.'); render();
  }catch(e){ flash('error', e.message); render(); }
  return false;
}
function addMonths(dateStr,n){
  const d = new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,10);
}
// Advances a date by n instalment periods according to a loan's repayment frequency
// (Weekly/Fortnightly/Monthly). Used for both nextDueDate and the full repayment schedule.
function addPeriod(dateStr, n, frequency){
  if(frequency==='Weekly'){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+7*n); return d.toISOString().slice(0,10); }
  if(frequency==='Fortnightly'){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+14*n); return d.toISOString().slice(0,10); }
  return addMonths(dateStr, n);
}

function viewSavings(){
  let html = `<div class="section-title"><h2>Savings Register</h2></div>`;
  const rows = activeMembers().map(m=>{
    const {dr,cr} = ledgerMovement('MEMBER_SAVINGS',{memberId:m.id});
    return [m.id, esc(m.name), rightCell(rupee(cr)), rightCell(rupee(dr)), rightCell(rupee(memberSavingsBalance(m.id)))];
  });

function postSavingsEntry(ev){

function saveLoan(ev){
  ev.preventDefault(); const f=new FormData(ev.target);
  try{
    const data = Object.fromEntries(f.entries());
    // This app supports one active loan per member at a time (enforced consistently
    // everywhere a loan is matched to a member — meetings, statements, due lists), so a
    // second loan is blocked with a clear message rather than silently picking one later.
    const existing = DB.loans.find(l=>l.memberId===data.memberId && l.status!=='Closed');
    if(existing) throw new Error(memberName(data.memberId)+' already has an active loan ('+existing.id+', outstanding '+rupee(loanOutstanding(existing.id).principal)+'). Close or fully repay it before issuing a new one.');
    const loan = { id: nextId('LOAN'), memberId:data.memberId, purpose:data.purpose,
      sanctionDate:data.sanctionDate, disbursementDate:data.disbursementDate,
      principal: parseFloat(data.principal), interestRate: parseFloat(data.interestRate)||0,
      instalments: parseInt(data.instalments)||12, frequency: data.frequency||'Monthly', interestMethod: data.interestMethod||'flat',
      status:'Active', nextDueDate: addPeriod(data.disbursementDate,1,data.frequency||'Monthly') };
    DB.loans.push(loan);
    postTxn({date:data.disbursementDate,type:'Disbursement',debit:'MEMBER_LOANS',credit:data.mode,amount:loan.principal,memberId:loan.memberId,loanId:loan.id,narration:'Loan disbursed — '+memberName(loan.memberId)});
    logAudit('LOAN_SANCTION', loan.id+' sanctioned & disbursed for '+memberName(loan.memberId)+' — '+rupee(loan.principal));
    closeModal(); flash('ok','Loan disbursed.'); render();
  }catch(e){ flash('error',e.message); render(); }
  return false;
}
function closeLoan(id){
  const l = DB.loans.find(x=>x.id===id); if(!l) return;
  l.status='Closed'; logAudit('CLOSE_LOAN', id+' marked closed'); flash('ok','Loan marked closed.'); render();
}

function guardTxnAccounts(changed){
  const d = document.getElementById('txnDebit'), c = document.getElementById('txnCredit');
  const warn = document.getElementById('txnAccountWarning'), btn = document.getElementById('txnSubmitBtn');
  if(!d || !c) return;
  if(d.value===c.value){
    // Nudge whichever field the user did NOT just change onto the next different option, so they never stay stuck on the same head.
    const codes = allLedgerCodes();
    const other = changed==='debit' ? c : d;
    const idx = codes.indexOf(other.value);
    other.value = codes[(idx+1)%codes.length];
  }
  const same = d.value===c.value;
  warn.style.display = same ? 'block' : 'none';
  if(btn) btn.disabled = same;
}

    postTxn(data);
    closeModal(); flash('ok','Voucher posted.'); render();

function viewBook(code,title){
  let html = `<div class="section-title"><h2>${esc(title)}</h2>${code==='CASH'?`<button class="btn secondary" onclick="depositToBankForm()">Deposit to Bank</button>`:''}</div>`;
  // Opening balance is posted as a real transaction (Debit Cash/Bank, Credit SHG Fund — see
  // postOpeningBalances), so it already appears in the transaction loop below. Starting the
  // running balance at DB.settings.openingCash/openingBank here would double-count it.
  let bal = 0;
  const rows = [];
  DB.transactions.filter(t=>t.debit===code||t.credit===code).sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{
    const isDr = t.debit===code;
    bal += isDr? t.amount : -t.amount;
    rows.push([fmtDate(t.date), t.voucherNo, esc(t.narration||t.type), isDr?rightCell(rupee(t.amount)):'', !isDr?rightCell(rupee(t.amount)):'', rightCell(rupee(bal))]);
  });
  html += `<div class="grid cols2">${stat('Closing Balance', rupee(bal))}${stat('Entries', rows.length)}</div>`;
  html += `<div class="card">${tbl(['Date','Voucher','Particulars','Receipts (Dr)','Payments (Cr)','Balance'], rows)}</div>`;
  return html;
}

/* ============================================================ TRIAL BALANCE */
// Central Trial Balance calculation — every screen that needs a debit/credit total
// (Trial Balance view, Data Quality, Month-End Closing) reads from this single function.
function generateTrialBalance(){
  const codes = allLedgerCodes();
  let totalDr=0, totalCr=0;
  const rows = codes.map(c=>{
    const type = accountType(c);
    const normalDebit = (type==='asset'||type==='expense');
    const bal = accountBalance(c);
    const dr = normalDebit ? Math.max(bal,0) : Math.max(-bal,0);
    const cr = normalDebit ? Math.max(-bal,0) : Math.max(bal,0);
    totalDr+=dr; totalCr+=cr;
    return {code:c, label:accountLabel(c), dr, cr};
  }).filter(r=>r.dr || r.cr);
  return {rows, totalDr:Math.round(totalDr*100)/100, totalCr:Math.round(totalCr*100)/100, diff: Math.round((totalDr-totalCr)*100)/100};
}
function viewTrialBalance(){
  let html = `<div class="section-title"><h2>Trial Balance</h2><span class="hint">As on ${fmtDate(todayStr())}</span></div>`;
  const tb = generateTrialBalance();
  const rows = tb.rows.map(r=>[r.label, rightCell(r.dr?rupee(r.dr):''), rightCell(r.cr?rupee(r.cr):'')]);
  html += `<div class="card">${tbl(['Account Head','Debit','Credit'], rows.concat([['<b>TOTAL</b>', rightCell('<b>'+rupee(tb.totalDr)+'</b>'), rightCell('<b>'+rupee(tb.totalCr)+'</b>')]]))}</div>`;
  html += tb.diff===0 ? `<div class="msg ok">Trial Balance is matched. Total Debit = Total Credit.</div>` :
    `<div class="msg err">Trial Balance does NOT match. Difference: ${rupee(Math.abs(tb.diff))}. This should not normally occur since every voucher enforces equal debit and credit — check for data import issues.</div>`;
  return html;
}

/* ============================================================ FINANCIAL STATEMENTS */
function incomeExpenditure(from,to){
  const codes = allLedgerCodes();
  let income=0, expenditure=0;
  codes.forEach(c=>{
    const type = accountType(c);
    if(type==='income') income += (ledgerMovement(c,{fromDate:from,upToDate:to}).cr - ledgerMovement(c,{fromDate:from,upToDate:to}).dr);
    if(type==='expense') expenditure += (ledgerMovement(c,{fromDate:from,upToDate:to}).dr - ledgerMovement(c,{fromDate:from,upToDate:to}).cr);
  });
  return {income, expenditure, surplus: income-expenditure};
}
function viewStatements(){
  let html = `<div class="section-title"><h2>Financial Statements</h2><span class="hint">Financial Year from ${fmtDate(fyStart())}</span></div>`;
  const from = fyStart(), to = todayStr();
  const ie = incomeExpenditure(from,to);

  // Receipts & Payments (cash+bank flows)
  let receipts=0, payments=0;
  DB.transactions.filter(t=>t.date>=from && t.date<=to && !t.reversed).forEach(t=>{
    if(['CASH','BANK'].includes(t.debit) && !['CASH','BANK'].includes(t.credit)) receipts += t.amount;
    if(['CASH','BANK'].includes(t.credit) && !['CASH','BANK'].includes(t.debit)) payments += t.amount;
  });
  html += `<div class="card"><h3>Receipts & Payments Account (${fmtDate(from)} to ${fmtDate(to)})</h3>
    <div class="grid cols2">${stat('Total Receipts', rupee(receipts))}${stat('Total Payments', rupee(payments))}</div></div>`;

  html += `<div class="card"><h3>Income & Expenditure Account</h3>
    <div class="grid cols3">${stat('Income', rupee(ie.income))}${stat('Expenditure', rupee(ie.expenditure))}${stat('Surplus / (Deficit)', rupee(ie.surplus), ie.surplus<0)}</div></div>`;

  // Balance sheet
  const cash = accountBalance('CASH'), bank = accountBalance('BANK');
  const loansOut = DB.loans.filter(l=>l.status!=='Closed').reduce((s,l)=>s+loanOutstanding(l.id).principal,0);
  const otherAssets = accountBalance('OTHER_ASSETS');
  const assets = cash+bank+loansOut+otherAssets;
  const savings = activeMembers().reduce((s,m)=>s+memberSavingsBalance(m.id),0) + DB.members.filter(m=>m.status!=='Active').reduce((s,m)=>s+memberSavingsBalance(m.id),0);
  const cif = accountBalance('CIF');
  const otherLiab = accountBalance('OTHER_LIABILITIES');
  const fund = accountBalance('SHG_FUND');
  const cumulativeSurplus = incomeExpenditure('1900-01-01', to).surplus;
  const liabilities = savings + cif + otherLiab + fund + cumulativeSurplus;
  html += `<div class="card"><h3>Balance Sheet as on ${fmtDate(to)}</h3>
    <div class="grid cols2">
      <div><h4>Assets</h4>${tbl(['Head','Amount'],[
        ['Cash in Hand', rightCell(rupee(cash))], ['Bank Balance', rightCell(rupee(bank))],
        ['Member Loans Outstanding', rightCell(rupee(loansOut))], ['Other Assets', rightCell(rupee(otherAssets))],
        ['<b>Total Assets</b>', rightCell('<b>'+rupee(assets)+'</b>')]])}</div>
      <div><h4>Liabilities & Funds</h4>${tbl(['Head','Amount'],[
        ['Member Savings', rightCell(rupee(savings))], ['CIF', rightCell(rupee(cif))],
        ['Other Liabilities', rightCell(rupee(otherLiab))], ['SHG Fund/Capital', rightCell(rupee(fund))],
        ['Cumulative Surplus/(Deficit)', rightCell(rupee(cumulativeSurplus))],
        ['<b>Total Liabilities & Funds</b>', rightCell('<b>'+rupee(liabilities)+'</b>')]])}</div>
    </div>`;
  const bsDiff = Math.round((assets-liabilities)*100)/100;
  html += bsDiff===0 ? `<div class="msg ok" style="margin-top:10px">Balance Sheet is balanced.</div>` :
    `<div class="msg err" style="margin-top:10px">Balance Sheet difference of ${rupee(Math.abs(bsDiff))} detected — see Data Quality Check.</div>`;
  html += `</div>`;
  return html;
}

function viewReconciliation(){

  const bookBal = accountBalance('BANK');
  html += `<div class="card"><form onsubmit="return doRecon(event)">
    <div class="row">
      <div class="field"><label>Bank Statement Balance ₹</label><input type="number" step="0.01" name="stmtBal" id="reconStmt"></div>
      <div class="field"><label>Unpresented Cheques (−) ₹</label><input type="number" step="0.01" name="unpresented" value="0"></div>
      <div class="field"><label>Deposits in Transit (+) ₹</label><input type="number" step="0.01" name="transit" value="0"></div>
      <div class="field"><label>Bank Charges Not Recorded (−) ₹</label><input type="number" step="0.01" name="charges" value="0"></div>
      <div class="field"><label>Interest Credited Not Recorded (+) ₹</label><input type="number" step="0.01" name="interest" value="0"></div>
    </div>
    <button class="btn" type="submit">Reconcile</button>
  </form></div>`;
  html += `<div class="card"><div class="grid cols2">${stat('Book Bank Balance', rupee(bookBal))}<div id="reconResult" class="stat"><div class="lbl">Adjusted Bank Balance</div><div class="val">—</div></div></div></div>`;

}
function doRecon(ev){
  ev.preventDefault(); const f = new FormData(ev.target);
  const stmt = parseFloat(f.get('stmtBal'))||0;
  const unp = parseFloat(f.get('unpresented'))||0;
  const trans = parseFloat(f.get('transit'))||0;
  const chg = parseFloat(f.get('charges'))||0;
  const int_ = parseFloat(f.get('interest'))||0;
  const adjusted = stmt - unp + trans - chg + int_;
  const bookBal = accountBalance('BANK');
  const diff = Math.round((adjusted-bookBal)*100)/100;
  document.getElementById('reconResult').innerHTML = `<div class="lbl">Adjusted Bank Balance</div><div class="val ${diff!==0?'neg':''}">${rupee(adjusted)}</div>
    <div class="hint" style="margin-top:6px">${diff===0?'Matches book balance.':'Difference vs book balance: '+rupee(Math.abs(diff))}</div>`;
  return false;
}

/* ============================================================ DATA QUALITY */
function runDataQuality(){
  const issues = [];
  // negative balances
  if(accountBalance('CASH')<0) issues.push({sev:'red', text:'Cash balance is negative.'});
  if(accountBalance('BANK')<0) issues.push({sev:'red', text:'Bank balance is negative.'});
  // trial balance (reuses the same central calculation as the Trial Balance screen)
  if(generateTrialBalance().diff !== 0) issues.push({sev:'red', text:'Trial Balance does not match.'});
  // duplicate members
  const seen = {};
  DB.members.forEach(m=>{ const key=(m.name||'').trim().toLowerCase()+'|'+(m.fatherHusband||'').trim().toLowerCase();
    if(key.trim()!=='|'){ if(seen[key]) issues.push({sev:'amber', text:'Possible duplicate member: '+m.name}); seen[key]=true; } });
  // missing mandatory fields
  DB.members.forEach(m=>{ if(!m.mobile) issues.push({sev:'amber', text:'Member '+m.name+' has no mobile number on file.'}); });
  if(!DB.profile.name) issues.push({sev:'red', text:'SHG Profile: name is not set.'});
  if(!DB.profile.banks || !DB.profile.banks.length) issues.push({sev:'amber', text:'No bank account recorded in SHG Profile.'});
  // loan issues
  DB.loans.forEach(l=>{ if(!l.interestRate && l.interestRate!==0) issues.push({sev:'amber', text:'Loan '+l.id+' has no interest rate set.'});
    if(loanOutstanding(l.id).principal<0) issues.push({sev:'red', text:'Loan '+l.id+' shows negative outstanding — check repayments.'}); });
  // meetings without any postings
  // unposted / unbalanced transactions can't occur since engine enforces equal dr=cr per entry
  if(!DB.members.length) issues.push({sev:'amber', text:'No members registered yet.'});
  if(!DB.meetings.length) issues.push({sev:'amber', text:'No meetings have been recorded yet.'});
  return issues;
}
function dqSummaryRow(issues){
  const red = issues.filter(i=>i.sev==='red').length;
  const amber = issues.filter(i=>i.sev==='amber').length;
  let overall = red>0?'red':(amber>0?'amber':'green');
  let label = overall==='red'?'Error':(overall==='amber'?'Attention Required':'Ready');
  return `<span class="dot ${overall}"></span><b>${label}</b> &nbsp; <span class="hint">${red} error(s), ${amber} item(s) needing attention</span>`;
}
function viewDataQuality(){
  const issues = runDataQuality();
  let html = `<div class="section-title"><h2>Data Quality Check</h2></div>`;
  html += `<div class="card">${dqSummaryRow(issues)}</div>`;
  if(!issues.length){ html += `<div class="card"><div class="empty">No issues found. Records look clean.</div></div>`; return html; }
  html += `<div class="grid cols2">`;
  issues.forEach(i=>{ html += `<div class="qcard"><span class="status" style="color:var(--${i.sev==='red'?'red':(i.sev==='amber'?'amber':'green')})"><span class="dot ${i.sev}"></span>${i.sev==='red'?'Error':'Attention Required'}</span><div style="margin-top:5px">${esc(i.text)}</div></div>`; });
  html += `</div>`;
  return html;
}

/* ============================================================ HEALTH CHECK */
function daysSince(iso){ if(!iso) return null; const d=(Date.now()-new Date(iso).getTime())/86400000; return Math.floor(d); }
function storageUsageKB(){ try{ return Math.round((JSON.stringify(DB).length)/1024); }catch(e){ return 0; } }

  let html = `<div class="section-title"><h2>Health Check</h2><span class="hint">A quick, all-in-one status check of your data, backups and this device</span></div>`;

  const backupDays = daysSince(DB.settings.lastBackupAt);
  const backupStale = backupDays===null || backupDays>7;
  const storageKB = storageUsageKB();
  const storageWarn = storageKB > 4000; // browser localStorage is typically ~5-10MB
  let overall = 'green', overallLabel = 'Healthy';
  if(dqRed>0 || storageWarn){ overall='red'; overallLabel='Needs Attention'; }
  else if(dqAmber>0 || backupStale){ overall='amber'; overallLabel='Attention Recommended'; }
  html += `<div class="card"><span class="dot ${overall}"></span><b>${overallLabel}</b></div>`;

    ${stat('Last Backup', DB.settings.lastBackupAt ? (backupDays+' day(s) ago') : 'Never', backupStale)}
    ${stat('Active Members', activeMembers().length)}
    ${stat('Demo Data', DB.settings.demoDataLoaded ? 'Loaded' : 'Not loaded', DB.settings.demoDataLoaded)}
  </div>`;

  html += `<div class="card"><h3>Backup Status</h3>`;
  if(!DB.settings.lastBackupAt){
    html += `<div class="msg err">No backup has ever been taken on this device. If the browser data is cleared, all records will be lost. Take a backup now.</div>`;
  } else if(backupStale){
    html += `<div class="msg amber" style="background:var(--amber-bg);color:var(--amber)">Last backup was ${backupDays} day(s) ago (${fmtDate(DB.settings.lastBackupAt.slice(0,10))}). A fresh backup is recommended after every few meetings.</div>`;
  } else {
    html += `<div class="msg ok">Last backup was ${backupDays} day(s) ago (${fmtDate(DB.settings.lastBackupAt.slice(0,10))}). You're up to date.</div>`;
  }
  html += `<button class="btn" onclick="exportBackup();render();">Take Backup Now</button></div>`;

  html += `<div class="card"><h3>Demo Data</h3>`;
  if(DB.settings.demoDataLoaded){
    html += `<p class="hint">Sample demo records are currently in the app (members named "(DEMO)"). They are tagged internally and kept completely separate from real figures, so removing them never touches genuine records.</p>
    <button class="btn secondary" onclick="clearDemoData()">Clear Demo Data</button>`;
  } else {
    html += `<p class="hint">No demo data is loaded. Only real records are in the app.</p>
    <button class="btn secondary" onclick="loadDemoData()">Load Sample Demo Data</button>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>Device & Browser</h3>${tbl(['Check','Result'],[
    ['Local storage available', (typeof(Storage)!=='undefined') ? 'Yes' : 'No'],
    ['Network status', (typeof navigator!=='undefined' && navigator.onLine!==undefined) ? (navigator.onLine?'Online':'Offline (app still fully usable)') : 'Unknown'],
    ['Closed accounting periods', DB.closedPeriods.length ? DB.closedPeriods.join(', ') : 'None'],

  ])}</div>`;

  html += `<div class="card"><h3>Data Quality Detail</h3><div style="margin-top:4px">${dqSummaryRow(dq)}</div><div style="margin-top:8px"><a onclick="go('dataquality')" style="cursor:pointer">Open full Data Quality Check →</a></div></div>`;
  return html;

/* ============================================================ GRADING */
// Performance indicators only — meetings, attendance, savings, loan recovery. Bookkeeping/data
// quality is deliberately NOT averaged into this score (see item 17): a good-performing SHG
// should not look weak just because one field is incomplete, and a badly-kept SHG should not
// look good just because collections happened to come in. The two are reported side by side.
function computeGrading(ym){
  const [y,m] = ym.split('-').map(Number);
  const from = ym+'-01';
  const lastDay = new Date(y, m, 0).getDate();
  const to = ym+'-'+String(lastDay).padStart(2,'0');
  const monthMeetings = DB.meetings.filter(mt=>mt.date>=from && mt.date<=to);
  const freq = DB.profile.meetingFrequency||'Monthly';
  const scheduled = freq==='Weekly'?4:(freq==='Fortnightly'?2:1);
  const meetingRegularity = Math.min(100, scheduled? (monthMeetings.length/scheduled*100) : 100);
  const totalMembers = activeMembers().length || 1;
  const attendanceSum = monthMeetings.reduce((s,mt)=>s+(mt.present||0),0);
  const attendancePct = monthMeetings.length ? Math.min(100, attendanceSum/(monthMeetings.length*totalMembers)*100) : 0;
  const savers = new Set();
  DB.transactions.filter(t=>t.date>=from && t.date<=to && t.credit==='MEMBER_SAVINGS').forEach(t=>savers.add(t.memberId));
  const savingsRegularity = totalMembers? (savers.size/totalMembers*100) : 0;
  let principalRecovered = 0, principalDue = 0;
  DB.transactions.filter(t=>t.date>=from && t.date<=to && t.credit==='MEMBER_LOANS').forEach(t=>principalRecovered+=t.amount);
  DB.loans.filter(l=>l.status!=='Closed' && l.nextDueDate && l.nextDueDate>=from && l.nextDueDate<=to).forEach(l=>principalDue += (l.principal/(l.instalments||1)));
  const loanRecovery = principalDue>0 ? Math.min(100, principalRecovered/principalDue*100) : 100;
  const indicators = [
    {key:'meetings', label:'Meeting Regularity', value:meetingRegularity},
    {key:'attendance', label:'Attendance', value:attendancePct},
    {key:'savings', label:'Savings Regularity', value:savingsRegularity},
    {key:'recovery', label:'Loan Recovery', value:loanRecovery}
  ];
  const overall = indicators.reduce((s,i)=>s+i.value,0)/indicators.length;

  // Data Quality is calculated separately and can block a grade from being issued at all.
  const dq = runDataQuality();
  const dqRed = dq.filter(i=>i.sev==='red').length, dqAmber = dq.filter(i=>i.sev==='amber').length;
  const dqStatus = dqRed>0 ? 'red' : (dqAmber>0 ? 'amber' : 'green');
  const gradePending = dqRed>0;
  const grade = gradePending ? null : (overall>=80?'A':(overall>=60?'B':(overall>=40?'C':'D')));

  return { ym, indicators, overall, grade, gradePending,
    dqStatus, dqRed, dqAmber, exceptions: dqRed, ruleVersion: DB.grading.ruleVersion };
}
function viewGrading(){
  let html = `<div class="section-title"><h2>SHG Grading</h2></div>`;
  html += `<div class="msg info">Configurable/Local Grading Framework — Not an Official Government Grade. Grading Framework Version: ${esc(DB.grading.ruleVersion)}. If your SRLM/DAY-NRLM issues an official grading format, the weights and indicators below can be reconfigured to match it exactly in Settings.</div>`;
  const ym = monthKey(todayStr());
  const g = computeGrading(ym);
  html += `<div class="card"><h3>Current Month — ${ym}</h3>
    <div class="grid cols3">
      ${g.gradePending ? stat('Performance Grade', 'Pending', true) : stat('Performance Grade', g.grade)}
      ${stat('Performance Score', g.overall.toFixed(1)+'%')}
      ${stat('Data Quality', g.dqStatus==='green'?'Green':(g.dqStatus==='amber'?'Amber':'Red'), g.dqStatus!=='green')}
    </div>
    ${g.gradePending ? `<div class="msg err" style="margin-top:10px">Grade Pending — Data correction required. ${g.dqRed} critical data-quality issue(s) must be resolved before a reliable grade can be issued. <a style="cursor:pointer" onclick="go('dataquality')">Open Data Quality Check →</a></div>` : ''}
    <div style="margin-top:12px">${g.indicators.map(i=>{
      const sev = i.value>=80?'green':(i.value>=50?'amber':'red');
      return `<div class="qcard" style="margin-bottom:8px"><span class="dot ${sev}"></span><b>${esc(i.label)}</b> — ${i.value.toFixed(1)}%
        ${i.value<80?`<div class="hint" style="margin-top:4px">${gradingAction(i.key)}</div>`:''}</div>`;
    }).join('')}
    <div class="qcard" style="margin-bottom:8px"><span class="dot ${g.dqStatus}"></span><b>Data Quality (Bookkeeping)</b> — ${g.dqStatus==='green'?'No issues':(g.dqRed+' critical, '+g.dqAmber+' warning(s)')}
      <div class="hint" style="margin-top:4px">Shown separately from the performance score, per item 17 — a data gap should be visible without unfairly lowering a genuinely good performance grade.</div></div>
    </div>
    <button class="btn" style="margin-top:8px" onclick="saveGradeSnapshot('${ym}')">Save this Month's Grade to History</button>
  </div>`;

  const hist = Object.values(DB.grading.history).sort((a,b)=>a.ym<b.ym?-1:1);
  html += `<div class="card"><h3>Monthly Grading History</h3>`;
  html += hist.length ? tbl(['Month','Performance Grade','Score','Data Quality','Framework Version',''], hist.map((h,i)=>{
    const prev = hist[i-1];
    const change = prev ? (h.overall>prev.overall?'↑':(h.overall<prev.overall?'↓':'—')) : '—';
    return [h.ym, (h.gradePending?'Pending':h.grade)+' '+change, h.overall.toFixed(1)+'%',
      badge(h.dqStatus==='green'?'Green':(h.dqStatus==='amber'?'Amber':'Red'), h.dqStatus==='green'?'green':(h.dqStatus==='amber'?'amber':'red')),
      h.ruleVersion, h.revisions&&h.revisions.length ? `<a style="cursor:pointer;font-size:12px" onclick="showGradeRevisions('${h.ym}')">${h.revisions.length} revision(s)</a>` : ''];
  })) : `<div class="empty">No monthly grades saved yet.</div>`;
  html += `</div>`;
  return html;
}
function showGradeRevisions(ym){
  const h = DB.grading.history[ym]; if(!h || !h.revisions) return;
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Grade Revisions — ${esc(ym)}</h3>
    ${tbl(['Date','User','Original Grade','Revised Grade','Original Score','Revised Score','Reason'],
      h.revisions.map(r=>[fmtDate(r.date.slice(0,10)), esc(r.user), r.originalGrade||'Pending', r.revisedGrade||'Pending', r.originalScore.toFixed(1)+'%', r.revisedScore.toFixed(1)+'%', esc(r.reason||'—')]))}`);
}
function gradingAction(key){
  return ({
    meetings:'Ensure meetings are held on the scheduled day and recorded promptly.',
    attendance:'Follow up with members who are frequently absent.',
    savings:'Review members with unpaid monthly savings and remind them.',
    recovery:'Review overdue member loans and the repayment schedule.'
  })[key]||'';
}
// Central save function — used both by the manual "Save Grade" button and by Month-End
// Closing. If a CLOSED month's grade changes materially on re-save, the original and revised
// grade/score are preserved in that month's revision history rather than overwritten silently.
function saveGradeSnapshot(ym, silent){
  const g = computeGrading(ym);
  const existing = DB.grading.history[ym];
  if(existing && DB.closedPeriods.includes(ym)){
    const materialChange = existing.grade!==g.grade || Math.abs(existing.overall-g.overall)>0.5;
    if(materialChange){
      const reason = silent ? 'Recalculated at month-end closing' : (prompt('This month is closed and its grade is changing. Reason for revision:','Data correction')||'');
      const revisions = existing.revisions||[];
      revisions.push({date:nowStamp(), user:DB.settings.currentUserName, originalGrade:existing.grade, revisedGrade:g.grade,
        originalScore:existing.overall, revisedScore:g.overall, reason});
      g.revisions = revisions;
      logAudit('GRADE_REVISION', ym+': '+(existing.grade||'Pending')+' → '+(g.grade||'Pending')+' — '+reason);
    } else {
      g.revisions = existing.revisions||[];
    }
  }
  DB.grading.history[ym]=g;
  if(!silent){
    logAudit('SAVE_GRADE', ym+' grade '+(g.gradePending?'Pending':g.grade)+' saved ('+g.overall.toFixed(1)+'%)');
    flash('ok','Grade for '+ym+' saved to history.'); render();
  }
  return g;
}

function updateLokosMapping(kind, idx, val){
  if(DB.lokosMapping[kind] && DB.lokosMapping[kind][idx]){ DB.lokosMapping[kind][idx].lokos = val; saveDB(); }
}
function toCSV(headers, rows){
  const esc2 = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return headers.map(esc2).join(',')+'\n'+rows.map(r=>r.map(esc2).join(',')).join('\n');
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime||'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
// Single place that builds export rows for every module, using internal field names.
// Both the plain Reports export and the LokOS-mapped export read from here, so the two
// can never drift apart or show conflicting figures.
function buildExportData(kind){
  if(kind==='members') return {headers:['MemberID','Name','FatherHusband','Mobile','Village','DOJ','Status'],
    rows: DB.members.map(m=>[m.id,m.name,m.fatherHusband,m.mobile,m.village,m.doj,m.status])};
  if(kind==='savings') return {headers:['MemberID','Name','ClosingSavingsBalance'],
    rows: activeMembers().map(m=>[m.id,m.name,memberSavingsBalance(m.id).toFixed(2)])};
  if(kind==='loans') return {headers:['LoanID','MemberID','Member','Principal','Rate','OutstandingPrincipal','Status','NextDueDate'],
    rows: DB.loans.map(l=>[l.id,l.memberId,memberName(l.memberId),l.principal,l.interestRate,loanOutstanding(l.id).principal.toFixed(2),l.status,l.nextDueDate])};
  if(kind==='cif') return {headers:['Date','Source','Amount','Rate','PeriodMonths','OutstandingLiability'],
    rows: DB.cif.map(c=>[c.date,c.source,c.amount,c.rate,c.period,cifOutstanding().toFixed(2)])};
  if(kind==='attendance') return {headers:['MeetingDate','MemberID','Member','Present'],
    rows: DB.meetings.flatMap(mt=>activeMembers().map(m=>[mt.date,m.id,memberName(m.id), (mt.presentIds||[]).includes(m.id)?'Yes':'No']))};
  if(kind==='trialbalance'){ const tb = generateTrialBalance(); return {headers:['AccountHead','Debit','Credit'], rows: tb.rows.map(r=>[r.label, r.dr.toFixed(2), r.cr.toFixed(2)])}; }
  if(kind==='grading'){ const hist = Object.values(DB.grading.history).sort((a,b)=>a.ym<b.ym?-1:1);
    return {headers:['Month','PerformanceGrade','Score','DataQuality','FrameworkVersion'],
      rows: hist.map(h=>[h.ym, h.gradePending?'Pending':h.grade, h.overall.toFixed(1), h.dqStatus, h.ruleVersion])}; }
  if(kind==='dataquality'){ const issues = runDataQuality();
    return {headers:['Severity','Issue'], rows: issues.map(i=>[i.sev==='red'?'Critical':'Warning', i.text])}; }
  return {headers:['Date','VoucherNo','Type','Debit','Credit','Amount','MemberID','Narration'],
    rows: DB.transactions.map(t=>[t.date,t.voucherNo,t.type,t.debit,t.credit,t.amount,t.memberId,t.narration])};
}
function exportCSV(kind){
  const {headers, rows} = buildExportData(kind);
  downloadFile(kind+'_export.csv', toCSV(headers, rows));
  logAudit('EXPORT', kind+' CSV exported');
}
// LokOS-ready export: validates first, relabels headers through the configurable field
// mapping, and never exports silently over unresolved critical data-quality issues.
function generateLokOSExport(kind){
  const issues = runDataQuality();
  const red = issues.filter(i=>i.sev==='red').length;
  if(red>0 && !confirm('There '+(red===1?'is 1 critical data-quality issue':'are '+red+' critical data-quality issues')+' right now. Exporting anyway is not recommended. Export with an authorised override?')){
    return;
  }
  const {headers, rows} = buildExportData(kind);
  const map = DB.lokosMapping[kind];
  const mappedHeaders = map ? headers.map(h=>{ const f = map.find(x=>x.internal===h); return f ? f.lokos : h; }) : headers;
  downloadFile(kind+'_lokos_export.csv', toCSV(mappedHeaders, rows));
  logAudit('LOKOS_EXPORT', kind+' LokOS-mapped CSV exported'+(red>0?' (with '+red+' unresolved critical issue(s), authorised override)':''));
}

/* ============================================================ MONTH-END CLOSING */
// Runs every reconciliation check (data validation, Trial Balance, cash/bank, loans, CIF,
// savings, data quality) before allowing a month to be locked, matching item 18. This is the
// single place a month actually gets closed — the quick "Close Period" control in Settings
// remains for convenience but performs the same underlying closeMonth() function.
function monthClosingChecklist(ym){
  const from = ym+'-01';
  const [y,m] = ym.split('-').map(Number);
  const to = ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  const tb = generateTrialBalance();
  const dq = runDataQuality();
  const dqRed = dq.filter(i=>i.sev==='red').length, dqAmber = dq.filter(i=>i.sev==='amber').length;
  const monthHasMeeting = DB.meetings.some(mt=>mt.date>=from && mt.date<=to);
  return [
    {label:'Trial Balance', ok: tb.diff===0, detail: tb.diff===0?'Debit = Credit':'Mismatch of '+rupee(Math.abs(tb.diff))},
    {label:'Cash reconciliation', ok: accountBalance('CASH')>=0, detail: rupee(accountBalance('CASH'))},
    {label:'Bank reconciliation', ok: accountBalance('BANK')>=0, detail: rupee(accountBalance('BANK'))},
    {label:'Loan sub-ledger', ok: DB.loans.every(l=>loanOutstanding(l.id).principal>=-0.5), detail: DB.loans.length+' loan(s) checked'},
    {label:'CIF reconciliation', ok: accountBalance('CIF')>=0, detail: rupee(accountBalance('CIF'))},
    {label:'Savings ledger', ok: activeMembers().every(mem=>memberSavingsBalance(mem.id)>=-0.5), detail: activeMembers().length+' member(s) checked'},
    {label:'Meeting recorded this month', ok: monthHasMeeting, detail: monthHasMeeting?'Yes':'No meeting found for '+ym, warnOnly:true},
    {label:'Data Quality', ok: dqRed===0, detail: dqRed+' critical, '+dqAmber+' warning(s)'}
  ];
}
function closeMonth(ym, override){
  const checklist = monthClosingChecklist(ym);
  const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
  if(criticalFails.length && !override){
    return {ok:false, checklist, reason:'critical'};
  }
  if(!DB.closedPeriods.includes(ym)) DB.closedPeriods.push(ym);
  const g = saveGradeSnapshot(ym, true);
  logAudit('MONTH_CLOSE', ym+' closed'+(criticalFails.length?' with authorised override ('+criticalFails.length+' unresolved item(s))':'')+' — grade '+(g.gradePending?'Pending':g.grade));
  return {ok:true, checklist, grade:g};
}
function viewMonthClosing(){
  let html = `<div class="section-title"><h2>Month-End Closing</h2></div>`;
  html += `<div class="msg info">Closing a month validates every ledger, locks it against accidental editing, and permanently saves that month's grading snapshot. Corrections after closing are always made by reversal, never by silent editing.</div>`;
  const ym = monthKey(todayStr());
  html += `<div class="card"><h3>Close ${ym}</h3><div id="closingChecklist"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="runMonthClose('${ym}', false)">Run Closing Checklist</button>
    </div></div>`;
  html += `<div class="card"><h3>Closed Periods</h3>${DB.closedPeriods.length ? tbl(['Month','Grade at Closing',''],
    DB.closedPeriods.slice().sort().reverse().map(p=>{
      const h = DB.grading.history[p];
      return [p, h ? (h.gradePending?'Pending':h.grade)+' ('+h.overall.toFixed(1)+'%)' : '—',
        `<button class="btn small secondary" onclick="reopenPeriodFrom('closing','${p}')">Reopen</button>`];
    })) : `<div class="empty">No months closed yet.</div>`}</div>`;
  setTimeout(()=>runMonthClose(ym,false),0);
  return html;
}
function renderChecklist(ym, checklist){
  const el = document.getElementById('closingChecklist');
  if(!el) return;
  const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
  el.innerHTML = checklist.map(c=>`<div class="qcard" style="margin-bottom:6px"><span class="dot ${c.ok?'green':(c.warnOnly?'amber':'red')}"></span><b>${esc(c.label)}</b> — ${esc(c.detail)}</div>`).join('')
    + (criticalFails.length ?
        `<div class="msg err" style="margin-top:8px">${criticalFails.length} critical item(s) failed. Resolve them, or close with an authorised override (recorded in the audit trail).</div>
         <button class="btn danger" style="margin-top:6px" onclick="runMonthClose('${ym}', true)">Close Anyway (Authorised Override)</button>`
      : `<div class="msg ok" style="margin-top:8px">All critical checks passed.</div>
         <button class="btn" style="margin-top:6px" onclick="doCloseMonth('${ym}', false)">Confirm & Close ${esc(ym)}</button>`);
}
function runMonthClose(ym, allowOverride){
  const checklist = monthClosingChecklist(ym);
  renderChecklist(ym, checklist);
  if(allowOverride){
    const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
    if(criticalFails.length && confirm('Close '+ym+' with '+criticalFails.length+' unresolved critical item(s)? This will be recorded in the audit trail as an authorised override.')){
      doCloseMonth(ym, true);
    }
  }
}
function doCloseMonth(ym, override){
  const result = closeMonth(ym, override);
  if(!result.ok){ flash('error','Cannot close '+ym+' — critical checks failed. Resolve them or use the authorised override.'); render(); return; }
  flash('ok', ym+' closed. Grade: '+(result.grade.gradePending?'Pending':result.grade.grade)+'.');
  render();
}
function reopenPeriodFrom(fromRoute, ym){
  if(!confirm('Reopen '+ym+'? This allows further postings and edits in this period.')) return;
  DB.closedPeriods = DB.closedPeriods.filter(p=>p!==ym);
  logAudit('REOPEN_PERIOD', ym+' reopened');
  flash('ok', ym+' reopened.');
  ROUTE = fromRoute; render();
}
