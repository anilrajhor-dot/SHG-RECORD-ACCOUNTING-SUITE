  return html;
}

/* ============================================================ TRIAL BALANCE */
// Central Trial Balance calculation — every screen that needs a debit/credit total
// (Trial Balance view, Data Quality, Month-End Closing) reads from this single function.
function generateTrialBalance(){
  const codes = allLedgerCodes();
  let totalDr=0, totalCr=0;
  const rows = codes.map(c=>{
    const type = accountType(c);
    const normalDebit = (type==='asset'||type==='expense');
    const bal = accountBalance(c);
    const dr = normalDebit ? Math.max(bal,0) : Math.max(-bal,0);
    const cr = normalDebit ? Math.max(-bal,0) : Math.max(bal,0);
    totalDr+=dr; totalCr+=cr;
    return {code:c, label:accountLabel(c), dr, cr};
  }).filter(r=>r.dr || r.cr);
  return {rows, totalDr:Math.round(totalDr*100)/100, totalCr:Math.round(totalCr*100)/100, diff: Math.round((totalDr-totalCr)*100)/100};
}
function viewTrialBalance(){
  let html = `<div class="section-title"><h2>Trial Balance</h2><div class="row"><span class="hint" style="align-self:center">As on ${fmtDate(todayStr())}</span><button class="btn secondary small" onclick="shareTrialBalance()">Share</button></div></div>`;
  const tb = generateTrialBalance();
  const rows = tb.rows.map(r=>[r.label, rightCell(r.dr?rupee(r.dr):''), rightCell(r.cr?rupee(r.cr):'')]);
  html += `<div class="card">${tbl(['Account Head','Debit','Credit'], rows.concat([['<b>TOTAL</b>', rightCell('<b>'+rupee(tb.totalDr)+'</b>'), rightCell('<b>'+rupee(tb.totalCr)+'</b>')]]))}</div>`;
  html += tb.diff===0 ? `<div class="msg ok">Trial Balance is matched. Total Debit = Total Credit.</div>` :
    `<div class="msg err">Trial Balance does NOT match. Difference: ${rupee(Math.abs(tb.diff))}. This should not normally occur since every voucher enforces equal debit and credit — check for data import issues.</div>`;
  const lines = [(DB.profile.name||'SHG')+' — Trial Balance as on '+fmtDate(todayStr()), ''];
  tb.rows.forEach(r=> lines.push(r.label+': Dr '+rupee(r.dr)+' / Cr '+rupee(r.cr)));
  lines.push(''); lines.push('Total: Dr '+rupee(tb.totalDr)+' / Cr '+rupee(tb.totalCr));
  window.__trialBalanceShareText = lines.join('\n');
  return html;
}
function shareTrialBalance(){ shareText((DB.profile.name||'SHG')+' — Trial Balance', window.__trialBalanceShareText||'Not generated yet.'); }

/* ============================================================ FINANCIAL STATEMENTS */
function incomeExpenditure(from,to){
  const codes = allLedgerCodes();
  let income=0, expenditure=0;
  codes.forEach(c=>{
    const type = accountType(c);
    if(type==='income') income += (ledgerMovement(c,{fromDate:from,upToDate:to}).cr - ledgerMovement(c,{fromDate:from,upToDate:to}).dr);
    if(type==='expense') expenditure += (ledgerMovement(c,{fromDate:from,upToDate:to}).dr - ledgerMovement(c,{fromDate:from,upToDate:to}).cr);
  });
  return {income, expenditure, surplus: income-expenditure};
}
function viewStatements(){
  let html = `<div class="section-title"><h2>Financial Statements</h2><div class="row"><span class="hint" style="align-self:center">Financial Year from ${fmtDate(fyStart())}</span><button class="btn secondary small" onclick="shareStatements()">Share</button></div></div>`;
  html += `<div class="msg info">Income &amp; Expenditure Account and Balance Sheet are presented in the classic Indian "T" (Dr/Cr — Liabilities/Assets) format commonly used for Not-for-Profit Organisations and Societies, as recommended in ICAI's guidance for NPO accounting.</div>`;
  const from = fyStart(), to = todayStr();
  const codes = allLedgerCodes();

  // --- Receipts & Payments Account ---
  let receipts=0, payments=0;
  DB.transactions.filter(t=>t.date>=from && t.date<=to && !t.reversed).forEach(t=>{
    if(['CASH','BANK'].includes(t.debit) && !['CASH','BANK'].includes(t.credit)) receipts += t.amount;
    if(['CASH','BANK'].includes(t.credit) && !['CASH','BANK'].includes(t.debit)) payments += t.amount;
  });
  html += `<div class="card"><h3>Receipts &amp; Payments Account (${fmtDate(from)} to ${fmtDate(to)})</h3>
    <div class="grid cols2">${stat('Total Receipts', rupee(receipts))}${stat('Total Payments', rupee(payments))}</div></div>`;

  // --- Income & Expenditure Account (ICAI horizontal Dr/Cr format) ---
  const expenseLines = codes.filter(c=>accountType(c)==='expense').map(c=>{
    const amt = Math.round((ledgerMovement(c,{fromDate:from,upToDate:to}).dr - ledgerMovement(c,{fromDate:from,upToDate:to}).cr)*100)/100;
    return {label:accountLabel(c), amt};
  }).filter(x=>x.amt>0);
  const incomeLines = codes.filter(c=>accountType(c)==='income').map(c=>{
    const amt = Math.round((ledgerMovement(c,{fromDate:from,upToDate:to}).cr - ledgerMovement(c,{fromDate:from,upToDate:to}).dr)*100)/100;
    return {label:accountLabel(c), amt};
  }).filter(x=>x.amt>0);
  const totalExpenditure = Math.round(expenseLines.reduce((s,x)=>s+x.amt,0)*100)/100;
  const totalIncome = Math.round(incomeLines.reduce((s,x)=>s+x.amt,0)*100)/100;
  const ieSurplus = Math.round((totalIncome-totalExpenditure)*100)/100;
  const drRows = expenseLines.map(x=>['To '+x.label, rightCell(rupee(x.amt))]);
  const crRows = incomeLines.map(x=>['By '+x.label, rightCell(rupee(x.amt))]);
  if(ieSurplus>0) drRows.push(['To Excess of Income over Expenditure (transferred to Capital Fund)', rightCell('<b>'+rupee(ieSurplus)+'</b>')]);
  if(ieSurplus<0) crRows.push(['By Excess of Expenditure over Income (transferred to Capital Fund)', rightCell('<b>'+rupee(Math.abs(ieSurplus))+'</b>')]);
  const ieTotal = Math.round((totalExpenditure + Math.max(0,ieSurplus))*100)/100; // == totalIncome + max(0,-ieSurplus)
  while(drRows.length<crRows.length) drRows.push(['','']);
  while(crRows.length<drRows.length) crRows.push(['','']);
  html += `<div class="card"><h3>Income &amp; Expenditure Account for the year ${fmtDate(from)} to ${fmtDate(to)}</h3>
    <div class="tablewrap"><table><thead><tr><th>Expenditure</th><th>Amount</th><th>Income</th><th>Amount</th></tr></thead><tbody>
      ${drRows.map((r,i)=>`<tr><td>${esc(r[0])}</td><td class="num">${r[1]?r[1].slice(3):''}</td><td>${esc(crRows[i][0])}</td><td class="num">${crRows[i][1]?crRows[i][1].slice(3):''}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${rupee(ieTotal)}</b></td><td><b>Total</b></td><td class="num"><b>${rupee(ieTotal)}</b></td></tr>
    </tbody></table></div>
    ${(!expenseLines.length && !incomeLines.length) ? '<div class="empty">No income or expenditure recorded for this period.</div>' : ''}
    <p class="hint" style="margin-top:8px">Loan principal disbursed and repaid, savings deposits/withdrawals, and CIF receipts are balance-sheet items (assets/liabilities), not income or expenditure, and are excluded here as per standard practice.</p>
  </div>`;

  // --- Balance Sheet (ICAI horizontal Liabilities/Assets format) ---
  const cash = accountBalance('CASH'), bank = accountBalance('BANK'), upi = accountBalance('UPI');
  const loansOut = DB.loans.filter(l=>l.status!=='Closed').reduce((s,l)=>s+loanOutstanding(l.id).principal,0);
  const otherAssets = accountBalance('OTHER_ASSETS');
  const corpus = calculateCorpus();
  const savings = corpus.savings, cif = corpus.cif, capitalFund = corpus.capitalFund, revolvingFund = corpus.revolvingFund;
  const otherLiab = accountBalance('OTHER_LIABILITIES');
  const bankTL = accountBalance('BANK_TL'), bankCC = accountBalance('BANK_CC');
  const assetRows = [
    ['Cash in Hand', rightCell(rupee(cash))],
    ['Bank Balance', rightCell(rupee(bank))],
    ['UPI Balance', rightCell(rupee(upi))],
    ['Loans to Members (Outstanding)', rightCell(rupee(loansOut))],
    ['Other Assets', rightCell(rupee(otherAssets))]
  ];
  const liabRows = [
    ['Capital Fund / General Fund', rightCell(rupee(capitalFund))],
    ['  (Opening balance + cumulative surplus/deficit)', ''],
    ['Community Investment Fund (CIF)', rightCell(rupee(cif))],
    ['Revolving Fund (RF)', rightCell(rupee(revolvingFund))],
    ['Members Savings', rightCell(rupee(savings))],
    ['Bank Term Loan (TL) Payable', rightCell(rupee(bankTL))],
    ['Bank Cash Credit (CC) Payable', rightCell(rupee(bankCC))],
    ['Other Liabilities', rightCell(rupee(otherLiab))]
  ];
  const totalAssets = Math.round((cash+bank+upi+loansOut+otherAssets)*100)/100;
  const totalLiabilities = Math.round((capitalFund+cif+revolvingFund+savings+bankTL+bankCC+otherLiab)*100)/100;
  let liabDisplay = liabRows.slice(); let assetDisplay = assetRows.slice();
  while(liabDisplay.length<assetDisplay.length) liabDisplay.push(['','']);
  while(assetDisplay.length<liabDisplay.length) assetDisplay.push(['','']);
  html += `<div class="card"><h3>Balance Sheet as on ${fmtDate(to)}</h3>
    <div class="tablewrap"><table><thead><tr><th>Liabilities</th><th>Amount</th><th>Assets</th><th>Amount</th></tr></thead><tbody>
      ${liabDisplay.map((r,i)=>`<tr><td>${esc(r[0])}</td><td class="num">${r[1]?r[1].slice(3):''}</td><td>${esc(assetDisplay[i][0])}</td><td class="num">${assetDisplay[i][1]?assetDisplay[i][1].slice(3):''}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${rupee(totalLiabilities)}</b></td><td><b>Total</b></td><td class="num"><b>${rupee(totalAssets)}</b></td></tr>
    </tbody></table></div>`;
  const bsDiff = Math.round((totalAssets-totalLiabilities)*100)/100;
  html += bsDiff===0 ? `<div class="msg ok" style="margin-top:10px">Balance Sheet is balanced (Total Liabilities = Total Assets).</div>` :
    `<div class="msg err" style="margin-top:10px">Balance Sheet difference of ${rupee(Math.abs(bsDiff))} detected — see Data Quality Check.</div>`;
  html += `</div>`;

  html += `<div class="card"><h3>Notes to Accounts</h3>
    <p><b>Note 1 — Composition of Corpus</b></p>
    ${tbl(['Particulars','Amount'],[
      ['Members Savings', rightCell(rupee(savings))],
      ['Capital Fund / General Fund', rightCell(rupee(capitalFund))],
      ['Community Investment Fund (CIF)', rightCell(rupee(cif))],
      ['Revolving Fund (RF)', rightCell(rupee(revolvingFund))],
      ['<b>Total Corpus</b>', rightCell('<b>'+rupee(corpus.total)+'</b>')]
    ])}
    <p class="hint" style="margin-top:6px">Corpus is the SHG's own internal fund base — members savings plus accumulated surplus (Capital Fund) plus CIF plus Revolving Fund — used for internal lending and as the basis for bank credit-linkage eligibility (see Bank Loan Application). Bank Term Loan/Cash Credit (TL/CC) are external borrowings, not part of corpus, and are shown separately above.</p>
  </div>`;

  // Plain-text version for the Share button — same figures as above, nothing recalculated.

function viewReconciliation(){

  html += `<div class="card"><form onsubmit="return doRecon(event)">

      <div class="field"><label>Unpresented Cheques (−) ₹</label><input type="number" step="0.01" name="unpresented" value="0"></div>
      <div class="field"><label>Deposits in Transit (+) ₹</label><input type="number" step="0.01" name="transit" value="0"></div>
      <div class="field"><label>Bank Charges Not Recorded (−) ₹</label><input type="number" step="0.01" name="charges" value="0"></div>
      <div class="field"><label>Interest Credited Not Recorded (+) ₹</label><input type="number" step="0.01" name="interest" value="0"></div>
    </div>
    <button class="btn" type="submit">Reconcile</button>

  html += `<div class="card"><div class="grid cols2">${stat('Book Bank Balance', rupee(bookBal))}<div id="reconResult" class="stat"><div class="lbl">Adjusted Bank Balance</div><div class="val">—</div></div></div></div>`;

}
function doRecon(ev){
  ev.preventDefault(); const f = new FormData(ev.target);
  const stmt = parseFloat(f.get('stmtBal'))||0;
  const unp = parseFloat(f.get('unpresented'))||0;
  const trans = parseFloat(f.get('transit'))||0;
  const chg = parseFloat(f.get('charges'))||0;
  const int_ = parseFloat(f.get('interest'))||0;
  const adjusted = stmt - unp + trans - chg + int_;
  const bookBal = accountBalance('BANK');
  const diff = Math.round((adjusted-bookBal)*100)/100;
  document.getElementById('reconResult').innerHTML = `<div class="lbl">Adjusted Bank Balance</div><div class="val ${diff!==0?'neg':''}">${rupee(adjusted)}</div>
    <div class="hint" style="margin-top:6px">${diff===0?'Matches book balance.':'Difference vs book balance: '+rupee(Math.abs(diff))}</div>`;
  return false;
}

/* ============================================================ DATA QUALITY */
function runDataQuality(){
  const issues = [];
  // negative balances
  if(accountBalance('CASH')<0) issues.push({sev:'red', text:'Cash balance is negative.'});
  if(accountBalance('BANK')<0) issues.push({sev:'red', text:'Bank balance is negative.'});
  // trial balance (reuses the same central calculation as the Trial Balance screen)
  if(generateTrialBalance().diff !== 0) issues.push({sev:'red', text:'Trial Balance does not match.'});
  // duplicate members
  const seen = {};
  DB.members.forEach(m=>{ const key=(m.name||'').trim().toLowerCase()+'|'+(m.fatherHusband||'').trim().toLowerCase();
    if(key.trim()!=='|'){ if(seen[key]) issues.push({sev:'amber', text:'Possible duplicate member: '+m.name}); seen[key]=true; } });
  // missing mandatory fields
  DB.members.forEach(m=>{ if(!m.mobile) issues.push({sev:'amber', text:'Member '+m.name+' has no mobile number on file.'}); });
  if(!DB.profile.name) issues.push({sev:'red', text:'SHG Profile: name is not set.'});
  if(!DB.profile.banks || !DB.profile.banks.length) issues.push({sev:'amber', text:'No bank account recorded in SHG Profile.'});
  // loan issues — every check operates on one Loan ID at a time, never a member-level merge
  const loanIdCounts = {};
  const memberIdSetEarly = new Set(DB.members.map(m=>m.id));
  DB.loans.forEach(l=>{
    if(!l.memberId) issues.push({sev:'red', text:'Loan '+l.id+' has no Member ID linked to it.'});
    else if(!memberIdSetEarly.has(l.memberId)) issues.push({sev:'red', text:'Loan '+l.id+' is linked to a member that no longer exists.'});
    if(!l.principal || l.principal<=0) issues.push({sev:'red', text:'Loan '+l.id+' has no valid principal amount.'});
    if(!l.disbursementDate || isNaN(new Date(l.disbursementDate+'T00:00:00').getTime())) issues.push({sev:'red', text:'Loan '+l.id+' has a missing or invalid disbursement date.'});
    if(!l.interestRate && l.interestRate!==0) issues.push({sev:'amber', text:'Loan '+l.id+' has no interest rate set.'});
    if(l.interestRate<0) issues.push({sev:'red', text:'Loan '+l.id+' has a negative interest rate.'});
    if(!['Weekly','Fortnightly','Monthly'].includes(l.frequency||'Monthly')) issues.push({sev:'amber', text:'Loan '+l.id+' has an unrecognised repayment frequency.'});
    if(!l.instalments || l.instalments<1) issues.push({sev:'red', text:'Loan '+l.id+' has an invalid number of instalments.'});
    if(loanOutstanding(l.id).principal<0) issues.push({sev:'red', text:'Loan '+l.id+' shows negative outstanding — check repayments.'});
    loanIdCounts[l.id] = (loanIdCounts[l.id]||0)+1;
    // Cross-check: outstanding from the ledger must agree with outstanding derived from the
    // loan's own schedule — these are two different views of the same data (item 16/17); if
    // they ever disagree it signals a genuine bug rather than a normal data-entry issue.
    const schedule = generateLoanSchedule(l.id);
    const scheduleOutstanding = Math.max(0, Math.round((l.principal - schedule.reduce((s,r)=>s+r.principalPaid,0))*100)/100);
    if(Math.abs(scheduleOutstanding - loanOutstanding(l.id).principal) > 1) issues.push({sev:'red', text:'Loan '+l.id+': ledger balance and repayment schedule disagree — data may need review.'});
  });
  Object.keys(loanIdCounts).forEach(id=>{ if(loanIdCounts[id]>1) issues.push({sev:'red', text:'Duplicate Loan ID detected: '+id+' appears more than once.'}); });
  // orphan transactions: a loanId or memberId that no longer matches any real record
  const loanIdSet = new Set(DB.loans.map(l=>l.id)), memberIdSet = new Set(DB.members.map(m=>m.id));
  DB.transactions.forEach(t=>{
    if(t.loanId && !loanIdSet.has(t.loanId)) issues.push({sev:'red', text:'Transaction '+t.voucherNo+' references loan '+t.loanId+', which no longer exists.'});
    if(t.memberId && !memberIdSet.has(t.memberId)) issues.push({sev:'red', text:'Transaction '+t.voucherNo+' references a member that no longer exists.'});
    // A repayment/interest transaction's memberId must match the loan it's tagged against.
    if(t.loanId && t.memberId && (t.credit==='MEMBER_LOANS'||t.credit==='INTEREST_INCOME')){
      const loan = DB.loans.find(l=>l.id===t.loanId);
      if(loan && loan.memberId!==t.memberId) issues.push({sev:'red', text:'Transaction '+t.voucherNo+' posts to loan '+t.loanId+' but that loan belongs to a different member.'});
    }
    // A principal or interest repayment posted with no Loan ID at all cannot be attributed to
    // any specific loan's sub-ledger — this breaks loan-wise accounting and is always critical.
    if(!t.reversed && !t.loanId && (t.type==='Loan Repayment'||t.type==='Interest Received')){
      issues.push({sev:'red', text:'Transaction '+t.voucherNo+' is a '+t.type+' with no Loan ID — it cannot be attributed to a specific loan.'});
    }
  });
  // repayment posted against a loan that is now closed (the loan may have been closed after this posting)
  DB.transactions.filter(t=>!t.reversed && t.loanId && t.credit==='MEMBER_LOANS').forEach(t=>{
    const loan = DB.loans.find(l=>l.id===t.loanId);
    if(loan && loan.status==='Closed' && loanOutstanding(loan.id).principal<-0.5) issues.push({sev:'amber', text:'Loan '+t.loanId+' is closed but shows an overpaid/negative position — check repayment history.'});
  });
  // possible duplicate transactions: same loan, date, type and amount posted more than once
  const txKeySeen = {};
  DB.transactions.filter(t=>!t.reversed && t.loanId && (t.type==='Loan Repayment'||t.type==='Interest Received')).forEach(t=>{
    const key = t.loanId+'|'+t.date+'|'+t.type+'|'+t.amount;
    if(txKeySeen[key]) issues.push({sev:'amber', text:'Possible duplicate: loan '+t.loanId+' has two '+t.type+' entries of '+rupee(t.amount)+' on '+fmtDate(t.date)+'.'});
    txKeySeen[key] = true;
  });
  // meetings without any postings
  // unposted / unbalanced transactions can't occur since engine enforces equal dr=cr per entry
  if(!DB.members.length) issues.push({sev:'amber', text:'No members registered yet.'});
  if(!DB.meetings.length) issues.push({sev:'amber', text:'No meetings have been recorded yet.'});
  return issues;
}
function dqSummaryRow(issues){
  const red = issues.filter(i=>i.sev==='red').length;
  const amber = issues.filter(i=>i.sev==='amber').length;
  let overall = red>0?'red':(amber>0?'amber':'green');
  let label = overall==='red'?'Error':(overall==='amber'?'Attention Required':'Ready');
  return `<span class="dot ${overall}"></span><b>${label}</b> &nbsp; <span class="hint">${red} error(s), ${amber} item(s) needing attention</span>`;
}
function viewDataQuality(){
  const issues = runDataQuality();
  let html = `<div class="section-title"><h2>Data Quality Check</h2></div>`;
  html += `<div class="card">${dqSummaryRow(issues)}</div>`;
  if(!issues.length){ html += `<div class="card"><div class="empty">No issues found. Records look clean.</div></div>`; return html; }
  html += `<div class="grid cols2">`;
  issues.forEach(i=>{ html += `<div class="qcard"><span class="status" style="color:var(--${i.sev==='red'?'red':(i.sev==='amber'?'amber':'green')})"><span class="dot ${i.sev}"></span>${i.sev==='red'?'Error':'Attention Required'}</span><div style="margin-top:5px">${esc(i.text)}</div></div>`; });
  html += `</div>`;
  return html;
}

/* ============================================================ HEALTH CHECK */
function daysSince(iso){ if(!iso) return null; const d=(Date.now()-new Date(iso).getTime())/86400000; return Math.floor(d); }
function storageUsageKB(){ try{ return Math.round((JSON.stringify(DB).length)/1024); }catch(e){ return 0; } }
function viewHealthCheck(){
  let html = `<div class="section-title"><h2>Health Check</h2><span class="hint">A quick, all-in-one status check of your data, backups and this device</span></div>`;

  // --- overall status
  const dq = runDataQuality();
  const dqRed = dq.filter(i=>i.sev==='red').length, dqAmber = dq.filter(i=>i.sev==='amber').length;
  const backupDays = daysSince(DB.settings.lastBackupAt);
  const backupStale = backupDays===null || backupDays>7;
  const storageKB = storageUsageKB();
  const storageWarn = storageKB > 4000; // browser localStorage is typically ~5-10MB
  let overall = 'green', overallLabel = 'Healthy';
  if(dqRed>0 || storageWarn){ overall='red'; overallLabel='Needs Attention'; }
  else if(dqAmber>0 || backupStale){ overall='amber'; overallLabel='Attention Recommended'; }
  html += `<div class="card"><span class="dot ${overall}"></span><b>${overallLabel}</b></div>`;

  html += `<div class="grid cols3">
    ${stat('Data Quality Errors', dqRed, dqRed>0)}
    ${stat('Data Quality Warnings', dqAmber, dqAmber>0)}
    ${stat('Storage Used', storageKB+' KB', storageWarn)}
    ${stat('Last Backup', DB.settings.lastBackupAt ? (backupDays+' day(s) ago') : 'Never', backupStale)}
    ${stat('Active Members', activeMembers().length)}
    ${stat('Demo Data', DB.settings.demoDataLoaded ? 'Loaded' : 'Not loaded', DB.settings.demoDataLoaded)}
  </div>`;

  html += `<div class="card"><h3>Backup Status</h3>`;
  if(!DB.settings.lastBackupAt){
    html += `<div class="msg err">No backup has ever been taken on this device. If the browser data is cleared, all records will be lost. Take a backup now.</div>`;
  } else if(backupStale){
    html += `<div class="msg amber" style="background:var(--amber-bg);color:var(--amber)">Last backup was ${backupDays} day(s) ago (${fmtDate(DB.settings.lastBackupAt.slice(0,10))}). A fresh backup is recommended after every few meetings.</div>`;
  } else {
    html += `<div class="msg ok">Last backup was ${backupDays} day(s) ago (${fmtDate(DB.settings.lastBackupAt.slice(0,10))}). You're up to date.</div>`;
  }
  html += `<button class="btn" onclick="exportBackup();render();">Take Backup Now</button></div>`;

  html += `<div class="card"><h3>Demo Data</h3>`;
  if(DB.settings.demoDataLoaded){
    html += `<p class="hint">Sample demo records are currently in the app (members named "(DEMO)"). They are tagged internally and kept completely separate from real figures, so removing them never touches genuine records.</p>
    <button class="btn secondary" onclick="clearDemoData()">Clear Demo Data</button>`;
  } else {
    html += `<p class="hint">No demo data is loaded. Only real records are in the app.</p>
    <button class="btn secondary" onclick="loadDemoData()">Load Sample Demo Data</button>`;
  }
  html += `</div>`;

  html += `<div class="card"><h3>Device & Browser</h3>${tbl(['Check','Result'],[
    ['Local storage available', (typeof(Storage)!=='undefined') ? 'Yes' : 'No'],
    ['Network status', (typeof navigator!=='undefined' && navigator.onLine!==undefined) ? (navigator.onLine?'Online':'Offline (app still fully usable)') : 'Unknown'],
    ['Closed accounting periods', DB.closedPeriods.length ? DB.closedPeriods.join(', ') : 'None'],
    ['Total transactions recorded', DB.transactions.length]
  ])}</div>`;

  html += `<div class="card"><h3>Data Quality Detail</h3><div style="margin-top:4px">${dqSummaryRow(dq)}</div><div style="margin-top:8px"><a onclick="go('dataquality')" style="cursor:pointer">Open full Data Quality Check →</a></div></div>`;
  return html;

/* ============================================================ GRADING */
// Performance indicators only — meetings, attendance, savings, loan recovery. Bookkeeping/data
// quality is deliberately NOT averaged into this score (see item 17): a good-performing SHG
// should not look weak just because one field is incomplete, and a badly-kept SHG should not
// look good just because collections happened to come in. The two are reported side by side.
function computeGrading(ym){
  const [y,m] = ym.split('-').map(Number);
  const from = ym+'-01';
  const lastDay = new Date(y, m, 0).getDate();
  const to = ym+'-'+String(lastDay).padStart(2,'0');
  const monthMeetings = DB.meetings.filter(mt=>mt.date>=from && mt.date<=to);
  const freq = DB.profile.meetingFrequency||'Monthly';
  const scheduled = freq==='Weekly'?4:(freq==='Fortnightly'?2:1);
  const meetingRegularity = Math.min(100, scheduled? (monthMeetings.length/scheduled*100) : 100);
  const totalMembers = activeMembers().length || 1;
  const attendanceSum = monthMeetings.reduce((s,mt)=>s+(mt.present||0),0);
  const attendancePct = monthMeetings.length ? Math.min(100, attendanceSum/(monthMeetings.length*totalMembers)*100) : 0;
  const savers = new Set();
  DB.transactions.filter(t=>t.date>=from && t.date<=to && t.credit==='MEMBER_SAVINGS').forEach(t=>savers.add(t.memberId));
  const savingsRegularity = totalMembers? (savers.size/totalMembers*100) : 0;
  let principalRecovered = 0, principalDue = 0;
  DB.transactions.filter(t=>t.date>=from && t.date<=to && t.credit==='MEMBER_LOANS').forEach(t=>principalRecovered+=t.amount);
  DB.loans.filter(l=>l.status!=='Closed' && l.nextDueDate && l.nextDueDate>=from && l.nextDueDate<=to).forEach(l=>principalDue += (l.principal/(l.instalments||1)));
  const loanRecovery = principalDue>0 ? Math.min(100, principalRecovered/principalDue*100) : 100;
  const indicators = [
    {key:'meetings', label:'Meeting Regularity', value:meetingRegularity},
    {key:'attendance', label:'Attendance', value:attendancePct},
    {key:'savings', label:'Savings Regularity', value:savingsRegularity},
    {key:'recovery', label:'Loan Recovery', value:loanRecovery}
  ];
  const overall = indicators.reduce((s,i)=>s+i.value,0)/indicators.length;

  // Data Quality is calculated separately and can block a grade from being issued at all.
  const dq = runDataQuality();
  const dqRed = dq.filter(i=>i.sev==='red').length, dqAmber = dq.filter(i=>i.sev==='amber').length;
  const dqStatus = dqRed>0 ? 'red' : (dqAmber>0 ? 'amber' : 'green');
  const gradePending = dqRed>0;
  const grade = gradePending ? null : (overall>=80?'A':(overall>=60?'B':(overall>=40?'C':'D')));

  return { ym, indicators, overall, grade, gradePending,
    dqStatus, dqRed, dqAmber, exceptions: dqRed, ruleVersion: DB.grading.ruleVersion };
}
function viewGrading(){
  let html = `<div class="section-title"><h2>SHG Grading</h2></div>`;
  html += `<div class="msg info">Configurable/Local Grading Framework — Not an Official Government Grade. Grading Framework Version: ${esc(DB.grading.ruleVersion)}. If your SRLM/DAY-NRLM issues an official grading format, the weights and indicators below can be reconfigured to match it exactly in Settings.</div>`;
  const ym = monthKey(todayStr());
  const g = computeGrading(ym);
  html += `<div class="card"><h3>Current Month — ${ym}</h3>
    <div class="grid cols3">
      ${g.gradePending ? stat('Performance Grade', 'Pending', true) : stat('Performance Grade', g.grade)}
      ${stat('Performance Score', g.overall.toFixed(1)+'%')}
      ${stat('Data Quality', g.dqStatus==='green'?'Green':(g.dqStatus==='amber'?'Amber':'Red'), g.dqStatus!=='green')}
    </div>
    ${g.gradePending ? `<div class="msg err" style="margin-top:10px">Grade Pending — Data correction required. ${g.dqRed} critical data-quality issue(s) must be resolved before a reliable grade can be issued. <a style="cursor:pointer" onclick="go('dataquality')">Open Data Quality Check →</a></div>` : ''}
    <div style="margin-top:12px">${g.indicators.map(i=>{
      const sev = i.value>=80?'green':(i.value>=50?'amber':'red');
      return `<div class="qcard" style="margin-bottom:8px"><span class="dot ${sev}"></span><b>${esc(i.label)}</b> — ${i.value.toFixed(1)}%
        ${i.value<80?`<div class="hint" style="margin-top:4px">${gradingAction(i.key)}</div>`:''}</div>`;
    }).join('')}
    <div class="qcard" style="margin-bottom:8px"><span class="dot ${g.dqStatus}"></span><b>Data Quality (Bookkeeping)</b> — ${g.dqStatus==='green'?'No issues':(g.dqRed+' critical, '+g.dqAmber+' warning(s)')}
      <div class="hint" style="margin-top:4px">Shown separately from the performance score, per item 17 — a data gap should be visible without unfairly lowering a genuinely good performance grade.</div></div>
    </div>
    <button class="btn" style="margin-top:8px" onclick="saveGradeSnapshot('${ym}')">Save this Month's Grade to History</button>
  </div>`;

  const hist = Object.values(DB.grading.history).sort((a,b)=>a.ym<b.ym?-1:1);
  html += `<div class="card"><h3>Monthly Grading History</h3>`;
  html += hist.length ? tbl(['Month','Performance Grade','Score','Data Quality','Framework Version',''], hist.map((h,i)=>{
    const prev = hist[i-1];
    const change = prev ? (h.overall>prev.overall?'↑':(h.overall<prev.overall?'↓':'—')) : '—';
    return [h.ym, (h.gradePending?'Pending':h.grade)+' '+change, h.overall.toFixed(1)+'%',
      badge(h.dqStatus==='green'?'Green':(h.dqStatus==='amber'?'Amber':'Red'), h.dqStatus==='green'?'green':(h.dqStatus==='amber'?'amber':'red')),
      h.ruleVersion, h.revisions&&h.revisions.length ? `<a style="cursor:pointer;font-size:12px" onclick="showGradeRevisions('${h.ym}')">${h.revisions.length} revision(s)</a>` : ''];
  })) : `<div class="empty">No monthly grades saved yet.</div>`;
  html += `</div>`;
  return html;
}
function showGradeRevisions(ym){
  const h = DB.grading.history[ym]; if(!h || !h.revisions) return;
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>Grade Revisions — ${esc(ym)}</h3>
    ${tbl(['Date','User','Original Grade','Revised Grade','Original Score','Revised Score','Reason'],
      h.revisions.map(r=>[fmtDate(r.date.slice(0,10)), esc(r.user), r.originalGrade||'Pending', r.revisedGrade||'Pending', r.originalScore.toFixed(1)+'%', r.revisedScore.toFixed(1)+'%', esc(r.reason||'—')]))}`);
}
function gradingAction(key){
  return ({
    meetings:'Ensure meetings are held on the scheduled day and recorded promptly.',
    attendance:'Follow up with members who are frequently absent.',
    savings:'Review members with unpaid monthly savings and remind them.',
    recovery:'Review overdue member loans and the repayment schedule.'
  })[key]||'';
}
// Central save function — used both by the manual "Save Grade" button and by Month-End
// Closing. If a CLOSED month's grade changes materially on re-save, the original and revised
// grade/score are preserved in that month's revision history rather than overwritten silently.
function saveGradeSnapshot(ym, silent){
  const g = computeGrading(ym);
  const existing = DB.grading.history[ym];
  if(existing && DB.closedPeriods.includes(ym)){
    const materialChange = existing.grade!==g.grade || Math.abs(existing.overall-g.overall)>0.5;
    if(materialChange){
      const reason = silent ? 'Recalculated at month-end closing' : (prompt('This month is closed and its grade is changing. Reason for revision:','Data correction')||'');
      const revisions = existing.revisions||[];
      revisions.push({date:nowStamp(), user:DB.settings.currentUserName, originalGrade:existing.grade, revisedGrade:g.grade,
        originalScore:existing.overall, revisedScore:g.overall, reason});
      g.revisions = revisions;
      logAudit('GRADE_REVISION', ym+': '+(existing.grade||'Pending')+' → '+(g.grade||'Pending')+' — '+reason);
    } else {
      g.revisions = existing.revisions||[];
    }
  }
  DB.grading.history[ym]=g;
  if(!silent){
    logAudit('SAVE_GRADE', ym+' grade '+(g.gradePending?'Pending':g.grade)+' saved ('+g.overall.toFixed(1)+'%)');
    flash('ok','Grade for '+ym+' saved to history.'); render();
  }
  return g;
}

/* ============================================================ LOKOS READINESS & EXPORT */
function viewLokos(){
  let html = `<div class="section-title"><h2>LokOS Data Readiness & Export</h2></div>`;

/* ============================================================ BANK LOAN APPLICATION (CCL / Term Loan) */
// Drafts a bank loan application for progressive SHG-Bank credit linkage ("doses"). The
// eligible-amount formula (corpus × a configurable multiple, subject to a floor) is a locally
// editable default reflecting common DAY-NRLM SHG-Bank Linkage practice — it is NOT an
// official RBI/NABARD figure fixed in this app. The generated letter is always a DRAFT for the
// SHG's own review; it must be checked against the bank's and SRLM's current requirements
// before signature and submission.
function calculateDoseEligibility(dose, corpusTotal){
  const cfg = DB.loanDoseEligibility.find(d=>d.dose===dose) || DB.loanDoseEligibility[DB.loanDoseEligibility.length-1];
  const byMultiple = cfg.multiplier>0 ? Math.round(corpusTotal*cfg.multiplier) : 0;
  const eligible = Math.max(cfg.minAmount, byMultiple);
  return { cfg, byMultiple, eligible: Math.ceil(eligible/1000)*1000 };
}

  html += `<div class="card"><h3>Current Corpus</h3><div class="grid cols4">

function toCSV(headers, rows){
  const esc2 = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  return headers.map(esc2).join(',')+'\n'+rows.map(r=>r.map(esc2).join(',')).join('\n');
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime||'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
/* ---------------- Share ----------------
   Uses the device's native share sheet (WhatsApp, email, SMS, etc.) where available, so a
   report can go straight to a bank official, SRLM staff, or another Vitta Sakhi without first
   saving and re-attaching a file. Falls back gracefully where the browser doesn't support it. */
function shareText(title, text){
  if(typeof navigator!=='undefined' && navigator.share){
    navigator.share({title, text}).catch(()=>{}); // user cancelling the share sheet is not an error
    return;
  }
  if(typeof navigator!=='undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{ flash('ok','Copied to clipboard — paste it into WhatsApp, email or SMS to share.'); render(); })
      .catch(()=>{ shareTextFallback(title,text); });
    return;
  }
  shareTextFallback(title,text);
}
function shareTextFallback(title,text){
  openModal(`<button class="close" onclick="closeModal()">×</button><h3>${esc(title)}</h3>
    <textarea readonly style="width:100%;height:260px;font-family:var(--mono);font-size:12.5px">${esc(text)}</textarea>
    <p class="hint" style="margin-top:6px">Select all and copy to share manually — this device/browser doesn't support one-tap sharing.</p>`);
}
function shareFile(filename, content, mime, title){
  try{
    if(typeof navigator!=='undefined' && navigator.canShare && typeof File!=='undefined'){
      const file = new File([content], filename, {type:mime||'text/plain'});
      if(navigator.canShare({files:[file]})){
        navigator.share({title:title||filename, files:[file]}).catch(()=>{});
        return;
      }
    }
  }catch(e){}
  downloadFile(filename, content, mime); // fallback: this device can't share a file directly, so save it instead
}
// Single place that builds export rows for every module, using internal field names.
// Both the plain Reports export and the LokOS-mapped export read from here, so the two
// can never drift apart or show conflicting figures.
function buildExportData(kind){
  if(kind==='members') return {headers:['MemberID','Name','FatherHusband','Mobile','Village','DOJ','Status'],
    rows: DB.members.map(m=>[m.id,m.name,m.fatherHusband,m.mobile,m.village,m.doj,m.status])};
  if(kind==='savings') return {headers:['MemberID','Name','ClosingSavingsBalance'],
    rows: activeMembers().map(m=>[m.id,m.name,memberSavingsBalance(m.id).toFixed(2)])};
  if(kind==='loans') return {headers:['LoanID','MemberID','Member','Purpose','Principal','InterestRate','InterestMethod','Instalments','Frequency','OutstandingPrincipal','InterestDue','Status','NextDueDate'],
    rows: DB.loans.map(l=>{ const due = memberDueInfos(l.memberId, todayStr()).find(d=>d.loan.id===l.id);
      return [l.id,l.memberId,memberName(l.memberId),l.purpose||'',l.principal,l.interestRate,l.interestMethod||'flat',l.instalments,l.frequency||'Monthly',
        loanOutstanding(l.id).principal.toFixed(2), due?due.totalInterestDue.toFixed(2):'0.00', l.status,l.nextDueDate]; })};
  if(kind==='cif') return {headers:['Date','Source','Amount','Rate','PeriodMonths','OutstandingLiability'],
    rows: DB.cif.map(c=>[c.date,c.source,c.amount,c.rate,c.period,cifOutstanding().toFixed(2)])};
  if(kind==='revolvingfund') return {headers:['Date','Source','Amount','Rate','PeriodMonths','OutstandingLiability'],
    rows: DB.revolvingFund.map(c=>[c.date,c.source,c.amount,c.rate,c.period,revolvingFundOutstanding().toFixed(2)])};
  if(kind==='bankloans') return {headers:['FacilityID','Type','SanctionDate','SanctionedAmount','Utilised','NotUtilised','OutstandingPayable','Rate','Status'],
    rows: DB.bankLoans.map(b=>{ const utilised=bankLoanUtilised(b.id); return [b.id,b.type,b.sanctionDate,b.sanctionedAmount,utilised.toFixed(2),
      Math.max(0,b.sanctionedAmount-utilised).toFixed(2), bankLoanOutstanding(b.id).toFixed(2), b.rate, b.status]; })};
  if(kind==='attendance') return {headers:['MeetingDate','MemberID','Member','Present'],
    rows: DB.meetings.flatMap(mt=>activeMembers().map(m=>[mt.date,m.id,memberName(m.id), (mt.presentIds||[]).includes(m.id)?'Yes':'No']))};
  if(kind==='trialbalance'){ const tb = generateTrialBalance(); return {headers:['AccountHead','Debit','Credit'], rows: tb.rows.map(r=>[r.label, r.dr.toFixed(2), r.cr.toFixed(2)])}; }
  if(kind==='grading'){ const hist = Object.values(DB.grading.history).sort((a,b)=>a.ym<b.ym?-1:1);
    return {headers:['Month','PerformanceGrade','Score','DataQuality','FrameworkVersion'],
      rows: hist.map(h=>[h.ym, h.gradePending?'Pending':h.grade, h.overall.toFixed(1), h.dqStatus, h.ruleVersion])}; }
  if(kind==='dataquality'){ const issues = runDataQuality();
    return {headers:['Severity','Issue'], rows: issues.map(i=>[i.sev==='red'?'Critical':'Warning', i.text])}; }
  return {headers:['Date','VoucherNo','Type','Debit','Credit','Amount','MemberID','Narration'],
    rows: DB.transactions.map(t=>[t.date,t.voucherNo,t.type,t.debit,t.credit,t.amount,t.memberId,t.narration])};
}
function exportCSV(kind){
  const {headers, rows} = buildExportData(kind);
  downloadFile(kind+'_export.csv', toCSV(headers, rows));
  logAudit('EXPORT', kind+' CSV exported');
}
// LokOS-ready export: validates first, relabels headers through the configurable field
// mapping, and never exports silently over unresolved critical data-quality issues.
function generateLokOSExport(kind){
  const issues = runDataQuality();
  const red = issues.filter(i=>i.sev==='red');
  if(red.length>0){
    openModal(`<button class="close" onclick="closeModal()">×</button><h3>Export Blocked</h3>
      <div class="msg err">Export blocked — data quality issues require correction. ${red.length} critical issue${red.length>1?'s':''} must be resolved before a LokOS-ready export can be generated.</div>
      ${tbl(['Issue'], red.map(i=>[esc(i.text)]))}
      <div class="row" style="margin-top:10px"><button class="btn secondary" onclick="closeModal();go('dataquality')">Open Data Quality Check</button><button class="btn secondary" onclick="closeModal()">Close</button></div>`);
    logAudit('LOKOS_EXPORT_BLOCKED', kind+' export blocked — '+red.length+' critical data-quality issue(s)');
    return;
  }
  const {headers, rows} = buildExportData(kind);
  const map = DB.lokosMapping[kind];
  const mappedHeaders = map ? headers.map(h=>{ const f = map.find(x=>x.internal===h); return f ? f.lokos : h; }) : headers;
  downloadFile(kind+'_lokos_export.csv', toCSV(mappedHeaders, rows));
  logAudit('LOKOS_EXPORT', kind+' LokOS-mapped CSV exported — data quality was clean');
}

/* ============================================================ MONTH-END CLOSING */
// Runs every reconciliation check (data validation, Trial Balance, cash/bank, loans, CIF,
// savings, data quality) before allowing a month to be locked, matching item 18. This is the
// single place a month actually gets closed — the quick "Close Period" control in Settings
// remains for convenience but performs the same underlying closeMonth() function.
function monthClosingChecklist(ym){
  const from = ym+'-01';
  const [y,m] = ym.split('-').map(Number);
  const to = ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  const tb = generateTrialBalance();
  const dq = runDataQuality();
  const dqRed = dq.filter(i=>i.sev==='red').length, dqAmber = dq.filter(i=>i.sev==='amber').length;
  const monthHasMeeting = DB.meetings.some(mt=>mt.date>=from && mt.date<=to);
  return [
    {label:'Trial Balance', ok: tb.diff===0, detail: tb.diff===0?'Debit = Credit':'Mismatch of '+rupee(Math.abs(tb.diff))},
    {label:'Cash reconciliation', ok: accountBalance('CASH')>=0, detail: rupee(accountBalance('CASH'))},
    {label:'Bank reconciliation', ok: accountBalance('BANK')>=0, detail: rupee(accountBalance('BANK'))},
    {label:'Loan sub-ledger', ok: DB.loans.every(l=>loanOutstanding(l.id).principal>=-0.5), detail: DB.loans.length+' loan(s) checked'},
    {label:'CIF reconciliation', ok: accountBalance('CIF')>=0, detail: rupee(accountBalance('CIF'))},
    {label:'Savings ledger', ok: activeMembers().every(mem=>memberSavingsBalance(mem.id)>=-0.5), detail: activeMembers().length+' member(s) checked'},
    {label:'Meeting recorded this month', ok: monthHasMeeting, detail: monthHasMeeting?'Yes':'No meeting found for '+ym, warnOnly:true},
    {label:'Data Quality', ok: dqRed===0, detail: dqRed+' critical, '+dqAmber+' warning(s)'}
  ];
}
function closeMonth(ym, override){
  const checklist = monthClosingChecklist(ym);
  const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
  if(criticalFails.length && !override){
    return {ok:false, checklist, reason:'critical'};
  }
  if(!DB.closedPeriods.includes(ym)) DB.closedPeriods.push(ym);
  const g = saveGradeSnapshot(ym, true);
  logAudit('MONTH_CLOSE', ym+' closed'+(criticalFails.length?' with authorised override ('+criticalFails.length+' unresolved item(s))':'')+' — grade '+(g.gradePending?'Pending':g.grade));
  return {ok:true, checklist, grade:g};
}
function viewMonthClosing(){
  let html = `<div class="section-title"><h2>Month-End Closing</h2></div>`;
  html += `<div class="msg info">Closing a month validates every ledger, locks it against accidental editing, and permanently saves that month's grading snapshot. Corrections after closing are always made by reversal, never by silent editing.</div>`;
  const ym = monthKey(todayStr());
  html += `<div class="card"><h3>Close ${ym}</h3><div id="closingChecklist"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="runMonthClose('${ym}', false)">Run Closing Checklist</button>
    </div></div>`;
  html += `<div class="card"><h3>Closed Periods</h3>${DB.closedPeriods.length ? tbl(['Month','Grade at Closing',''],
    DB.closedPeriods.slice().sort().reverse().map(p=>{
      const h = DB.grading.history[p];
      return [p, h ? (h.gradePending?'Pending':h.grade)+' ('+h.overall.toFixed(1)+'%)' : '—',
        `<button class="btn small secondary" onclick="reopenPeriodFrom('closing','${p}')">Reopen</button>`];
    })) : `<div class="empty">No months closed yet.</div>`}</div>`;
  setTimeout(()=>runMonthClose(ym,false),0);
  return html;
}
function renderChecklist(ym, checklist){
  const el = document.getElementById('closingChecklist');
  if(!el) return;
  const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
  el.innerHTML = checklist.map(c=>`<div class="qcard" style="margin-bottom:6px"><span class="dot ${c.ok?'green':(c.warnOnly?'amber':'red')}"></span><b>${esc(c.label)}</b> — ${esc(c.detail)}</div>`).join('')
    + (criticalFails.length ?
        `<div class="msg err" style="margin-top:8px">${criticalFails.length} critical item(s) failed. Resolve them, or close with an authorised override (recorded in the audit trail).</div>
         <button class="btn danger" style="margin-top:6px" onclick="runMonthClose('${ym}', true)">Close Anyway (Authorised Override)</button>`
      : `<div class="msg ok" style="margin-top:8px">All critical checks passed.</div>
         <button class="btn" style="margin-top:6px" onclick="doCloseMonth('${ym}', false)">Confirm & Close ${esc(ym)}</button>`);
}
function runMonthClose(ym, allowOverride){
  const checklist = monthClosingChecklist(ym);
  renderChecklist(ym, checklist);
  if(allowOverride){
    const criticalFails = checklist.filter(c=>!c.ok && !c.warnOnly);
    if(criticalFails.length && confirm('Close '+ym+' with '+criticalFails.length+' unresolved critical item(s)? This will be recorded in the audit trail as an authorised override.')){
      doCloseMonth(ym, true);
    }
  }
}
function doCloseMonth(ym, override){
  const result = closeMonth(ym, override);
  if(!result.ok){ flash('error','Cannot close '+ym+' — critical checks failed. Resolve them or use the authorised override.'); render(); return; }
  flash('ok', ym+' closed. Grade: '+(result.grade.gradePending?'Pending':result.grade.grade)+'.');
  render();
}
function reopenPeriodFrom(fromRoute, ym){
  if(!confirm('Reopen '+ym+'? This allows further postings and edits in this period.')) return;
  DB.closedPeriods = DB.closedPeriods.filter(p=>p!==ym);
  logAudit('REOPEN_PERIOD', ym+' reopened');
  flash('ok', ym+' reopened.');
  ROUTE = fromRoute; render();
}

// Merges records from an uploaded JSON file into the current DB, keyed by their own id —
// unlike Restore (which replaces everything), this only ADDS records whose id isn't already
// present, so it's safe to use for bringing in extra test entries without disturbing real data.
function importMergeJSON(){
  const inp = document.getElementById('importFile');
  if(!inp.files.length){ alert('Choose a JSON file first.'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const counts = {members:0, loans:0, transactions:0, meetings:0, cif:0, skipped:0};
      let maxSeq = DB.seq||1;
      const bumpSeq = id => { const m = String(id).match(/(\d+)$/); if(m) maxSeq = Math.max(maxSeq, parseInt(m[1],10)+1); };

      (data.members||[]).forEach(m=>{
        if(DB.members.some(x=>x.id===m.id)){ counts.skipped++; return; }
        DB.members.push(m); counts.members++; bumpSeq(m.id);
      });
      (data.loans||[]).forEach(l=>{
        if(DB.loans.some(x=>x.id===l.id)){ counts.skipped++; return; }
        DB.loans.push(l); counts.loans++; bumpSeq(l.id);
      });
      (data.meetings||[]).forEach(mt=>{
        if(DB.meetings.some(x=>x.id===mt.id)){ counts.skipped++; return; }
        DB.meetings.push(mt); counts.meetings++; bumpSeq(mt.id);
      });
      (data.cif||[]).forEach(c=>{ DB.cif.push(c); counts.cif++; });
      (data.transactions||[]).forEach(t=>{
        if(DB.transactions.some(x=>x.id===t.id)){ counts.skipped++; return; }
        DB.transactions.push(t); counts.transactions++; bumpSeq(t.id);
      });
      if(data.expenseCategories) data.expenseCategories.forEach(c=>{ if(!DB.expenseCategories.includes(c)) DB.expenseCategories.push(c); });
      if(data.grading && data.grading.history) Object.keys(data.grading.history).forEach(ym=>{ if(!DB.grading.history[ym]) DB.grading.history[ym] = data.grading.history[ym]; });
      DB.seq = maxSeq;

      const tb = generateTrialBalance();
      logAudit('IMPORT_MERGE', counts.members+' member(s), '+counts.loans+' loan(s), '+counts.meetings+' meeting(s), '+counts.transactions+' transaction(s) imported; '+counts.skipped+' duplicate(s) skipped');
      let msg = 'Imported '+counts.members+' member(s), '+counts.loans+' loan(s), '+counts.meetings+' meeting(s), '+counts.transactions+' transaction(s)'+(counts.skipped?(' — '+counts.skipped+' duplicate id(s) skipped'):'')+'.';
      if(tb.diff!==0) msg += ' Note: Trial Balance now shows a difference of '+rupee(Math.abs(tb.diff))+' — check Data Quality if you imported transactions without their related records.';
      flash(tb.diff!==0?'error':'ok', msg);
      render();
    }catch(err){ alert('Import failed: '+err.message); }
  };
  reader.readAsText(inp.files[0]);
}
function exportBackup(){
  downloadFile('shg_backup_'+todayStr()+'.json', JSON.stringify(DB,null,2), 'application/json');
  DB.settings.lastBackupAt = nowStamp();
  logAudit('BACKUP_EXPORT','Full backup downloaded');
}
function restoreBackup(){
  const inp = document.getElementById('restoreFile');
  if(!inp.files.length){ alert('Choose a backup .json file first.'); return; }
  if(!confirm('This will replace ALL current data. Continue?')) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.members || !data.transactions) throw new Error('This does not look like a valid backup file.');
      DB = data; if(!DB.grading) DB.grading={ruleVersion:'2026.1',history:{}};
      logAudit('BACKUP_RESTORE','Data restored from backup file');
      flash('ok','Backup restored.'); render();
    }catch(err){ alert('Restore failed: '+err.message); }
  };
  reader.readAsText(inp.files[0]);
}
function resetApp(){
  if(!confirm('This will permanently erase ALL data on this device. This cannot be undone. Continue?')) return;
  if(!confirm('Are you absolutely sure? Consider exporting a backup first.')) return;
  DB = freshDB(); saveDB(); flash('ok','Application data has been reset.'); ROUTE='dashboard'; render();

function helpAiAsk(q){
  q = (q||'').toLowerCase();
  if(!q.trim()) return null;
  let best=null, bestScore=0;
  HELP_KB.forEach(entry=>{
    let score=0;
    entry.kw.forEach(k=>{ if(q.includes(k)) score += k.split(' ').length; });
    if(score>bestScore){ bestScore=score; best=entry; }
  });
  return bestScore>0 ? best.a : null;
}
function viewHelpAI(){
  let html = `<div class="section-title"><h2>Help Assistant</h2></div>`;
  html += `<div class="msg info">This is an offline, built-in assistant that matches your question against this app's own Help content — it is not a live AI model and does not connect to the internet. For anything it can't answer, see Help &amp; Training or ask your Vitta Sakhi / bank branch.</div>`;
  html += `<div class="card"><form onsubmit="return helpAiSubmit(event)">
    <div class="field"><label>Ask a question about using this app</label><input name="q" id="helpAiInput" placeholder="e.g. How do I record a loan repayment?" autocomplete="off"></div>
    <button class="btn" type="submit">Ask</button>
  </form></div>`;
  if(HELP_CHAT.length){
    html += `<div class="card"><h3>Conversation</h3>`;
    HELP_CHAT.slice().reverse().forEach(c=>{
      html += `<div style="margin-bottom:12px"><div style="font-weight:600;color:var(--navy-2);font-size:13px">You asked</div><div style="font-size:13.5px;margin-bottom:6px">${esc(c.q)}</div>
        <div style="font-weight:600;color:var(--muted);font-size:12px">Help Assistant</div><div style="font-size:13.5px;color:var(--text)">${esc(c.a)}</div></div>`;
    });
    html += `</div>`;
  }
  html += `<div class="card"><h3>Try asking about…</h3><div class="row">${['Savings','Loan repayment','CIF','Trial Balance mismatch','Backup & restore','SHG Grading','LokOS export','Closed period','Reversing an entry'].map(t=>`<button type="button" class="btn small secondary" onclick="helpAiQuick('${esc(t)}')">${esc(t)}</button>`).join('')}</div></div>`;
  return html;
}
function helpAiSubmit(ev){
  ev.preventDefault();
  const inp = document.getElementById('helpAiInput');
  const q = inp.value;
  if(!q.trim()) return false;
  const ans = helpAiAsk(q) || 'I don\'t have a ready answer for that yet. Try Help & Training in the left menu, or rephrase using a word like "savings", "loan", "repayment", "CIF", "backup", "grading" or "LokOS".';
  HELP_CHAT.push({q, a:ans});
  ROUTE='helpai'; render();
  setTimeout(()=>{ const el=document.getElementById('helpAiInput'); if(el) el.focus(); },0);
  return false;
}
function helpAiQuick(q){
  const ans = helpAiAsk(q) || 'I don\'t have a ready answer for that yet. Try Help & Training in the left menu.';
  HELP_CHAT.push({q, a:ans});
  render();
}

/* ============================================================ DEMO DATA */
// Every record created while DEMO_MODE is true carries demo:true, so it can be
// added and removed cleanly without ever touching real SHG data.
function seedDemoDataCore(){
  DEMO_MODE = true;
  try{
    if(!DB.profile.name){
      DB.profile = Object.assign(DB.profile, {name:'DEMO — Jyoti Mahila SHG', shgId:'DEMO-001', state:'Haryana', district:'Gurugram', block:'Farrukhnagar',
        gp:'Demo GP', village:'Demo Village', voClf:'Demo VO', formationDate:'2023-04-01', meetingDay:'Monday', meetingFrequency:'Monthly',
        president:'Demo President', secretary:'Demo Secretary', treasurer:'Demo Treasurer'});
      DB.settings.demoProfileApplied = true;
    }
    if(!DB.profile.banks.length){
      DB.profile.banks.push({bank:'Demo Gramin Bank',branch:'Farrukhnagar',accno:'000DEMO0001234',ifsc:'DEMB0000001'});
      DB.settings.demoBankApplied = true;
    }
    const names = ['Sunita Devi','Rekha Kumari','Meena Yadav','Kamla Devi','Pooja Sharma','Anita Rani','Savita Devi','Geeta Kumari','Radha Devi','Suman Lata','Kavita Rani','Neelam Devi'];
    const newMembers = names.map(n=>({id:nextId('MEM'), name:n+' (DEMO)', fatherHusband:'S/o Demo', mobile:'9800000'+(100+Math.floor(Math.random()*900)), village:'Demo Village', doj:'2023-04-10', status:'Active', occupation:'Agriculture', nominee:'', bankAccno:'', bankIfsc:'', demo:true}));
    DB.members = DB.members.concat(newMembers);
    if(accountBalance('CASH')===0 && accountBalance('BANK')===0){
      try{ postOpeningBalances(30000, 0, addMonths(todayStr(),-6)); DB.settings.demoOpeningApplied = true; }catch(e){}
    }
    // Run five monthly meetings ending in the current month, so dates are always current and never fall in a closed period.
    const anchor = new Date(); anchor.setDate(4);
    for(let month=-4; month<=0; month++){
      const dateStr = addMonths(anchor.toISOString().slice(0,10), month);
      if(isPeriodClosed(dateStr)) continue;
      let present=0;
      newMembers.forEach((m,idx)=>{
        const isPresent = Math.random()>0.1;
        if(isPresent){ present++;
          try{ postTxn({date:dateStr,type:'Savings',debit:'CASH',credit:'MEMBER_SAVINGS',amount:100+Math.round(Math.random()*50),memberId:m.id,narration:'DEMO meeting savings — '+m.name}); }catch(e){}
        }
        if(month===-4 && idx<4){
          const amt = 5000+idx*1000;
          const loan = {id:nextId('LOAN'), memberId:m.id, purpose:'Petty business (DEMO)', sanctionDate:dateStr, disbursementDate:dateStr, principal:amt, interestRate:12, instalments:10, status:'Active', nextDueDate: addMonths(dateStr,1), demo:true};
          DB.loans.push(loan);
          try{ postTxn({date:dateStr,type:'Disbursement',debit:'MEMBER_LOANS',credit:'CASH',amount:amt,memberId:m.id,loanId:loan.id,narration:'DEMO loan disbursed — '+m.name}); }catch(e){}
        }
        if(month>-4){
          const loan = DB.loans.find(l=>l.memberId===m.id && l.status!=='Closed' && l.demo);
          if(loan && Math.random()>0.2){
            const inst = Math.round(loan.principal/loan.instalments);
            try{
              postTxn({date:dateStr,type:'Loan Repayment',debit:'CASH',credit:'MEMBER_LOANS',amount:Math.min(inst,loanOutstanding(loan.id).principal||inst),memberId:m.id,loanId:loan.id,narration:'DEMO principal repayment — '+m.name});
              postTxn({date:dateStr,type:'Interest Received',debit:'CASH',credit:'INTEREST_INCOME',amount:Math.round(loan.principal*loan.interestRate/1200),memberId:m.id,loanId:loan.id,narration:'DEMO interest — '+m.name});
            }catch(e){}
          }
        }
      });
      if(month===-3){ try{ postTxn({date:dateStr,type:'CIF Receipt',debit:'BANK',credit:'CIF',amount:150000,narration:'DEMO CIF received from VO/CLF'}); DB.cif.push({date:dateStr,source:'Demo VO/CLF',amount:150000,rate:9,period:36,bank:'BANK',demo:true});}catch(e){} }
      try{ postTxn({date:dateStr,type:'Expense',debit:'EXP_Stationery',credit:'CASH',amount:150,narration:'DEMO stationery expense'}); }catch(e){}
      DB.meetings.push({id:nextId('MTG'), date:dateStr, totalMembers:newMembers.length, present, totals:{savings:0,repayment:0,newLoans:0,expenses:150}, demo:true});
    }
    DB.settings.demoDataLoaded = true;
    logAudit('LOAD_DEMO','Demo SHG data generated');
  } finally {
    DEMO_MODE = false;
  }
}
function loadDemoData(){
  if(DB.settings.demoDataLoaded){ alert('Demo data is already loaded. Use "Clear Demo Data" first if you want to regenerate it.'); return; }
  if(!confirm('This will add a demo SHG with sample members, meetings, savings, loans and CIF, clearly tagged as DEMO. Continue?')) return;
  seedDemoDataCore();
  flash('ok','Demo data loaded — every demo record is tagged internally and can be removed cleanly any time with "Clear Demo Data" in Backup & Restore.');
  render();
}
function clearDemoData(){
  if(!DB.settings.demoDataLoaded && !DB.members.some(m=>m.demo)){ alert('No demo data is currently loaded.'); return; }
  if(!confirm('Remove all demo records? Your real SHG data (if any) will not be touched.')) return;
  DB.members = DB.members.filter(m=>!m.demo);
  DB.loans = DB.loans.filter(l=>!l.demo);
  DB.meetings = DB.meetings.filter(mt=>!mt.demo);
  DB.cif = DB.cif.filter(c=>!c.demo);
  DB.transactions = DB.transactions.filter(t=>!t.demo);
  if(DB.settings.demoProfileApplied){
    Object.assign(DB.profile, {name:'', shgId:'', state:'', district:'', block:'', gp:'', village:'', voClf:'',
      formationDate:'', president:'', secretary:'', treasurer:''});
    DB.settings.demoProfileApplied = false;
  }
  if(DB.settings.demoBankApplied){
    DB.profile.banks = DB.profile.banks.filter(b=>b.accno!=='000DEMO0001234');
    DB.settings.demoBankApplied = false;
  }
  if(DB.settings.demoOpeningApplied){
    DB.settings.openingCash = 0; DB.settings.openingBank = 0; DB.settings.openingDate = '';
    DB.settings.demoOpeningApplied = false;
  }
  DB.settings.demoDataLoaded = false;
  logAudit('CLEAR_DEMO','All demo records removed');
  flash('ok','Demo data cleared.');
  ROUTE='dashboard'; render();
}

/* ============================================================ INIT ============================================================ */
loadDB();
if(location.hash) ROUTE = location.hash.replace('#','')||'dashboard';
window.addEventListener('hashchange', ()=>{ ROUTE = location.hash.replace('#','')||'dashboard'; render(); });
if(!DB.members.length && !DB.settings.autoSeeded){
  // First run on this device: fill and keep sample demo data automatically so the app is never empty.
  seedDemoDataCore();
  DB.settings.autoSeeded = true;
}
render();
window.loadDemoData = loadDemoData;
window.clearDemoData = clearDemoData;
</script>
