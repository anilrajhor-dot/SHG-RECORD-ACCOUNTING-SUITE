  const lines = [];
  if(typeof current!=='undefined' && current && current.borrower && current.borrower.business){
    if(current.history && current.history.enabled) lines.push('Books of accounts: enabled, source = '+(current.history.source||'declared'));
    lines.push('Business: '+current.borrower.business+' | Activity: '+(current.activityName||'-')+' | Constitution: '+(current.borrower.constitution||'-'));
    lines.push('Loan Requested: Total '+inr(current.loan.total)+', Term Loan '+inr(current.loan.termLoan)+', WC Finance '+inr(current.loan.wcLoan)+', Purpose: '+current.loan.purpose);
    const c = window._reportCalc;
    if(c && c.ratios){
      lines.push('Projected Sales Y1-Y3: '+c.sales.map(s=>inr(s)).join(' / '));
      lines.push('Average DSCR: '+(c.avgDscr!==null?c.avgDscr.toFixed(2):'N/A')+', Minimum year DSCR: '+(c.minDscr!==null?c.minDscr.toFixed(2):'N/A'));
      const r3 = c.ratios[2];
      lines.push('Year-3 ratios — Current Ratio: '+(r3.currentRatio!==null?r3.currentRatio.toFixed(2):'N/A')+', Debt-Equity: '+(r3.debtEquity!==null?r3.debtEquity.toFixed(2):'N/A')+', TOL/TNW: '+(r3.tolTnw!==null?r3.tolTnw.toFixed(2):'N/A')+', Interest Coverage: '+(r3.interestCoverage!==null?r3.interestCoverage.toFixed(2):'N/A'));
      const bm = benchmarkAnalysis(c);
      lines.push(bm.flags.length ? ('Flagged (below commonly used norm or declining trend): '+bm.flags.join(', ')) : 'No ratios currently flagged.');
    }
  }
  return lines.length ? lines.join('\n') : '(No project is currently open.)';
}
function aiSystemPrompt(){
  return "You are a helpful assistant embedded inside an offline MSME Project Report Generator app used by Indian bank branch staff and MSME loan applicants/preparers to draft bank project reports. "+
    "Answer questions about the app's screens/fields, and about standard Indian bank credit-appraisal concepts (DSCR, MPBF, Tandon/Nayak Committee, Current Ratio, TOL/TNW, Working Capital, moratorium, EMI vs actual repayment schedule), and about the specific project summarised below. "+
    "The app also has a Books menu that prepares books of accounts (Journal, Cash & Bank Book, Ledgers, Trial Balance, Trading & P&L, Balance Sheet) for an existing unit from actual financial statements (blank Excel format with yellow input cells, CSV, Excel, PDF, photo, paste), bank-statement entries, or declared annual figures; group splits of sales/purchases/stock follow the nature of business using the borrower's estimated mix and are marked est.; outputs are reconstructed and unaudited; each saved set can be viewed, printed (Save as PDF) and shared. "+
    "Keep answers under roughly 120 words unless the person clearly asks for more detail. Reply in "+(LANG==='hi'?"Hindi":"English")+". "+
    "Always keep it clear that you are not providing a credit appraisal, eligibility view, sanction decision or legal/financial advice — that remains entirely the lending bank's responsibility; you only give general information and navigation help.\n\nCurrent project summary:\n"+buildAiContext();
}
async function callAnthropicApi(apiKey, model, userMessage){
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model: model||'claude-sonnet-4-5', max_tokens:700, system: aiSystemPrompt(), messages:[{role:'user', content:userMessage}] })
  });
  if(!resp.ok){ let t=''; try{ t=(await resp.json()).error?.message||''; }catch(e){} throw new Error('HTTP '+resp.status+(t?': '+t:'')); }
  const data = await resp.json();
  const block = (data.content||[]).find(b=>b.type==='text');
  return block ? block.text : '(empty response)';
}
async function callCustomApi(endpoint, apiKey, model, userMessage){
  if(!endpoint) throw new Error(LANG==='hi'?'कस्टम एंडपॉइंट URL दर्ज नहीं है':'No custom endpoint URL configured');
  const resp = await fetch(endpoint, {
    method:'POST',
    headers: Object.assign({'Content-Type':'application/json'}, apiKey?{'Authorization':'Bearer '+apiKey}:{}),
    body: JSON.stringify({ model: model||'gpt-4o-mini', messages:[{role:'system',content:aiSystemPrompt()},{role:'user',content:userMessage}] })
  });
  if(!resp.ok){ throw new Error('HTTP '+resp.status); }
  const data = await resp.json();
  if(data.choices && data.choices[0] && data.choices[0].message) return data.choices[0].message.content;
  if(data.content){ return typeof data.content==='string' ? data.content : ((data.content[0]&&data.content[0].text)||JSON.stringify(data).slice(0,400)); }
  return JSON.stringify(data).slice(0,400);
}
async function aiCallProvider(query){
  const ai = getAiSettings();
  if(ai.provider==='custom') return await callCustomApi(ai.endpoint, ai.apiKey, ai.model, query);
  return await callAnthropicApi(ai.apiKey, ai.model, query);
}
async function aiTestConnection(origin){
  const ai = { enabled: val('ai_enabled')==='1', provider: val('ai_provider'), apiKey: val('ai_apiKey'), model: val('ai_model'), endpoint: document.getElementById('ai_endpoint')?val('ai_endpoint'):'' };
  const statusEl = document.getElementById(origin==='settings' ? 'ai_testStatus' : 'aiPanelBody');
  const label = LANG==='hi' ? 'जाँच रहे हैं…' : 'Testing…';
  if(origin==='settings' && statusEl) statusEl.textContent = label;
  try{
    if(!ai.apiKey && ai.provider!=='custom') throw new Error(LANG==='hi'?'कृपया पहले एपीआई कुंजी दर्ज करें':'Please enter an API key first');
    const test = ai.provider==='custom' ? await callCustomApi(ai.endpoint, ai.apiKey, ai.model, 'Say "OK" and nothing else.')
                                          : await callAnthropicApi(ai.apiKey, ai.model, 'Say "OK" and nothing else.');
    const msg = (LANG==='hi'?'✓ कनेक्शन सफल। उत्तर: ':'✓ Connection succeeded. Reply: ')+String(test).slice(0,80);
    if(origin==='settings' && statusEl) statusEl.textContent = msg; else alert(msg);
  }catch(e){
    const msg = (LANG==='hi'?'✗ कनेक्शन विफल: ':'✗ Connection failed: ')+e.message;
    if(origin==='settings' && statusEl) statusEl.textContent = msg; else alert(msg);
  }
}
function toggleAiPanel(){
  const p = document.getElementById('aiPanel');
  const willOpen = p.classList.contains('hidden');
  p.classList.toggle('hidden');
  if(willOpen){
    document.getElementById('aiPanelTitle').textContent = LANG==='hi'?'एआई सहायक':'AI Assistant';
    aiSwitchTab(aiActiveTab);
  }
}
function aiSwitchTab(tab){
  aiActiveTab = tab;
  document.getElementById('aiTabHelpBtn').classList.toggle('active', tab==='help');
  document.getElementById('aiTabAskBtn').classList.toggle('active', tab==='ask');
  document.getElementById('aiTabHelpBtn').textContent = LANG==='hi'?'त्वरित सहायता':'Quick Help';
  document.getElementById('aiTabAskBtn').textContent = LANG==='hi'?'पूछें':'Ask';
  document.getElementById('aiAskRow').classList.toggle('hidden', tab!=='ask');
  if(tab==='ask') document.getElementById('aiAskInput').placeholder = LANG==='hi'?'प्रश्न टाइप करें…':'Type a question…';
  renderAiPanel();
}
function renderAiPanel(){
  const body = document.getElementById('aiPanelBody');
  const hi = LANG==='hi';
  if(aiActiveTab==='help'){
    const tip = aiContextTip();
    const tipHtml = tip ? `<div class="ai-context-tip">${escapeHtml(tip)}</div>` : '';
    const list = AI_KB.map(e=>`<li onclick="aiAskDirect('${escapeHtml(e.kw[0]).replace(/'/g,"\\'")}')">${escapeHtml((hi?e.hi:e.en).split(/[—.]/)[0].slice(0,70))}${(hi?e.hi:e.en).length>70?'…':''}</li>`).join('');
    body.innerHTML = `${tipHtml}<p class="muted small">${hi?'नीचे किसी भी विषय पर टैप करें, अथवा "पूछें" टैब में अपना प्रश्न टाइप करें:':'Tap any topic below, or type your own question in the "Ask" tab:'}</p><ul class="ai-quicklist">${list}</ul>`;
  } else {
    if(!aiChatHistory.length){
      body.innerHTML = `<p class="muted small">${hi?'नीचे अपना प्रश्न टाइप करें। एआई सक्षम न होने पर, उत्तर ऐप की अंतर्निर्मित मार्गदर्शिका से दिया जाएगा।':'Type your question below. If the AI Assistant isn\'t enabled, the answer comes from the app\'s built-in offline guide.'}</p>`;
    } else {
      body.innerHTML = aiChatHistory.map(m=>{
        if(m.role==='user') return `<div class="ai-msg user">${escapeHtml(m.text)}</div>`;
        return `<div class="ai-msg bot">${escapeHtml(m.text)}<span class="ai-src">${escapeHtml(m.source)}</span></div>`;
      }).join('');
    }
    body.scrollTop = body.scrollHeight;
  }
}
function aiAskDirect(kwFirst){
  aiSwitchTab('ask');
  document.getElementById('aiAskInput').value = kwFirst;
  aiAsk();
}
function aiAsk(){
  if(aiBusy) return;
  const input = document.getElementById('aiAskInput');
  const query = (input.value||'').trim();
  if(!query) return;
  input.value = '';
  aiChatHistory.push({role:'user', text:query});
  renderAiPanel();
  const ai = getAiSettings();
  const hi = LANG==='hi';
  if(ai.enabled && ai.apiKey){
    aiBusy = true;
    aiChatHistory.push({role:'bot', text:(hi?'सोच रहे हैं…':'Thinking…'), source:''});
    renderAiPanel();
    aiCallProvider(query).then(answer=>{
      aiChatHistory[aiChatHistory.length-1] = { role:'bot', text:answer, source:(hi?'एआई (':'AI (')+(ai.provider==='custom'?(hi?'कस्टम':'custom'):'Anthropic Claude')+')' };
      aiBusy=false; renderAiPanel();
    }).catch(err=>{
      const offline = aiMatchOffline(query);
      aiChatHistory[aiChatHistory.length-1] = offline
        ? { role:'bot', text:offline, source:(hi?'एआई विफल, अंतर्निर्मित मार्गदर्शिका से — ':'AI call failed, from built-in guide — ')+err.message }
        : { role:'bot', text:(hi?'एआई कॉल विफल ('+err.message+'), तथा कोई ऑफ़लाइन उत्तर नहीं मिला। कृपया सेटिंग्स में एपीआई कुंजी जाँचें।':'AI call failed ('+err.message+'), and no offline answer was found either. Please check the API key in Settings.'), source:'' };
      aiBusy=false; renderAiPanel();
    });
  } else {
    const offline = aiMatchOffline(query);
    aiChatHistory.push(offline
      ? { role:'bot', text:offline, source:(hi?'अंतर्निर्मित मार्गदर्शिका से':'From the built-in guide') }
      : { role:'bot', text:(hi?'इस पर मेरे पास ऑफ़लाइन उत्तर नहीं है। कृपया दोबारा शब्दों में पूछें, Help स्क्रीन देखें, अथवा सेटिंग्स में अपनी एपीआई कुंजी के साथ एआई सहायक सक्षम करें।':'I don\'t have an offline answer for that. Try rephrasing, check the Help screen, or enable the AI Assistant in Settings with your own API key for open-ended answers.'), source:'' });
    renderAiPanel();
  }
}

goDashboard();
