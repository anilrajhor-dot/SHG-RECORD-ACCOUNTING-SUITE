function exportBackup(){
  downloadFile('shg_backup_'+todayStr()+'.json', JSON.stringify(DB,null,2), 'application/json');
  DB.settings.lastBackupAt = nowStamp();
  logAudit('BACKUP_EXPORT','Full backup downloaded');
}
function restoreBackup(){
  const inp = document.getElementById('restoreFile');
  if(!inp.files.length){ alert('Choose a backup .json file first.'); return; }
  if(!confirm('This will replace ALL current data. Continue?')) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.members || !data.transactions) throw new Error('This does not look like a valid backup file.');
      DB = data; if(!DB.grading) DB.grading={ruleVersion:'2026.1',history:{}};
      logAudit('BACKUP_RESTORE','Data restored from backup file');
      flash('ok','Backup restored.'); render();
    }catch(err){ alert('Restore failed: '+err.message); }
  };
  reader.readAsText(inp.files[0]);
}
function resetApp(){
  if(!confirm('This will permanently erase ALL data on this device. This cannot be undone. Continue?')) return;
  if(!confirm('Are you absolutely sure? Consider exporting a backup first.')) return;
  DB = freshDB(); saveDB(); flash('ok','Application data has been reset.'); ROUTE='dashboard'; render();
}

    html += `<div class="card"><h3>Conversation</h3>`;
    HELP_CHAT.slice().reverse().forEach(c=>{
      html += `<div style="margin-bottom:12px"><div style="font-weight:600;color:var(--navy-2);font-size:13px">You asked</div><div style="font-size:13.5px;margin-bottom:6px">${esc(c.q)}</div>
        <div style="font-weight:600;color:var(--muted);font-size:12px">Help Assistant</div><div style="font-size:13.5px;color:var(--text)">${esc(c.a)}</div></div>`;
    });
    html += `</div>`;
  }
  html += `<div class="card"><h3>Try asking about…</h3><div class="row">${['Savings','Loan repayment','CIF','Trial Balance mismatch','Backup & restore','SHG Grading','LokOS export','Closed period','Reversing an entry'].map(t=>`<button type="button" class="btn small secondary" onclick="helpAiQuick('${esc(t)}')">${esc(t)}</button>`).join('')}</div></div>`;
  return html;
}
function helpAiSubmit(ev){
  ev.preventDefault();
  const inp = document.getElementById('helpAiInput');
  const q = inp.value;
  if(!q.trim()) return false;
  const ans = helpAiAsk(q) || 'I don\'t have a ready answer for that yet. Try Help & Training in the left menu, or rephrase using a word like "savings", "loan", "repayment", "CIF", "backup", "grading" or "LokOS".';
  HELP_CHAT.push({q, a:ans});
  ROUTE='helpai'; render();
  setTimeout(()=>{ const el=document.getElementById('helpAiInput'); if(el) el.focus(); },0);
  return false;
}
function helpAiQuick(q){
  const ans = helpAiAsk(q) || 'I don\'t have a ready answer for that yet. Try Help & Training in the left menu.';
  HELP_CHAT.push({q, a:ans});
  render();
}

/* ============================================================ DEMO DATA */
// Every record created while DEMO_MODE is true carries demo:true, so it can be
// added and removed cleanly without ever touching real SHG data.
function seedDemoDataCore(){
  DEMO_MODE = true;
  try{
    if(!DB.profile.name){
      DB.profile = Object.assign(DB.profile, {name:'DEMO — Jyoti Mahila SHG', shgId:'DEMO-001', state:'Haryana', district:'Gurugram', block:'Farrukhnagar',
        gp:'Demo GP', village:'Demo Village', voClf:'Demo VO', formationDate:'2023-04-01', meetingDay:'Monday', meetingFrequency:'Monthly',
        president:'Demo President', secretary:'Demo Secretary', treasurer:'Demo Treasurer'});
      DB.settings.demoProfileApplied = true;
    }
    if(!DB.profile.banks.length){
      DB.profile.banks.push({bank:'Demo Gramin Bank',branch:'Farrukhnagar',accno:'000DEMO0001234',ifsc:'DEMB0000001'});
      DB.settings.demoBankApplied = true;
    }
    const names = ['Sunita Devi','Rekha Kumari','Meena Yadav','Kamla Devi','Pooja Sharma','Anita Rani','Savita Devi','Geeta Kumari','Radha Devi','Suman Lata','Kavita Rani','Neelam Devi'];
    const newMembers = names.map(n=>({id:nextId('MEM'), name:n+' (DEMO)', fatherHusband:'S/o Demo', mobile:'9800000'+(100+Math.floor(Math.random()*900)), village:'Demo Village', doj:'2023-04-10', status:'Active', occupation:'Agriculture', nominee:'', bankAccno:'', bankIfsc:'', demo:true}));
    DB.members = DB.members.concat(newMembers);
    if(accountBalance('CASH')===0 && accountBalance('BANK')===0){
      try{ postOpeningBalances(30000, 0, addMonths(todayStr(),-6)); DB.settings.demoOpeningApplied = true; }catch(e){}
    }
    // Run five monthly meetings ending in the current month, so dates are always current and never fall in a closed period.
    const anchor = new Date(); anchor.setDate(4);
    for(let month=-4; month<=0; month++){
      const dateStr = addMonths(anchor.toISOString().slice(0,10), month);
      if(isPeriodClosed(dateStr)) continue;
      let present=0;
      newMembers.forEach((m,idx)=>{
        const isPresent = Math.random()>0.1;
        if(isPresent){ present++;
          try{ postTxn({date:dateStr,type:'Savings',debit:'CASH',credit:'MEMBER_SAVINGS',amount:100+Math.round(Math.random()*50),memberId:m.id,narration:'DEMO meeting savings — '+m.name}); }catch(e){}
        }
        if(month===-4 && idx<4){
          const amt = 5000+idx*1000;
          const loan = {id:nextId('LOAN'), memberId:m.id, purpose:'Petty business (DEMO)', sanctionDate:dateStr, disbursementDate:dateStr, principal:amt, interestRate:12, instalments:10, status:'Active', nextDueDate: addMonths(dateStr,1), demo:true};
          DB.loans.push(loan);
          try{ postTxn({date:dateStr,type:'Disbursement',debit:'MEMBER_LOANS',credit:'CASH',amount:amt,memberId:m.id,loanId:loan.id,narration:'DEMO loan disbursed — '+m.name}); }catch(e){}
        }
        if(month>-4){
          const loan = DB.loans.find(l=>l.memberId===m.id && l.status!=='Closed' && l.demo);
          if(loan && Math.random()>0.2){
            const inst = Math.round(loan.principal/loan.instalments);
            try{
              postTxn({date:dateStr,type:'Loan Repayment',debit:'CASH',credit:'MEMBER_LOANS',amount:Math.min(inst,loanOutstanding(loan.id).principal||inst),memberId:m.id,loanId:loan.id,narration:'DEMO principal repayment — '+m.name});
              postTxn({date:dateStr,type:'Interest Received',debit:'CASH',credit:'INTEREST_INCOME',amount:Math.round(loan.principal*loan.interestRate/1200),memberId:m.id,loanId:loan.id,narration:'DEMO interest — '+m.name});
            }catch(e){}
          }
        }
      });
      if(month===-3){ try{ postTxn({date:dateStr,type:'CIF Receipt',debit:'BANK',credit:'CIF',amount:150000,narration:'DEMO CIF received from VO/CLF'}); DB.cif.push({date:dateStr,source:'Demo VO/CLF',amount:150000,rate:9,period:36,bank:'BANK',demo:true});}catch(e){} }
      try{ postTxn({date:dateStr,type:'Expense',debit:'EXP_Stationery',credit:'CASH',amount:150,narration:'DEMO stationery expense'}); }catch(e){}
      DB.meetings.push({id:nextId('MTG'), date:dateStr, totalMembers:newMembers.length, present, totals:{savings:0,repayment:0,newLoans:0,expenses:150}, demo:true});
    }
    DB.settings.demoDataLoaded = true;
    logAudit('LOAD_DEMO','Demo SHG data generated');
  } finally {
    DEMO_MODE = false;
  }
}
function loadDemoData(){
  if(DB.settings.demoDataLoaded){ alert('Demo data is already loaded. Use "Clear Demo Data" first if you want to regenerate it.'); return; }
  if(!confirm('This will add a demo SHG with sample members, meetings, savings, loans and CIF, clearly tagged as DEMO. Continue?')) return;
  seedDemoDataCore();
  flash('ok','Demo data loaded — every demo record is tagged internally and can be removed cleanly any time with "Clear Demo Data" in Backup & Restore.');
  render();
}
function clearDemoData(){
  if(!DB.settings.demoDataLoaded && !DB.members.some(m=>m.demo)){ alert('No demo data is currently loaded.'); return; }
  if(!confirm('Remove all demo records? Your real SHG data (if any) will not be touched.')) return;
  DB.members = DB.members.filter(m=>!m.demo);
  DB.loans = DB.loans.filter(l=>!l.demo);
  DB.meetings = DB.meetings.filter(mt=>!mt.demo);
  DB.cif = DB.cif.filter(c=>!c.demo);
  DB.transactions = DB.transactions.filter(t=>!t.demo);
  if(DB.settings.demoProfileApplied){
    Object.assign(DB.profile, {name:'', shgId:'', state:'', district:'', block:'', gp:'', village:'', voClf:'',
      formationDate:'', president:'', secretary:'', treasurer:''});
    DB.settings.demoProfileApplied = false;
  }
  if(DB.settings.demoBankApplied){
    DB.profile.banks = DB.profile.banks.filter(b=>b.accno!=='000DEMO0001234');
    DB.settings.demoBankApplied = false;
  }
  if(DB.settings.demoOpeningApplied){
    DB.settings.openingCash = 0; DB.settings.openingBank = 0; DB.settings.openingDate = '';
    DB.settings.demoOpeningApplied = false;
  }
  DB.settings.demoDataLoaded = false;
  logAudit('CLEAR_DEMO','All demo records removed');
  flash('ok','Demo data cleared.');
  ROUTE='dashboard'; render();
}

/* ============================================================ INIT ============================================================ */
loadDB();
if(location.hash) ROUTE = location.hash.replace('#','')||'dashboard';
window.addEventListener('hashchange', ()=>{ ROUTE = location.hash.replace('#','')||'dashboard'; render(); });
if(!DB.members.length && !DB.settings.autoSeeded){
  // First run on this device: fill and keep sample demo data automatically so the app is never empty.
  seedDemoDataCore();
  DB.settings.autoSeeded = true;
}
render();
window.loadDemoData = loadDemoData;
window.clearDemoData = clearDemoData;
</script>
